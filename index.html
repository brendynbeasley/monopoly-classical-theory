{id:'04',year:1886,who:'Hadley',title:'HADLEY 1886 · PRIVATE MONOPOLIES AND PUBLIC RIGHTS',secs:[
 {h:'Why railway competition destroys itself',beats:[
  ["October 1886. The very first issue of the Quarterly Journal of Economics. Arthur Hadley asks what railways teach about competition.","Old transport law had a neat split. The *highway* was public, a natural monopoly. The *carrier* was private and competed. A railway is road and carrier at once, so the split broke."],
  {fig:'steps',a:[{title:"HADLEY'S FOUR WAYS OUT (p. 31)",lines:['1 keep road and carrier separate','  fails: the railway undercuts outside carriers','2 state monopoly','  rejected: he refuses the socialist inference','3 parallel competing private roads','  fails: wasteful, ends in a rate war','4 admit monopoly, keep public rights of control','  his choice']}]},
  ["Now the core argument. In a fight for traffic, any rate above operating expenses pays something. So *fixed charges* are ignored, just as rent does not enter the price of wheat. Rates fall toward operating cost and leave nothing for interest or repairs.","So far railways look like farms. Then comes the twist."],
  ["Farming has *diminishing return*: push output and each extra bushel costs more, which stops the price war. Railways do not. Extra traffic is handled at better and better advantage. In Hadley's words, \"there is thus no direct limit to this cut-throat competition.\""],
  {fig:'bars',a:[{title:'A RATE WAR (illustrative, not his numbers)',rows:[['full cost',100,'interest + operating'],['rate, month 1',90,''],['rate, month 3',70,''],['rate, month 6',55,''],['operating exp.',50,'the only floor']],max:100,note:'nothing left for fixed charges; consolidation follows'}]},
  ["The war has one exit: *consolidation*. On the way it brings discrimination between shippers and unstable rates. Write it this way for the exam: large fixed investment plus no diminishing return means *ruinous competition*, and ruinous competition ends in combination."]],
  q:[mc("In Hadley's argument, why is railway competition more disastrous than agricultural competition?",["Railways are not subject to diminishing return, so the war has no limit","Railways have higher operating expenses than farms","Railway owners are more reckless than farmers","Farmers combine more easily than railways"],"He says it is general economic law, not recklessness: no diminishing return means no natural stop."),
     tf("True or false: Hadley says a railway in a rate war will cut rates toward operating expenses, ignoring fixed charges.",true,"Fixed charges are disregarded just as rent is ignored in the price of wheat."),
     fill("Hadley: fixed charges are ignored in a rate war just as ____ does not enter the price of produce.",['rent'],"The farm analogy on p. 35.")],
  sa:[sa("Why does Hadley's railway rate war have no natural limit?","No diminishing return: extra traffic gets cheaper to carry.",[['diminish','increasing return','cheaper','cheap','advantage'],['return','traffic','cost','carry']]),
      sa("How does Hadley say railway competition ends?","In consolidation of the competing roads.",[['consolidat','combin','merg','monopol','amalgam']],1)],
  line:"fixed charges are ignored so railway rate wars end in consolidation"},

 {h:'Regulated combination, and factories next',beats:[
  ["If competition cannot work, what should the state do? Hadley rejects forcing it. He also rejects fixing rates by law: the Granger laws \"proved so bad\" in their first consequences. And he rejects state ownership.","His tools are two: *equality of treatment* between shippers, and *publicity* of management. Leave the absolute rate to the managers."],
  {fig:'events',a:[{title:'THREE PHASES OF US RAILWAY LAW (p. 44)',events:[['phase 1','forced active competition: failed'],['phase 2','shippers dictate rates (Granger): worse'],['phase 3','accept combination + publicity'],['next?','factory law may follow the same path']]}]},
  ["His line to quote: \"regulated combination is better than irresponsible competition.\" (p. 39). Report: accept, with the reviewer noting that the author is extremely sure of himself."],
  ["Then he generalises. Any industry with large permanent investment behaves like a railway. He borrows the phrase *law of the increasing return* from H. C. Adams (#07). Price wars alternate with monopoly prices: Standard Oil, coal, steel rails.","He calls this monopoly from *capital organization* the type \"characteristic of the present day\". Legal monopoly is largely past; natural monopoly means things like land."],
  {fig:'chain',a:[{title:'WHERE HADLEY SITS',nodes:['ADAMS #07','HADLEY #04','CLARK #05','GIDDINGS #06'],caps:['lends the law of the increasing return','railways: accept and regulate combination','reaches a parallel accept-and-regulate view','footnotes Hadley as a pessimist, p. 65'],end:'Bullock #12 (1901) files Hadley with the inevitabilists',token:'[R]'}]},
  ["Place him in the debate. Hadley responds to old transport law, the Granger Cases, and Adams (#07). Clark (#05) agrees. Giddings (#06) footnotes him among those who wrongly predict competition's suppression. Bullock (#12) lists his later writings among those blaming trusts on destructive competition."]],
  q:[mc("Which remedy did Hadley (1886) recommend for railways?",["Accept combination, with equality of treatment and publicity","State ownership of all railways","Legislated maximum rates, as in the Granger laws","Forced competition through parallel roads"],"He rejects the other three explicitly."),
     mc("From whom did Hadley borrow the 'law of the increasing return'?",["H. C. Adams","J. B. Clark","Alfred Marshall","F. H. Giddings"],"He credits Adams (#07) on p. 40 to extend the argument to factories."),
     tf("True or false: Hadley thought the railway case was special and would not extend to manufacturing.",false,"He predicts factory law will follow the railway path.")],
  sa:[sa("Hadley's two tools for regulating combined railways?","Equality of treatment and publicity of management.",[['equal','discriminat'],['public','publicity','disclos']]),
      sa("Hadley's famous line about combination?","Regulated combination beats irresponsible competition.",[['regulat'],['combin'],['irresponsib','competi']],2)],
  line:"regulated combination is better than irresponsible competition"}
]},

/* ------------------------------------------------ #05 */
{id:'05',year:1887,who:'Clark',title:'CLARK 1887 · THE LIMITS OF COMPETITION',secs:[
 {h:'Federations of giants',beats:[
  ["March 1887, Political Science Quarterly. J. B. Clark opens with Ricardo. Ricardo built permanent laws on a passing age: a *struggle for existence* between unequal rivals. Clark calls it *economic Darwinism*.","That contest is nearly over. The weak are gone. The survivors are few, strong and nearly equal. Further war would ruin all of them, so they combine."],
  {fig:'crowd',a:[{title:'ECONOMIC DARWINISM (sketch)',n:40,per:20,off:'o',on:'.',stages:[{frac:0.4,cap:'unequal rivals: the weak are killed out'},{frac:0.75,cap:'few strong, nearly equal survivors left'},{frac:0.9,cap:'"armed neutralities and federations of giants"'}]}]},
  ["Clark's phrase for the new era: \"armed neutralities and federations of giants\" (p. 47). His examples of employers' combinations: glass, wall-paper, cut nails, screws, files, spool silk, anthracite, steel rails."],
  ["His verdict: combinations \"are to be accepted, studied, and, probably, regulated\" (p. 55). Suppressing them would mean social retrogradation and economic loss. Permanent suppression is impossible anyway; temporary repression drives them into illegal forms or restarts the internecine war."],
  {fig:'steps',a:[{title:'WHEN DOES AN INDUSTRY COMBINE? (Clark)',lines:['few producers, not thousands','  (agriculture has far too many)','nearly equal strength','a portable product','  silk: freight costs almost nothing','  baskets: bulky, local makers survive','cheap freight and tariffs help']}]},
  ["Write it this way. Clark: combination is a *normal product of evolution*, not a crime. Accept and regulate it. Note he says \"probably\" regulated. He is less sure than Hadley (#04) about the state's role, but lands in the same place."]],
  q:[mc("What did Clark (1887) recommend doing with producers' combinations?",["Accept, study and probably regulate them","Suppress them by criminal law","Nationalise them as state monopolies","Ignore them, since pools always collapse"],"p. 55: suppression means social retrogradation."),
     mc("Why, for Clark, does silk combine nationally while baskets do not?",["Silk is portable; bulky baskets carry high freight","Silk has more producers than baskets","Basket makers are protected by patents","Silk is not covered by the tariff"],"Portability lets a cheap mill reach the whole country."),
     tf("True or false: Clark read Ricardo's competition as the economics of a transitional era.",true,"Economic Darwinism between unequal rivals, now nearly over.")],
  sa:[sa("Clark: what kind of firms end up combining?","A few strong, nearly equal surviving firms.",[['few','small number'],['equal','strong','giant','surviv']],1),
      sa("Clark's verdict on combinations in one phrase?","Accept, study and probably regulate them.",[['accept','studi','study'],['regulat']])],
  line:"combinations are normal products of evolution to be accepted and regulated"},

 {h:'Horizontal strata and residual competition',beats:[
  ["Clark's second target is Cairnes's *non-competing groups*. Cairnes grouped workers by class qualification. Competition across groups was only potential: the next generation choosing a better trade.","Clark says machinery and education have erased those class lines. Only unions might rebuild them artificially."],
  {fig:'steps',a:[{title:"CLARK'S FURNITURE GROUP (p. 56)",lines:['finishing        <- competes only with finishers','cabinet making','transporting','lumber dealing   (each layer: capitalists + men)','wood cutting     <- raw-material stage','before combining: war inside a layer','after combining: war across the layers']}]},
  ["Real competition runs along *horizontal strata* of production. A lumber dealer undersells lumber dealers, not cabinet makers. So the groups that compete are the groups that combine.","Then two kinds of limit. Fixing prices limits *actual competition*. Restricting output limits *potential competition*: the flow of labour and capital between strata."],
  {fig:'compare',a:[{left:{h:'CAIRNES',lines:['groups by class','qualification','competition: potential','(next generation)']},right:{h:'CLARK 1887',lines:['groups by stage of','production','competition: actual','(who undersells whom)']},note:'Giddings #06 adds a third grouping: by mental capacity'}]},
  ["What checks a combination's price? *Residual competition*, in two forms. Actual: rivalry among pool members of roughly equal strength. Potential: between the whole combination and the rest of society. Prices are held by competition in \"latent and residual\" forms."],
  ["Clark then hands off. He leaves the study of residual competition to someone whose analysis derives weight from \"practical observation\" (p. 58). The next article in the same issue is Giddings (#06), who does exactly that. Clark parallels Hadley (#04). Bullock (#12) later discusses Clark's *later* papers on potential competition and calls that argument consistent."]],
  q:[mc("How do Clark's competing groups differ from Cairnes's non-competing groups?",["Clark groups by stage of production; Cairnes by class qualification","Clark groups by mental capacity; Cairnes by industry","Clark groups by region; Cairnes by stage of production","Clark groups by firm size; Cairnes by wage level"],"Grouping by mental capacity is Giddings's addition."),
     fill("Clark: price-fixing limits actual competition; restricting output limits ____ competition.",['potential'],"Potential = the transfer of labour and capital between groups."),
     tf("True or false: after combination, Clark says the industrial war is fought across the horizontal lines, between strata.",true,"Lumbermen against transporters and furniture makers, not lumbermen against lumbermen.")],
  sa:[sa("Clark's two forms of residual competition?","Actual among pool members; potential from outside capital.",[['actual','member','inside','within'],['potential','outside','societ']]),
      sa("Who answered Clark in the same PSQ issue?","Giddings, The Persistence of Competition.",[['gidding']],1)],
  line:"competition and combination both run within horizontal strata of production"}
]},

/* ------------------------------------------------ #06 */
{id:'06',year:1887,who:'Giddings',title:'GIDDINGS 1887 · THE PERSISTENCE OF COMPETITION',secs:[
 {h:'Competition is conserved, pools are unstable',beats:[
  ["Same journal, same issue, the very next article. Franklin Giddings takes Clark's (#05) framework and pushes back on emphasis. Hadley (#04) and Clark forecast that competition will be suppressed. Giddings says it will not be destroyed, only converted."],
  ["His odd but memorable reason: competition in some form is \"an implication of the conservation of energy.\" People have unequal energy, so their activity is unequal. When market competition seems suppressed, ask where its forces went.","Two errors to avoid: assuming competition is absent because it is not visible, and ignoring it because it is imperfect."],
  {fig:'steps',a:[{title:'WHY A POOL CANNOT HOLD (pp. 65-67)',lines:['members are unequal, and their fortunes shift','some members cheat on the agreement','outside capital keeps accumulating','high prices invite new capital in','"The combination equilibrium may be,"','"at best, an unstable one." (p. 66)']}]},
  ["Then the facts. One adult's daily supplies cost 43.53 cents in 1870 and 30 cents in 1885, despite the pools. Nail mills grew from 68 to 79 in 1883. The anthracite pool of 1873 broke in 1876.","In the wall-paper pool, one member paid $10,000 a year in forfeits rather than stop underselling."],
  {fig:'bars',a:[{title:'GIDDINGS: POOLS FAIL TO HOLD (pp. 67-69)',rows:[['supplies 1870',43.53,'43.53 cents'],['supplies 1885',30,'30 cents'],['nail mills before',68,'68 mills'],['nail mills 1883',79,'79 mills']],max:80,note:'prices fell and capacity grew despite the pools'}]},
  ["His estimate: probably not one-tenth of the combinations limited competition for long. Write it this way: Giddings is an early empirical case that cartels are unstable, through cheating, entry and the trade cycle."]],
  q:[mc("According to Giddings (1887), competition is permanent because it is an implication of what?",["The conservation of energy","The law of diminishing return","The struggle for existence","The mobility of capital"],"Unequal energies produce unequal activity."),
     mc("Which fact did Giddings use to show a pool failing?",["A wall-paper pool member paid $10,000 a year in forfeits","Standard Oil's transport rebates","Railway rates fell to operating expenses","Silk mills shipped nationally at no cost"],"Rather than stop underselling, he paid the fine."),
     tf("True or false: Giddings agreed with Hadley that competition was being suppressed.",false,"He footnotes Hadley among the pessimists and disagrees.")],
  sa:[sa("Giddings: why is the combination equilibrium unstable?","Unequal members cheat and outside capital enters.",[['cheat','unequal','undersell'],['capital','enter','outsid','new']],1),
      sa("What does Giddings say happens to suppressed competition?","It is converted into other forms, not destroyed.",[['convert','redirect','other form','new form','persist','conserv']],1)],
  line:"competition is never destroyed only converted into other forms"},

 {h:'Cross-cutting groups and the solvency line',beats:[
  ["Giddings adopts Clark's grouping by stage of production. Then he adds groups by *personal qualification*, from responsible brain work to automatic manual work, cutting across Clark's strata. A combination forms inside one cell of that grid."],
  {fig:'compare',a:[{left:{h:'NON-COMPETING GROUP',lines:['members compete with','each other','but not with outsiders']},right:{h:'COMBINATION',lines:['members do not compete','with each other','but do with outsiders']},note:'Giddings p. 71: an exam favourite'}]},
  ["Where are combinations easiest? Among the few producers of final, specialised goods: rails, nails, wire. Hardest among the many producers of crude materials, unless a natural or patent monopoly helps, as in anthracite and steel.","Capital shut out of a pooled field finds new utilities, as steel replaced iron. Inside a pool, rivalry moves to quality: the brass-goods combination."],
  {fig:'compare',a:[{left:{h:'NORMAL COMPETITION',lines:['drives price to cost','supplies demand fully','Ricardo assumed this','keep it']},right:{h:'ABNORMAL COMPETITION',lines:['chronic sale below cost','needs heavy fixed','charges and reserves','pools rightly curb it']},note:'combinations work only "below the solvency line" (p. 78)'}]},
  ["So pools are defensive and track depressions. A pool that holds prices high invites capital, and heavy fixed charges then make the fight ruinous. Pools must let price gravitate to cost of production. He even proposes \"combination actuaries\" to set fines for price-cutting.","Ricardo never assumed chronic selling below cost. Curbing that waste strengthens normal competition, so Ricardo stands."],
  ["Place it. Giddings answers Clark (#05) and footnotes Hadley (#04). Marshall (#08) independently notes trusts fail when they price too high. Bullock (#12) takes up the persistence theme in 1901. Do not write that Giddings is anti-combination. He accepts pools; he disputes how far they suppress competition."]],
  q:[mc("For Giddings, what is the difference between a combination and a non-competing group?",["Combination members compete with outsiders, not each other","Combination members compete with each other, not outsiders","A combination is legal; a non-competing group is not","A non-competing group is always a labour union"],"The non-competing group is the mirror image."),
     mc("What kind of competition did Giddings think pools could rightly suppress?",["Chronic selling below cost under heavy fixed charges","All competition between members","Competition in quality and new products","Competition from outside capital"],"Only competition 'below the solvency line'."),
     tf("True or false: Giddings thought combinations were easiest among many producers of crude materials.",false,"Easiest among few producers of final, specialised goods.")],
  sa:[sa("Which competition do pools curb, per Giddings?","Only ruinous competition below cost, below the solvency line.",[['below','solvency','ruinous','abnormal']],1),
      sa("Where does capital shut out of a pool go, per Giddings?","Into new products, substitutes, and better quality.",[['new','substitut','utilit','qualit','steel']],1)],
  line:"pools only curb competition below the solvency line so ricardo stands"}
]},

/* ------------------------------------------------ #07 */
{id:'07',year:1887,who:'Adams',title:'ADAMS 1887 · RELATION OF THE STATE TO INDUSTRIAL ACTION',secs:[
 {h:'Three classes of industry and the rule for state control',beats:[
  ["January 1887, Publications of the American Economic Association. Henry C. Adams says laissez-faire is a conservative maxim, not a scientific principle. Law should keep competition's benefits and guard against its evils.","Three evils of unregulated competition (p. 38): the worst competitor sets the moral level of a trade; society loses the benefits of monopoly; government is left weak."],
  ["Against the first evil, the state can *raise the plane of competition*. Factory laws on child labour or a normal working day do not restrict competition. They set its legal floor, encoding what the decent majority already wants."],
  {fig:'table',a:[{title:"ADAMS'S THREE CLASSES (pp. 55-59)",head:['returns','2x gives','3x gives','example'],rows:[['constant','2y','3y','retail'],['diminishing','2y','2 3/4 y','farming'],['increasing','2y','more than 3y','railways']],left:[0,3],note:'only the third needs state control'}]},
  ["Constant returns: retail is easy to enter, so competition regulates it. Diminishing returns: farming. \"There is no call for government farming.\" Increasing returns: an established firm can expand more cheaply than a newcomer can enter.","So \"free competition is powerless to exercise a healthy regulating influence\" (p. 60). Widening the old road beats building a new one. Parallel lines get built to be sold to the old road."],
  {fig:'steps',a:[{title:'THE INCREASING-RETURNS ARGUMENT',lines:['incumbent expands cheaply to meet new demand','a new rival cannot enter as cheaply','so competition cannot regulate it','= natural monopoly','choice: extra-legal monopoly or legal one','legal one runs on public financiering:','price = cost, accounts made public']}]},
  ["The rule to write: state control \"should be co-extensive with the application of the law of increasing returns.\" Mind two traps. Adams's increasing returns concern one established firm expanding, not Marshall's industry-wide economies. And high profit from *superior management* is a rent of talent, not monopoly profit.","Placement: Hadley (#04) borrows his law to reach factories. Marshall (#08) wants public control of indivisible industries but not state management."]],
  q:[mc("According to Adams (1887), which industries need state control?",["Industries of increasing returns","Industries of diminishing returns, like farming","Industries of constant returns, like retail","All industries with more than one firm"],"Control should be co-extensive with increasing returns."),
     mc("Why is competition powerless under increasing returns, for Adams?",["The incumbent can expand more cheaply than a rival can enter","Increasing returns raise costs for every firm","Consumers prefer to buy from many sellers","The state already owns these industries"],"Widening the old road beats building a new one."),
     tf("True or false: Adams said factory laws restrict competition and should be avoided.",false,"They raise the plane of competition without restricting it."),
     fill("Adams: under public financiering, price equals ____.",['cost','cost of service'],"Private firms charge the highest price that does not curtail profitable business.")],
  sa:[sa("Adams's rule for the reach of state control?","Co-extensive with the law of increasing returns.",[['increas'],['return']]),
      sa("Adams's example of a diminishing-returns industry?","Farming, so no call for government farming.",[['farm','agricult']],1)],
  line:"state control should match the reach of increasing returns"}
]},

/* ------------------------------------------------ #08 */
{id:'08',year:1890,who:'Marshall',title:'MARSHALL 1890 · SOME ASPECTS OF COMPETITION',secs:[
 {h:'Analysis, not dogma: the trust movement',beats:[
  ["September 1890, Leeds. Alfred Marshall gives the presidential address to Section F of the British Association, printed in the Journal of the Royal Statistical Society in December.","He opens with a method lesson from *Protection*. The old English economists dismissed new-country arguments, such as infant industries and increasing return in manufacture, as heresy. By killing the messenger they lost credibility. Do not repeat that with trusts."],
  {fig:'chain',a:[{title:"MARSHALL'S METHOD LESSON",nodes:['PROTECTION','DOGMA','LOST CREDIT','TRUSTS'],caps:['new countries had partly valid arguments','old economists condemned them wholesale','"killing the messenger" cost them belief','same risk now: analyse, do not denounce'],end:'combinations will be permanent, good and bad',token:'[!]'}]},
  ["Why is the movement stronger in America? England's Free Trade has kept increasing return from strengthening combinations as much as in protectionist America. And better transport makes pressure from combinations \"more extensive but less intensive\": wider areas, weaker grip at any point."],
  ["The American complaint, which he reports from a Congressional committee: firms with big plants sell at *Prime Cost* in slack times. Competition \"burns so furiously as to smother itself in its own smoke.\" Combination then looks like the only escape from ruin."],
  {fig:'steps',a:[{title:"MARSHALL'S REPLY TO THE ALARM",lines:['the trust movement is exaggerated','Standard Oil is special:','  natural and transport advantages','smart trusts follow a moderate price policy','high prices bring cheating, entry, anger','pools slide "on an inclined plane"','  toward full consolidation']}]},
  ["Why do pools slide into consolidation? A pool weakens each member's incentive to manage well, so work shifts to the best plants and power to the centre. And the law helps it along by banning pools while allowing a single amalgamated firm."]],
  q:[mc("What lesson from Protection did Marshall (1890) apply to trusts?",["Don't condemn wholesale what is partly valid; analyse it","Protection always produces trusts, so abolish tariffs","Infant industries should be run by the state","Increasing return makes free trade impossible"],"The old economists lost credibility by dogmatism."),
     fill("Marshall: the pressure of combinations is becoming more extensive but less ____.",['intensive'],"Wider area, weaker grip at any one point (p. 622)."),
     tf("True or false: Marshall argued that pooling tends to slide toward full consolidation.",true,"'On an inclined plane' toward amalgamation.")],
  sa:[sa("Where was Marshall's 1890 address given?","British Association Section F, Leeds.",[['leeds','british association','section f']],1),
      sa("Why do pools drift to consolidation, per Marshall?","Members lose incentive to manage well; power centralises.",[['incentive','manag','centr','power'],['weak','lose','less','shift','central']],1)],
  line:"economists must analyse trusts not condemn them as with protection"},

 {h:'The false antithesis and indivisible industries',beats:[
  ["The famous line: \"There seems to have been set up a false antithesis between competition and combination.\" (p. 626).","His examples: law condemned workmen's unions while the employer, himself a combination of capital, was let alone. Law bans pools and loose combinations while a single consolidated firm may do the same things. The Sherman bill interests him because it reaches individuals who monopolise."],
  {fig:'compare',a:[{left:{h:'STATE CONTROL',lines:['absolute, for gas,','water, railways','sometimes ownership','MARSHALL: yes']},right:{h:'STATE MANAGEMENT',lines:['run by a department','invites jobbery','less inventive','MARSHALL: no']},note:'Adams #07 was open to public management'}]},
  ["For *indivisible industries*, his name for gas, water, railways, tramways and electricity, public interference \"must be absolute\". But private management is more inventive and better at spotting talent.","His device: the public owns the franchise and leases it for limited years. Firms *compete for the franchise* on the price or quality of service they offer, not on rent paid."],
  {fig:'compare',a:[{left:{h:'COMPETITION IN',lines:['BARGAINING','buy low, sell high','"almost pure waste"','trusts save some']},right:{h:'COMPETITION IN',lines:['PRODUCTION','better goods, methods','serves the public','trusts lose this']},note:'monopolies still bargain on a large scale'}]},
  ["In ordinary trades, trusts' claim to stabilise industry is unproven, and many industries reach full economy at moderate size. The deeper point: trusts exploit *existing* knowledge; a multitude of independent firms produces *new* knowledge. That *inventive energy* is competition's chief service.","He ends between \"irresponsible competition\" and an \"ironbound socialism\": public control and public opinion. I have refereed many presidential addresses; this one has content."],
  ["Place it. Marshall answers the American trust debate and, unnamed, younger Americans under German influence. Compare Adams (#07) on control and Hadley (#04) on regulated combination. Bullock (#12) quotes Marshall that a monopoly must keep bargaining and manoeuvring on a large scale."]],
  q:[mc("What did Marshall mean by a 'false antithesis between competition and combination'?",["Law bans loose combinations but lets one firm do the same","Competition and combination always produce identical prices","Combination is merely a slower form of competition","Trusts and unions are both illegal"],"Unions condemned while the employer, a combination of capital, was not."),
     mc("Marshall's policy for indivisible industries such as gas and water?",["Public control, sometimes ownership, but private management","State management by a public department","Laissez-faire with free entry","Compulsory breakup into many small firms"],"Control yes, management no; franchise leasing."),
     tf("True or false: Marshall's main worry about large consolidations was that they add little new knowledge.",true,"Independent firms have superior inventive energy.")],
  sa:[sa("Marshall's franchise idea for indivisible industries?","Lease franchise; firms bid on price or quality.",[['franchis','leas'],['price','qualit','bid','compet']]),
      sa("What do independent firms offer that trusts lack, per Marshall?","Inventive energy producing new knowledge.",[['invent','new knowledge','innovat','new idea','progress']],1)],
  line:"competition versus combination is a false antithesis"}
]},

/* ------------------------------------------------ #12 */
{id:'12',year:1901,who:'Bullock',title:'BULLOCK 1901 · TRUST LITERATURE: A SURVEY AND CRITICISM',secs:[
 {h:'Large-scale production is not monopoly',beats:[
  ["February 1901, Quarterly Journal of Economics. Charles Bullock reviews the flood of trust writing from 1897 to 1900: Jenks, Ely, Collier, von Halle, Baker, the boosters Gunton and Dodd, the Industrial Commission.","He sorts it into eight classes. One camp treats trusts as inevitable, Hadley's later work among them. Another wants competition restored, Clark among them."],
  ["First: trusts are monopolies. Combinations controlling 65 to 95 per cent of output, and a wider margin between materials cost and price after combining, show \"monopolistic intent and monopolistic power\" (p. 185).","Then the key: readers must \"grasp firmly the distinction between large-scale production and monopoly.\""],
  {fig:'compare',a:[{left:{h:'LARGE-SCALE PRODUCTION',lines:['big independent plants','already the norm','not controversial']},right:{h:'MONOPOLY',lines:['one centralised company','replaces those plants','the real trust issue']},note:'pro-trust writers prove the left, claim the right'}]},
  ["The three pro-trust arguments, and why each fails. (a) Efficiency: savings on cross-freights, patents, idle plant and buying are small, and beyond a limit size monopoly breeds apathy. (b) Mass of capital to crush rivals: only temporary, and banning price discrimination removes it. (c) Ruinous competition: the over-investment comes mainly from tariffs and tax laws."],
  {fig:'bars',a:[{title:'POTENTIAL COMPETITION FAILS (p. 211)',rows:[['independent floor',100,'$1.00'],['trust price',99.9,'99.9 cents'],['trust cost',80,'80 cents']],max:100,note:'trust keeps ~19.9 of the 20-cent saving'}]},
  ["The killer example. If an independent needs $1 and the trust's cost is 80 cents, the trust can charge 99.9 cents and invite no entry. Consumers get almost nothing. So whoever believes in trust superiority cannot also rely on *potential competition*.","Clark's version is consistent, Bullock says, because Clark does not think monopoly more efficient."],
  ["Placement. Bullock answers the inevitabilists, including Hadley's line (#04), cites Clark's later papers (#05's line), quotes Marshall (#08), and echoes Giddings (#06) on persistence: trusts buy rivals because their competition is \"dangerous, and not hopeless\". Nothing in your set answers him; he closes group A. Remedy: remove privileges such as tariffs, rebates and patents."]],
  q:[mc("Which distinction does Bullock (1901) tell readers to grasp firmly?",["Large-scale production versus monopoly","Actual versus potential competition","Normal versus abnormal competition","Control versus management"],"The trust issue is replacing big independents with one company."),
     mc("In Bullock's example, independents need $1 and the trust's cost is 80 cents. What can the trust charge?",["99.9 cents, inviting no entry","80 cents, its cost","$1.20, a monopoly mark-up","90 cents, splitting the saving"],"Potential competition only stops price reaching $1."),
     tf("True or false: Bullock rejected Clark's potential-competition argument as inconsistent.",false,"He calls Clark consistent; his target is writers claiming trust superiority too.")],
  sa:[sa("What mainly causes 'ruinous competition', per Bullock?","Over-investment caused by tariffs and tax laws.",[['tariff','tax','protect','government']],1),
      sa("Why can't potential competition protect consumers from a superior trust?","Trust prices just below entrants' cost, keeps savings.",[['below','just under','99','entr','independ'],['keep','sav','pocket','consumer']],1)],
  line:"large scale production is not the same as monopoly"}
]}

],
gloss:[
['fixed charges',"Hadley's term for interest and other costs that do not vary with traffic; in a rate war they are ignored and rates fall toward operating expenses.","A railway cuts rates almost to operating cost, leaving nothing for interest.",['ruinous competition','operating expenses']],
['ruinous competition',"Price-cutting below full cost in industries with heavy fixed investment; Hadley says it ends in consolidation, Giddings calls it abnormal, Bullock blames tariffs.","Hadley's railway rate war, ended by consolidation.",['fixed charges','solvency line']],
['equality and publicity',"Hadley's remedies for combined railways: equal treatment of shippers and compulsory publicity of management, instead of rate-fixing or state ownership.","Regulated combination is better than irresponsible competition.",['ruinous competition']],
['economic Darwinism',"Clark's name for Ricardo's competitive struggle between unequal rivals, which he says belonged to a transitional age.","It ends in armed neutralities and federations of giants.",['residual competition']],
['horizontal strata',"Clark's groups by stage of production (wood cutting, lumber dealing, transport, cabinet making, finishing); competition and combination run within a stratum.","Lumber dealers undersell lumber dealers, not cabinet makers.",['non-competing groups','residual competition']],
['residual competition',"Clark: the competition left after combination; actual among pool members, potential between the combination and outside capital.","Prices held in check by competition in latent and residual forms.",['potential competition','horizontal strata']],
['non-competing groups',"Cairnes's grouping of workers by class qualification. Giddings: members compete with each other but not outsiders, unlike a combination.","Clark says machinery and education erased these lines.",['horizontal strata','combination']],
['combination',"For Giddings, a body whose members do not compete with each other but do compete with outsiders; an unstable, defensive equilibrium.","The wall-paper pool of 1880.",['non-competing groups','solvency line']],
['solvency line',"Giddings: combinations deal effectively only with competition below it, chronic selling below cost; normal competition to cost survives.","Pools must let price gravitate to cost of production.",['ruinous competition','combination']],
['increasing returns',"Adams: product rising more than in proportion as an established enterprise adds capital and labour, so it can expand more cheaply than a rival can enter.","Widening the old railway beats building a new one.",['natural monopoly','plane of competition']],
['plane of competition',"Adams: the legal floor (no child labour, a normal working day) that shapes competition without restricting it.","Factory laws raise the plane of competition.",['increasing returns']],
['false antithesis',"Marshall's charge that law treats combination as the opposite of competition, banning pools and unions while a single firm may do the same.","There seems to have been set up a false antithesis between competition and combination.",['indivisible industries']],
['indivisible industries',"Marshall's name for gas, water, railways, tramways and electricity: public control, sometimes ownership, but private management.","A franchise leased to the firm offering the best price or quality.",['false antithesis','increasing returns']],
['potential competition',"The threat of entry. Bullock: it can only stop price reaching the independents' cost, so it cannot protect consumers from a truly superior trust.","Trust cost 80 cents, entry at $1, price 99.9 cents.",['residual competition','large-scale production']],
['large-scale production',"Bullock: big independent plants, already normal and uncontroversial, as distinct from monopoly by one centralised combination.","Grasp firmly the distinction between large-scale production and monopoly.",['potential competition']]
],

/* ------------------------------------------------ #11 */
{id:'11',year:1898,who:'Fisher',title:'FISHER 1898 · COURNOT AND MATHEMATICAL ECONOMICS',secs:[
 {h:'The founder rediscovered, and his monopoly',beats:[
  ["January 1898. Irving Fisher writes in the Quarterly Journal of Economics. The occasion: N. T. Bacon's 1897 English *translation* of Cournot's *Recherches*, first published in 1838 and ignored for decades.","In 1838 the mathematical school was almost nobody. Fisher counts some thirty active enthusiasts now. Cournot, he says, was its principal founder."],
  ["Fisher praises the price chapters as almost uniformly excellent. Cournot was first to draw a *demand curve*. He solved monopoly: the monopolist picks the output where the gain from one more unit just covers its added cost.","Fisher even gives a reading guide: about 103 essential pages, plus notes on calculus."],
  {fig:'plot',a:[{title:'MONOPOLY AND A COST RISE (sketch)',xl:'quantity',yl:'p',xr:[0,6],yr:[0,10],curves:[{f:x=>10-x,ch:'D',name:'demand'},{f:x=>10-2*x,ch:'m',name:'marg. revenue'},{f:x=>2,ch:'c',name:'marg. cost'}],eq:[1,2],eqf:(x,y)=>`MR = MC at q ≈ ${x.toFixed(1)}; price = ${(10-x).toFixed(1)}`,shift:{curve:2,to:{f:x=>4},cap:'cost up 2: price up 1 here; can be more or less'},cap:'monopoly output where MR meets marginal cost'}]},
  ["Two monopoly results Fisher underlines. First, Cournot's section 30: *fixed charges*, costs that do not vary with output, do not affect the monopoly price. Fisher notes this is now conspicuous in American railway experience, citing Hadley.","Second, a rise in marginal cost raises the monopoly price, sometimes by more than the rise and sometimes by less."],
  ["Under unlimited competition Cournot showed price equals φ′(x). Cournot used only symbols. Fisher gives it the verbal name *marginal cost*, and so credits Cournot with anticipating Jevons, Menger and Walras. Cournot also drew supply and demand curves later credited to Fleeming Jenkin (1870)."]],
  q:[mc("What occasioned Fisher's 1898 article on Cournot?",["N. T. Bacon's 1897 English translation of the Recherches","Cournot's death and the sale of his papers","Moore's biography of Cournot","The first French review of the Recherches"],"Bacon's translation of the 1838 book set off the revival."),
     tf("True or false: Fisher reports Cournot's result that fixed charges do not affect monopoly price.",true,"Cournot section 30; Fisher links it to Hadley and American railways."),
     fill("Fisher's verbal name for Cournot's φ′(x), to which competitive price is equal?",['marginal cost','marginal cost of production'],"Cournot used only the symbol; Fisher supplies the term.")],
  sa:[sa("What did Fisher call Cournot?","Principal founder of mathematical economics.",[['founder','father','founded'],['mathemat']]),
      sa("Under competition, price equals what, in Cournot per Fisher?","Marginal cost of production.",[['marginal'],['cost']])],
  line:"cournot founded mathematical economics but fisher found three faults"},

 {h:'Three faults: duopoly, tariffs, social income',beats:[
  ["Fault one is duopoly. Cournot's two producers each assume the rival's *output* stays constant and adjust their own. Then price lands between monopoly and competition.","Fisher: those are not the conditions of real competition between two producers."],
  {fig:'compare',a:[{left:{h:'COURNOT PREMISE',lines:["rival's OUTPUT fixed",'each sets own output','price between monopoly','  and competition']},right:{h:'BERTRAND PREMISE',lines:["rival's PRICE fixed",'each undersells','while profit remains','= unlimited competition']},note:'Fisher: real rivals assume neither one'}]},
  ["A more natural hypothesis, Fisher says, is that each assumes the rival's *price* stays fixed. Then each undersells the other while any profit remains, and the result is the same as unlimited competition. He cites Bertrand, Marshall, Pareto and Edgeworth.","But no business man assumes either. He is like a *chess player* forecasting his opponent's reply. The problem is dynamic."],
  ["Fisher calls the completest treatment Edgeworth's articles in the Giornale degli Economisti (1897). On complements he is kinder: one monopolist of copper and zinc sells brass cheaper than two separate ones, and Edgeworth applies this to merging connecting railways. Fisher finds those conclusions in the main consonant with facts."],
  {fig:'steps',a:[{title:"FISHER'S THREE CHARGES",lines:['1 duopoly: rival output fixed is unrealistic','2 tariff: formula fails a simple check','  the effect should vanish when the tax does','3 social income: no consumers\' rent','  Cournot counts only the rectangle of loss','  he misses the triangle under demand']}]},
  ["Fault three: Cournot lacked *consumers' rent*. When price rises he counts as the consumers' loss only a rectangle, and ignores the triangle lost by those who stop buying. Fisher ends defending mathematics: wages are a flow, not a fund.","In the debate: Fisher answers Cournot and sides with Bertrand and Edgeworth. Moore #14 continues the revival; Moore #15 cites Fisher; Edgeworth #20 keeps up the attack on Cournot's duopoly."]],
  q:[mc("What is Fisher's objection to Cournot's duopoly theory?",["Each seller is assumed to treat the rival's output as fixed, which is unrealistic","Cournot made an algebraic slip in solving the equations","Two sellers always combine into a monopoly","Duopoly price must equal marginal cost"],"Fisher attacks the premise; real rivals forecast replies like chess players."),
     tf("True or false: Fisher thought Cournot's complementary-monopoly conclusions absurd.",false,"Fisher called them in the main consonant with facts; Moore #15 calls them extraordinary."),
     mc("What does Fisher say is missing from Cournot's 'social income' chapters?",["Consumers' rent, the triangle of loss","Marginal cost","The demand curve","Any treatment of taxes"],"Cournot counted only the rectangle of loss when price rises.")],
  sa:[sa("If each duopolist takes the rival's price as fixed?","Undercutting until the competitive price results.",[['underc','undersell','cut'],['compet','unlimited']]),
      sa("Fisher's image for how real duopolists behave?","Like chess players forecasting the rival's move.",[['chess']],1)],
  line:"duopolists forecast rival moves like chess players so the problem is dynamic"}
]},

/* ------------------------------------------------ #13 */
{id:'13',year:1904,who:'Pigou',title:"PIGOU 1904 · MONOPOLY AND CONSUMERS' SURPLUS",secs:[
 {h:'Taking the surplus: discrimination and parcels',beats:[
  ["September 1904, Economic Journal. A. C. Pigou asks how a monopolist can do better than its best single price.","His starting point: some point on the total benefit curve always lies above the monopolist's maximum revenue. Buyers keep a *consumers' surplus*, and there is money to be taken."],
  ["The direct attack is *discrimination*. Ideally, a separate price for every unit, matched to the intensity of demand, takes the whole surplus. That is impracticable.","Group discrimination does happen where goods are difficult to transfer between persons and through time: gas, water, and railways raising the charge per pound-mile when a customer's demand is strong. He cites Hadley and Acworth."],
  ["The second direct attack is cleverer. Refuse to sell except in *parcels* of a fixed size. The buyer is forced off his demand curve onto Edgeworth's indifference curve through the origin, where his net gain is zero."],
  {fig:'plot',a:[{title:'SELLING IN PARCELS (illustrative)',xl:'quantity',yl:'p',xr:[0,8],yr:[0,10],curves:[{f:x=>10-x,ch:'D',name:"demand DD'"},{f:x=>10-x/2,ch:'B',name:'parcel price DB'}],cap:'on DB the buyer of a whole parcel keeps no surplus'}]},
  ["Read the figure. DB lies above demand. Pick a parcel size OM and charge the price on DB. The surplus the buyer gets on the first units is exactly cancelled by his loss on the later units he did not want. Area PQF equals area DNF.","The buyer pays more than his demand price per unit and still buys, because each sale is all or nothing."],
  {fig:'compare',a:[{left:{h:'DISCRIMINATION',lines:['different prices to','units or groups','goods hard to resell','e.g. gas, railways']},right:{h:'PARCELS DEVICE',lines:['one price per unit','but a forced lot size','pushes buyer to the','zero-gain curve']},note:'first/second/third degree comes later (1912)'}]}],
  q:[mc("Why can a monopolist gain by attacking consumers' surplus, per Pigou 1904?",["Some point on the total benefit curve lies above maximum monopoly revenue","Marginal cost always falls as output rises","Buyers always combine against the seller","Total benefit equals the monopolist's revenue"],"The gap between total benefit and best revenue is the prize."),
     tf("True or false: Pigou's 1904 paper uses the terms first-, second- and third-degree discrimination.",false,"That vocabulary comes from Wealth and Welfare (1912), not in your folder."),
     mc("In the parcels device, the buyer is pushed onto which curve?",["Edgeworth's indifference curve through the origin","Marshall's supply curve","The monopolist's marginal revenue curve","The average cost curve"],"Along it the buyer's net gain is zero.")],
  sa:[sa("What does the parcels device do?","Sells only fixed lots, stripping the buyer's surplus.",[['parcel','lot','fixed','size','all or nothing','package'],['surplus','gain','benefit']]),
      sa("Discrimination needs goods with what property?","Hard to transfer between persons and through time.",[['transfer','resell','resale','shift'],['person','time','hard','difficult','cannot']])],
  line:"a monopolist can take surplus by discrimination or by selling fixed parcels"},

 {h:'Four conditions, and driving out rivals',beats:[
  ["One buyer facing one seller is an indeterminate bargain, as in Edgeworth's Mathematical Psychics: the buyer can refuse terms to extract concessions.","With many independent buyers, refusing is a sure sacrifice for each of them. So the parcels device can work, but only under four conditions."],
  {fig:'steps',a:[{title:'PARCELS WORK ONLY IF ALL FOUR HOLD',lines:['1 no combination among buyers','2 imperfect transferability','  else middlemen split the parcels','3 perishability','  else buyers buy big lots less often','4 buyers fall into a few groups of similar people','Pigou: all four together are improbable']}]},
  ["The indirect attack: threaten to withhold supply. A combination tells a customer that if he deals with a rival he will be cut off. It works when losing the combination costs the buyer more than losing the rival: area DKQ exceeds area DRP."],
  ["His examples of *extruding competitors*: factors' agreements and unionised shops; shipping conferences offering more frequent sailings; telephone companies; leases of patented shoe machinery tied to the owner's other machines."],
  ["In the debate: Pigou builds on Marshall and Edgeworth. He answers himself in Wealth and Welfare (1912, not in your folder) with degrees of discrimination. Railway charging as discrimination returns in his #18; Yntema #24 treats discrimination between two markets."]],
  q:[mc("Which is NOT one of Pigou's four conditions for the parcels device?",["Demand must be perfectly inelastic","No combination among buyers","The good must be perishable","Imperfect transferability between buyers"],"The fourth real condition: buyers in a few groups of similar people."),
     mc("Which is one of Pigou's 1904 examples of extruding competitors?",["Tied leases of patented shoe machinery","Railway joint cost of coal and copper","Dumping steel abroad","Cournot's two mineral springs"],"Others: shipping conferences, telephone companies, unionised shops.")],
  sa:[sa("Why must the parcel good be perishable?","Otherwise buyers buy big lots less often.",[['otherwise','else','store','less often','larger','big'],['buy','lot','stock','purchas']]),
      sa("Indirect way a monopolist exploits surplus, per Pigou?","Threatening to withhold supply to exclude rivals.",[['withhold','cut off','refus','threat','boycott','tie'],['rival','compet','exclud','extrud']])],
  line:"parcels need no buyer combination no resale perishability and similar buyers"}
]},

/* ------------------------------------------------ #14 */
{id:'14',year:1905,who:'Moore',title:'MOORE 1905 · THE PERSONALITY OF COURNOT',secs:[
 {h:'The man behind the Recherches',beats:[
  ["May 1905. Henry L. Moore, in the Quarterly Journal of Economics, writes a biography. His main source is Cournot's unpublished *Souvenirs*, written in 1859.","Moore's portrait: a model scholar working under bad conditions. Unlike Darwin, he had no leisure or independent income for years, and an infirmity of the eyes made continuous work impossible."],
  {fig:'events',a:[{title:'COURNOT, PER MOORE 1905',events:[['1801','born at Gray, 28 August'],['1821','enters the Ecole Normale'],['1838','Recherches; inspector-general'],['1863','Principes, without symbols'],['1877','Revue sommaire; dies 30 March'],['1897','Bacon translation (revival)']]}]},
  ["Three economic works. The *Recherches* (1838): as late as 1873, Walras said, no French critic had reviewed it. The *Principes* (1863) restated it without mathematics and was poorly reviewed. The *Revue sommaire* (1877).","Cournot's own joke: he won his case of 1838 rather late, and lost his case of 1863."],
  ["His chief patron in the University was Poisson. Few contemporaries saw his worth. Moore blames the lag on his masterful independence and absolute truthfulness, and his dislike of self-advertisement.","Detail for the curious: methodical habits, one luxury, a snuff-box."],
  ["In the debate: this is biography, not analysis. It continues the revival Fisher #11 marked. Moore's own critique of Cournot's theory comes next year, in #15."]],
  q:[mc("What was Moore's main source for his 1905 biography of Cournot?",["Cournot's unpublished Souvenirs","Walras's letters","Bacon's translator's preface","Poisson's lecture notes"],"Written in 1859, unpublished."),
     mc("Which pairing of Cournot's works and dates is right?",["Recherches 1838; Principes 1863","Recherches 1863; Principes 1838","Recherches 1877; Principes 1897","Recherches 1801; Principes 1838"],"1838 mathematical; 1863 literary; 1877 Revue sommaire."),
     tf("True or false: Moore's 1905 paper is his analytical attack on Cournot's duopoly theory.",false,"That is #15 (1906). #14 is biography.")],
  sa:[sa("Why did Cournot's reputation lag, per Moore?","Independence, truthfulness, and dislike of self-advertisement.",[['independ','truth','advertis','modest','reticen']],1),
      sa("Who was Cournot's chief patron?","Poisson.",[['poisson']],1)],
  line:"moore drew cournot from the souvenirs a half blind independent scholar"}
]},

/* ------------------------------------------------ #15 */
{id:'15',year:1906,who:'Moore',title:'MOORE 1906 · PARADOXES OF COMPETITION',secs:[
 {h:'Five hypotheses hidden in "competition"',beats:[
  ["February 1906. Moore turns from biography to analysis. His charge: *perfect competition* quietly bundles five separate hypotheses. Economists derive results that need all five, then carry them into industries where some fail."],
  {fig:'steps',a:[{title:"MOORE'S FIVE HYPOTHESES",lines:['I   each factor seeks maximum net income','II  one price in one market','III one output barely affects price','IV  one output small relative to total','V   each ignores his effect on rivals','I alone = competition in its essential sense']}]},
  ["Now the two springs. *Cournot* uses I, II and V: price settles between monopoly and competition, in stable equilibrium. *Bertrand* uses I and II and denies III and IV: no limit to the fall in price, no equilibrium."],
  {fig:'plot',a:[{title:'COURNOT REACTION CURVES (sketch)',xl:'output of I',yl:'II',xr:[0,8],yr:[0,12],curves:[{f:x=>(12-x)/2,ch:'1',name:"I's best reply"},{f:x=>12-2*x,ch:'2',name:"II's best reply"}],eq:[0,1],eqf:(x,y)=>`Cournot point: ${Math.round(x)} each`,cap:"each takes the rival's output as given (V)"}]},
  ["Moore's verdict, and the exam wants it exactly. Cournot made no mathematical blunder: his conclusions follow rigidly from his premises. The fault is premise V, illegitimate once III and IV fail. Judged by realism, Bertrand is nearer the truth.","Moral: competition changes meaning with the number of competitors. We need to study how few is too few."]],
  q:[mc("Which of Moore's hypotheses does Cournot's duopoly use?",["I, II and V","I and II, denying III and IV","All five","III and IV only"],"Bertrand: I, II and the negatives of III and IV."),
     tf("True or false: Moore agrees with Bertrand that Cournot made a mathematical blunder.",false,"No blunder: the conclusions follow from the premises; premise V is the problem."),
     mc("What is 'competition in its essential sense' for Moore?",["Hypothesis I: each seeks maximum net income","Price equal to marginal cost","Many small sellers of one good","Free entry with no profits"],"Rivalry can be keen among few sellers, yet perfect competition needs all five.")],
  sa:[sa("Why is Cournot's premise V illegitimate, per Moore?","With few sellers, hypotheses III and IV fail.",[['few','iii','iv','three','four','small number'],['fail','false','do not hold','denied','negat']],1),
      sa("Who is nearer the truth, Cournot or Bertrand?","Bertrand, judged by realism of premises.",[['bertrand']],1)],
  line:"perfect competition bundles five hypotheses and few sellers break three and four"},

 {h:'No resting-place, and the wage doctrine',beats:[
  ["Add costs and limited capacity, as Edgeworth did. Each seller can supply three quarters of the market. They undercut each other down to a low price OQ. Then one restricts output and raises his price, and the cutting starts again.","Moore quotes Edgeworth: there could be no resting-place. The outcome is *indeterminate*."],
  {fig:'chain',a:[{title:"EDGEWORTH'S DUOPOLY, VIA MOORE",nodes:['MONOPOLY P','CUT','LOW Q','RESTRICT','CUT'],caps:['start near the monopoly price OP','each undercuts the other','price reaches OQ, capacity full','one restricts output, price rises','and round again: no rest'],end:'indeterminate: wages set by other causes',token:'[p]'}]},
  ["Paradoxes from Cournot's own equations: the bigger producer has the lower marginal cost. Under increasing returns, perfect competition has no equilibrium, yet duopoly has a stable one with price above marginal cost.","Complementary monopoly (Cournot ch. IX): separate monopolists give higher price and lower output than one. Moore calls these conclusions extraordinary."],
  ["The target is the doctrine that labour gets what it produces, usually tied to J. B. Clark (context; Moore does not name him). With few producers Moore will only grant that labour at least produces what it gets.","Four limits: monopoly, few producers, increasing returns, monopolised complements. After each: no statistics."],
  ["In the debate: Moore answers Cournot and Bertrand, uses Edgeworth, and cites Fisher #11. Edgeworth #20 restates indeterminacy in 1922; the imperfect-competition debate of group E comes later. Report: accept, with a request for those statistics."]],
  q:[mc("With few producers, Moore weakens 'labour gets what it produces' to what?",["Labour at least produces what it gets","Labour gets less than nothing","Labour gets its marginal product exactly","Labour gets the monopolist's profit"],"p. 224: the doctrine holds at best under perfect competition."),
     mc("What did Edgeworth's capacity-limited duopoly show, as Moore reports it?",["Price oscillates with no resting-place","A stable price between monopoly and competition","Price falls to zero and stays there","The larger seller drives out the smaller"],"Undercut to OQ, restrict, rise, undercut again."),
     tf("True or false: Moore calls Cournot's complementary-monopoly conclusions 'extraordinary'.",true,"Fisher #11 had called them consonant with facts.")],
  sa:[sa("What does Moore say is lacking for each limit?","Statistics on how much industry is in each condition.",[['statistic','data','figures','measure']],1),
      sa("Edgeworth's duopoly with limited capacity is what?","Indeterminate: price oscillates with no resting-place.",[['indetermin','oscillat','no rest','no equilib','unstable']],1)],
  line:"with few producers labour at least produces what it gets"}
]},

/* ------------------------------------------------ #19 */
{id:'19',year:1915,who:'Edgeworth',title:'EDGEWORTH 1915 · RECENT CONTRIBUTIONS TO MATH ECONOMICS',secs:[
 {h:'Mathematics as presumption',beats:[
  ["June 1915, Economic Journal: Section II of F. Y. Edgeworth's survey; Section I ran in March and is not in your folder. His method question: what is mathematical economics good for in practice?","His answer: *presumptions*. Pure and applied theory are both nearly equally false if taken too literally, yet both show probability or tendency."],
  {fig:'steps',a:[{title:'WHAT A THEOREM GIVES YOU',lines:['a tendency, from theory plus experience','held prima facie','until cause to the contrary is shown','like Mill\'s antecedent probability','e.g. a tax will reduce demand for the thing','not a verified prediction']}]},
  ["He calls these *antecedent probabilities*, after Mill and Laplace. They are a bridge from theory to practice, but he posts a notice: this bridge is not adapted to carry heavy traffic.","His examples come from Pigou's Wealth and Welfare (1912, not in your folder), which a hostile Quarterly Review critic had attacked. A footnote ties the critic to J. Shield Nicholson."],
  ["Edgeworth defends two of Pigou's principles. One: national dividend is greatest when marginal net products are equal in all uses, and self-interest tends to equalise them. Two: the elasticity of demand for labour is much greater than one."]],
  q:[mc("What does Edgeworth 1915 say mathematical theorems give the policy-maker?",["Presumptions that hold until cause to the contrary is shown","Exact predictions verified by statistics","Nothing, since pure theory is useless","Rules that must never be overridden"],"Antecedent probabilities, after Mill and Laplace."),
     tf("True or false: Edgeworth 1915 defends Pigou's Wealth and Welfare against a Quarterly Review critic.",true,"The footnote ties the critic to J. Shield Nicholson.")],
  sa:[sa("What is an antecedent-probability presumption?","A tendency valid until cause to the contrary appears.",[['tend','presum','prima facie','probab'],['until','contrary','unless','unverif']]),
      sa("Whose book supplies Edgeworth's examples?","Pigou's Wealth and Welfare.",[['pigou','wealth and welfare']],1)],
  line:"theorems give presumptions that hold until cause to the contrary is shown"},

 {h:'Gas and coke is not coal and copper',beats:[
  ["Now railway rates, the quarrel of #17 Taussig and #18 Pigou in 1913. Edgeworth says Pigou was wrong to call the experts' error an accident of language. The difference is between *things*.","The experts' quoted failing: their subtlety of thought was not equal to the subtlety of the distinctions."],
  {fig:'compare',a:[{left:{h:'JOINT PROPER',lines:['gas and coke (Mill)','one outlay gives both','x gas costs the same','as x gas plus y coke','split set by demand']},right:{h:'COST = F(x + y)',lines:['ton of coal, ton of','copper carried','cost depends on total','same prime cost a ton','prices tend to equal']},note:'opposite ends of a spectrum, says Edgeworth'}]},
  ["The spectrum runs: joint production proper (gas and coke), partial jointness (wool and mutton), independence, rival production. Cost of the form F(x + y) is the far extreme, a limit of *rival production*.","His money analogy: the experts confused symmetallism, a fixed bundle of gold and silver, with bimetallism, any proportion at a fixed ratio."],
  {fig:'steps',a:[{title:'EDGEWORTH ON RAILWAY RATES',lines:['cost depends on tons carried: F(x + y)','prime cost per ton is equal, coal or copper','so competitive rates tend to equality','monopoly obstructs the tendency','so equal rates = a regulative rule','discrimination fits early development only']}]},
  ["Verdict: for Pigou. The regulating cost is *prime cost*. Edgeworth does not claim actual rates equal prime cost; monopoly obstructs it, and cost of service is a rule for regulators, as the ICC now enforces. The competition that defenders of discrimination such as Hugo Meyer invoke is really duopoly.","Fanno, he notes, rejects the broad joint-cost notion as too vague and indeterminate."],
  ["In the debate: Edgeworth judges group C (#17 Taussig, #18 Pigou) for Pigou, building on Pigou's monopoly analysis in #13. Nothing in your folder answers him."]],
  q:[mc("Which side does Edgeworth 1915 take in the railway joint-cost debate?",["Pigou's: transport cost depends on total tons, not true joint cost","Taussig's: railway rates are a case of joint cost","Neither: rates are indeterminate","Hadley's: rates should follow what the traffic will bear"],"Gas/coke is joint proper; coal/copper ton-miles are F(x + y)."),
     fill("Where cost is F(x+y), competitive prices tend to equal what kind of cost?",['prime cost','prime','marginal cost'],"Equal per ton of coal or copper."),
     tf("True or false: Edgeworth claims actual railway rates already equal prime cost.",false,"Monopoly obstructs the tendency; it serves as a regulative rule.")],
  sa:[sa("Why do coal and copper rates tend to equality?","Prime cost per ton is the same for both.",[['prime','cost','ton'],['same','equal','identical']]),
      sa("When is value-of-service discrimination justified, per Edgeworth?","In an early stage of development.",[['early','develop','new','young','infan']],1)],
  line:"gas and coke is joint cost but ton miles depend on the sum"}
]},

/* ------------------------------------------------ #20 */
{id:'20',year:1922,who:'Edgeworth',title:'EDGEWORTH 1922 · THE MATHEMATICS OF AMOROSO',secs:[
 {h:'Price-cutting and jumping, for ever',beats:[
  ["September 1922. Edgeworth reviews Luigi Amoroso's Lezioni di Economia Matematica (1921; the book is not in your folder). He praises the treatment of value and the *curve of unitary costs*, which is average cost, like Pigou's.","Then the duopoly chapter, where Amoroso follows Cournot."],
  ["Amoroso's example: demand p = 450/(2 + x). The Cournot solution: Primus supplies 5, Secundus 8, price 30. Edgeworth calls the quantity convention fit for a kind of *kartel*, not for monopolists free to vary price."],
  {fig:'table',a:[{title:"EDGEWORTH'S PRICE WAR (Amoroso's numbers)",head:['step','price','profits'],rows:[['Cournot point','30','P 25, S 64'],['Primus cuts a hair','~30','P all but 79'],['cutting goes on','21.57','P about 1'],['Secundus serves tail','47.8','S about 80'],['Primus cuts again','<47.8','down again']],left:[0,2],note:'no rest while the two stay uncombined'}]},
  ["Why the jumps? Capacity is limited. At the bottom price Primus serves only about half the market. The unserved *tail* must go to Secundus, who need not match Primus's terms. He raises his price on them.","Theory predicts only that the jumping will go on for ever, as long as the monopolists are uncombined."],
  ["Verdict: Amoroso is alone among high authorities in siding with Cournot. Pigou's phrase *monopolistic competition* has output indeterminate (Wealth and Welfare, p. 193), and Pigou calls that commonly accepted. Edgeworth would cut the duopoly section from any English translation.","Even monopolists of complementary goods vibrate around the meeting of reaction curves; rival goods do so a fortiori."],
  ["In the debate: this is the last word of the Cournot–Bertrand–Edgeworth line in your folder, continuing Fisher #11 and Moore #15. The phrase monopolistic competition returns in group E (#63 Chamberlin 1937). I have refereed worse than Amoroso; I have also refereed Edgeworth."]],
  q:[mc("In Amoroso's example, what is the Cournot solution Edgeworth attacks?",["Primus 5, Secundus 8, price 30","Primus 8, Secundus 5, price 21.57","Each supplies 9.444 at price 30","Each supplies 4 at price 47.8"],"Profits 25 and 64, so Primus cuts."),
     tf("True or false: Edgeworth says Cournot's duopoly equations contain a mathematical error.",false,"The quantity convention suits a kartel, not price-setting monopolists."),
     mc("Whose phrase 'monopolistic competition' does Edgeworth 1922 quote?",["Pigou's, in Wealth and Welfare","Chamberlin's","Amoroso's","Cournot's"],"Pigou says output there is indeterminate.")],
  sa:[sa("Why does Secundus jump his price up?","He alone can serve the tail Primus cannot.",[['tail','unserved','left','remaining','queue'],['capacit','cannot','alone','limit','serve','supply']],1),
      sa("Edgeworth's verdict on duopoly against Amoroso?","Indeterminate: cutting and jumping go on for ever.",[['indetermin','for ever','forever','no equilib','unstable']],1)],
  line:"uncombined duopolists cut and jump prices for ever"}
]},

/* ------------------------------------------------ #23 */
{id:'23',year:1928,who:'Bowley',title:'BOWLEY 1928 · BILATERAL MONOPOLY',secs:[
 {h:'Steel maker meets ore monopolist',beats:[
  ["December 1928, Economic Journal. A. L. Bowley replies to Knut Wicksell's last published paper, a criticism of Bowley's Mathematical Groundwork, reprinted by Schumpeter.","Set-up: a monopolist steel-maker buys ore from a monopolist mine-owner, one unit of ore per unit of steel. Consumers' demand is p = f(x); ore cost is φ(x). Who sets the ore price π?"],
  ["Two derived schedules. The manufacturer's *demand schedule* for ore: π = f(x) + xf′(x), the price at which he would take x. The supplier's *offer schedule*: π = φ(x) + xφ′(x)."],
  {fig:'plot',a:[{title:'BILATERAL MONOPOLY (sketch, Fig. 1)',xl:'quantity of ore',yl:'π',xr:[0,6],yr:[0,12],curves:[{f:x=>12-x,ch:'A',name:'demand AC0'},{f:x=>x,ch:'B',name:'cost BC0'},{f:x=>12-2*x,ch:'a',name:'AR0'},{f:x=>2*x,ch:'b',name:'BR0'}],eq:[2,3],eqf:(x,y)=>`R0: joint maximum, q ≈ ${x.toFixed(1)}, π ≈ ${y.toFixed(1)}`,cap:'AR0 mfr demand; BR0 supplier offer'}]},
  {fig:'table',a:[{title:"BOWLEY'S THREE CASES",head:['case','who sets π','result'],rows:[['I','manufacturer','his gain largest'],['II','supplier','supplier gain largest'],['III','they combine','max output, joint gain']],left:[0,1,2],note:'Wicksell solved only Case II: one-sided'}]},
  ["Case I: the manufacturer dictates the price and moves along the supplier's offer schedule. Case II: the supplier dictates and moves along the manufacturer's demand schedule; that is Wicksell's case. Case III: they combine, at the intersection R0 of the two schedules, with the largest output and largest joint gain."]],
  q:[mc("Why does Bowley call Wicksell's solution one-sided?",["It solves only the case where the supplier dictates the price","It ignores consumers' demand for steel","It assumes perfect competition in ore","It treats steel and ore as joint products"],"The employer, equally, may reach a real maximum (Case I)."),
     mc("In Bowley's Case III, what happens?",["The two combine: output and joint gain are greatest","The manufacturer dictates the price","Price falls to the cost of ore","Each takes the other's output as given"],"At R0, where the two derived schedules cross."),
     tf("True or false: in Case I the manufacturer moves along the supplier's offer schedule.",true,"He dictates π; the supplier's offer schedule constrains him.")],
  sa:[sa("What decides the outcome of bilateral monopoly, per Bowley?","Which side dictates the price.",[['who','which','side','whoever'],['dictat','set','fix','price']]),
      sa("Whose criticism provoked Bowley's 1928 note?","Wicksell's, his last published paper.",[['wicksell']],1)],
  line:"in bilateral monopoly whoever dictates the price decides the outcome"},

 {h:'The joint maximum is not stable',beats:[
  ["The catch. At R0 the joint gain is greatest, but the price is not stable. The manufacturer wants π lower, towards R1; the supplier wants it higher, towards R2. Only an outside arbitrator could hold it.","Don't write that Case III is an equilibrium. It is a joint maximum."],
  {fig:'bars',a:[{title:'JOINT GAIN, EQUAL LINEAR SLOPES',rows:[['Case I',8,'(a-b)²/9m'],['Case II',8,'(a-b)²/9m'],['Case III',9,'(a-b)²/8m']],max:10,note:'output (a-b)/6m in I or II, (a-b)/4m combined'}]},
  ["With equal slopes, either side dictating gives output (a − b)/6m and joint gain (a − b)²/9m. Combining gives (a − b)²/8m. The result extends to several materials, each monopolised. Combination beats dictation."],
  {fig:'table',a:[{title:'UNION AND COAL-OWNERS (50,000 miners)',head:['union target','daily wage'],rows:[['full employment','5s. 4d.'],['maximum earnings','6s.'],['max receipts incl. benefit','7s. 6d.']],left:[0],note:'union dictating = Case II; employer = Case I'}]},
  ["The labour case. A union that dictates the wage is Case II; an employer who dictates drives the wage down (Case I). Bowley's conclusion: where neither employer nor employed has absolute power, there is no definite solution. An arbitrator could work within narrow limits.","In the debate: Bowley answers Wicksell, and extends Edgeworthian indeterminacy (Pigou #13 on bargains, duopoly in #15 and #20) to bilateral monopoly."]],
  q:[mc("Why is Bowley's Case III price not an equilibrium?",["Each side still wants to move the price, so it needs an arbitrator","It gives the smallest output of the three cases","It is where the manufacturer's gain is largest","It requires perfect competition in steel"],"Manufacturer pushes towards R1, supplier towards R2."),
     tf("True or false: with equal linear slopes, combination gives a larger joint gain than either side dictating.",true,"(a-b)²/8m against (a-b)²/9m."),
     mc("In Bowley's coal example, which union wage gives maximum earnings?",["6s.","5s. 4d.","7s. 6d.","57s."],"5s. 4d. full employment; 7s. 6d. maximum receipts including benefit.")],
  sa:[sa("Bowley's conclusion when neither side has absolute power?","No definite solution, though an arbitrator might help.",[['no definite','indetermin','no solution','no unique','arbitrat']],1),
      sa("A union dictating the wage is which Bowley case?","Case II, the seller dictates.",[['ii','two','2']],1)],
  line:"the joint maximum needs an arbitrator so bilateral monopoly has no definite solution"}
]},

/* ------------------------------------------------ #24 */
{id:'24',year:1928,who:'Yntema',title:'YNTEMA 1928 · DUMPING AND MONOPOLY PRICE',secs:[
 {h:'Two markets, one marginal cost',beats:[
  ["December 1928, Journal of Political Economy. Theodore Yntema tests a claim by Jacob Viner, in his book Dumping (not in your folder): the most profitable home price is the same with or without dumping. Graham objected; Yntema, at Viner's suggestion, looks for general conditions.","*Dumping* here means a price that discriminates but is not necessarily below cost: discrimination between markets."],
  ["One market first. Maximise revenue minus cost. At the best output, *marginal gross revenue*, his name for marginal revenue, just equals marginal cost."],
  {fig:'plot',a:[{title:'DUMPING MONOPOLY, FIG. 2 (sketch)',xl:'quantity',yl:'MR',xr:[0,8],yr:[0,10],curves:[{f:x=>10-2*x,ch:'a',name:'home MR'},{f:x=>6-x,ch:'b',name:'foreign MR'},{f:x=>x<=2?10-2*x:(22-2*x)/3,ch:'s',name:'sum'},{f:x=>4,ch:'c',name:'MC'}],eq:[2,3],eqf:(x,y)=>`E2: total q ≈ ${x.toFixed(0)} where sum = MC`,cap:'add MR curves sideways; cut with MC'}]},
  ["Two markets: each market's marginal revenue must equal the common marginal cost. Add the two MR curves horizontally, find where the sum cuts marginal cost (E2), and split that output so each market's MR equals MC. It works for any number of markets.","In the sketch: 3 units at home, 2 abroad."],
  ["Which price is lower? The foreign price is lower if and only if foreign demand is the more elastic, which is typical where foreign competitors are present. That is why dumping looks like selling cheap abroad."]],
  q:[mc("What is Yntema's equilibrium condition for a dumping monopoly?",["Marginal revenue in each market equals the common marginal cost","Price in each market equals average cost","The foreign price equals the home price","Marginal cost equals average revenue at home"],"So the two marginal revenues are equal."),
     fill("Yntema's term for what we call marginal revenue?",['marginal gross revenue','gross marginal revenue'],"Defined on p. 687."),
     tf("True or false: the foreign price is lower when foreign demand is more elastic.",true,"If and only if, per Yntema.")],
  sa:[sa("How does Yntema find total output with two markets?","Add MR curves horizontally and intersect with MC.",[['add','sum','horizontal'],['mc','marginal cost','intersect','cut']]),
      sa("Whose claim of no home-price effect did Yntema test?","Viner's.",[['viner']],1)],
  line:"a dumping monopoly sets marginal revenue equal to marginal cost in each market"},

 {h:'Falling or rising marginal cost decides',beats:[
  ["The question Viner raised: does dumping change the home price? Yntema's method: shift the marginal cost curve left by the quantity dumped, and see where it now cuts home marginal revenue. G. T. Jones supplied the constructions."],
  {fig:'plot',a:[{title:'DECREASING MC: DUMPING (sketch)',xl:'home sales',yl:'MR',xr:[0,5],yr:[0,10],curves:[{f:x=>10-2*x,ch:'a',name:'home MR'},{f:x=>6-0.5*x,ch:'c',name:'MC'}],eq:[0,1],eqf:(x,y)=>`home sales ≈ ${x.toFixed(1)}, home price ≈ ${(10-x).toFixed(1)}`,shift:{curve:1,to:{f:x=>5-0.5*x},cap:'dump 2 units: home sales up, price down'},cap:'home demand p = 10 - q; no dumping yet'}]},
  ["Decreasing marginal cost: the units sold abroad push the firm down its cost curve, so home sales rise and the home price falls.","Increasing marginal cost: the units abroad push cost up, so home sales fall and the home price rises. Viner's no-change claim is the special case of constant marginal cost."],
  {fig:'compare',a:[{left:{h:'DECREASING MC',lines:['dumping lowers MC','for home units','home sales rise','home price FALLS']},right:{h:'INCREASING MC',lines:['dumping raises MC','for home units','home sales fall','home price RISES']},note:'marginal, not average, cost decides'}]},
  ["Write it with marginal cost, not average cost: Yntema even has a case where marginal cost rises while average cost falls. He links rising marginal cost to Edgeworth's primary sense of decreasing returns (#16). Short-run dumping with rising marginal cost raises the home price.","Welfare presumption: permanent dumping of manufactures under decreasing marginal cost benefits home consumers."],
  ["In the debate: Yntema answers Viner and Graham, and turns Pigou's #13 discrimination into marginal-revenue geometry. Nothing in your folder answers him; the MR curve returns with Harrod #41 and Robinson #44, and Robinson's 1933 discrimination theory (not in your folder) builds on it."]],
  q:[mc("Per Yntema, dumping lowers the domestic monopoly price when:",["Marginal cost is decreasing","Marginal cost is increasing","Average cost is rising","Foreign demand is less elastic"],"Increasing marginal cost raises it."),
     tf("True or false: Yntema confirms Viner's claim that dumping leaves the home price unchanged.",false,"Only with constant marginal cost; otherwise it moves."),
     mc("Yntema's welfare presumption about permanent dumping?",["Of manufactures under decreasing marginal cost, it benefits home consumers","It always harms home consumers","It harms foreign producers only","It has no welfare effect"],"Lower home prices via lower marginal cost.")],
  sa:[sa("Effect of dumping on home price with rising marginal cost?","It raises the domestic price.",[['rais','rise','higher','increas','up']],1),
      sa("What decides the direction of the home price change?","Whether marginal cost falls or rises.",[['marginal'],['cost','mc']])],
  line:"with falling marginal cost dumping lowers the home price with rising it raises it"}
]}
