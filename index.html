/* Group E, part 2: papers 59, 61, 63, 64, 65, 66, 69. Volume header (title, short, boss) and papers 49–58 live in the other E file. */
VOL.add({key:'E',
modules:[

/* ------------------------------------------------ #59 */
{id:'59',year:1935,who:'Kahn',title:'KAHN 1935 · SOME NOTES ON IDEAL OUTPUT',secs:[
 {h:'Ideal output and the deviation from the average',beats:[
  ["March 1935. Richard Kahn, in the Economic Journal, reworks Pigou's welfare analysis. Same method: full employment, money as a measure of utility.","The definition you must write. Output is *ideal output* when the value of the marginal social product of each factor is the same in every use. Then no transfer of a factor can raise the national dividend."],
  ["First case: external economies. Under laissez-faire factors equalise their private returns. Where social product exceeds private product, the industry is too small. But by how much it exceeds matters only relative to other industries.","Rank industries by external economies. Expand those above the average. Contract those below. That is the *deviation from the average* principle."],
  {fig:'steps',a:[{title:'KAHN: WHEN SHOULD THE STATE INTERFERE?',lines:['factors move until private returns are equal','social product differs from private by X','X varies from industry to industry','moving a factor helps only if X differs','so: expand where X is above the average','contract where X is below the average','X equal everywhere: no case for interference']}]},
  ["Pigou said: expand any industry with positive external economies. Kahn says that holds only on a tacit assumption, that such economies are rare, so their average is about zero. Pigou's device of an \"archetypal industry\" hides it."],
  ["Where do external economies come from? Usually from *lumpy units*: railways and public utilities worked below capacity. A railway limited to covering its average cost charges more than marginal cost.","The cure is a subsidy direct to the railway until price equals marginal cost. Clapham's boxes, says Kahn, \"were full all the time\": economists were \"looking on the wrong shelf\"."],
  {fig:'plot',a:[{title:'A LUMPY RAILWAY (illustrative)',xl:'output of transport',yl:'price',xr:[0.5,10],yr:[0,10],curves:[{f:x=>10-x,ch:'D',name:'demand'},{f:x=>2+12/x,ch:'A',name:'average cost'},{f:x=>2,ch:'M',name:'marginal cost'}],eq:[0,2],eqf:(x,y)=>'ideal: price = marginal cost (subsidy)',cap:'covering cost stops at P = AC, short of ideal',yf:v=>String(Math.round(v))}]},
  ["Smoke and roads follow. Smoke harms others, so discourage it. Roads are a scarce factor: charge the toll competing private owners would charge. Write the exam line: ideal output is relative to the average, not to perfect competition."]],
  q:[mc("According to Kahn (1935), what decides whether an industry should be expanded?",["Its deviation from the average degree of divergence","The absolute size of its external economies","Whether its supply curve is falling","Whether it is a monopoly in the traditional sense"],"Kahn: it is the deviation from the norm, not the absolute amount, that matters."),
     tf("True or false: Kahn held that Pigou's rule (expand any industry with external economies) is valid only if such economies are rare.",true,"Pigou's archetypal industry tacitly assumes the average divergence is about zero."),
     fill("Kahn: Clapham's economic boxes were full all the time, but economists were looking on the wrong ____.",['shelf'],"The full boxes were railways and public utilities: lumpy units to subsidise.")],
  sa:[sa("When is output 'ideal' for Kahn?","Value of marginal social product equal in every use.",[['marginal'],['social','value'],['equal','same','every use','all use']]),
      sa("How should a lumpy railway be treated, per Kahn?","Subsidise it until price equals marginal cost.",[['subsid','bount'],['marginal cost','price']])],
  line:"interference depends on deviation from the average not the absolute amount"},

 {h:'Imperfect competition: more workers, fewer shops',beats:[
  ["Second case: imperfect competition. Kahn defines it as a firm's demand that is not perfectly elastic. Elasticity is an inverse measure of the degree of imperfection.","He adds a disclaimer the exam will want: the phrase carries none of the implications that tradition attaches to the word monopoly. Remember it. Chamberlin will quote it against him."],
  ["A hired factor earns its marginal physical product times *marginal revenue*, not times price. And MR divided by price equals (e - 1)/e. The more imperfect the industry, the lower that ratio, and the more a factor's pay falls short of its value."],
  {fig:'plot',a:[{title:'MR / PRICE = (e - 1) / e',xl:'elasticity of demand for the firm (e)',yl:'MR/P',xr:[1.2,10],yr:[0,1],curves:[{f:e=>(e-1)/e,ch:'*',name:'(e-1)/e'},{f:e=>0.75,ch:'-',name:'average industry (sketch)'}],eq:[0,1],eqf:(x,y)=>'average: e = 4, MR/P = 0.75 (sketch)',cap:'left of the dot: more imperfect, expand',yf:v=>v.toFixed(2)}]},
  ["So expand industries more imperfect than the average and contract the rest. Kahn's line: \"If competition were everywhere equally imperfect there would be no case for interference.\" Pigou's monopolies were simply above the average."],
  ["Now the twist. Following Robinson (#50), an *entrepreneur* earns more than the value of his marginal physical product. So entrepreneurs should move the opposite way to hired factors: out of abnormally imperfect trades.","Kahn's example is retail selling: more hired factors, fewer shops."],
  {fig:'compare',a:[{left:{h:'HIRED FACTORS',lines:['paid less than value','move INTO imperfect','trades: subsidise them','more shop assistants']},right:{h:'ENTREPRENEURS',lines:['paid more than product','move OUT of imperfect','trades: lump-sum tax','fewer shops']},note:'at the ideal point the subsidy and the tax offset'}]},
  ["With irrational preferences the entrepreneur's marginal social product is earnings minus the cost of hired factors over (e - 1). Where average cost of hired factors is falling, it can be negative: too many firms. With *rational imperfection* add the extra revenue under perfect discrimination.","Debate: Kahn builds on Pigou, Shove (#36), Robinson (#50) and Kaldor (#49, #53). Chamberlin (#63) quotes his p. 20 disclaimer and rejects the negative-marginal-product entrepreneur."]],
  q:[mc("Kahn (1935): which way should hired factors and entrepreneurs move in an abnormally imperfect trade?",["Hired factors in, entrepreneurs out","Both should move out","Both should move in","Hired factors out, entrepreneurs in"],"More hired factors in retailing, but fewer shops."),
     mc("What policy pair does Kahn propose to bring an industry to the average degree of imperfection?",["A subsidy on hired factors plus a lump-sum tax per entrepreneur","A tax on output plus a bounty on exports","Price control plus free entry","Nationalisation of all public utilities"],"At the ideal point the subsidy and the lump-sum tax pay for each other."),
     tf("True or false: for Kahn, 'imperfection of competition' carries the traditional implications of monopoly.",false,"His p. 20 disclaimer says it carries none of them; Chamberlin (#63) seizes on this.")],
  sa:[sa("Why may there be 'too many shops', per Kahn?","Entrepreneurs earn more than their marginal social product.",[['entrepreneur','shopkeeper','firm'],['more than','exceed','negative','social product','marginal product']]),
      sa("What is Kahn's ratio of MR to price?","(e - 1)/e, e being the firm's elasticity.",[['e 1','e-1','minus one','elasticit']])],
  line:"more hired factors and fewer shops in abnormally imperfect trades"}
]},

/* ------------------------------------------------ #61 */
{id:'61',year:1936,who:'Harrod',title:'HARROD 1936 · IMPERFECT COMPETITION AND THE TRADE CYCLE',secs:[
 {h:'Careless buyers in the boom',beats:[
  ["May 1936, Review of Economic Statistics. Roy Harrod takes what he calls \"the leading principle\" of imperfect competition: entrepreneurs equate marginal cost to marginal revenue. He applies it to the trade cycle.","The puzzle: prices swing more than costs, and profits swing more than prices. Can MR = MC explain that without lags or errors?"],
  ["Split cost in two. *Reward costs* are rates of pay per unit of factor. *Work costs* are the units of factor needed per unit of output. Reward costs swing less than prices. Rising work costs explain only part.","The rest must come from the ratio of MR to price falling in the boom. That means demand gets less elastic."],
  {fig:'steps',a:[{title:"HARROD'S CYCLE MECHANISM",lines:['imperfection: habit, inertia, lack of knowledge','boom: buyers richer, stop hunting the cheapest','demand less elastic, MR/price falls','price rises above cost: margins widen','slump: buyers economise hard','demand more elastic: prices and profits fall fast']}]},
  ["His phrase: \"in good times demand is apt to get less elastic and competition more imperfect.\" Searching for the cheapest market is a discommodity the rich can afford to skip. Of the careless buyer in a slump: \"A contraction recalls him to his senses.\""],
  {fig:'morph',a:[{title:'ELASTICITY 4 TO 5 IN A RECESSION (MC = 100)',rows:[['price',133.3,125,v=>v.toFixed(1)],['margin',33.3,25,v=>v.toFixed(1)]],max:140,capA:'boom: e = 4, price = MC x 4/3',capB:'slump: e = 5, price -6.25%, profit -25%'}]},
  ["Harrod's own numbers: average elasticity rising from 4 to 5 cuts prices about 6¼ per cent and profits about 25 per cent. Do not overclaim: this explains cycle *amplitudes*, not the cause of the cycle.","Debate: it extends his #56. Chamberlin (#63) replies that MR = MC is no \"leading principle\" of imperfect competition: it holds under any market form."]],
  q:[mc("In Harrod (1936), what happens to demand elasticity in a boom?",["It falls, so competition grows more imperfect","It rises, so competition grows more perfect","It stays constant over the cycle","It becomes infinite as markets widen"],"Prosperous buyers grow careless about finding the cheapest market."),
     tf("True or false: Harrod's 1936 paper claims to explain the cause of the trade cycle.",false,"Only the greater amplitude of price and profit swings than of cost swings."),
     mc("Who objected that MR = MC is not peculiar to imperfect competition?",["Chamberlin 1937 (#63)","Kahn 1935 (#59)","Coase 1937 (#64)","Machlup 1939 (#69)"],"Chamberlin listed it among his misconceptions.")],
  sa:[sa("Why does demand become less elastic in booms, per Harrod?","Richer buyers grow careless and stop seeking cheapest markets.",[['rich','prosper','income','boom'],['careless','habit','search','cheap','bother']]),
      sa("Harrod's effect of elasticity rising from 4 to 5?","Prices fall about 6.25 per cent, profits 25 per cent.",[['6','price'],['25','profit']])],
  line:"in booms demand gets less elastic so prices and profits swing more"}
]},

/* ------------------------------------------------ #63 */
{id:'63',year:1937,who:'Chamberlin',title:'CHAMBERLIN 1937 · MONOPOLISTIC OR IMPERFECT COMPETITION?',secs:[
 {h:'Six misconceptions cleared away',beats:[
  ["August 1937, Quarterly Journal of Economics; parts given at the AEA meeting in Chicago, December 1936. Edward Chamberlin, author of the 1933 book, answers his critics. Part I lists misconceptions about his theory. Part II says it differs *in conception* from Robinson's."],
  ["Misconception one: the MR curve. MR = MC is just profit maximisation and holds under pure competition too. So Harrod (#61) is wrong to call it the leading principle of imperfect competition.","Two: increasing returns. Falling cost at equilibrium is a result, not part of the definition: \"neither necessary nor sufficient\"."],
  {fig:'plot',a:[{title:'LARGE-GROUP TANGENCY (sketch)',xl:'output of one firm',yl:'price',xr:[0,10],yr:[2,8],curves:[{f:x=>6.3-0.6*x,ch:'D',name:'firm demand'},{f:x=>3+0.1*(x-7)*(x-7),ch:'A',name:'average cost'}],eq:[0,1],eqf:(x,y)=>'tangency left of AC minimum (x = 7)',cap:'no monopoly profit, yet excess capacity',yf:v=>String(Math.round(v))}]},
  ["Three: *large-group tangency*. Critics treat it as the heart of the theory. Chamberlin now says it flows from \"heroic assumptions\" and is mainly \"an expositional device\". With or without tangency there is a blend of monopoly and competition."],
  ["Four: numbers. Kaldor (#58) said more firms come in between the old ones and flatten demand curves. Chamberlin: new stores may simply widen the area. Are menthol cigarettes \"in between\" two brands? On a line market a shifted curve keeps its slope.","Five: divisibility. Perfect divisibility gives only \"an infinite number of infinitesimally small firms\", not pure competition."],
  {fig:'steps',a:[{title:'WHAT CHAMBERLIN CONCEDED, WHAT HE DENIED',lines:['MR = MC: not special to imperfect competition','increasing returns: a result, not a definition','tangency: only an expositional device','numbers: need not flatten demand curves','divisibility: gives tiny firms, not pure comp.','free entry: CONCEDED to Kaldor (#58)','  -> incompatible with a differentiated product']}]},
  ["Six: entry. Here he records a change of view. Following Kaldor, full free entry means anyone could make the identical product. That is \"quite incompatible with a differentiated product\". Entry means only freedom to produce substitutes. Kaldor (#66) will call this a volte-face."]],
  q:[mc("What does Chamberlin (1937) now call the large-group tangency solution?",["Mainly an expositional device resting on heroic assumptions","The central principle of monopolistic competition","A tautology because profits are counted as cost","Proof that increasing returns define the theory"],"He demotes tangency to an intermediate stage of the theory."),
     mc("Which of Kaldor's 1935 points did Chamberlin accept in 1937?",["Full free entry means producing the identical product","More firms flatten firm demand curves","Perfect divisibility yields pure competition","Tangency is the heart of the theory"],"So free entry is incompatible with a differentiated product."),
     tf("True or false: Chamberlin argued that perfect divisibility would turn monopolistic competition into pure competition.",false,"He said it would give only an infinite number of infinitesimally small firms.")],
  sa:[sa("Chamberlin 1937: are increasing returns needed for monopolistic competition?","No: neither necessary nor sufficient; a result.",[['no','not','neither'],['necessary','sufficient','result']]),
      sa("Why, for Chamberlin, is free entry incompatible with differentiation?","No one else can produce the identical product.",[['identical','same product','exact'],['product','produc']])],
  line:"tangency is only an expositional device and free entry excludes differentiation"},

 {h:'A blend, not a dichotomy',beats:[
  ["Part II. *Monopolistic competition* challenges the old view that monopoly and competition are alternatives. Chamberlin: \"most economic situations are composites of both competition and monopoly\". Each seller has a monopoly of his own variety but faces substitutes.","So monopolistic competition embraces the whole theory of monopoly."],
  ["His Chapter IV, \"The Differentiation of the Product\", is not a technique but a way of looking at the system: a new *Weltanschauung*.","\"Imperfect competition\", by contrast, he calls a \"purely negative\" term. It only admits competition is imperfect. Monopoly and competition stay in separate boxes."],
  {fig:'compare',a:[{left:{h:'MONOPOLISTIC (CHAMBERLIN)',lines:['blend of both forces','rooted in product','differentiation','monopoly theory inside','pure comp. no ideal']},right:{h:'IMPERFECT (ROBINSON)',lines:['competition, imperfect','monopolist = any seller','categories exclusive','profits competitive','pure comp. as norm']},note:'Chamberlin: conception. Kaldor (#66): terminology.'}]},
  ["Robinson defines a monopolist as any individual seller. Chamberlin's jibe: like calling either rail of a railway track a monorail. Barring that definition, he says, there is no monopoly at all in her imperfect competition. Kahn (#59, p. 20) said so outright."],
  ["Three consequences. *Profits*: genuine monopoly profits run through the whole system. *Norms*: product variety matters, so pure competition is no longer an \"ideal\". *Exploitation*: all factors get less than marginal physical product times price, not just labour.","Robinson's entrepreneur-as-exploiter (#50) needs an indivisible entrepreneur. Entrepreneurship is divisible."],
  {fig:'chain',a:[{title:'EXCESS CAPACITY AND ENTRY: THE EXCHANGE',nodes:['KALDOR #58','CHAMBERLIN #63','KALDOR #66'],caps:['1935: tangency needs symmetry; free entry','1937: tangency a device; entry conceded','1938: slope is not elasticity; regrets it'],end:"Chamberlin's reply (#67) is not in your folder",token:'[R]'}]},
  ["Placement. He answers Robinson (#57, #50), Kaldor (#58), Kahn (#59) and Harrod (#61). Kaldor (#66) replies in 1938. Machlup (#69) later uses the narrow and wide senses of the term. Report on Chamberlin: product differentiated, perhaps too far."]],
  q:[mc("What, according to Chamberlin (1937), is the conceptual core of monopolistic competition?",["Most situations are composites of monopoly and competition","Firms equate marginal revenue and marginal cost","Demand for each firm is not perfectly elastic","Large groups reach tangency with excess capacity"],"A blend grounded in product differentiation, not a technique."),
     mc("Chamberlin's 'monorail' jibe targets which definition?",["Robinson's monopolist as any individual seller","Kaldor's free entry as the identical product","Kahn's elasticity as a measure of imperfection","Harrod's MR = MC as the leading principle"],"Calling one rail a monorail is like calling one seller a monopolist."),
     tf("True or false: Chamberlin argued that under monopolistic competition pure competition is no longer an ideal.",true,"Variety has value; retail shops cannot all stand on one spot.")],
  sa:[sa("Why is 'imperfect competition' purely negative, per Chamberlin?","It keeps monopoly and competition as exclusive categories.",[['monopol'],['exclusive','separate','apart','categor','overlap']]),
      sa("Name Chamberlin's three consequences of the difference.","Profits, competitive norms, and exploitation.",[['profit'],['norm','ideal'],['exploit']],2)],
  line:"monopolistic competition is a blend of monopoly and competition"}
]},

/* ------------------------------------------------ #64 */
{id:'64',year:1937,who:'Coase',title:'COASE 1937 · SOME NOTES ON MONOPOLY PRICE',secs:[
 {h:'The monopolist who does not know',beats:[
  ["First, a warning. This is Coase's \"Some Notes on Monopoly Price\", Review of Economic Studies, October 1937. It is *not* \"The Nature of the Firm\" (Economica, November 1937), which is not in your folder. Write the right title or lose the mark."],
  {fig:'compare',a:[{left:{h:'IN YOUR FOLDER (#64)',lines:['Monopoly Price','RES, October 1937','how a real monopolist','sets price over time']},right:{h:'NOT IN YOUR FOLDER',lines:['The Nature of the Firm','Economica, Nov 1937','why firms exist','(context only)']},note:'same author, same year: do not mix them up'}]},
  ["The case: a combine formed from all the firms of a previously perfectly competitive industry, with entry barred. Robinson calls it the comparison of monopoly and competitive output. Her monopolist knows to set MR = MC and knows his demand curve.","Coase asks: does he? He questions her behavioural assumptions, not her market concepts."],
  ["Businessmen's cost accounts make marginal cost hard to find. If they only dimly grasp the MR = MC rule, that would \"enhance the importance of the status quo\". Trial and error assumes stationary conditions and a small, simple firm. Demand is even harder to know than cost."],
  {fig:'steps',a:[{title:'PRICE UNDER AN UNCERTAIN DEMAND CURVE',lines:['only today\'s price-quantity point is certain','raise price a little: a new point is revealed','extra revenue offset by risk of not getting it','raise again, learn again','price climbs toward the monopoly price','approaching but not reaching it']}]},
  ["Refined: he faces a *demand surface*, a frequency curve of sales at each price, so his attitude to risk matters. If he goes by the most probable sales, the conclusion holds: price starts below the monopoly price and creeps up."]],
  q:[mc("Which Coase paper is #64 in your folder?",["Some Notes on Monopoly Price (RES, October 1937)","The Nature of the Firm (Economica, November 1937)","The Problem of Social Cost","Monopolistic or Imperfect Competition?"],"The Nature of the Firm is context only, not in your folder."),
     mc("What case does Coase (1937) examine?",["A combine formed from a perfectly competitive industry, entry barred","A natural monopoly regulated by the state","A duopoly with conjectural variations","A firm under monopolistic competition with free entry"],"Robinson's comparison of monopoly and competitive output."),
     tf("True or false: Coase argues that uncertainty about demand makes the new monopolist raise price step by step.",true,"Each new price reveals another point on the demand curve.")],
  sa:[sa("Why might businessmen not set MR = MC, per Coase?","Cost accounts hide marginal cost; demand is unknown.",[['account','marginal cost','cost'],['demand','unknown','ignor','know']]),
      sa("What is Coase's #64 often confused with?","The Nature of the Firm, also 1937.",[['nature of the firm','nature','firm']],1)],
  line:"an ignorant monopolist raises price slowly toward the monopoly price"},

 {h:'Short run, long run and the quiet life',beats:[
  ["Robinson uses one long-period demand curve. Coase says the monopolist faces two. The *long-run demand curve* DD shows sales after consumers adjust. The short-run curve DsDs shows the immediate effect. They cross at the competitive price OP. Above OP the short-run curve lies to the right: less elastic."],
  {fig:'plot',a:[{title:'COASE DIAGRAM IV (sketch)',xl:'quantity',yl:'price',xr:[0,10],yr:[0,10],curves:[{f:x=>10-x,ch:'D',name:'DD long-run'},{f:x=>15-2*x,ch:'s',name:'DsDs short-run'}],eq:[0,1],eqf:(x,y)=>y>6?'P3: short-run optimum now on DD, above P1':'OP: competitive price, curves cross',shift:{curve:1,to:{f:x=>13-2*x},cap:'Ds shifts left as consumers adjust'},cap:'above OP the short-run curve is less elastic',yf:v=>String(Math.round(v))}]},
  ["Look only at DsDs and you pick OP2, above Robinson's OP1. Consumers then cut back, DsDs drifts left, and price settles at P3, still above OP1. Know both curves and you head for OP1. On balance price is probably \"rather higher\" than the long-run curve alone suggests."],
  ["Worse: price changes shift demand. Raise price and consumers and inventors try substitutes. When the Greeks raised the price of currants, people tried raisins. The Stevenson rubber restriction spurred reclaimed rubber; tin schemes likewise.","Hence \"the notion of a long-run demand curve is in the nature of a fiction\". Gradual rises do less damage."],
  {fig:'morph',a:[{title:'OUTPUT RESTRICTION VS ROBINSON (sketch)',rows:[['Robinson',50,50,''],['Coase',25,80,'']],max:100,capA:'at first: Coase restricts LESS than Robinson',capB:'long run: Coase restricts MORE than Robinson'}]},
  ["Progress makes each producer's demand lower and more elastic. The forces that first held price below the monopoly level later hold it too high. Hicks: \"The best of all monopoly profits is a quiet life!\" Inertia keeps price put, and invention slows.","Placement: Coase answers Robinson's book and Hicks 1935 (both context). No reply in your set; compare Burns (#65) and Machlup (#69)."]],
  q:[mc("In Coase's Diagram IV, where does a monopolist using only the short-run curve set price?",["Above the long-run monopoly price OP1","Exactly at the long-run monopoly price OP1","At the competitive price OP","Below the competitive price OP"],"The short-run curve is less elastic above OP, so he picks OP2 > OP1."),
     mc("Why does Coase call the long-run demand curve 'a fiction'?",["Price changes themselves shift it, via substitutes and inventions","Consumers never adjust to a new price","Monopolists cannot estimate any demand curve","It always coincides with the short-run curve"],"Currants and raisins; Stevenson rubber; tin."),
     tf("True or false: Coase concludes that in the long run the monopolist restricts output less than Robinson predicts.",false,"Less at first, more in the long run, and progress slows.")],
  sa:[sa("Coase's long-run result compared with Robinson?","More output restriction in the long run, slower progress.",[['more','greater'],['restrict','output','progress']]),
      sa("Give one Coase example of price rises lowering demand.","Greek currants led people to try raisins.",[['currant','raisin','rubber','tin']],1)],
  line:"first less restriction than robinson but in the long run more"}
]},

/* ------------------------------------------------ #65 */
{id:'65',year:1937,who:'Burns',title:'BURNS 1937 · THE ORGANIZATION OF INDUSTRY AND PRICES',secs:[
 {h:'Start from prices, follow the scattered entrepreneur',beats:[
  ["Arthur Robert Burns, Journal of Political Economy, October 1937; read at the same AEA meeting in Chicago, December 1936, as parts of Chamberlin #63. He opens on \"the sad state of our knowledge\" of how industry operates.","Antitrust, the Robinson-Patman Act and the NRA rest on outdated theory. The new imperfect-competition theories need far better data."],
  ["Old price theory rested on *competitive individualism*: three categories, the entrepreneur, the competitive market and the rational individual buyer. None now fits.","Old industry studies described technique and organisation but ignored price policy. Burns: \"The central objective of such studies should be the analysis of the behavior of prices.\""],
  {fig:'lanes',a:[{left:['risking capital','price policy','output policy'],mid:'ENTREPRENEUR',right:['owners','managers','contracts'],sym:'*',lh:'one hat, once',mh:'',rh:'now dispersed',note:'the disintegration of the entrepreneur'}]},
  ["The *disintegration of the entrepreneur*. The entrepreneur concept put risking capital and making price policy \"under a single hat\". In the corporation, ownership and control separate. Who now controls, and do they maximise income? Three *relocations of function* follow."],
  {fig:'steps',a:[{title:"BURNS: WHERE THE FUNCTIONS WENT",lines:['1 scale: few firms relative to the market','  guess elasticities, rivals, new entry','  markets geographic: cement, basing points','2 integration: costs blurred by allocation','  contracts: resale price, tying, leasing','3 sales promotion: seller appraises utility','  normal profits via higher costs, not prices']}]},
  ["Sales promotion is the striking one: \"any tendency toward normal profits works out\" partly through the *raising of costs* rather than lower prices. Add style and quality competition.","Burns offers a research programme, not a new equilibrium model. No reply in your set; Machlup (#69) takes up case studies, Coase (#64) real behaviour."]],
  q:[mc("What does Burns (1937) say should be the central objective of industry studies?",["The analysis of the behaviour of prices","The measurement of technical efficiency","The history of trusts and corporations","Testing the tangency solution"],"Price behaviour, to improve general price theory."),
     mc("Which is NOT one of Burns's three relocations of function?",["Free entry of identical producers","Larger scale relative to markets","Integration of activities","Transfer of utility appraisal to sellers"],"Scale, integration and sales promotion are his three."),
     tf("True or false: Burns argues that with sales promotion, normal profits come partly through higher costs rather than lower prices.",true,"Selling outlays absorb the profits that competition would otherwise remove.")],
  sa:[sa("What is Burns's 'disintegration of the entrepreneur'?","Entrepreneurial functions dispersed among owners, managers and contracts.",[['function','role','control','capital'],['dispers','split','separat','scatter','divid','owner','manag','contract']]),
      sa("Name Burns's three categories of competitive individualism.","Entrepreneur, competitive market, rational buyer.",[['entrepreneur'],['market'],['buyer','consumer']],2)],
  line:"industry studies should explain price behaviour through the relocation of functions"}
]},

/* ------------------------------------------------ #66 */
{id:'66',year:1938,who:'Kaldor',title:'KALDOR 1938 · PROFESSOR CHAMBERLIN ON MONOPOLISTIC AND IMPERFECT COMPETITION',secs:[
 {h:'Slope is not elasticity',beats:[
  ["May 1938, Quarterly Journal of Economics. Nicholas Kaldor answers Chamberlin (#63) and defends his own #58.","Differences between theories, he says, are of three kinds: terminology, doctrine, or subject matter. Chamberlin has not shown a difference in subject matter. So his \"dissimilarities\" are really misconceptions."],
  ["On MR: \"the heart of the whole matter\" is the relation of price to marginal cost. That depends on elasticity at equilibrium, which is what the MR curve shows. Tangency is just Robinson's double condition in geometric form."],
  ["On numbers, Chamberlin's widening area confuses growth of demand with greater density in a given section of the field. The competitive field is n-dimensional, so nobody needs to be literally \"in between\".","The fundamental error: confusing *slope with elasticity*. Slope \"is a matter of the scale of drawing\"; elasticity is not."],
  {fig:'plot',a:[{title:'SAME SLOPE, SHIFTED LEFT (illustrative)',xl:'output of one firm',yl:'price',xr:[0,10],yr:[0,10],curves:[{f:x=>10-x,ch:'D',name:'demand'},{f:x=>2,ch:'M',name:'marginal cost'}],shift:{curve:0,to:{f:x=>7-x},cap:'same slope, but more elastic at new output'},cap:'more firms: curve moves left, slope unchanged',yf:v=>String(Math.round(v))}]},
  {fig:'table',a:[{title:'P = a - q, MC = 2: MR = MC OUTPUT (illustrative)',head:['demand','output','price','P/MC','elasticity'],rows:[['a = 10','4','6.0','3.00','1.5'],['a = 7','2.5','4.5','2.25','1.8']],note:'higher elasticity: price nearer marginal cost'}]},
  ["So a leftward shift with unchanged slope still raises elasticity at the equilibrium output, and price moves toward MC. More firms do reduce the *degree of market imperfection*. Kaldor hopes the idea will keep its \"astounding vitality\"."]],
  q:[mc("What, for Kaldor (1938), is Chamberlin's fundamental confusion about numbers of firms?",["He confuses the slope of a demand curve with its elasticity","He confuses free entry with restriction of entry","He confuses average with marginal revenue","He confuses rational with irrational preferences"],"A leftward shift with the same slope still raises elasticity."),
     tf("True or false: Kaldor argued that a demand curve shifted left with unchanged slope has higher elasticity at equilibrium output.",true,"So price comes nearer to marginal cost."),
     fill("Kaldor: the slope of a demand curve, though not its elasticity, is a matter of the scale of ____.",['drawing'],"Slope depends on the units chosen; elasticity does not.")],
  sa:[sa("How does Kaldor measure the degree of market imperfection?","Elasticity of firm demand: price relative to marginal cost.",[['elastic','price','marginal cost']],1),
      sa("What happens to elasticity as firms multiply, per Kaldor?","It rises, so price approaches marginal cost.",[['rise','increas','higher','grow'],['elastic','marginal cost','price']])],
  line:"slope depends on the scale of drawing but elasticity does not"},

 {h:'Monopoly without privilege, and a new vocabulary',beats:[
  ["On divisibility: pure competition needs no infinity of firms. It arrives once producers take price as given and set price equal to marginal cost. Economies of scale are a necessary condition of imperfect competition, and sufficient absent institutional monopoly. Chamberlin's footnote is a \"non sequitur\"."],
  ["On free entry, Kaldor regrets Chamberlin's \"volte-face\". Chamberlin's great achievement was showing *monopoly without privilege*: monopoly-like positions alongside free entry, from scale economies.","Contrast the company store in a company town, which owes its position to privilege, with Henry Ford, who owes it largely to large-scale production."],
  {fig:'table',a:[{title:"KALDOR'S PROPOSED TERMINOLOGY (1938)",head:['term','reserve it for'],rows:[['monopoly','institutional privilege'],['imperfect comp.','scale economies, free entry'],['monopolistic comp.','restriction of entry']],left:[0,1],note:'the two 1933 labels split by cause, not by author'}]},
  ["On Weltanschauung: there is no difference. Robinson herself said monopoly analysis \"swallowed up\" competitive analysis. Kaldor's verdict: Chamberlin has fallen victim to the sellers' tendency he described, and \"is trying to differentiate his product too far\"."],
  ["One subject, two labels, like lorries and trucks, braces and suspenders, constables and cops. Kaldor used the two terms \"promiscuously\" on purpose."],
  {fig:'events',a:[{title:'THE KALDOR-CHAMBERLIN EXCHANGE',events:[['1933',"Chamberlin's and Robinson's books (context)"],['1935','Kaldor #58: tangency needs symmetry'],['1937','Chamberlin #63: blend; entry conceded'],['1938','Kaldor #66: one subject; slope vs elast.'],['later','Chamberlin #67 reply (not in folder)']]}]},
  ["Placement: answers Chamberlin #63, defends #58. Chamberlin's reply (#67) is not in your folder. Report on #63: reject the claim of a different subject; accept the product, with minor relabelling."]],
  q:[mc("What did Kaldor (1938) call Chamberlin's 'great achievement', now disclaimed?",["Showing monopoly can coexist with free entry, without privilege","Inventing the marginal revenue curve","Proving excess capacity under tangency","Defining pure competition as perfect elasticity"],"Henry Ford versus the company store."),
     mc("In Kaldor's 1938 terminology, 'monopolistic competition' should denote limitation due to what?",["Restriction of entry","Economies of scale with free entry","Institutional privilege","Product differentiation alone"],"Imperfect = scale economies with free entry; monopoly = privilege."),
     tf("True or false: Kaldor (1938) agreed there is a real difference of Weltanschauung between Chamberlin and Robinson.",false,"He says Chamberlin is trying to differentiate his product too far.")],
  sa:[sa("Kaldor's example of privilege versus scale-based monopoly?","Company store in a company town versus Henry Ford.",[['company store','company town'],['ford']]),
      sa("Kaldor's verdict on Chamberlin's claimed difference?","Same subject; he differentiates his product too far.",[['same','one subject','no difference','too far','terminolog'],['subject','product','label','name','differen']])],
  line:"chamberlin is trying to differentiate his product too far"}
]},

/* ------------------------------------------------ #69 */
{id:'69',year:1939,who:'Machlup',title:'MACHLUP 1939 · PRACTICAL SIGNIFICANCE OF MONOPOLISTIC COMPETITION',secs:[
 {h:'Practical for whom? Polypoly and oligopoly',beats:[
  ["Fritz Machlup, AEA round table in Detroit, 29 December 1938; American Economic Review, June 1939. A late verdict on the decade's theory.","First question: practical for whom? Four users: the pure theorist, the applied analyst, the government official and the businessman. Only applied analysis and government control count here. Businessmen have little to learn from theorists."],
  ["What is the theory? Not the MR and MC tools, which go back to Cournot. In the narrow sense it means product differentiation. In the wide sense it covers every case between pure competition and monopoly, oligopoly included. What is new is the emphasis on differentiation and on how common oligopoly is."],
  {fig:'compare',a:[{left:{h:'POLYPOLY',lines:['very many sellers','each ignores rivals','with differentiation:','near pure competition']},right:{h:'OLIGOPOLY',lines:['seller counts on','rivals\' reactions','defined subjectively','the common case']},note:'monopoly: seller thinks reactions need not concern him'}]},
  ["*Polypoly* with differentiated products is welcomed for its realism and its case against laissez-faire. Machlup doubts it matters much: prices and output are probably not very different from pure competition. Such markets tend to break into small oligopolistic groups."],
  ["*Oligopoly* is defined by the seller's state of mind: he includes the reactions he expects from rivals. Vague conjectures bring two consequences: price rigidity and increased selling costs.","So much oligopoly is \"a bad blow\" for general equilibrium theory."],
  {fig:'steps',a:[{title:"MACHLUP'S CLASSIFICATION IS SUBJECTIVE",lines:['not: how many sellers are there?','but: what does the seller believe?','ignores rivals, many of them -> polypoly','allows for rivals\' reactions -> oligopoly','reactions need not concern him -> monopoly','vague conjectures -> rigid prices, selling costs']}]}],
  q:[mc("How does Machlup (1939) define oligopoly?",["By the seller's conjectures: he allows for rivals' reactions","By an objective count of fewer than ten sellers","By the presence of product differentiation","By a kinked demand curve"],"His classification rests on the seller's state of mind."),
     tf("True or false: Machlup thought polypoly with differentiated products gives results far from pure competition.",false,"He surmised prices and output would not be much different."),
     mc("Two consequences of vague oligopolistic conjectures, per Machlup?",["Price rigidity and increased selling costs","Excess capacity and tangency","Falling costs and free entry","Price discrimination and dumping"],"And a bad blow for general equilibrium theory.")],
  sa:[sa("What is polypoly, in Machlup's terms?","Very many sellers, each ignoring rivals' reactions.",[['many'],['seller','rival','firm']]),
      sa("Narrow versus wide sense of monopolistic competition?","Narrow: product differentiation; wide: all intermediate cases.",[['differentiat'],['intermediate','all','oligopol','wide']])],
  line:"oligopoly is defined by the seller's conjectures about rivals"},

 {h:"Firestone's breakfast and five aids to policy",beats:[
  ["Machlup speaks from experience. For ten years he was an executive of several firms in one industry, controlling about 20 per cent of the country's output. Yet he could not say how much their market position mattered.","Neither differentiation nor oligopoly much affected decisions; demand was elastic. Sensible businessmen act as economists suppose, though they rationalise misleadingly."],
  ["He suggests *theoretical case studies*: vary the assumptions and see which ones change the outcome. But oligopoly is the behaviour of a few individuals, not of a mass.","To explain the price of wheat you need no single farmer. For rubber tires you may need the late Mr. Firestone: \"Whether Mr. Firestone had had a good breakfast\" may have mattered."],
  {fig:'steps',a:[{title:"FIVE AIDS TO THE ADMINISTRATOR",lines:['1 the problem is harder than you assumed','2 it points to the relevant factors','3 it warns against naive methods','4 it supplies definitions and concepts','5 markets within markets, selling costs,','  discrimination, price regulation']}]},
  ["Is any of it new since Cournot, Edgeworth, Marshall, Pigou and Sraffa? Much is a shift of emphasis. But progress often consists of shifts of emphasis and better formulations. Report on the decade: useful, if pompous."],
  {fig:'chain',a:[{title:'THE REALIST REACTION, 1937-39',nodes:['COASE #64','BURNS #65','MACHLUP #69'],caps:['real monopolists lack knowledge','study prices, follow the functions','oligopoly: hard, but theory helps'],end:'none of the three is answered in your folder',token:'[?]'}]},
  ["Placement: Machlup weighs Chamberlin's book in its narrow and wide senses (cf. #63, which cites Machlup's 1937 remarks on tangency). No reply in your set. Pair him with Burns (#65) on case studies and Coase (#64) on real behaviour; unlike Coase, he thinks businessmen act roughly as theory says."]],
  q:[mc("Why does Machlup mention Mr. Firestone's breakfast?",["Oligopoly prices may hinge on the choices of a few individuals","Advertising changes consumers' daily habits","Rubber tires are a polypolistic market","Executives never maximise profits"],"Mass behaviour is easier to explain than the behaviour of a few."),
     mc("What did Machlup conclude from ten years as an executive?",["Sensible businessmen act roughly as economists suppose","Businessmen never know their marginal cost","Oligopoly dominated every decision","Product differentiation set every price"],"Though they rationalise their decisions misleadingly. Contrast Coase (#64)."),
     tf("True or false: Machlup concluded the theory is of no use to government officials.",false,"He lists five aids, from showing the problem's difficulty to supplying concepts.")],
  sa:[sa("Name one of Machlup's aids to policy-makers.","It shows the problem is harder than assumed.",[['hard','difficult','factor','concept','definition','method','selling cost','markets within']],1),
      sa("Why is oligopoly hard to theorise, per Machlup?","It depends on a few individuals' behaviour.",[['few','individual','firestone','person'],['behav','decision','action','choice','depend']])],
  line:"oligopoly prices may hinge on whether mr firestone had a good breakfast"}
]}

gloss:[
['ideal output',"Kahn (1935): output at which the value of the marginal social product of each factor is the same in every use.","Shifting labour from an average to an abnormally imperfect trade raises the national dividend.",['deviation from the average','rational imperfection']],
['deviation from the average',"Kahn's principle: the case for interference depends on how far an industry's divergence (external economies or imperfection) departs from the average, not on its absolute size.","If competition were everywhere equally imperfect, there would be no case for interference.",['ideal output','lumpy units']],
['lumpy units',"Kahn: indivisible plant (railways, public utilities) worked below capacity; the usual source of external economies, to be subsidised until price equals marginal cost.","Clapham's boxes were full all the time, on the wrong shelf.",['ideal output']],
['rational imperfection',"Kahn: market imperfection reflecting real satisfactions (transport costs, lasting tastes), as against irrational imperfection from ignorance or inertia.","Switching a customer to another shop costs nothing only if his preference was irrational.",['ideal output','entrepreneur']],
['entrepreneur',"In Kahn (following Robinson #50) the unit that earns more than its marginal physical product under imperfect competition; Chamberlin (#63) says entrepreneurship is divisible.","Kahn: fewer shops in retailing.",['rational imperfection','exploitation']],
['reward costs',"Harrod (1936): rates of pay per unit of factor, as against work costs, the number of factor units per unit of output.","Prices swing more than reward costs over the cycle.",['marginal revenue']],
['marginal revenue',"Revenue added by one more unit sold; for Kahn MR/price = (e - 1)/e. Chamberlin (#63): MR = MC holds under any market form.","At e = 4, MR is three quarters of price.",['reward costs','degree of market imperfection']],
['monopolistic competition',"Chamberlin (1937): a blend of monopoly and competition grounded in product differentiation; embraces the whole theory of monopoly. Kaldor (1938) would reserve it for limitation due to restriction of entry.","Each seller owns his variety but faces substitutes.",['large-group tangency','weltanschauung']],
['large-group tangency',"Chamberlin's solution: firm demand tangent to average cost on its falling part, so no monopoly profit and excess capacity; in 1937 demoted to 'an expositional device'.","Tangency left of the AC minimum.",['monopolistic competition']],
['weltanschauung',"Chamberlin's word for the way of looking at the system in his Chapter IV (differentiation of the product); Kaldor (1938) denies any such difference from Robinson.","Changing one's Weltanschauung is not adding a tool to the kit.",['monopolistic competition']],
['exploitation',"Pigou-Robinson sense: a factor paid less than the value of its marginal physical product. Chamberlin (1937): under monopolistic competition all factors are so paid.","No single 'exploiter' if entrepreneurship is divisible.",['entrepreneur']],
['monopoly price',"Coase (1937): the price equating marginal cost and marginal revenue on the demand curve; a real monopolist at first charges less, later more.","A new combine creeps up toward it step by step.",['long-run demand curve','demand surface','quiet life']],
['demand surface',"Coase: frequency curves of possible sales at each price, so the monopolist's attitude to risk matters.","Only the current price point is certain.",['monopoly price']],
['long-run demand curve',"Sales after consumers fully adjust to a price; Coase calls it 'in the nature of a fiction' because price changes shift it.","Greek currants pushed buyers to raisins.",['monopoly price']],
['quiet life',"Hicks's phrase quoted by Coase: 'The best of all monopoly profits is a quiet life!' Inertia keeps price near the status quo and slows invention.","A combine stays below the profit-maximising price.",['monopoly price']],
['competitive individualism',"Burns (1937): the old framework of the entrepreneur, the competitive market and the rational individual buyer, no longer suited to industry.","Antitrust policy still rests on it.",['disintegration of the entrepreneur']],
['disintegration of the entrepreneur',"Burns: functions once 'under a single hat' (risking capital, price and output policy) dispersed among owners, managers and contracts, with three relocations: scale, integration, sales promotion.","Normal profits reached by raising selling costs.",['competitive individualism']],
['degree of market imperfection',"Kaldor (1938): measured by the elasticity of the firm's demand at equilibrium, i.e. price relative to marginal cost, not by the slope of the curve.","A curve shifted left with the same slope is more elastic at the new output.",['monopoly without privilege','marginal revenue']],
['monopoly without privilege',"Kaldor's name for Chamberlin's achievement: monopoly-like positions coexisting with free entry, due to economies of scale rather than institutional privilege.","Henry Ford versus the company store.",['degree of market imperfection']],
['polypoly',"Machlup: very many sellers, each believing rivals will not react; with differentiation, probably near pure competition.","Contrast oligopoly, where rivals' reactions enter the calculation.",['oligopoly']],
['oligopoly',"Machlup (1939): defined subjectively, a seller who consciously allows for rivals' reactions; brings price rigidity and selling costs.","Mr. Firestone's breakfast.",['polypoly']]
],

async function quiz(q,o={}){

  else if(q.t==='tf'){key=q.a?'true':'false';correct=q.a?'TRUE':'FALSE';chips=['true','false']}
  else if(q.t==='fill'){key=q.a[0];correct=q.a[0];if(TOUCH())chips=fillChoices(q)}

      else if(q.t==='fill')await type(`hint: ${key.length} letters, starts with "${key[0]}".`,{cls:'dim'});else if(q.t==='tf')await type('hint: it is one of the two.',{cls:'dim'});else await type('hint: write out the formula, then plug in.',{cls:'dim'});continue}
