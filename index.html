ot's formula it does not."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Who does Fisher credit with the best treatment of duopoly?", "b": "Edgeworth, in his Giornale degli Economisti articles (1897)."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Which later paper calls Cournot's complementary-monopoly conclusions 'extraordinary', unlike Fisher?", "b": "#15 Moore 1906, 'Paradoxes of Competition'."}, {"id": "12", "who": "Bullock 1901", "g": "A", "f": "Bullock (QJE 1901): the distinction he says readers must 'grasp firmly'?", "b": "Large-scale production vs monopoly. Big independent plants are already the norm; the trust question is whether one centralized combination should replace them (p. 187)."}, {"id": "12", "who": "Bullock 1901", "g": "A", "f": "Bullock's numerical attack on 'potential competition': what is it?", "b": "If independents need $1 and the trust's cost is 80 cents, the trust can price at 99.9 cents without inviting entry. Consumers get almost none of the 20-cent saving (p. 211)."}, {"id": "12", "who": "Bullock 1901", "g": "A", "f": "Bullock: the three arguments for a tendency to permanent monopoly?", "b": "(a) A consolidated firm is more efficient in producing and marketing; (b) mere mass of capital allows destructive warfare that deters rivals; (c) competition with heavy fixed capital is ruinous and self-destroying."}, {"id": "12", "who": "Bullock 1901", "g": "A", "f": "Bullock: what mainly causes the over-investment behind 'ruinous competition'?", "b": "Government interference, especially protective tariffs (iron and steel, sugar) and manipulated excise taxes (distilling), plus promoters' profits. 'Competition cannot be proved a failure until it is given a trial' (p. 210)."}, {"id": "12", "who": "Bullock 1901", "g": "A", "f": "Which 1901 QJE survey sorted trust writers into eight classes and concluded we should stay sceptical of combination economies?", "b": "Charles J. Bullock, 'Trust Literature: A Survey and a Criticism', QJE 15(2), Feb 1901, pp. 167–217."}, {"id": "12", "who": "Bullock 1901", "g": "A", "f": "Why does Bullock call Clark's potential-competition argument consistent but others' not?", "b": "Clark does not think monopoly more efficient than large independents, so the threat of entry can restrain it. Writers who claim trust superiority cannot rely on entry, which would be hopeless."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Pigou 1904: two ways a monopolist can exploit consumers' surplus?", "b": "(1) Directly: discrimination or selling only in parcels of fixed size; (2) indirectly: using the threat of withholding supply to extrude would-be competitors."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Pigou 1904's alternative to discrimination?", "b": "Refuse to sell except in parcels of a certain size, forcing the buyer off his demand curve onto the indifference curve through the origin (Edgeworth)."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Pigou 1904: four conditions for the parcels device to work?", "b": "No combination among buyers; imperfect transferability; perishability; buyers divisible into a few groups of similar people."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Pigou 1904: discrimination requires goods 'difficult to transfer between persons and through {{c1::time}}'.", "b": "p. 388."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Which railway practice does Pigou 1904 cite as discrimination?", "b": "Raising the charge per pound-mile when a customer's demand is stimulated (wealth, value of goods, or no alternative route); cites Hadley and Acworth."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Does Pigou's 1904 paper use 'first/second/third degree' discrimination?", "b": "No; that vocabulary comes from Wealth and Welfare (1912) (context)."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Pigou 1904: examples of extruding competitors?", "b": "Factors' agreements and unionised shops, shipping conferences (frequent sailings), telephone networks, tied leases of patented shoe machinery."}, {"id": "13", "who": "Pigou 1904", "g": "B", "f": "Pigou 1904: why is the bargain indeterminate with one seller and one buyer?", "b": "Each loses more by not trading than by conceding, so a buyer may refuse the monopolist's terms to extract concessions (Mathematical Psychics p. 47)."}, {"id": "14", "who": "Moore 1905", "g": "B", "f": "Moore's main source for 'The Personality of Cournot' (1905)?", "b": "Cournot's unpublished Souvenirs, written in 1859."}, {"id": "14", "who": "Moore 1905", "g": "B", "f": "Cournot's three economic works and dates (per Moore 1905)?", "b": "Recherches 1838; Principes de la théorie des richesses 1863 (non-mathematical); Revue sommaire des doctrines économiques 1877."}, {"id": "14", "who": "Moore 1905", "g": "B", "f": "Which physical handicap limited Cournot's work?", "b": "An infirmity of the eyes that made continuous application impossible."}, {"id": "14", "who": "Moore 1905", "g": "B", "f": "Who was Cournot's chief patron in the University, per Moore?", "b": "Poisson."}, {"id": "14", "who": "Moore 1905", "g": "B", "f": "Moore: Cournot's reputation lagged because of his 'masterful {{c1::independence}} and absolute {{c2::truthfulness}}'.", "b": "Plus repugnance to self-advertisement (p. 399)."}, {"id": "14", "who": "Moore 1905", "g": "B", "f": "Cournot's birth and death (Moore 1905)?", "b": "Born Gray, 28 August 1801; died Paris, 30 March 1877."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Moore 1906: list the five hypotheses bundled in 'perfect competition'.", "b": "I maximum net income; II one price per market; III one producer's influence on price negligible; IV one producer's output negligible; V each ignores effect on rivals."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Which of Moore's hypotheses does Cournot use, and which Bertrand?", "b": "Cournot: I, II, V. Bertrand: I, II, and the negatives of III and IV."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Moore's verdict on Cournot vs Bertrand?", "b": "Cournot made no mathematical blunder; his conclusions follow from premises, but premise V is illicit when III and IV fail. Bertrand is nearer the truth."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Moore 1906: with few producers, 'labour gets what it produces' becomes 'labour {{c1::at least produces what it gets}}'.", "b": "p. 224."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Moore's paradox from Cournot's duopoly equations about costs?", "b": "The producer of the greater amount has the lower marginal cost; under increasing returns, duopoly has a stable equilibrium though perfect competition has none."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Bertrand's solution to Cournot's two-springs problem (per Moore)?", "b": "No limit to the fall in price; output reaches satiety; equilibrium impossible."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Edgeworth's conclusion (as reported by Moore) for duopoly with costs and limited capacity?", "b": "Indeterminate: price oscillates, no resting-place, no stable equilibrium."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "Moore on Cournot's complementary monopoly (ch. IX)?", "b": "Separately monopolised factors give higher price and lower output than a single monopoly; Moore calls these 'extraordinary', and Edgeworth finds the case indeterminate."}, {"id": "15", "who": "Moore 1906", "g": "B", "f": "What does Moore 1906 repeatedly say is lacking for each limit on the wage doctrine?", "b": "Statistics on what share of industry is monopolised, has few producers, increasing returns, or monopolised complementary goods."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Edgeworth 1911: what is the 'primary' definition of increasing returns?", "b": "Returns increase when the increment of product from a second dose exceeds that from the first: a marginal test, the criterion of a maximum."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Edgeworth 1911: what is the 'secondary' definition of increasing returns?", "b": "Returns increase while the average product per unit of productive power (measured from zero) increases."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Edgeworth 1911: which definition suits competition, and which monopoly?", "b": "Secondary (averages) suits competition; under monopoly the secondary is 'even fallacious' and the primary governs; state monopoly maximising consumers' surplus also uses the primary."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Edgeworth: 'there abide both the primary and the secondary definition; and {{c1::the greater of these is the primary}}.'", "b": "p. 362."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "In Carver's table used by Edgeworth 1911, where do increasing returns end on each definition?", "b": "At the third dose on the primary (marginal increment peaks at 120 bushels); at the fourth dose on Carver's secondary (average) definition."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "What term did Edgeworth 1911 borrow from Einaudi for two (or very few) dealers serving a numerous public?", "b": "Duopoly."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Edgeworth 1911: what railway example shows the size of the dose matters?", "b": "Extra carriages on existing trains may show increasing return; extra trains on a crowded track decreasing; a new track increasing again."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "What does Edgeworth call 'Increasing Return par excellence' and what railway fact does it explain?", "b": "A large fixed outlay (permanent way) followed by variable operating outlay; it explains why net receipts rise more than proportionately with gross receipts (Ripley)."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Is Edgeworth 1911 Part I mainly about the joint-cost vs discrimination dispute?", "b": "No: it is Section I on laws of return and cost; the series continued. His explicit backing of Pigou on joint cost is in #19 (1915)."}, {"id": "16", "who": "Edgeworth 1911", "g": "C", "f": "Which 1928 paper in the set explicitly uses Edgeworth's primary (marginal) definition?", "b": "#24 Yntema, 'The Influence of Dumping on Monopoly Price' (fn. 12)."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Taussig 1913 (Feb) replies to which work?", "b": "Pigou's Wealth and Welfare (1912), ch. xii, 'The Special Case of Railway Rates'."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "What does Taussig 1913 concede to Pigou?", "b": "Transport from A to B and from B to C (long stretches, division points) is not joint; local/distance discrimination is a different problem from classification."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Taussig 1913: in what sense are railway services NOT homogeneous?", "b": "As regards conditions of demand: coal and copper transport have different demand schedules, like cuts of beef or cotton fibre and seed."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Taussig's empirical test against Pigou's monopoly explanation?", "b": "If rates were monopolistic discrimination, railways would earn large monopoly revenue; British railways do not, yet show the same apparent discrimination."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Taussig 1913: railways are 'a much restricted monopoly conducted under the conditions of {{c1::joint cost}}'.", "b": "p. 384."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Which case of joint cost does Taussig say Pigou himself admits?", "b": "Back loading (the return haul); also electricity for light by night and power by day."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Taussig 1913: what restrains railways from exploiting monopoly fully?", "b": "Habit and tradition, public opinion, and public regulation or fear of it."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Taussig says the salient consequence of joint cost in railways is what?", "b": "Classification (of passengers and freight), not distance rates."}, {"id": "17", "who": "Taussig 1913", "g": "C", "f": "Date and journal of 'Railway Rates and Joint Cost Once More'?", "b": "QJE, February 1913, vol. 27, Notes and Memoranda."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Pigou 1913: distinguish joint costs from common costs.", "b": "Joint: one product cannot be increased without increasing the other (cotton fibre and seed). Common: shared overheads but outputs separately variable (copper and coal transport)."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Pigou 1913: 'Professor Taussig sees jointness {{c1::everywhere}}, and I see it {{c2::nowhere}}' except special cases.", "b": "p. 689; exceptions include A-to-B vs B-to-A (back loading)."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "On what case do Pigou and Taussig agree discrimination is desirable?", "b": "Where differential rates are needed to make a railway profitable at all (Pigou adds a reservation for state bounties)."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Name Pigou's three arguments (1913) against general joint cost in railways.", "b": "Analogy (factories also have big overheads), analysis (supply price of copper transport depends only on total transport), and direct proof (competition equalises prices across markets)."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "What policy does Pigou 1913 recommend to the ICC?", "b": "Uniform mileage rates as the ideal where a railway would pay under them; 'value of service' has a stronger claim in the sparse Western states than the Eastern."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Pigou reaches support for discriminating rates via {{c1::monopoly theory}}; Taussig via {{c2::joint cost}}.", "b": "They agree at the goal but disapprove of each other's routes (p. 688)."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Taussig's reply (1913): when does joint cost apply?", "b": "When a railway cannot use its full capacity on the most profitable traffic alone, so it fills spare capacity with other traffic at lower rates (e.g. New Haven: passengers then freight)."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Taussig's examples of joint products not 'necessarily' produced together?", "b": "Electricity by night and by day, freight by night and passengers by day, back loading, a mail car on a passenger train."}, {"id": "18", "who": "Pigou 1913", "g": "C", "f": "Which later paper in the set judges the Pigou–Taussig debate, and for whom?", "b": "#19 Edgeworth 1915, for Pigou (citing Fanno's rejection of 'broad' joint cost)."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "In the Pigou–Taussig railway debate, which side does Edgeworth 1915 take?", "b": "Pigou's: the experts' 'joint cost' confuses true joint production with costs depending on the sum of outputs."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "Edgeworth 1915: what distinguishes gas/coke from coal/copper transport?", "b": "Gas/coke: cost of x gas equals cost of x gas plus y coke (joint proper). Transport: cost depends on z = x + y (sum of tons), an extreme of rival production."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "Edgeworth 1915: where cost is F(x+y), competitive prices tend to equal {{c1::prime cost}}, equal per ton of coal or copper.", "b": "pp. 200–201."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "Which Italian economist does Edgeworth 1915 cite as rejecting the 'broad' concept of joint cost?", "b": "Fanno, who called it too vague and indeterminate."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "Edgeworth 1915's monetary analogy for the joint-cost confusion?", "b": "Confusing symmetallism (fixed bundle of gold and silver) with bimetallism (any proportion at a fixed ratio)."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "Edgeworth 1915 agrees with Pigou that value of service suits {{c1::an early stage of development}}, and cost of service {{c2::more developed countries}}.", "b": "p. 202; adds weight to the ICC."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "What does Edgeworth 1915 mean by an 'a priori' or antecedent-probability presumption?", "b": "A tendency derived from theory and general experience, valid prima facie until cause to the contrary is shown (unverified, after Mill and Laplace)."}, {"id": "19", "who": "Edgeworth 1915", "g": "B", "f": "Edgeworth 1915: the 'competition' that advocates of discrimination like Hugo Meyer invoke is really what?", "b": "Duopoly, which lacks the presumptions in favour of 'simple competition'."}, {"id": "20", "who": "Edgeworth 1922", "g": "B", "f": "Edgeworth 1922 reviews which book?", "b": "Luigi Amoroso, Lezioni di Economia Matematica (1921)."}, {"id": "20", "who": "Edgeworth 1922", "g": "B", "f": "Edgeworth's main objection to Amoroso?", "b": "He extends Cournot's determinate solution to two monopolists; Edgeworth shows price cutting and jumps continue forever, so duopoly is indeterminate."}, {"id": "20", "who": "Edgeworth 1922", "g": "B", "f": "Edgeworth 1922: Amoroso is 'alone among high authorities in siding with {{c1::Cournot}}'.", "b": "p. 405."}, {"id": "20", "who": "Edgeworth 1922", "g": "B", "f": "Whose phrase 'monopolistic competition' (output indeterminate) does Edgeworth 1922 quote?", "b": "Pigou, Wealth and Welfare, p. 193."}, {"id": "20", "who": "Edgeworth 1922", "g": "B", "f": "What is Amoroso's 'curve of unitary costs'?", "b": "Total cost divided by quantity (average cost); Edgeworth compares it to Pigou's construction."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth 1925 reviews which edition of which book?", "b": "The 2nd edition (1924) of Pigou's The Economics of Welfare, compared with the 1st edition (1920) and Wealth and Welfare (1912)."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth 1925: which error of Pigou's does he concede, and who pointed it out?", "b": "Treating rents paid to members of the community as a cost. Pointed out by Allyn Young and Maurice Clark (both 1913)."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth 1925: how much does the rent correction damage Pigou's theory?", "b": "Little: the main outcome, the blow to the abstract doctrine of laissez-faire, is 'not much affected'."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth's fanciful example of an external diseconomy?", "b": "A free Irish state whose landlords keep their rights and emigrate, so rising rents go to absentees outside the community."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth 1925: 'it is an error to treat the {{c1::rents}} paid as a cost'.", "b": "rents"}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "How does Edgeworth construct the curve of 'marginal supply prices'?", "b": "So that the area under it up to any output equals total cost (the rectangle under the supply curve). The optimum is where demand meets it."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth credits whom for the better name 'curve of aggregate expenses'?", "b": "Allyn Young (1913 review, #26)."}, {"id": "21", "who": "Edgeworth 1925", "g": "D1", "f": "Edgeworth 1925 on Robertson's objections to the theory's usefulness?", "b": "He gives them weight but says the propositions are 'curious and may be useful', and may one day be made usable with statistics."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley 1928 develops whose critique of his Mathematical Groundwork?", "b": "Knut Wicksell's last published writing, reprinted by Schumpeter."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley 1928 Case I vs Case II?", "b": "Case I: manufacturer dictates the material price (moves along supplier's offer schedule). Case II: supplier dictates (moves along manufacturer's demand schedule), Wicksell's case."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley 1928 Case III result?", "b": "Combination maximises joint gain at the intersection of the manufacturer's demand and supplier's offer schedules, with the largest output, but the price is not stable."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley: Wicksell's solution is {{c1::one-sided}}; equally the employer may reach a real maximum.", "b": "p. 651."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley with equal linear slopes: joint gain in Case I or II vs combination?", "b": "(a-b)^2/9m in Case I or II vs (a-b)^2/8m when combined; outputs (a-b)/6m vs (a-b)/4m."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley's coal example: three union wage targets (50,000 miners)?", "b": "5s. 4d. full employment; 6s. maximum earnings; 7s. 6d. maximum receipts including unemployment benefit."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Bowley's conclusion when neither employer nor union has absolute power?", "b": "There is no definite solution, though an arbitrator could work within narrow limits."}, {"id": "23", "who": "Bowley 1928", "g": "B", "f": "Define the 'manufacturer's demand schedule' in Bowley 1928.", "b": "Price of material at which the manufacturer, maximising profit, takes quantity x: pi = f(x) + x f'(x)."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Whose claim does Yntema 1928 test?", "b": "Jacob Viner's (Dumping) that the most profitable domestic price is unchanged by dumping."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Yntema 1928: equilibrium condition for a dumping monopoly?", "b": "Marginal gross revenue in each market equals the common marginal cost (hence the two MRs are equal)."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Yntema: with {{c1::decreasing}} marginal costs dumping lowers the domestic price; with {{c2::increasing}} marginal costs it raises it.", "b": "p. 693."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Yntema's graphic method for two markets?", "b": "Add the two marginal gross revenue curves horizontally and intersect the sum with marginal cost; then shift MC left by the quantity dumped."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Yntema: when is the foreign (dumping) price lower than the domestic price?", "b": "When foreign demand is more elastic than domestic demand (typical with foreign competition)."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "What does Yntema call marginal revenue?", "b": "Marginal gross revenue."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Yntema fn. 12 links his results to whose definition of returns?", "b": "Edgeworth's primary (marginal) sense, as opposed to the secondary (average) sense (#16)."}, {"id": "24", "who": "Yntema 1928", "g": "B", "f": "Yntema's welfare presumption on permanent dumping?", "b": "Permanent dumping of manufactures produced under decreasing marginal costs tends to benefit domestic consumers through lower prices."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "What did Allyn Young (1913) rename Pigou's 'curve of marginal supply prices'?", "b": "The 'curve of aggregate expenses': it shows how much each extra unit adds to the industry's total expenses, rent included."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Young 1913's central objection to Pigou's tax-bounty argument?", "b": "Under diminishing returns the extra aggregate expense is mainly higher land rent, a transfer of purchasing power, not an increased using up of resources."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Young 1913: Pigou is inconsistent about the meaning of which word?", "b": "'Resources': sometimes the real services of labour and capital, sometimes entrepreneurs' money expenses."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "In which journal and year did Young review Pigou's Wealth and Welfare?", "b": "Quarterly Journal of Economics, August 1913 (vol. 27, pp. 672–686)."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Young 1913 'cannot imagine' what, in his footnote on p. 678?", "b": "External economies strong enough to give increasing returns to the industry while each firm faces diminishing returns. Robertson #31 quotes this."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Young 1913: rent increases 'merely represent {{c1::transferences of purchasing power}}'.", "b": "transferences of purchasing power"}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Which later papers credit or endorse Young's 1913 critique of Pigou?", "b": "Knight 1924 (#30, fn. 8), Robertson 1924 (#31), Edgeworth 1925 (#21); Pigou concedes it in 1924 (reply in #31)."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Per Young 1913, for what is Pigou's curve of marginal supply prices genuinely useful?", "b": "Analysing monopoly (a perfectly discriminating monopolist equates demand with it), and possibly questions of distribution, but not competitive output."}, {"id": "26", "who": "Young 1913", "g": "D1", "f": "Young 1913: what is Pigou's 'most unsatisfactory feature' outside cost theory?", "b": "His treatment of the population problem, which he 'neglects or evades'."}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Who wrote 'Of Empty Economic Boxes' and when?", "b": "J. H. Clapham, economic historian, Economic Journal, September 1922."}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "What are Clapham's 'empty economic boxes'?", "b": "The categories of diminishing, constant and increasing return industries (and monopoly/tax variants), which no one has filled with actual industries."}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Which factory does Clapham's economist visit, and what does he conclude?", "b": "A hat factory (Denton). He 'leaves the factory with no formed opinion about the proper economic box for hats'."}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Clapham: constant returns 'must always remain a {{c1::mathematical point}}, their box an empty one.'", "b": "mathematical point"}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Why does Marshall's invention/organisation distinction trouble Clapham?", "b": "Marshall's increasing returns come from organisation, not invention, but you cannot measure the two apart (e.g. freezing strata for the Doncaster pits)."}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Does Clapham deny that increasing returns exist?", "b": "No: 'This is not a denial of the reality of increasing returns in this sense, only a denial of their measurability.'"}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Which book does Clapham say has no illustration of which industries go in which box, in nearly a thousand pages?", "b": "Pigou's The Economics of Welfare."}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Clapham: 'In all these matters the economist is, willy-nilly, an {{c1::historian}}.'", "b": "historian"}, {"id": "27", "who": "Clapham 1922", "g": "D1", "f": "Who replied to Clapham's Empty Boxes in Dec 1922, and who extended the debate in March 1924?", "b": "Pigou replied (#28); Robertson's 'Those Empty Boxes' (#31) followed in March 1924."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Pigou's reply to Clapham appeared where and when?", "b": "Economic Journal, December 1922 (vol. 32, pp. 458–465)."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Pigou 1922: the 'valises' vs the 'little cases' inside them?", "b": "Valises: the broad increasing/diminishing returns categories. Little cases: precise numerical ranges of supply and demand elasticities, which practice needs."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Which negative use of the returns categories does Pigou give against Clapham?", "b": "Exposing hidden assumptions: anyone who says a tax always raises price by the full tax is assuming constant returns."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Pigou 1922: knowledge 'If X, then Y' vs 'In the year 1600, X' illustrates what?", "b": "Knowledge of implications is just as much knowledge as historical fact (the king who died of a surfeit of lampreys)."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Pigou 1922: the boxes are 'elements in the intellectual {{c1::machinery}}' of modern economic thought.", "b": "machinery"}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Whom does Pigou hold up as the model economist who is equally at home in theory and in industrial facts?", "b": "Jevons, the 'towering exception'. We must train more men of his calibre or get specialists to work together."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Pigou's suit-of-clothes analogy answers which Clapham argument?", "b": "That knowing which returns category applies is useless for tax policy because other considerations also matter. Like refusing to check fit because price matters too."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Does Pigou (1922) value pure economics for its own sake?", "b": "No. He says practical usefulness, not necessarily immediate, is what he looks for from economics."}, {"id": "28", "who": "Pigou 1922", "g": "D1", "f": "Which paper does Pigou's 1922 reply answer, and which 1924 paper takes the debate inside Pigou's own apparatus?", "b": "Answers Clapham #27; Robertson's 'Those Empty Boxes' #31 (1924) attacks Pigou's apparatus itself."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight 1924: what does the owner of the narrow, good road charge, and with what result?", "b": "A toll (rent) set so the marginal truck adds no more than it could on the free road. The toll exactly equals Pigou's ideal tax."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Which Pigou example does Knight 1924 attack, and from which book?", "b": "The two roads (one broad and poor, one narrow and good), from The Economics of Welfare (1920), p. 194."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight: Pigou's logic is 'quite unexceptionable'. So what is wrong?", "b": "His assumptions drop private ownership of the scarce factor, the key feature of competition."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight: it is 'the social function of {{c1::ownership}} to prevent this excessive investment in superior situations.'", "b": "ownership"}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight 1924: do higher payments to specialised factors (rents) count as social cost?", "b": "No: they are 'not social costs at all, but redistributions of product merely'."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight's two kinds of cause of increasing cost (p. 594)?", "b": "Value changes, and technological changes (factors used in worse proportions; less suitable factors drawn in). (Context: the later 'pecuniary vs technological' distinction.)"}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight on Marshall's external economies?", "b": "They are a misconception: economies external to one firm are 'internal economies in some other' within the industry. Lasting economies end in monopoly."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Besides Pigou, whose 1923 argument does Knight 1924 attack?", "b": "F. D. Graham's case that protection may pay under decreasing costs, against comparative advantage."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Whom does Knight credit with having already spotted Pigou's fallacy?", "b": "Allyn Young, in his August 1913 QJE review of Wealth and Welfare (#26)."}, {"id": "30", "who": "Knight 1924", "g": "D1", "f": "Knight 1924: where do the real weaknesses of free enterprise lie?", "b": "Outside the mechanics of exchange: ignorance, inherited or unequal capacities, manufactured wants, dependence on the state, and the drift to monopoly."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Which terms does Robertson 1924 prefer to 'diminishing/increasing returns' for industries?", "b": "'Increasing cost' and 'decreasing cost'. Keep 'diminishing return' for the law of variable proportions."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Robertson's Class I decreasing cost?", "b": "Lumpy, discontinuous fixed capital spread over more units, e.g. the medal die (£20 die + 5s per medal), railways, newspapers. Cost falls at once when demand rises."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Robertson's Class II decreasing cost?", "b": "Improvements in technique and organisation that, given time, let a larger output be produced at lower unit cost."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Robertson's reductio against Pigou for Class I industries?", "b": "Pigou's rule implies a nationalised industry should be subsidised for 'the whole burden of the charges of the fixed original plant', which is absurd. It should cover total costs."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Robertson 1924: 'But these external {{c1::diseconomies}}, mathematically no less powerful, who in the world are they?'", "b": "diseconomies"}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Robertson's National Guild thought experiment shows what?", "b": "Even a body that captures all economies would set output so total receipts cover total costs, as competition does. Not Pigou's 'ideal' output."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Pigou's reply to Robertson (Mar 1924): what does he drop, and what does he concede?", "b": "He drops the 'duplex curve apparatus' from the new edition and concedes Young's criticism is 'substantially valid as regards long-period problems'."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Which State support does Robertson accept for decreasing-cost industries?", "b": "Temporary infant-industry protection or subsidy to reach a point on the supply curve sooner. Not a permanent subsidy."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "When and where was 'Those Empty Boxes' published?", "b": "Economic Journal, March 1924 (vol. 34, pp. 16–31), with Pigou's reply and Robertson's rejoinder."}, {"id": "31", "who": "Robertson 1924", "g": "D1", "f": "Robertson's sole explanation of increasing cost?", "b": "Diminishing return from land, whose supply is limited; the resulting rent rises are transfers (following Young 1913), not a social excess."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Which paper prompted Pigou's 'The Laws of Diminishing and Increasing Cost' (June 1927)?", "b": "Sraffa's 'The Laws of Returns under Competitive Conditions', Economic Journal, December 1926 (context, not in your folder)."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "On what does Pigou 1927 agree with Sraffa?", "b": "For a commodity using a small share of each factor, increasing costs are impossible: a 10% rise in all factors gives at least 10% more output."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "On what does Pigou 1927 disagree with Sraffa?", "b": "That external economies from one industry's expansion are negligible. What matters is the ratio of the cost saving to the output increase."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Pigou's 1927 numerical example of external economies?", "b": "£100,000 for 100,000 units, £175,000 for 200,000. One extra unit saves ·0012d across the industry, yet doubling output cuts average cost 12½%."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Pigou 1927: the ratio between two quantities both of the second order may itself be of the {{c1::first order}}.", "b": "first order"}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Pigou 1927: with continuously decreasing costs the supply curve coincides with which curve?", "b": "The average costs curve (it lies above marginal costs)."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Pigou 1927's welfare conclusion for decreasing-cost industries?", "b": "Optimum is demand = marginal cost, but output goes to demand = supply (average cost), so it is too small unless the State gives a bounty."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Pigou 1927's 'minimum apparatus' type of internal economy (monopoly) — examples?", "b": "Striking medals (a die), a printed book, rail transport (first hundredweight £100,000, each extra 6d)."}, {"id": "33", "who": "Pigou 1927", "g": "D1", "f": "Date and journal of Pigou's 'The Laws of Diminishing and Increasing Cost'?", "b": "Economic Journal, June 1927 (vol. 37, pp. 188–197)."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Robbins 1928: the representative firm 'lurks in the obscurer corners of Book V like some pale {{c1::visitant}}'.", "b": "visitant (from the world of the unborn): Robbins pictures it as a ghost."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Robbins's two kinds of efficiency disparities between producers?", "b": "Static: scarcity of the best factors, which would persist in equilibrium. Dynamic: maladjustment during changes in demand or supply."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Robbins: why is no representative firm needed for equilibrium?", "b": "Each factor just needs to earn at least what it could get elsewhere. Unequal managers earn unequal normal profits, like unequal lands earn unequal rents."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Robbins's quip against Henderson's 'average ability' entrepreneurs?", "b": "'If all entrepreneurs were at least of average managerial ability, they would at once cease to be average.'"}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Whose phrase: 'There are not enough Josiah Stamps to go round'?", "b": "Robbins 1928, on diminishing returns to scarce managerial ability."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Robbins: which edition of the Principles lacks the representative firm?", "b": "The first edition (1890, context). It enters in the second and later editions, in Bk IV's last chapter."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Robbins's three conclusions in his final section (V)?", "b": "No tendency of profits to equality; not one optimum firm size but many; the Colwyn/Coates debate can be settled without representative firms."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Does Robbins's 1928 paper discuss Pigou's 'equilibrium firm'?", "b": "No. It was written and set up before Pigou's 'Analysis of Supply' (June 1928); a footnote only hopes its points apply."}, {"id": "34", "who": "Robbins 1928", "g": "D1", "f": "Whose idea does Robbins credit, in a footnote, that growth by differentiation makes the representative firm misleading?", "b": "Allyn Young's, later developed in Young 1928 (#37)."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Define Pigou's 'equilibrium firm' (1928).", "b": "A firm that is itself in equilibrium whenever the industry as a whole is in equilibrium, even though most actual firms are growing or shrinking."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928: how does the equilibrium firm differ from Marshall's representative firm?", "b": "The representative firm is also 'typical' or average-sized. The equilibrium firm need not be: firms 'might be of all varieties of size'."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928: two equilibrium conditions for a many-firm industry?", "b": "Supply price = marginal cost of the equilibrium firm (no gain from expanding at rivals' expense) and = its average cost (no entry or exit)."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928: marginal additive vs marginal substitute cost?", "b": "Additive: extra cost if rivals' output is unchanged. Substitute: extra cost if industry output is unchanged (rivals contract). Pigou uses substitute cost."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928: if the equilibrium firm's costs depend only on its own output, the industry obeys which law?", "b": "Constant supply price: firm output and cost are fixed independently of industry output."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928's 'transfer elements'?", "b": "Rises in supply price from higher factor prices (a·dp₁/dy + …). They are transfers to factor owners, not net costs to the community."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928: corrected for transfer elements, increasing supply price is {{c1::impossible}} (except imported materials from one country's view).", "b": "impossible"}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Pigou 1928: why is (corrected) decreasing supply price 'likely' in many manufacturing industries?", "b": "A larger industry allows firms to specialise (e.g. Chapman on English cotton spinning fine vs coarse counts), lowering the equilibrium firm's costs."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Why does Pigou 1928 prefer 'increasing/constant/decreasing supply price' to 'returns' or 'cost'?", "b": "Average and marginal returns (or costs) can move in opposite directions for the same output; supply price has no such ambiguity."}, {"id": "35", "who": "Pigou 1928", "g": "D1", "f": "Date, journal and companion paper of Pigou's 'An Analysis of Supply'?", "b": "Economic Journal, June 1928 (vol. 38, pp. 238–257); followed in the same issue by Shove's 'Varying Costs and Marginal Net Products' (#36)."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Which Pigou doctrine does Shove 1928 attack?", "b": "Economics of Welfare 2nd ed.: under diminishing returns the buyers' loss is balanced by landlords' gain; under increasing returns the buyers' gain is 'offset by nothing'."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Shove 1928: the balance of purchasers' loss and landlords' gain depends on what?", "b": "On how expansion affects infra-marginal costs (the cost of units with differential advantages), not on whether marginal cost rises or falls."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Define Shove's 'final trade cost'.", "b": "The increase in total cost excluding rent when output rises by one unit (c₂ − c₁)."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Shove: landlords' gain minus purchasers' loss equals what?", "b": "Marginal cost minus final trade cost: p₂ − (c₂ − c₁)."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Shove: 'The effects on {{c1::rents}} must be allowed for in both types of industry, not in one only.'", "b": "rents"}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Shove 1928: in which form does the tax-bounty doctrine 'remain unshaken'?", "b": "Marshall's original form (Principles pp. 472–5), which already flagged effects on landlords' interests."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Shove's restated policy rule?", "b": "Shift resources toward industries where marginal cost greatly exceeds final trade cost (large net external economies) and away from those where it does not."}, {"id": "36", "who": "Shove 1928", "g": "D1", "f": "Shove's 1928 note appeared alongside which paper?", "b": "Pigou's 'An Analysis of Supply' (#35), in the June 1928 Economic Journal (vol. 38)."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Occasion of Young's 'Increasing Returns and Economic Progress'?", "b": "Presidential Address to Section F of the British Association, Glasgow, 10 September 1928; printed EJ December 1928."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928: Adam Smith's dictum becomes 'the division of labour depends in large part upon the {{c1::division of labour}}'.", "b": "division of labour"}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928: what are the principal economies behind increasing returns?", "b": "Those of capitalistic or roundabout methods of production, largely the same as the economies of the modern division of labour."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928: why not study increasing returns firm by firm or industry by industry?", "b": "The progressive division and specialisation of industries is central to the process. Industry must be seen 'as an interrelated whole'."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928 on the representative firm?", "b": "With the division of labour among industries it 'loses its identity': its internal economies dissolve into those of specialised successor firms."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young's printing example illustrates what?", "b": "Industrial differentiation: printing gave rise to separate pulp, paper, ink, type and printing-machinery industries."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928: what determines the size of the market 'in an inclusive view'?", "b": "The volume of production (buying power depends on capacity to produce)."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928's hammer-and-nail point?", "b": "'It would be wasteful to make a hammer to drive a single nail': roundabout methods pay only with a large enough market (likewise Ford's methods)."}, {"id": "37", "who": "Young 1928", "g": "D1", "f": "Young 1928 vs Young 1913: what's the difference?", "b": "1913 (#26): critique of Pigou counting rents as cost. 1928 (#37): increasing returns as cumulative, economy-wide division of labour."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "In the 1930 EJ symposium, what role did the editor assign to Robertson, Sraffa and Shove?", "b": "Robertson: 'partial rehabilitation of Marshallian orthodoxy'; Sraffa: 'negative and destructive criticisms'; Shove: 'constructive suggestions' (p. 79)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Robertson 1930: why can Marshall's representative firm be in equilibrium with falling cost and price > MC?", "b": "No identifiable firm with a continuing will has both the power and the motive to expand. Real firms are like water-drops in a wave (p. 88)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Sraffa's key question to Robertson (1930) once firms 'lose their identity'?", "b": "If new firms can produce more at lower cost, why didn't they come into existence before, in the old equilibrium? (p. 92)"}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Sraffa 1930 rejoinder: why do the 'two roads' not cross by Providence?", "b": "Under free competition the firm's demand curve is horizontal, tangent to its cost curve at minimum cost (p. 93)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Cloze: Sraffa (1930): 'I think it is {{c1::Marshall's theory}} that should be discarded.'", "b": "Marshall's theory (p. 93)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Shove 1930: what labels replace 'internal' and 'external' economies?", "b": "Economies of individual expansion (firm grows, industry output fixed) and economies of large-scale industry (industry grows); plus economies of concentration and of rationalisation."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Shove 1930's first reconciliation of internal economies with competition?", "b": "Invading a rival's market (transport, buyers' preferences) costs more than adding to your own, so firms don't take over the trade, yet industry output can rise at falling cost (pp. 105–7)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "What analogy does Shove (1930) offer instead of Marshall's 'trees of the forest'?", "b": "A cluster of variable stars: long-lived firms whose fluctuations offset each other (p. 115)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Which Pigou distinction does Shove 1930 link to his own invasion-vs-addition point?", "b": "'Marginal substitute cost' vs 'marginal additive cost' (Pigou 1928), which Pigou had dismissed as unlikely to differ much (p. 106 n.)."}, {"id": "38", "who": "Robertson, Sraffa & Shove 1930", "g": "D2", "f": "Date and place of the Robertson–Sraffa–Shove symposium?", "b": "Economic Journal, March 1930 (vol. 40), pp. 79–116."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "What did Harrod (1930) call the curve later named the marginal revenue curve?", "b": "The 'increment of aggregate demand curve' (p. 238): total price of x units minus total price of x−1 units."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "Harrod 1930: where is the output of a monopolistic source determined?", "b": "Where the marginal cost curve cuts the increment of aggregate demand curve (p. 239)."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "Who renamed Harrod's 'increment of aggregate demand curve' the 'marginal revenue curve'?", "b": "Joan Robinson, EJ Dec 1932 (p. 546 n.). Harrod accepts the 'more elegant name' in 1933."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "Harrod 1930 Fig. 1: at what point is average total cost lowest?", "b": "Where marginal prime cost (KCm) cuts average total cost (LCt), point F, the optimum output of the source."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "For Harrod (1930), what is evidence of quasi-monopoly?", "b": "Sources working 'under capacity', i.e. able to lower average prime costs by expanding output (p. 235)."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "Harrod 1930: what is the 'law of decreasing cost conditions'?", "b": "After a fall in demand, fixed equipment isn't renewed, so short-period cost schedules rise. Asymmetric: permanent equipment can be increased but not decreased."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "Harrod 1930 Sec. III: why does agriculture show increasing supply price?", "b": "It uses land in more than the national-average proportion, so expansion bids up land's relative price. Better than citing land's inelastic supply."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "Cloze: Under perfect competition, Harrod notes the demand curve and the {{c1::increment of aggregate demand curve}} coincide.", "b": "increment of aggregate demand curve (p. 239)."}, {"id": "41", "who": "Harrod 1930", "g": "D2", "f": "When and where did Harrod's 'Notes on Supply' appear?", "b": "Economic Journal, June 1930, pp. 232–241."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Harrod 1931: why does the marginal competitive marketing cost depend on the state of demand?", "b": "It is the cost of trespassing on a neighbour's territory. An evenly spread rise in demand lets firms expand without trespass (p. 567)."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Harrod 1931: consequence for the supply schedule?", "b": "'Every demand schedule has its own appropriate supply schedule'. Cost depends on output and the state of demand, so three dimensions are needed (pp. 567–8)."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Which formula does Harrod (1931) say 'has universal applicability'?", "b": "In equilibrium, marginal cost = price − price/elasticity of demand. Perfect competition is the case of infinite elasticity (p. 570)."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Harrod 1931: two long-period reasons why firms below optimum size don't amalgamate?", "b": "Transport costs would rise with concentration, and 'individualism' (firms' wish to keep their identity) (pp. 572–3)."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Harrod 1931: in which industries are decreasing costs normal?", "b": "Those where technical progress makes the optimum plant grow faster than demand (pp. 574, 576)."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Harrod 1931 Fig. 2: what is the 'long-period productive cost curve'?", "b": "The envelope of a family of plant-cost parabolas. It touches each parabola on its falling side if it slopes down, so plant is worked below optimum."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Cloze: Harrod 1931 aimed to establish 'the legitimacy of the conception of {{c1::increasing returns industries}}'.", "b": "increasing returns industries (p. 576)."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Who criticised Harrod 1931 for implying that price = AC with MR = MC occurs 'only by an accident'?", "b": "Joan Robinson, EJ Dec 1932, p. 548 n."}, {"id": "43", "who": "Harrod 1931", "g": "D2", "f": "Date of Harrod's 'The Law of Decreasing Costs'?", "b": "Economic Journal, December 1931, pp. 566–576."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932: what is the 'double condition' of industry equilibrium?", "b": "Marginal revenue = marginal cost (firm) and price = average cost including normal profit (industry, via entry) (p. 547)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932: what geometrical condition satisfies the double condition, and to whom is it credited?", "b": "The firm's demand curve is tangent to its average cost curve. Credited to R. F. Kahn, 'pursuing Mr. Sraffa's argument' (p. 547 n.)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Cloze: Robinson 1932: in full equilibrium average costs for the firm 'may be falling: they {{c1::must be falling}}'.", "b": "must be falling (p. 549)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932: after a rise in total demand, when does supply price fall?", "b": "When the new individual demand curves are more elastic. Same elasticity: unchanged; less elastic: higher (pp. 550–2)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson's example of an increase in demand that leaves price unchanged?", "b": "New suburbs on a town's edge whose residents switch to new local firms once these are set up (p. 552)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932: which type of demand increase does she think most frequent, and its effect?", "b": "Demand spread evenly (denser population) with new firms set up in between old ones: buyers more indifferent, elasticity up, price falls (p. 553)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932: which relaxed assumption 'very greatly strengthens' falling supply price?", "b": "Allowing lateral and vertical disintegration: imperfection blocks specialisation, so more demand releases a 'reservoir' of economies (p. 554)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932's footnote: what is Harrod's name for her marginal revenue curve?", "b": "The 'increment of aggregate demand curve' (p. 546 n.)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Robinson 1932: what does she say is the chief inducement to amalgamate (against Harrod)?", "b": "Monopoly profit: a larger share of output means less elastic demand. Not savings on marketing costs (p. 549 n.)."}, {"id": "44", "who": "Robinson 1932", "g": "D2", "f": "Date of Robinson's 'Imperfect Competition and Falling Supply Price'?", "b": "Economic Journal, December 1932, pp. 544–554."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Harrod 1933: what is wrong with Robinson's definition of normal profit under imperfect competition?", "b": "It gives only a range of rates, not a unique rate. A unique entry/exit rate would mean perfect competition (pp. 337–8)."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Harrod 1933's own definition of the normal rate of profit?", "b": "The rate just sufficient to induce the firm itself to embark on extra fixed capital, earned on its marginal installation (p. 338)."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Harrod 1933: is tangency of the demand curve to average total cost necessary for long-period equilibrium?", "b": "No. Only the marginal plant must earn the normal rate, so price may exceed or fall short of average total cost (p. 340)."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Harrod 1933: when are long-period decreasing costs 'more than usually likely'?", "b": "After prolonged depression, when firms settle at low output, prices and profits (p. 340)."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Cloze: Harrod 1933 says Robinson 're-christened' his 'increment of aggregate demand curve' as the {{c1::marginal revenue curve}}.", "b": "marginal revenue curve (p. 338 n.)."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Harrod 1933 vs Robinson 1932 on decreasing costs in imperfect competition: may or must?", "b": "Harrod: may. Robinson: must."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Whose criticism of Robinson does Harrod 1933 say exposed the normal-profit difficulty?", "b": "Mr. Shove's (EJ March 1933, p. 119)."}, {"id": "45", "who": "Harrod 1933", "g": "D2", "f": "Date of Harrod's 'A Further Note on Decreasing Costs'?", "b": "Economic Journal, June 1933, pp. 337–341."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "What doubt led Pigou (1933) to restate Robinson's analysis algebraically?", "b": "Whether her two conditions (each firm maximises monopoly revenue; no entry or exit) might sometimes be incompatible (p. 108)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Pigou 1933's two equations for Robinson's equilibrium?", "b": "(1) (1/n)F(p) = f(p); (2) (1/n)F′(p) − ∂ψ(p,n)/∂p = f′(p). Two equations, two unknowns (p, n) (p. 109)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Pigou 1933: firm scale with a perfect market vs a finitely imperfect market?", "b": "Perfect: optimum scale (minimum average cost). Any finite imperfection: less than optimum scale (p. 110)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Pigou 1933: what happens with an infinite degree of market imperfection?", "b": "Robinson's two conditions can be jointly met only at nil output, so for practical purposes they are incompatible (p. 110)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "What did Pigou (1933) propose as a 'measure of market imperfection'?", "b": "∂ψ(p,n)/∂p, the rate at which the firm's customers substitute other firms' product when it alone raises price (p. 111)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Pigou 1933: which two elements make up the elasticity of a firm's individual demand?", "b": "(1) The fall in total purchases by its customers; (2) their substitution of purchases from other firms (p. 111)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Cloze: Pigou says his note improves 'on a rather bleak {{c1::ice-wall}}, a staircase which has already been made and ascended'.", "b": "ice-wall (p. 108)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Did Pigou 1933 overturn Robinson 1932?", "b": "No. 'These results add nothing of significance' to hers, but they drop the assumption that firms are alike in size and situation (p. 111)."}, {"id": "46", "who": "Pigou 1933", "g": "D2", "f": "Date of Pigou's 'A Note on Imperfect Competition'?", "b": "Economic Journal, March 1933, pp. 108–112 (same issue as Shove's note)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Shove 1933: which view does he deny ever holding, which Robinson attributed to the earlier writers?", "b": "That falling average cost to the firm necessarily means falling supply price. In 1930 he wrote 'often (though not always or necessarily)' (p. 113)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Shove 1933's first question to Robinson?", "b": "What costs does her average cost curve set against each output, given that the cost of expanding depends on the character of demand? (pp. 114–119)"}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Shove 1933: why don't the old firms open branches in Robinson's suburb example?", "b": "Because, on her assumptions, expanding that way would raise (or not lower) their average costs relative to new entrants (pp. 115–116)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Shove 1933's second question: what does 'normal profit' become with costs of entry?", "b": "A range between the entry and exit levels. Tangency then shows maximum profit, not a necessary condition for stable output (pp. 119–121)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Shove 1933: 'minimum cost' vs 'special cost'?", "b": "Minimum: the cheapest known way to produce an output. Special: extra spending (advertising, transport, facilities) to raise its selling value (p. 122)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Cloze: Shove 1933: 'demand' is not simply a {{c1::datum}} to which producers adjust, but largely created and moulded by them.", "b": "datum (p. 124)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Robinson's reply to Shove (1933): what distinction does she say he fails to draw?", "b": "Equilibrium of the firm (MR = MC) vs equilibrium of the industry (entry governed by price vs average cost) (p. 125)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "What assumption did Robinson concede in reply to Shove (1933)?", "b": "That a firm's costs vary only with output, though they are likely to vary with the nature of the increase in demand (p. 124)."}, {"id": "47", "who": "Shove (with reply by Robinson) 1933", "g": "D2", "f": "Date and placement of Shove's 'The Imperfection of the Market'?", "b": "Economic Journal, March 1933, pp. 113–125, right after Pigou's note in the same issue."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "What does Robbins (1934) call the conception of cost as displaced alternatives?", "b": "'Wieser's Law' (after Pantaleoni's usage). The cost of anything is what must be surrendered to get it (p. 2)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Robbins 1934 rejects whose 'technical displacement' view of cost ('the cost of beaver is deer')?", "b": "Knight (1928) and Haberler (p. 4)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Robbins 1934: two reasons for rejecting cost as quantities of goods foregone?", "b": "It fails with fixed coefficients or products made from different factors, and it ignores the valuations entrepreneurs actually face (pp. 4–6)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Robbins 1934: how are Wieser's Law and Marshall's constant/falling supply curves reconciled?", "b": "Wieser's Law describes equilibrium (cost rises). The curves belong to a 'Theory of Variations', comparing equilibria after demand shifts and releases factors elsewhere (pp. 7–8)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Robbins 1934: why must external economies wait on an extended market?", "b": "The factors exploited are indivisible below a certain size. Competition rules out indivisibility in actual but not potential uses (pp. 13–14)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Robbins 1934's example of an indivisible potential use?", "b": "A producer with special marketing skill who works as ordinary labour until demand makes a specialist marketer worthwhile (pp. 13–14)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Robbins 1934: why are falling costs of Young's type incompatible with the supply curve?", "b": "They arise from many industries developing together and from vertical disintegration of industries (pp. 14–15)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Cloze: For Robbins (1934), short and long period theory 'explain {{c1::different sections of the same process}}'.", "b": "different sections of the same process (p. 17)."}, {"id": "48", "who": "Robbins 1934", "g": "D2", "f": "Where and when was Robbins's 'Theory of Costs' first delivered?", "b": "Lecture to the Nationalökonomische Gesellschaft, Vienna, 7 April 1933. Published EJ March 1934."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Kaldor (1934): which factor is 'fixed' for the firm even in the long run?", "b": "Co-ordinating ability — the managerial function of deciding which contracts to make, which must 'pass through a single brain'."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "How does Kaldor (1934) define a firm 'for theoretical purposes'?", "b": "A 'productive combination possessing a given unit of co-ordinating ability' (p. 69)."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Kaldor 1934: three meanings of the 'entrepreneurial function'?", "b": "(1) uncertainty-bearing; (2) management, split into (a) supervision and (b) co-ordination. Only co-ordination has fixed supply to the firm."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Why can't indivisibilities limit firm size under perfect competition (Kaldor 1934)?", "b": "With all factors variable, costs fall to a minimum and may rise over a range, but they fall again to the same minimum at larger outputs, so size is not limited."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Why can't external diseconomies limit firm size (Kaldor 1934)?", "b": "By definition they affect all firms equally, so they explain rising industry costs but not why one firm's costs rise relative to the industry's."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Cloze: Kaldor 1934 concludes that long-period static equilibrium and {{c1::perfect competition}} are incompatible assumptions.", "b": "perfect competition"}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Why is co-ordination 'essentially dynamic' for Kaldor?", "b": "It is required only so long as adjustments are needed; in Marshall's stationary state it becomes a free good and the optimum firm size becomes infinite or indeterminate."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Which paper argued that the representative firm was a 'Hilfskonstruktion' fitted to the industry supply curve, firm equilibrium being made to depend on industry equilibrium?", "b": "Kaldor, 'The Equilibrium of the Firm', EJ March 1934."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "Date card: Kaldor's 'The Equilibrium of the Firm' — journal and date?", "b": "Economic Journal, March 1934 (vol. 44, pp. 60–76)."}, {"id": "49", "who": "Kaldor 1934", "g": "E", "f": "What does Kaldor (1934) say about the practical importance of co-ordination-driven indeterminacy?", "b": "Insignificant compared with instability from the monetary system, price rigidities and international trade — like ship ripples absorbed by waves."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "What is the 'adding-up problem' discussed in Robinson 1934 (Euler)?", "b": "Whether paying each factor its marginal product exactly exhausts the total product, leaving no residue for or deficit to the entrepreneur."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "Robinson 1934 (Euler): relation between profits and returns to the firm under perfect competition?", "b": "Profits are zero, positive or negative according as physical returns are constant, diminishing or increasing."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "According to Robinson, what was Wicksteed's 'subtle' error?", "b": "Defining factors so finely (each plough a factor) to rule out increasing returns that indivisible factors made marginal productivity undefinable."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "Cloze: Robinson says Marshall and Hobson were each right in what they {{c1::assert}}, and wrong in what they {{c2::deny}}.", "b": "assert / deny"}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "Robinson 1934: how is the entrepreneur's marginal product to the industry measured?", "b": "Output of one firm minus what its hired factors would produce if dispersed among the other firms — equal to the firm's receipts minus cost of hired factors."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "Robinson 1934: under imperfect competition with constant physical returns to the industry, do entrepreneurs get more or less than their marginal physical product?", "b": "More — hired factors get less than MPP valued at price, so firms are 'uneconomically small'."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "How does Robinson's Euler paper define perfect competition (p. 405 n.)?", "b": "Infinite elasticities of demand and of factor supplies for a single firm — 'no reference to free entry … or normal profits'."}, {"id": "50", "who": "Robinson 1934", "g": "E", "f": "Which 1935 article took Robinson's Euler result as its starting point on entrepreneurial income?", "b": "Kahn, 'Some Notes on Ideal Output' (#59), EJ March 1935."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Robinson 1941: what is the proper value-theory question about supply price?", "b": "How supply reacts to a transfer of demand to one commodity from others, not to a net increase in demand (p. 2)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Why does Robinson (1941) call Marshall's supply-curve problem 'queer'?", "b": "Demand for one good rises with no fall elsewhere. With full employment that presupposes more resources: 'cart before the horse' (p. 2)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Robinson 1941: in what unit is supply price measured?", "b": "A composite unit of resources: factors weighted by their proportions in industry as a whole (p. 5)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Robinson 1941: why does any commodity (with unaverage factor needs) show rising supply price?", "b": "Expanding its output 'turns the relative factor prices against itself' (p. 5)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Robinson 1941: the four influences on the strength of rising supply price?", "b": "Industry's share of factors; idiosyncrasy of its factor needs; low elasticity of substitution; inelastic total supply of its factors (pp. 5–7)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Robinson 1941: which Pigou concept matches falling supply price from relative factor prices?", "b": "'Decreasing supply price simpliciter', not decreasing supply price 'from the standpoint of the community' (p. 7)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Robinson 1941: the 'logical distinction' replacing natural vs man-made factors?", "b": "Rare vs common, cranky vs adaptable, less vs more elastic in supply (p. 8)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Cloze: Robinson 1941: 'In order to know anything it is necessary to know {{c1::everything}}'.", "b": "everything (p. 8)."}, {"id": "51", "who": "Robinson 1941", "g": "D2", "f": "Date and journal of Robinson's 'Rising Supply Price'?", "b": "Economica (new series), February 1941, pp. 1–8."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Shove 1942: what is the 'analytical backbone' of Marshall's Principles?", "b": "A completion and generalisation, by mathematics, of Ricardo's theory of value and distribution as expounded by Mill (pp. 294–5)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Shove 1942: whose 'synthesis' interpretation of Marshall does he reject?", "b": "That Marshall synthesised Ricardo–Mill with Jevons and the Austrians (e.g. Whittaker 1940, Gray) (pp. 295–6)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Shove 1942: Marshall's three expedients for reconciling increasing returns with competition?", "b": "External economies; imperfection of the market; the representative firm (the shift of advantage between firms through luck and the waxing and waning of managers) (p. 304)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Shove 1942: the three epochs of English political economy?", "b": "Classical, Ricardian, and Marshallian or 'reformed-Ricardian' (p. 313)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Shove 1942: which sixth-edition change 'knocks away' the main prop of the competition/increasing-returns reconciliation?", "b": "Rewording 'trees of the forest' to past tense: joint-stock companies 'often stagnate, but do not readily die' (p. 321)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Cloze: Shove 1942: the marginal revenue curve is 'no more than a {{c1::geometrical version}} of Marshall's algebra'.", "b": "geometrical version (p. 322)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Shove 1942: which territory does Marshall's pure theory fail to cover?", "b": "Between atomic competition and absolute monopoly: domination by a few large units ('oligopoly') and complex controls (pp. 320, 322)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Which Marshall epigram does Shove 1942 say 'carries its date on its face'?", "b": "'The Mecca of the economist lies in economic biology rather than in economic dynamics' (p. 312)."}, {"id": "52", "who": "Shove 1942", "g": "D2", "f": "Occasion and date of Shove's 'The Place of Marshall's Principles'?", "b": "Centenary of Marshall's birth. Economic Journal, December 1942, pp. 294–329."}, {"id": "53", "who": "Kaldor 1934", "g": "E", "f": "Kaldor's 1934 review: two things Robinson's book omits that are central to imperfect markets?", "b": "Duopoly (interaction of rivals' policies and anticipations) and marketing costs."}, {"id": "53", "who": "Kaldor 1934", "g": "E", "f": "Cloze: Kaldor said Robinson's book 'inevitably becomes a {{c1::treatise on monopoly}}'.", "b": "treatise on monopoly"}, {"id": "53", "who": "Kaldor 1934", "g": "E", "f": "Kaldor 1934 review: which part of Robinson's book is 'unquestionably the most valuable'?", "b": "Books VII–IX extending marginal productivity distribution theory to monopoloid situations (exploitation)."}, {"id": "53", "who": "Kaldor 1934", "g": "E", "f": "Kaldor 1934: why is monopsonistic exploitation worse than monopolistic?", "b": "It distorts factor proportions, causing technical wastage; it can be countered by collective bargaining making labour supply horizontal to the firm."}, {"id": "53", "who": "Kaldor 1934", "g": "E", "f": "Kaldor's 'imagined demand curve' first appears in which 1934 review?", "b": "His Economica review (Aug 1934) of Robinson's Economics of Imperfect Competition."}, {"id": "54", "who": "Schumpeter (and Nichol) 1934", "g": "E", "f": "Schumpeter 1934: why does perfect competition remain fundamental in theory?", "b": "Because of properties characteristic of it — not because facts conform to it or because it is desirable; it is a background for comparison (and the avenue to a theory of planning)."}, {"id": "54", "who": "Schumpeter (and Nichol) 1934", "g": "E", "f": "Schumpeter's 'single formula' for price in all cases (from Robinson's MR)?", "b": "Price = marginal revenue × e/(e − 1)."}, {"id": "54", "who": "Schumpeter (and Nichol) 1934", "g": "E", "f": "Cloze: Schumpeter judged Robinson's book '{{c1::Marshallian}} to the core'.", "b": "Marshallian"}, {"id": "54", "who": "Schumpeter (and Nichol) 1934", "g": "E", "f": "Which reviewer said Robinson's 'sensible manner' assumption defines ignotum per ignotius?", "b": "Schumpeter, JPE April 1934."}, {"id": "54", "who": "Schumpeter (and Nichol) 1934", "g": "E", "f": "Nichol's 1934 review: what method does he say 'A World of Monopolies' needs?", "b": "Calculus and simultaneous equations (as Walras and Pareto used), not plane geometry."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Which 1934 QJE paper argued Chamberlin's oligopoly theorem rests on costless production?", "b": "A. J. Nichol, 'Professor Chamberlin's Theory of Limited Competition' (Feb 1934)."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Chamberlin's oligopoly theorem as stated by Nichol?", "b": "If competition is limited to a far-sighted few, price tends to the pure monopoly level — by independent action, not combination."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Nichol 1934: under which cost conditions does Chamberlin's result still hold?", "b": "Costless production, constant total costs, constant unit costs, or increasing costs identical for each competitor."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Nichol 1934: duopoly vs monopoly price with decreasing variable costs?", "b": "Duopoly price is higher (24 vs 20 in Table I): a monopoly concentrates output in one plant; duopolists each maximise on half the market."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Nichol 1934: duopoly vs monopoly price with unequal increasing costs?", "b": "Lower (26 vs 28): the efficient firm prefers 26 and can force the less efficient rival to follow its cut."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Cloze: Nichol argues Cournot's duopoly theory is intelligible only if {{c1::buyers}} name prices, Edgeworth's only if {{c2::sellers}} do.", "b": "buyers / sellers"}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Nichol 1934: under limited competition with unequal increasing costs, are total profits higher or lower than under monopoly?", "b": "Lower (12,000 vs 13,500); the efficient firm loses, the inefficient firm gains."}, {"id": "55", "who": "Nichol 1934", "g": "E", "f": "Nichol's overall verdict on Chamberlin's book?", "b": "Its duopoly conclusion holds only in special cases, but its terminology and technique are of 'permanent importance'."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Harrod 1934: why can a source under perfect competition never be in a range of decreasing costs?", "b": "If unit n+1 costs less and sells at no lower price, producing it is more profitable still, so output expands into rising costs."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Harrod 1934: the long-period cost curve is the ___ of short-period curves, not the locus of their minima.", "b": "Envelope (agreeing with Viner's draughtsman)."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Harrod 1934: two possible long-period equilibria under imperfect competition?", "b": "(1) Optimum lay-out with excess profits, entrants deterred by needing large price concessions; (2) standard profits with tangency, sub-optimal lay-out worked below capacity."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Define Harrod's 'standard rate of profit'.", "b": "The lowest rate that is an adequate inducement for the firm to invest in fixed equipment."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Cloze: Harrod (1934) likens a finite elasticity of demand of 3 to a tariff of {{c1::50}} per cent ad valorem.", "b": "50 (and elasticity 6 to a 20 per cent tariff)"}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Why, for Harrod 1934, does equating MR across uses fail to achieve the optimum?", "b": "Price measures marginal utility; MR is below price, so equi-marginal revenue gives equi-marginal utility only if elasticities are equal."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Harrod 1934: effect of trade unions on factor-market imperfection?", "b": "Collective bargaining makes the labour market 'more perfect' by giving each firm a constant supply price, improving resource allocation."}, {"id": "56", "who": "Harrod 1934", "g": "E", "f": "Harrod 1934 trade cycle point?", "b": "Decreasing-cost industries make the equilibrium of total output unstable; Pigou's argument assumes increasing costs; the psychological theory then needs no persistent error."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Robinson (1934) defines perfect competition as…?", "b": "A state of affairs in which the demand for the output of an individual seller is perfectly elastic — nothing about free entry or normal profits."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Which two notions does Robinson 1934 say are wrongly 'lumped together' as perfect competition?", "b": "(1) A single seller cannot influence price; (2) a single seller cannot earn more than normal profits."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "What are 'normal profits' in Robinson 1934?", "b": "'Simply the supply price of entrepreneurship to a particular industry' — profits at which the number of firms shows no tendency to change."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Why does Robinson call Chamberlin's pure/perfect distinction misleading?", "b": "It 'pays a verbal tribute to the old confusion'; she would call 'perfect' what he calls 'pure' and make theorists state any further assumptions explicitly."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f
