<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>REFEREE · Competition &amp; Cost</title>
<style>
:root{--bg:#1e1e2e;--fg:#cdd6f4;--dim:#8a90aa;--acc:#f9e2af;--ok:#a6e3a1;--err:#f38ba8;--info:#89dceb;--bar:#313244;--barfg:#cdd6f4;--cbg:#11111b;--cfg:#f38ba8;--glow:none;--frame:transparent;--fw:0px;--bgimg:none;
  --font:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:var(--bgimg);color:var(--fg);font:15px/1.5 var(--font);text-shadow:var(--glow);overflow:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.2;display:none}
[data-fx~=matrix] #rain{display:block}
#win{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;border:var(--fw) solid var(--frame)}
#bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bar);color:var(--barfg);padding:6px 12px;font-size:13px;text-shadow:none;flex-wrap:wrap}
#bar .l{display:flex;gap:10px;align-items:center;min-width:0}
.dots{display:none;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
[data-chrome=mac] .dots{display:flex}
.wbtn{display:none;letter-spacing:.5em;padding-left:6px}[data-chrome=win] .wbtn{display:inline}
#ttl{white-space:pre;overflow:hidden;text-overflow:ellipsis}
#bar .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar select,#bar button{font:12px var(--font);background:transparent;color:inherit;border:1px solid currentColor;border-radius:3px;padding:2px 7px;cursor:pointer;opacity:.9}
#bar select option{color:#111;background:#fff}
#screen{flex:1;overflow-y:auto;padding:14px 16px 30px;cursor:text;scrollbar-color:var(--dim) transparent}
[data-upper] #screen{text-transform:uppercase}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.say{padding-left:10ch;text-indent:-10ch}.say.cont{text-indent:0}
.who{color:var(--info);font-weight:700}
.acc,.ln b{color:var(--acc);font-weight:700}
.dim{color:var(--dim)}.err{color:var(--err)}.ok{color:var(--ok)}.info{color:var(--info)}
.hd{display:table;background:var(--fg);color:var(--bg);padding:0 1ch;font-weight:700;margin:1.2em 0 .4em;text-shadow:none}
.hd2{color:var(--acc);font-weight:700;margin-top:.8em;border-top:1px dashed var(--dim);padding-top:.5em}
.q{font-weight:700}.opt{padding-left:2ch}
.more{color:var(--dim)}
pre.fig{font:inherit;font-size:min(1em,2.5vw);line-height:1.2;margin:.7em 0;color:var(--fg);overflow-x:auto;overflow-y:hidden;white-space:pre}
pre.fig i{font-style:normal}pre.fig .m{color:var(--acc)}pre.fig .g{color:var(--ok)}pre.fig .r{color:var(--err)}
#inl{white-space:pre-wrap;word-break:break-word}
#ps1 i,.ln i{font-style:normal}
#ps1 .u,.ln .u{color:var(--ok);font-weight:700}#ps1 .p,.ln .p{color:var(--info);font-weight:700}#ps1 .a,.ln .a{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.1em;background:currentColor;vertical-align:text-bottom;margin-left:1px;animation:blink 1.06s steps(1) infinite;box-shadow:var(--glow)}
[data-cur=under] .cur{height:.2em;vertical-align:baseline}
[data-cur=bar] .cur{width:2px}
body.typing .cur{animation:none}
@keyframes blink{50%{opacity:0}}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#chips button,.box button{font:inherit;font-size:.9em;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:3px;padding:3px 10px;cursor:pointer;text-shadow:inherit;text-transform:inherit}
#chips button:hover,.box button:hover,.box button.on{background:var(--fg);color:var(--bg);text-shadow:none}
#status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ok);color:var(--bg);padding:2px 10px;font-size:12.5px;text-shadow:none;font-weight:700}
#status .e{background:var(--err);padding:0 4px}
#ghostf{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0}
#ghost{font-size:16px;width:200px}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
[data-fx~=crt] #fx{display:block}
#crash{position:fixed;inset:0;background:var(--cbg);color:var(--cfg);padding:10vh 8vw;white-space:pre-wrap;font-size:clamp(13px,2vw,18px);z-index:9;text-shadow:none;cursor:pointer}
#crash[hidden]{display:none}
.panel{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px;text-shadow:none}
.box{background:var(--bg);color:var(--fg);border:2px solid var(--fg);box-shadow:8px 8px 0 rgba(0,0,0,.55);width:min(720px,100%);max-height:90vh;max-height:90dvh;overflow:auto;padding:0 16px 16px}
.box h2{font:inherit;font-weight:700;background:var(--fg);color:var(--bg);margin:0 -16px 12px;padding:3px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
.box h2 button{border:0;color:var(--bg);padding:0 6px}.box h2 button:hover{background:var(--bg);color:var(--fg)}
.box h3{font:inherit;font-weight:700;color:var(--acc);margin:14px 0 6px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.prow input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.lvl button{border:0!important;padding:0 1px!important;font-size:1.3em!important;line-height:1;color:var(--acc)!important;background:none!important}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--dim)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.sw button{text-align:left;padding:8px 10px!important;border-width:2px!important;font-size:.9em;text-transform:none!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw button.cur-t{outline:3px solid var(--acc);outline-offset:1px}
.shake{animation:shake .45s}
@keyframes shake{10%{transform:translate(-6px,2px)}25%{transform:translate(5px,-3px);filter:hue-rotate(40deg) contrast(1.4)}40%{transform:translate(-4px,3px)}60%{transform:translate(4px,1px);filter:invert(.15)}80%{transform:translate(-2px,-1px)}}
@media (max-width:600px){body{font-size:13px}#screen{padding:10px 12px 24px}#status{font-size:11px}#ttl{display:none}}
@media (prefers-reduced-motion:reduce){.cur,.shake{animation:none}}
.figw{margin:.7em 0}.figw pre.fig{margin:0}
.pp{font:inherit;font-size:.78em;color:var(--dim);background:none;border:1px solid var(--dim);border-radius:3px;padding:0 8px;margin-top:4px;cursor:pointer;text-transform:none;text-shadow:none}
.pp:hover{color:var(--bg);background:var(--fg)}
.chrow{display:grid!important;grid-template-columns:2.5ch 1fr auto;gap:10px;width:100%;text-align:left;margin:3px 0;white-space:normal!important}
.box button.chrow.on{outline:2px solid var(--acc)}div.chrow.off{color:var(--dim);padding:3px 10px;font-size:.9em}
#sheet{display:none}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}#screen{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#bar{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
#status{padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))}
#dock{display:flex;flex-direction:column;gap:8px;padding:8px 12px;border-top:1px dashed var(--dim);max-height:50vh;overflow-y:auto;text-shadow:none}#dock:empty{display:none}
#dock button{font:inherit;font-size:.9em;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:4px;padding:3px 10px;cursor:pointer;text-transform:inherit;user-select:none;-webkit-user-select:none}
#dock button:hover{background:var(--fg);color:var(--bg)}#dock button:disabled{opacity:.22;pointer-events:none}
#dock .go{border-color:var(--ok);color:var(--ok);font-weight:700}#dock .kb{color:var(--dim)}#dock .tile.bad{background:var(--err);color:var(--bg)}
.tiles,.ctl,.chiprow{display:flex;flex-wrap:wrap;gap:8px}.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:440px}.numpad .go{grid-column:span 3}
.opt.tap{cursor:pointer}.opt.tap:hover{color:var(--acc)}
body.touch #dock button{min-height:44px;padding:8px 14px;font-size:16px}body.touch .numpad button{min-height:50px;font-size:20px}body.touch .opt.tap{border:1px solid var(--dim);border-radius:5px;padding:8px 10px;margin:6px 0}
body.touch .pp{min-height:34px;padding:4px 14px;font-size:.9em}body.touch .box button{min-height:42px}body.touch #bar button{min-height:34px;padding:4px 10px;font-size:14px}
@media (max-width:700px){#bTheme,#sSpeed,#sDiff,#bSound{display:none}}
@media print{html,body{height:auto;overflow:visible;background:#fff}#win,#fx,#rain,.panel,#crash,#ghostf{display:none!important}#sheet{display:block;color:#000;font:11pt/1.4 Georgia,serif;text-shadow:none;padding:0 6mm}#sheet h1{font-size:17pt}#sheet h2{font-size:13pt;border-bottom:1px solid #000;margin-top:14pt}#sheet pre{font:9.5pt/1.35 Menlo,Consolas,monospace;white-space:pre-wrap}#sheet li{margin-bottom:5pt;break-inside:avoid}#sheet dt{font-weight:700}#sheet dd{margin:0 0 5pt 0}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="win">
  <div id="bar"><div class="l"><span class="dots"><i></i><i></i><i></i></span><span id="ttl"></span></div>
    <div class="r"><button id="bBook" aria-label="Choose volume"></button><button id="bSet" aria-label="Settings">≡ settings</button><button id="bTheme" aria-label="Choose terminal"></button><select id="sSpeed" aria-label="Typing speed"><option value="slow">slow</option><option value="normal">normal</option><option value="fast">fast</option><option value="instant">instant</option></select><select id="sDiff" aria-label="Difficulty"><option value="chill">chill</option><option value="normal">normal</option><option value="hardcore">hardcore</option></select><button id="bSound" aria-label="Sound menu"></button><span class="wbtn">─□✕</span></div></div>
  <div id="screen"><div id="out"></div><div id="inl" hidden><span id="ps1"></span> <span id="typed"></span><span id="wc"></span></div></div>
  <div id="dock"></div>
  <div id="status"></div>
</div>
<form id="ghostf"><input id="ghost" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input"></form>
<div id="fx"></div><div id="crash" hidden></div><div id="sheet"></div>
<script>
/* ================= helpers (shared by the page and the content validator) ================= */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b,step=1)=>a+step*Math.floor(Math.random()*(Math.floor((b-a)/step)+1));
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmt2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=1)=>(+n).toFixed(d)+'%';
const rep=(c,n)=>n>0?c.repeat(Math.round(n)):'';
const padE=(s,n)=>String(s).padEnd(n),padS=(s,n)=>String(s).padStart(n);
const bar=(v,max,w)=>{const k=Math.max(0,Math.min(w,Math.round(v/max*w)));return rep('█',k)+rep('░',w-k)};
const rot=(s,k)=>{k=((k%s.length)+s.length)%s.length;return s.slice(k)+s.slice(0,k)};
const lane=(pat,len,k)=>rot(pat.repeat(Math.ceil(len/pat.length)+1),k).slice(0,len);
const pts=(P,x)=>{if(x<=P[0][0])return P[0][1];for(let k=1;k<P.length;k++)if(x<=P[k][0]){const a=P[k-1],b=P[k];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return P[P.length-1][1]};
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim();
const num=s=>{s=String(s==null?'':s).toLowerCase().replace(/[$,%\s]/g,'');let m=1;if(/k$/.test(s)){m=1000;s=s.slice(0,-1)}else if(/m$/.test(s)){m=1e6;s=s.slice(0,-1)}const v=parseFloat(s);return isNaN(v)?NaN:v*m};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const arg=(a,i,d)=>{const v=num(a&&a[i]);return isNaN(v)?d:v};
const words=s=>String(s==null?'':s).trim().split(/\s+/).filter(w=>/[a-z0-9]/i.test(w)).length;
// numeric marking: within tol (default 0.6%); a trailing k/m suffix is also accepted as plain units ("4.5m" for an answer in $ millions)
const numOK=(str,a,tol)=>{const near=x=>!isNaN(x)&&Math.abs(x-a)<=Math.max(Math.abs(a)*(tol||.006),.006);return near(num(str))||near(parseFloat(String(str).replace(/[$,%\s]/g,'')))};
/* question builders */
const mc=(q,o,why)=>({t:'mc',q,o,why}),tf=(q,a,why)=>({t:'tf',q,a,why}),fill=(q,a,why)=>({t:'fill',q,a,why}),nm=(q,a,why,u,tol)=>({t:'num',q,a,why,u,tol});
const sa=(q,m,k,need)=>({t:'sa',q,m,k,need});
const gradeSA=(it,ans)=>{const a=' '+norm(ans)+' ';return it.k.filter(g=>g.some(s=>{const k=norm(s);return k&&a.includes(k)})).length>=(it.need||it.k.length)};
/* the book */

/* ================= figure templates: data in, looping animation out =================
   Every figure is {n, fps, hold, intro?, reset?, r(i)} where r(i) returns the text for frame i (0..n).
   Keep every line <= 56 characters. */
const FW=54;
const TPL={
 // bars({title,rows:[[label,value,text?]],max?,note?,seq?})  bars grow; text shown at the end of each bar
 bars:o=>{const R=o.rows,mx=o.max||Math.max(...R.map(r=>Math.abs(r[1])))||1,lw=Math.max(...R.map(r=>String(r[0]).length))+1,sf=R.map(r=>r[2]!=null?String(r[2]):String(r[1])),sw=Math.max(...sf.map(s=>s.length)),bw=Math.max(4,Math.min(o.w||26,FW-3-lw-sw)),N=o.seq?R.length*6:12;
   return{n:N,fps:o.fps||12,hold:o.hold==null?3200:o.hold,r:i=>{const L=o.title?[' '+o.title]:[];R.forEach((r,k)=>{const p=o.seq?Math.max(0,Math.min(1,(i-k*6)/6)):i/12,len=Math.max(p>0&&r[1]?1:0,Math.round(Math.abs(r[1])/mx*bw*p));L.push(' '+padE(r[0],lw)+padE(rep('█',len),bw)+' '+(p>=1?sf[k]:''))});L.push(o.note&&i>=N?' '+o.note:'');return L.join('\n')}}},
 // morph({title,rows:[[label,from,to,suffix|fn]],max?,capA,capB})  bars slide between two states, back and forth
 morph:o=>{const R=o.rows,mx=o.max||Math.max(...R.flatMap(r=>[r[1],r[2]]))||1,lw=Math.max(...R.map(r=>String(r[0]).length))+1,bw=Math.max(6,Math.min(o.w||22,FW-14-lw)),N=24,show=(r,v)=>typeof r[3]==='function'?r[3](v):Math.round(v)+(r[3]||'');
   return{n:N*2,fps:o.fps||9,hold:0,intro:N,r:i=>{const p=i<=N?i/N:(2*N-i)/N,e=p<.2?0:p>.8?1:(p-.2)/.6,L=o.title?[' '+o.title]:[];R.forEach(r=>{const v=r[1]+(r[2]-r[1])*e;L.push(' '+padE(r[0],lw)+bar(v,mx,bw)+' '+show(r,v)+(e>0&&e<1&&r[2]!==r[1]?(r[2]>r[1]?' ▲':' ▼'):''))});L.push(' '+(e<.5?(o.capA||''):(o.capB||'')));return L.join('\n')}}},
 // steps({title,lines:[...]})  lines appear one at a time with a marker: chains of cause and effect, worked calculations
 steps:o=>{const ls=o.lines,N=ls.length;return{n:N,fps:o.fps||1.1,hold:o.hold==null?3600:o.hold,r:i=>{const L=o.title?[' '+o.title]:[];ls.forEach((l,k)=>L.push(i>=N||k<i?'   '+l:k===i?' ▶ '+l:''));return L.join('\n')}}},
 // chain({title,nodes:[...],caps:[...],end?,token?})  a token hops along a row of boxes, one caption per stop
 chain:o=>{const nd=o.nodes,sep=o.sep||' ─▶ ',N=nd.length,pos=[];let x=1;nd.forEach(s=>{pos.push(Math.max(0,x+Math.floor(s.length/2)-1));x+=s.length+sep.length});const tk=o.token||'(*)';
   return{n:N*2,fps:o.fps||1.5,hold:o.hold==null?3400:o.hold,r:i=>{const s=Math.min(N-1,Math.floor(i/2)),L=o.title?[' '+o.title]:[];L.push(' '+nd.join(sep),rep(' ',pos[s])+tk);(o.caps||[]).forEach((c,k)=>L.push(k<=s?' '+c:''));if(o.end)L.push(i>=N*2?' '+o.end:'');return L.join('\n')}}},
 // lanes({left:[...],mid:'BANK',right:[...],sym:'$',lh,mh,rh,note})  things flow from the left, through the middle, to the right
 lanes:o=>{const A=o.left,B=o.right,sym=o.sym||'$',n=Math.max(A.length,B.length),lw=Math.max(...A.map(s=>s.length),(o.lh||'').length),mid=o.mid||'BANK',mw=Math.max(8,mid.length+2),rw=Math.max(...B.map(s=>s.length)),ln=Math.max(5,Math.floor((FW-5-lw-mw-rw)/2)),pat=sym+'────';
   return{n:40,fps:12,hold:0,r:i=>{const a=k=>lane(pat,ln,-(i+k*2))+'▶',L=[' '+padE(o.lh||'',lw+ln+2)+padE(o.mh||'',mw+2)+' '+(o.rh||''),' '+rep(' ',lw+ln+2)+'┌'+rep('─',mw)+'┐'];
    for(let k=0;k<n;k++){const m=k===Math.floor((n-1)/2)?mid:'',pl=Math.floor((mw-m.length)/2);L.push(' '+padE(A[k]||'',lw)+' '+(A[k]?a(k):rep(' ',ln+1))+'│'+rep(' ',pl)+m+rep(' ',mw-pl-m.length)+'│'+(B[k]?a(k+1)+' '+B[k]:''))}
    L.push(' '+rep(' ',lw+ln+2)+'└'+rep('─',mw)+'┘');if(o.note)L.push(' '+o.note);return L.join('\n')}}},
 // taccount({title,frames:[{cap,A:[[name,value]],L:[[name,value]]}],money?:false})  a balance sheet that changes step by step; changed lines get a *
 taccount:o=>{const F=o.frames,cw=24,f$=o.money===false?(v=>v.toLocaleString('en-US')):fmt,mr=Math.max(...F.map(f=>Math.max(f.A.length,f.L.length)));
   const side=(rows,prev)=>rows.map(([n,v],k)=>{const ch=prev&&(!prev[k]||prev[k][1]!==v||prev[k][0]!==n);return padE(n,cw-11)+padS(typeof v==='number'?f$(v):v,10)+(ch?'*':' ')}),tot=rows=>rows.every(r=>typeof r[1]==='number')?rows.reduce((s,r)=>s+r[1],0):null;
   return{n:F.length-1,fps:o.fps||.4,hold:o.hold==null?4500:o.hold,r:i=>{const f=F[i],p=i?F[i-1]:null,A=side(f.A,p&&p.A),B=side(f.L,p&&p.L),L=o.title?[' '+o.title]:[];L.push(' '+padE('ASSETS',cw)+' │ LIABILITIES');
    for(let k=0;k<mr;k++)L.push(' '+padE(A[k]||'',cw)+' │ '+(B[k]||''));const ta=tot(f.A),tb=tot(f.L);L.push(' '+rep('─',cw)+'─┼─'+rep('─',cw));if(ta!=null&&tb!=null)L.push(' '+padE(padE('Total',cw-11)+padS(f$(ta),10),cw)+' │ '+padE('Total',cw-11)+padS(f$(tb),10));
    L.push(' '+(F.length>1?`${i+1}/${F.length}: `:'')+(f.cap||''));return L.join('\n')}}},
 // plot({title,xl,yl,xr:[a,b],yr:[a,b],curves:[{f:x=>y | pts:[[x,y]],ch,name}],shift?:{curve:idx,to:{f|pts},cap},eq?:[i,j],eqf?,cap?})
 //   draws curves left to right; optionally shifts one curve (its old position stays as dots) and marks the crossing point with ●
 plot:o=>{const W=o.W||40,H=o.H||9,[x0,x1]=o.xr||[0,1],[y0,y1]=o.yr||[0,1],C=o.curves,D=22,Sh=o.shift?18:0,yv=(c,x)=>c.f?c.f(x):pts(c.pts,x),yf=o.yf||(v=>String(+v.toFixed(2)));
   const val=(k,x,t)=>{let y=yv(C[k],x);if(t>0&&o.shift&&k===o.shift.curve)y+=(yv(o.shift.to,x)-y)*t;return y},row=y=>H-1-Math.round((y-y0)/(y1-y0)*(H-1));

mption in favour of the state (context)", "J. B. Clark, Philosophy of Wealth (cited on business moral dualism)"], "answered_by": ["#04 Hadley 1886 (already uses Adams's 'law of the increasing return', p. 40)", "#08 Marshall 1890 (public control of 'indivisible' industries, but not state management)"], "journal": "Publications of the American Economic Association", "id": "07"}, {"author": "Marshall", "year": 1890, "title": "Some Aspects of Competition (Presidential Address, Section F, British Association, Leeds 1890)", "group": "A", "hook": "Marshall: competition vs combination is a 'false antithesis'; publicly control indivisible industries, but don't let the state run them.", "claim": "Combinations will be permanent and mixed in effect, so economists must analyse rather than denounce them; the competition/combination antithesis is false, indivisible industries need public control but private management, and independent firms' inventiveness is competition's chief service.", "responds_to": ["Older English economists' dogmatism on Protection in new countries (List, Carey, Mill's infant-industry concession; Patten rejected) (context)", "American trust movement and a Congressional committee report (context)", "Senator Sherman's bill, passed by the Senate 8 April 1890 (context)", "German state socialism and 'younger American economists' under German influence (unnamed; cf. #07 Adams, context)", "Baker, Monopolies and the People; Rae; Foxwell (context)"], "answered_by": ["#12 Bullock 1901 (quotes Marshall on monopoly's bargaining and on central responsibility vs individual energy)"], "journal": "Journal of the Royal Statistical Society", "id": "08"}, {"author": "Taussig", "year": 1891, "title": "A Contribution to the Theory of Railway Rates", "group": "C", "hook": "Railway rate 'anomalies' are joint-cost pricing, like wool and mutton, not Cohn's ethics of ability-to-pay.", "claim": "Because most railway costs are joint across traffic with demands of differing intensity, classification and 'charging what the traffic will bear' follow from ordinary joint-cost value theory, not from an ethical (ability-to-pay) principle.", "responds_to": ["Gustav Cohn, Englische Eisenbahnpolitik 1883 (taxation / Leistungsfähigkeit view; summarised in text)", "Hadley, Railroad Transportation (fixed charges; discrimination) (context)", "Seligman and the ICC on 'value of service'", "Mill, Principles Bk III ch. xvi on joint cost"], "answered_by": ["Pigou, Wealth and Welfare 1912 ch. xii (context, not in folder)", "#17 Taussig 1913 (his own defence)", "#18 Pigou 1913", "#19 Edgeworth 1915 (sides with Pigou)"], "journal": "Quarterly Journal of Economics", "id": "09"}, {"author": "Fisher", "year": 1898, "title": "Cournot and Mathematical Economics", "group": "B", "hook": "Fisher hails Cournot as founder of mathematical economics but faults his duopoly, tariff and 'social income' reasoning.", "claim": "Cournot's 1838 Recherches founded mathematical economics and its price theory remains largely unsuperseded, but his duopoly assumption is unrealistic, his tariff result a mathematical blunder, and his social-income chapters vitiated by lacking consumers' rent.", "responds_to": ["Cournot, Recherches 1838, in N. T. Bacon's 1897 translation (context)", "Bertrand 1883 (context)", "Edgeworth, Giornale degli Economisti 1897 (context)"], "answered_by": ["#15 Moore 1906 (cites Fisher p. 126)", "#14 Moore 1905", "#20 Edgeworth 1922 (continues anti-Cournot duopoly line)"], "journal": "Quarterly Journal of Economics", "id": "11"}, {"author": "Bullock", "year": 1901, "title": "Trust Literature: A Survey and a Criticism", "group": "A", "hook": "Bullock: separate large-scale production from monopoly. If trusts really were superior, potential competition could never protect consumers.", "claim": "Surveying 1897–1900 trust writing, Bullock argues that trusts are monopolies whose claimed economies over large independent firms are slight, that 'ruinous competition' is largely caused by tariffs and tax laws, and that belief in trust superiority is incompatible with relying on potential competition.", "responds_to": ["Jenks, The Trust Problem; Ely, Monopolies and Trusts; Collier; von Halle; Baker; Gunton; Dodd (context)", "US Industrial Commission 1900 (context)", "Hadley's Economics 1896 and later articles (the line from #04)", "J. B. Clark's later papers on potential competition (the line from #05)", "#08 Marshall 1890 (quoted)", "Taussig on iron prices and the tariff, QJE vol. 14 (context)"], "answered_by": [], "journal": "Quarterly Journal of Economics", "id": "12"}, {"author": "Pigou", "year": 1904, "title": "Monopoly and Consumers' Surplus", "group": "B", "hook": "Pigou asks how monopolists seize consumers' surplus: discriminate, sell only in fixed parcels, or squeeze out rivals.", "claim": "Because total benefit exceeds maximum monopoly revenue, monopolists can gain by attacking consumers' surplus directly (discrimination or selling in fixed parcels, which needs four rarely co-existing conditions) or indirectly (threatening to withhold supply to extrude competitors).", "responds_to": ["Marshall, Principles (monopoly revenue, consumers' surplus) (context)", "Edgeworth, Mathematical Psychics (indifference curves; indeterminate bargain) (context)", "Walras, Neumann; Hadley and Acworth on railway charging (context)"], "answered_by": ["Pigou, Wealth and Welfare 1912, degrees of discrimination (context, not in folder)", "#18 Pigou 1913 (railway rates as discriminating monopoly)", "#24 Yntema 1928 (discrimination between markets)"], "journal": "Economic Journal", "id": "13"}, {"author": "Moore", "year": 1905, "title": "The Personality of Antoine Augustin Cournot", "group": "B", "hook": "Moore's Cournot: half-blind, under-recognised, fiercely independent, winning his 'case of 1838' late and losing that of 1863.", "claim": "From Cournot's unpublished Souvenirs, Moore portrays a model scholar working under adverse conditions whose reputation lagged because of his independence, truthfulness and dislike of self-advertisement.", "responds_to": ["Cournot's unpublished Souvenirs (1859)", "Neglect of the Recherches (Walras: no French review by 1873)"], "answered_by": ["#15 Moore 1906 (uses Cournot as test case)"], "journal": "Quarterly Journal of Economics", "id": "14"}, {"author": "Moore", "year": 1906, "title": "Paradoxes of Competition", "group": "B", "hook": "Moore: 'competition' bundles five hypotheses; with few sellers, results like 'labour gets what it produces' fail.", "claim": "Perfect competition tacitly bundles five hypotheses; projecting results valid under all five onto industries with few producers produces paradoxes (Cournot vs Bertrand vs Edgeworth), so the doctrine that labour gets what it produces holds only under perfect competition.", "responds_to": ["Cournot, Recherches ch. VII and IX (context)", "Bertrand 1883 (context)", "Edgeworth, Giornale 1897 (context)", "Marshall, Principles Notes XIV and III", "#11 Fisher 1898 (cited p. 220)", "Doctrine that labour gets what it produces (context: J. B. Clark, Distribution of Wealth 1899; not named by Moore)"], "answered_by": ["#20 Edgeworth 1922 (indeterminacy restated)", "Group E imperfect competition debate (context)"], "journal": "Quarterly Journal of Economics", "id": "15"}, {"author": "Edgeworth", "year": 1911, "title": "Contributions to the Theory of Railway Rates [Part I]", "group": "C", "hook": "Edgeworth splits 'increasing returns' into marginal (primary) and average (secondary) senses, and says monopoly needs the primary.", "claim": "Treating railways as monopolised public works, Edgeworth first clarifies the laws of return: the primary (marginal) definition is the criterion of a maximum and governs monopoly and state regulation, while the secondary (average) definition suits competition and is 'even fallacious' for monopoly.", "responds_to": ["Marshall, Principles (diminishing return; external economies) (context)", "Carver, Distribution of Wealth (numerical table; secondary definition)", "Walker, Seligman, Bullock, Flux (definitions of returns)", "J. M. Clark on local discriminations and 'law of joint cost'", "Pigou, 'Producers' and Consumers' Surplus', EJ 1910 (context)"], "answered_by": ["Later instalments of this series (not in folder; one is cited as EJ XXI p. 565 in #19)", "#19 Edgeworth 1915 (applies analysis to railway joint cost, backs Pigou)", "#24 Yntema 1928 (uses the primary/marginal definition, citing Edgeworth's Papers)"], "journal": "Economic Journal", "id": "16"}, {"author": "Taussig", "year": 1913, "title": "Railway Rates and Joint Cost Once More", "group": "C", "hook": "Taussig: coal and copper transport have different demand schedules, so joint cost, not monopoly, explains classification.", "claim": "Conceding that distance-based discrimination is not a joint-cost matter, Taussig holds that different traffics over one stretch are jointly supplied and non-homogeneous in demand, and that railways' lack of monopoly revenue shows joint cost rather than monopoly explains most discrimination.", "responds_to": ["Pigou, Wealth and Welfare 1912 ch. xii 'The Special Case of Railway Rates' (context, quoted)", "#09 Taussig 1891 (restated)"], "answered_by": ["Pigou's note, QJE May 1913, and Taussig's rejoinder (not in folder; referred to in #18)", "#18 Pigou 1913", "#19 Edgeworth 1915"], "journal": "Quarterly Journal of Economics", "id": "17"}, {"author": "Pigou", "year": 1913, "title": "Railway Rates and Joint Costs (with comment by Taussig)", "group": "C", "hook": "Pigou: coal and copper transport share 'common', not 'joint', costs, so competition would equalise ton-mile rates.", "claim": "Where a railway would pay under uniform mileage rates, its services are not joint (overheads are common costs only), so competition would equalise rates per ton-mile and uniform rates should be the ICC's ideal; discrimination is justified only where a line would otherwise not pay.", "responds_to": ["#17 Taussig 1913", "Taussig's May 1913 rejoinder (not in folder; quoted 'p. 537')", "Pigou, Wealth and Welfare 1912 (context)"], "answered_by": ["Taussig's comment in the same issue (pp. 692–694)", "#19 Edgeworth 1915 (sides with Pigou, citing Fanno)"], "journal": "Quarterly Journal of Economics", "id": "18"}, {"author": "Edgeworth", "year": 1915, "title": "Recent Contributions to Mathematical Economics [Section II]", "group": "B", "hook": "Edgeworth backs Pigou: railway 'joint cost' confuses gas-and-coke with costs depending on total tons carried.", "claim": "Mathematical theory yields presumptions useful for practice; applied to railway rates, costs depending on a sum of outputs (coal plus copper tons) are the opposite of true joint production, so competitive rates tend to equal prime cost and the cost-of-service principle is a regulative rule, as Pigou argued.", "responds_to": ["Pigou, Wealth and Welfare 1912 (context)", "Quarterly Review critic (footnote ties to J. Shield Nicholson)", "#17 and #18 Pigou–Taussig QJE 1913", "Fanno on joint cost (context)"], "answered_by": [], "journal": "Economic Journal", "id": "19"}, {"author": "Edgeworth", "year": 1922, "title": "The Mathematical Economics of Professor Amoroso", "group": "B", "hook": "Reviewing Amoroso, Edgeworth again insists duopoly is indeterminate: rivals cut and jump prices forever.", "claim": "Amoroso's Cournot-style determinate duopoly equilibrium is illegitimate: monopolists free to vary price will undercut and then jump prices indefinitely, so duopoly has no determinate equilibrium.", "responds_to": ["Amoroso, Lezioni di Economia Matematica 1921 (context)", "Cournot (context)", "Pigou, Wealth and Welfare p. 193 (context)"], "answered_by": [], "journal": "Economic Journal", "id": "20"}, {"author": "Edgeworth", "year": 1925, "title": "The Revised Doctrine of Marginal Social Product", "group": "D1", "hook": "Old Edgeworth defends Pigou's anti-laissez-faire conclusion but admits treating rents as cost was an error.", "claim": "Restating Pigou's revised doctrine diagrammatically, Edgeworth upholds the case against laissez-faire under increasing returns while conceding (with Young and Clark) that rents paid to members of the community are not a cost, a correction that leaves the main result little affected.", "responds_to": ["Pigou, Economics of Welfare 2nd ed. 1924 (context)", "#26 Young 1913", "#31 Robertson 1924"], "answered_by": ["No direct reply in folder; see #33 Pigou 1927 and #35 Pigou 1928 restatements"], "journal": "Economic Journal", "id": "21"}, {"author": "Bowley", "year": 1928, "title": "Bilateral Monopoly", "group": "B", "hook": "Steel monopolist meets ore monopolist: whoever dictates the price decides the outcome; otherwise it is indeterminate.", "claim": "In bilateral monopoly the outcome depends on which side dictates the price; combination maximises joint gain at the intersection of the manufacturer's demand and supplier's offer schedules, but that price is unstable, so without collusion or arbitration there is no definite solution.", "responds_to": ["Wicksell's critique of Bowley's Mathematical Groundwork of Economics, reprinted by Schumpeter, Archiv für Sozialwissenschaft Bd 58 (context)"], "answered_by": [], "journal": "Economic Journal", "id": "23"}, {"author": "Yntema", "year": 1928, "title": "The Influence of Dumping on Monopoly Price", "group": "B", "hook": "Yntema: dumping abroad lowers home monopoly price if marginal costs fall, raises it if they rise.", "claim": "A dumping monopoly equates marginal gross revenue in each market to common marginal cost; dumping lowers the domestic price under decreasing marginal costs and raises it under increasing marginal costs, contrary to Viner's claim of no effect.", "responds_to": ["Viner, Dumping: A Problem in International Trade (context)", "Graham's review, AER 1924 (context)", "Barone (context)", "Edgeworth's primary/secondary returns (cf. #16)"], "answered_by": ["Joan Robinson's theory of price discrimination 1933 (context, not in folder)"], "journal": "Journal of Political Economy", "id": "24"}, {"author": "Young", "year": 1913, "title": "Review: Pigou's Wealth and Welfare", "group": "D1", "hook": "Young: Pigou's 'marginal supply price' counts higher land rents as cost, but rents are mere transfers.", "claim": "Pigou's curve of marginal supply prices (Young: 'curve of aggregate expenses') wrongly counts higher rents, which are transfers of purchasing power, as resources used up, so his case for taxing diminishing-return and subsidising increasing-return industries fails.", "responds_to": ["Pigou, Wealth and Welfare 1912 (context)", "Edgeworth's endorsement of Pigou (context)"], "answered_by": ["Pigou, Economics of Welfare 1920 pp. 934–6 (context)", "#30 Knight 1924 (credits Young, fn. 8)", "#31 Robertson 1924 (endorses, §11; Pigou concedes in appended reply)", "#21 Edgeworth 1925"], "journal": "Quarterly Journal of Economics", "id": "26"}, {"author": "Clapham", "year": 1922, "title": "Of Empty Economic Boxes", "group": "D1", "hook": "Historian Clapham tours a hat factory and finds he cannot put any industry in the 'returns' boxes.", "claim": "The categories of diminishing, constant and increasing returns have never been filled with actual industries, and drawing welfare and tax conclusions from such empty boxes is dangerous for a practical science.", "responds_to": ["Pigou, The Economics of Welfare 1920 (context)", "Marshall, Principles and Industry and Trade (context)"], "answered_by": ["#28 Pigou, Empty Economic Boxes: A Reply (Dec 1922)", "Clapham's rejoinder, Notes and Memoranda, Dec 1922 (context)", "#31 Robertson 1924"], "journal": "Economic Journal", "id": "27"}, {"author": "Pigou", "year": 1922, "title": "Empty Economic Boxes: A Reply", "group": "D1", "hook": "Pigou to Clapham: the boxes hold 'little cases' of elasticities, which are useful, and fillable with statistics.", "claim": "The returns categories are integral parts of value theory, useful even when empty for exposing hidden assumptions; what matters for practice are the 'little cases' of numerical elasticities, which cooperation between theorists, business experts and statisticians may fill.", "responds_to": ["#27 Clapham 1922"], "answered_by": ["Clapham's rejoinder, Notes and Memoranda, Dec 1922 (context)", "#31 Robertson 1924"], "journal": "Economic Journal", "id": "28"}, {"author": "Knight", "year": 1924, "title": "Some Fallacies in the Interpretation of Social Cost", "group": "D1", "hook": "Knight's two roads: a private owner's toll on the good road equals Pigou's ideal tax.", "claim": "Pigou's case that competition over-invests in increasing-cost industries confuses social and entrepreneurial cost: private ownership and rent stop investment at the social optimum, rents are redistributions not social costs, and decreasing cost is incompatible with competition.", "responds_to": ["Pigou, Economics of Welfare 1920, p. 194 two roads (context)", "F. D. Graham, QJE 1923 (context)", "#26 Young 1913 (credited, fn. 8)"], "answered_by": ["Pigou's concession appended to #31 (Mar 1924)", "#35 Pigou 1928 ('transfer elements')"], "journal": "Quarterly Journal of Economics", "id": "30"}, {"author": "Robertson", "year": 1924, "title": "Those Empty Boxes", "group": "D1", "hook": "David's pebbles at the giant Pigou: 'external diseconomies… who in the world are they?'", "claim": "Pigou's twin-curve apparatus runs together two different kinds of decreasing cost and invents 'external diseconomies' for increasing cost; properly understood, competitive output commits no 'rigid mathematical sin', so permanent bounties and taxes are unjustified.", "responds_to": ["#27 Clapham 1922", "#28 Pigou 1922", "#26 Young 1913", "Pigou, Economics of Welfare 1920 (context)"], "answered_by": ["Pigou's reply appended (pp. 30–31)", "#21 Edgeworth 1925", "#38 Robertson 1930 symposium (group D2)"], "journal": "Economic Journal", "id": "31"}, {"author": "Pigou", "year": 1927, "title": "The Laws of Diminishing and Increasing Cost", "group": "D1", "hook": "Pigou accepts Sraffa: no increasing costs; but tiny external economies can still add up to decreasing costs.", "claim": "For industries too small to affect factor prices increasing costs are impossible (agreeing with Sraffa), but external economies special to an industry can produce decreasing costs under competition, in which case output falls short of the optimum and a bounty is warranted.", "responds_to": ["Sraffa, 'The Laws of Returns under Competitive Conditions', EJ Dec 1926 (context)"], "answered_by": ["#35 Pigou 1928 (fuller analysis)", "#37 Young 1928", "#38 1930 symposium (group D2)"], "journal": "Economic Journal", "id": "33"}, {"author": "Robbins", "year": 1928, "title": "The Representative Firm", "group": "D1", "hook": "Robbins: the representative firm is a superfluous, misleading ghost, since 'not enough Josiah Stamps to go round'.", "claim": "Marshall's representative firm is unnecessary for any problem in value theory, since unequal managerial ability yields unequal normal profits just as unequal land yields unequal rents, and it misleads by hiding the heterogeneity of business ability.", "responds_to": ["Marshall, Principles Bk IV ch. xiii and Bk V (context)", "Robertson's 1927 Colwyn Report article (context)", "H. D. Henderson, Supply and Demand (context)", "#35 Pigou 1928 (noted in footnote, not discussed)"], "answered_by": ["#38 Robertson 1930, 'The Trees of the Forest' (group D2)"], "journal": "Economic Journal", "id": "34"}, {"author": "Pigou", "year": 1928, "title": "An Analysis of Supply", "group": "D1", "hook": "Pigou's 'equilibrium firm': price equals its marginal and average cost; correct for transfers, and increasing supply price vanishes.", "claim": "Using an 'equilibrium firm' whose marginal and average costs both equal the industry's supply price, Pigou shows that decreasing supply price requires costs dependent on industry output, and that once transfer elements are removed increasing supply price is impossible while decreasing supply price is likely in manufacturing.", "responds_to": ["Sraffa 1926 (context)", "#33 Pigou 1927", "#26 Young 1913, #30 Knight 1924, #31 Robertson 1924 (rent/transfer critique)", "Marshall's representative firm (context)"], "answered_by": ["#34 Robbins 1928 (footnote only)", "#38 1930 symposium and #41 Harrod 1930 (group D2)"], "journal": "Economic Journal", "id": "35"}, {"author": "Shove", "year": 1928, "title": "Varying Costs and Marginal Net Products", "group": "D1", "hook": "Shove: rent effects must be counted under increasing and diminishing returns alike, so Pigou's asymmetry collapses.", "claim": "Whether purchasers' gains or losses from expansion are offset by landlords' rents depends on expansion's effect on infra-marginal costs, not on whether returns increase or diminish, so Pigou's tax-bounty asymmetry collapses and must be restated as a gap between marginal cost and 'final trade cost'.", "responds_to": ["Pigou, Economics of Welfare 2nd ed., Part II ch. x (context)", "Marshall, Principles pp. 472–5 and Appendix H (context)"], "answered_by": ["#38 1930 symposium and #47 Shove 1933 (group D2)"], "journal": "Economic Journal", "id": "36"}, {"author": "Young", "year": 1928, "title": "Increasing Returns and Economic Progress", "group": "D1", "hook": "Young: the division of labour depends on the division of labour, so increasing returns make growth cumulative.", "claim": "Increasing returns arise from the progressive division of labour among industries and roundabout methods, limited by a market that is itself total production, so they propagate cumulatively and cannot be grasped by firm- or industry-level equilibrium analysis.", "responds_to": ["Adam Smith (division of labour limited by the market) (context)", "Marshall's internal/external economies and representative firm (context)", "Sraffa 1926 and the supply-curve apparatus of #33/#35 (implicit)"], "answered_by": ["#38 1930 symposium (group D2)", "compare #34 Robbins 1928 footnote"], "journal": "Economic Journal", "id": "37"}, {"author": "Robertson, Sraffa & Shove", "year": 1930, "title": "Increasing Returns and the Representative Firm: A Symposium", "group": "D2", "hook": "Robertson defends Marshall's trees; Sraffa says discard Marshall; Shove relabels economies and calls in imperfect markets and time.", "claim": "How competitive equilibrium can coexist with increasing returns from internal economies: Robertson says through the representative firm (no identifiable firm can expand), Sraffa says it cannot (equilibrium means minimum cost) so Marshall's theory should be discarded, and Shove says through costlier invasion of rivals' markets and through time.", "responds_to": ["#34 Robbins 1928 (The Representative Firm)", "#33 Pigou 1927", "#35 Pigou 1928", "#36 Shove 1928", "#37 Young 1928", "#31 Robertson 1924", "Sraffa 1926 (context)"], "answered_by": ["#41", "#43", "#44", "#47", "#52"], "journal": "Economic Journal", "id": "38"}, {"author": "Harrod", "year": 1930, "title": "Notes on Supply", "group": "D2", "hook": "Harrod draws the marginal revenue curve first, calling it the 'increment of aggregate demand curve'.", "claim": "A source facing a falling demand curve sets output where marginal cost cuts the 'increment of aggregate demand curve' (marginal revenue), which allows decreasing supply price; separately, industries using factors in unusual proportions (agriculture) face increasing supply price.", "responds_to": ["#35 Pigou 1928 and #38 Shove 1930 (paper is 'propaedeutic' to them)", "classical agriculture vs manufacturing distinction"], "answered_by": ["#43", "#44", "#45", "#51"], "journal": "Economic Journal", "id": "41"}, {"author": "Harrod", "year": 1931, "title": "The Law of Decreasing Costs", "group": "D2", "hook": "Harrod: with marketing costs or sloping firm demand, competitive equilibrium and decreasing costs coexist; MC = price − price/elasticity.", "claim": "Competitive equilibrium is compatible with short- and long-period decreasing costs when there are competitive marketing costs (which make supply depend on the state of demand) or falling particular demand curves, and decreasing costs are normal where optimum plant grows faster than demand.", "responds_to": ["#41 Harrod 1930", "Sraffa 1926 (context)", "#38 Shove 1930", "Pigou's equilibrium firm, Economics of Welfare 1929 (cf. #35)"], "answered_by": ["#44", "#45"], "journal": "Economic Journal", "id": "43"}, {"author": "Robinson", "year": 1932, "title": "Imperfect Competition and Falling Supply Price", "group": "D2", "hook": "Robinson: with imperfect competition, equilibrium firms must have falling average cost, yet supply price may rise, fall or stay put.", "claim": "Under imperfect competition with free entry, the double condition (MR = MC, price = AC) means the firm's demand curve is tangent to its falling AC curve, but whether more demand lowers supply price depends on whether individual demand curves become more or less elastic.", "responds_to": ["Sraffa 1926 (context)", "#38 Symposium 1930", "#41 Harrod 1930", "#43 Harrod 1931", "Kahn's tangency theorem (unpublished, credited p. 547 n.)"], "answered_by": ["#45", "#46", "#47"], "journal": "Economic Journal", "id": "44"}, {"author": "Harrod", "year": 1933, "title": "A Further Note on Decreasing Costs", "group": "D2", "hook": "Harrod: under imperfect competition 'normal profit' is a range, so decreasing costs are possible, not compulsory.", "claim": "Defining normal profit as the rate on the firm's marginal fixed equipment that induces it to extend plant, price need not equal average total cost, so a firm in imperfect competition may, but need not, show decreasing costs in equilibrium.", "responds_to": ["#44 Robinson 1932", "#47 Shove 1933"], "answered_by": [], "journal": "Economic Journal", "id": "45"}, {"author": "Pigou", "year": 1933, "title": "A Note on Imperfect Competition", "group": "D2", "hook": "Pigou rebuilds Robinson's geometry in algebra: two equations, two unknowns, so her conditions are compatible and determinate.", "claim": "Writing Robinson's two equilibrium conditions algebraically gives two equations in price and number of firms, showing they are compatible and determinate, extending her results to unequal firms, and yielding ∂ψ/∂p as a measure of market imperfection.", "responds_to": ["#44 Robinson 1932"], "answered_by": [], "journal": "Economic Journal", "id": "46"}, {"author": "Shove (with reply by Robinson)", "year": 1933, "title": "The Imperfection of the Market: A Further Note", "group": "D2", "hook": "Shove asks Robinson: what does your cost curve show, and what is 'normal' profit when entry is costly?", "claim": "Robinson's proof is doubtful because a firm's cost of a given output depends on the character of demand, so her cost curve cannot stay fixed, and with entry costs normal profit is a range, so tangency defines maximum profit rather than a necessary equilibrium condition.", "responds_to": ["#44 Robinson 1932", "#38 Shove 1930 (his own pp. 106, 108)"], "answered_by": ["#45"], "journal": "Economic Journal", "id": "47"}, {"author": "Robbins", "year": 1934, "title": "Remarks upon Certain Aspects of the Theory of Costs", "group": "D2", "hook": "Robbins: cost is displaced alternatives (Wieser's Law); Marshall's flat and falling supply curves belong to a 'Theory of Variations'.", "claim": "Costs are the value of displaced alternatives, so cost rises at equilibrium; Marshallian constant and falling supply curves describe differences between equilibria, not equilibrium itself, and competitive decreasing costs come from exploiting indivisible potential uses of factors across many industries.", "responds_to": ["Sraffa 1926 (context)", "Knight 1928 and Haberler on technical-displacement cost (context)", "#26 Young 1913", "#30 Knight 1924", "#21 Edgeworth 1925", "#37 Young 1928", "#38 Shove 1930"], "answered_by": ["#51"], "journal": "Economic Journal", "id": "48"}, {"author": "Kaldor", "year": 1934, "title": "The Equilibrium of the Firm", "group": "E", "hook": "Co-ordination is the firm's only fixed factor — and in static equilibrium it becomes a free good.", "claim": "The only factor that can limit a firm's long-run size is co-ordinating ability, but co-ordination is needed only for adjustment to change, so long-period static equilibrium and perfect competition are incompatible.", "responds_to": ["#08 Marshall's representative firm", "#34 Robbins 1928 on the representative firm", "#38 Robertson in the 1930 symposium", "Pigou's 'equilibrium firm', Economics of Welfare (context)", "Harrod, 'Decreasing Costs', EJ June 1933 (cf. #45)", "Chamberlin 1933 and Robinson 1933 books (context)"], "answered_by": ["#58 Kaldor 1935 builds on it", "#50 Robinson 1934 cites it on entrepreneurship as a factor", "#59 Kahn 1935 cites it (roads/external diseconomies)", "Coase, 'The Nature of the Firm' 1937 (context, not in folder)"], "journal": "Economic Journal", "id": "49"}, {"author": "Robinson", "year": 1934, "title": "Euler's Theorem and the Problem of Distribution", "group": "E", "hook": "The adding-up problem was never a problem: profits are zero, positive or negative as returns are constant, diminishing or increasing.", "claim": "Euler's theorem and economic reasoning agree: profits are zero, positive or negative as returns (physical under perfect competition, in value and outlay under imperfect competition) are constant, diminishing or increasing, and under imperfect competition entrepreneurs receive more than their marginal product to the industry.", "responds_to": ["Wicksteed, Co-ordination of the Laws of Distribution 1894 (context)", "Clark, Edgeworth, Pareto, Walras, Hobson, Marshall, Wicksell (context)", "Hicks, Theory of Wages 1932 (context)", "#49 Kaldor 1934"], "answered_by": ["#59 Kahn 1935 (builds on it)", "#63 Chamberlin 1937 (rejects entrepreneur-as-exploiter)"], "journal": "Economic Journal", "id": "50"}, {"author": "Robinson", "year": 1941, "title": "Rising Supply Price", "group": "D2", "hook": "Robinson: when demand shifts to a commodity, it turns relative factor prices against itself, so supply price rises.", "claim": "For a transfer of demand under perfect competition and full employment, any industry using factors in unaverage proportions has rising supply price in terms of a composite unit of resources, its strength depending on size, idiosyncrasy, substitutability and factor-supply elasticity.", "responds_to": ["Marshall's long-period supply curve", "Hicks, Value and Capital 1939 (context)", "Sraffa 1926 (context)", "#33 Pigou 1927", "#48 Robbins 1934"], "answered_by": [], "journal": "Economica", "id": "51"}, {"author": "Shove", "year": 1942, "title": "The Place of Marshall's Principles in the Development of Economic Theory", "group": "D2", "hook": "Shove's centenary verdict: Marshall is 'reformed Ricardian', and the marginal revenue curve is Marshall's algebra drawn as geometry.", "claim": "Marshall's Principles is a mathematical completion of Ricardo–Mill rather than a synthesis with Jevons and the Austrians; the 1930s imperfect-competition theory follows Marshall's lines, but oligopoly, dynamics and Keynesian money remain gaps.", "responds_to": ["Keynes's memoir and Schumpeter 1941 on Marshall (context)", "Sraffa 1926 (context)", "#44 Robinson 1932 and the group E imperfect-competition literature", "Chamberlin 1933, Zeuthen 1930, Kahn 1937 (context)", "#38 Shove 1930"], "answered_by": [], "journal": "Economic Journal", "id": "52"}, {"author": "Kaldor", "year": 1934, "title": "Mrs. Robinson's 'Economics of Imperfect Competition' (review)", "group": "E", "hook": "A brilliant treatise on monopoly misnamed: it leaves out duopoly, marketing costs and the \"imagined demand curve.\"", "claim": "Robinson's book, omitting duopoly and marketing costs, is really an admirable ultra-Marshallian treatise on monopoly whose 'industry' and objective demand-curve concepts are unsuited to imperfect competition.", "responds_to": ["Robinson, The Economics of Imperfect Competition 1933 (context)"], "answered_by": ["#58 Kaldor 1935 develops it", "#59 Kahn 1935 cites it"], "journal": "Economica", "id": "53"}, {"author": "Schumpeter (and Nichol)", "year": 1934, "title": "Robinson's Economics of Imperfect Competition (reviews)", "group": "E", "hook": "Schumpeter: marginal revenue unifies price theory, yet the book is \"Marshallian to the core\"; Nichol: geometry can't handle monopolies.", "claim": "Schumpeter praises marginal revenue as unifying price theory but finds Robinson's book Marshallian partial-equilibrium to the core; Nichol finds its geometric methods inadequate for a world of monopolies.", "responds_to": ["Robinson, The Economics of Imperfect Competition 1933 (context)"], "answered_by": ["No reply in set; compare #53"], "journal": "Journal of Political Economy", "id": "54"}, {"author": "Nichol", "year": 1934, "title": "Professor Chamberlin's Theory of Limited Competition", "group": "E", "hook": "Far-sighted duopolists reach the monopoly price only with costless production; change the costs and price moves above or below monopoly.", "claim": "Chamberlin's theorem that far-sighted oligopolists reach the monopoly price rests on the costless case; with decreasing variable costs duopoly price exceeds monopoly price, and with unequal increasing costs it falls below it.", "responds_to": ["Chamberlin, 'Duopoly: Value When Sellers Are Few', QJE 1929 (context)", "Chamberlin, Theory of Monopolistic Competition 1933, ch. III (context)", "Cournot and Edgeworth duopoly theories (context; group B)"], "answered_by": ["No reply in set"], "journal": "Quarterly Journal of Economics", "id": "55"}, {"author": "Harrod", "year": 1934, "title": "Doctrines of Imperfect Competition", "group": "E", "hook": "Downward-sloping demand means either excess profits at optimum scale, or normal profits with too-small, under-used plant.", "claim": "Imperfect competition makes long-period equilibrium consistent with excess profits or with sub-optimal, under-used lay-outs, distorts resource allocation from the optimum, and through decreasing costs destabilises total output in the trade cycle.", "responds_to": ["Robinson 1933 and Chamberlin 1933 books (context)", "#41, #43, #45 Harrod's earlier EJ notes", "Viner 1931 cost curves (context)", "Pigou, Industrial Fluctuations (context)"], "answered_by": ["#57 Robinson 1934", "#61 Harrod 1936 (extension)"], "journal": "Quarterly Journal of Economics", "id": "56"}, {"author": "Robinson", "year": 1934, "title": "What Is Perfect Competition?", "group": "E", "hook": "Perfect competition just means a perfectly elastic demand curve for each seller. Free entry and normal profits are separate questions.", "claim": "Perfect competition should mean only that each seller faces perfectly elastic demand; it is analytically distinct from free entry and normal profits, and the number of firms needed for it depends on the slopes of marginal cost curves.", "responds_to": ["Knight, Risk, Uncertainty and Profit (context)", "Sraffa 1926 (context)", "#38 Shove in the 1930 symposium", "Shove, EJ March 1933 (cf. #47)", "Chamberlin 1933 book, pure vs perfect competition (context)", "#56 Harrod 1934", "Cournot's large-numbers condition (context)"], "answered_by": ["#63 Chamberlin 1937 (agrees on entry, rebuts on differentiation, numbers of buyers, and '100 firms')"], "journal": "Quarterly Journal of Economics", "id": "57"}, {"author": "Kaldor", "year": 1935, "title": "Market Imperfection and Excess Capacity", "group": "E", "hook": "Free entry into differentiated markets is \"the creator of excess capacity\", but only under Chamberlin's heroic assumptions.", "claim": "Chamberlin's excess-capacity (tangency) result is logically sound but depends on unrealistic assumptions — evenly spread preferences, short-sighted producers, no institutional monopoly — though some rise in costs rather than fall in price from entry remains likely.", "responds_to": ["Chamberlin, Theory of Monopolistic Competition 1933, ch. V (context)", "Robinson, Economics of Imperfect Competition 1933, ch. 7 (context)", "Shove, 'The Imperfection of the Market', EJ March 1933 (cf. #47)", "#49 Kaldor 1934", "#53 Kaldor's review of Robinson"], "answered_by": ["#63 Chamberlin 1937 (rejects numbers/divisibility, accepts free-entry point)", "#66 Kaldor 1938 rejoinder"], "journal": "Economica", "id": "58"}, {"author": "Kahn", "year": 1935, "title": "Some Notes on Ideal Output", "group": "E", "hook": "What matters is deviation from the average. If every industry were equally imperfect, there would be nothing to correct.", "claim": "Ideal output equalises the value of marginal social product across uses, so interference is warranted only by an industry's deviation from the average degree of external economy or imperfect competition — with hired factors and entrepreneurs to be shifted in opposite directions.", "responds_to": ["Pigou, Economics of Welfare 4th ed. 1932 (context)", "#36 Shove 1928 'Varying Costs and Marginal Net Products'", "#50 Robinson 1934 Euler's theorem", "Robinson, EIC ch. 27 'A World of Monopolies' (context)", "#27 Clapham's empty boxes", "#26 Young 1913", "#30 Knight 1924", "#21 Edgeworth 1925", "#49 Kaldor 1934", "#53 Kaldor 1934 review"], "answered_by": ["#63 Chamberlin 1937 (quotes Kahn p. 20; rejects negative marginal product of entrepreneurship)"], "journal": "Economic Journal", "id": "59"}, {"author": "Harrod", "year": 1936, "title": "Imperfect Competition and the Trade Cycle", "group": "E", "hook": "Demand gets less elastic in booms and more elastic in slumps, so prices and profits swing more than costs.", "claim": "If entrepreneurs equate MR and MC, the greater amplitude of price and profit fluctuations than of cost fluctuations is explained by demand becoming less elastic in booms and more elastic in slumps.", "responds_to": ["#56 Harrod 1934", "Psychological trade-cycle theories (context)"], "answered_by": ["#63 Chamberlin 1937 (MR = MC is not peculiar to imperfect competition)"], "journal": "Review of Economic Statistics", "id": "61"}, {"author": "Chamberlin", "year": 1937, "title": "Monopolistic or Imperfect Competition?", "group": "E", "hook": "Monopolistic competition is a blend of monopoly and competition, while \"imperfect\" competition keeps the old dichotomy.", "claim": "Monopolistic competition, built on product differentiation, treats most situations as blends of monopoly and competition, whereas Robinson's 'imperfect competition' keeps them mutually exclusive — a difference with consequences for profits, competitive norms and 'exploitation'.", "responds_to": ["Robinson, Economics of Imperfect Competition 1933 (context)", "#57 Robinson 1934", "#58 Kaldor 1935", "#59 Kahn 1935", "#61 Harrod 1936", "#50 Robinson 1934 Euler", "J. M. Clark; White 1936; Machlup 1937 (context)"], "answered_by": ["#66 Kaldor 1938", "Chamberlin's reply to Kaldor (#67, context, not in folder)", "#69 Machlup 1939 (discusses narrow vs wide sense of the term)"], "journal": "Quarterly Journal of Economics", "id": "63"}, {"author": "Coase", "year": 1937, "title": "Some Notes on Monopoly Price", "group": "E", "hook": "A real monopolist, ignorant of demand, raises prices slowly at first and, in the long run, restricts output more.", "claim": "Once ignorance, uncertainty about demand, short- vs long-run demand, demand shifts caused by price changes, dynamics and the 'quiet life' are allowed for, a newly formed monopoly first raises price less than Robinson predicts but in the long run restricts output more and slows progress.", "responds_to": ["Robinson, Economics of Imperfect Competition 1933 (context)", "Hicks, 'The Theory of Monopoly', Econometrica 1935 (context)"], "answered_by": ["No reply in set; compare #65 Burns 1937 and #69 Machlup 1939"], "journal": "Review of Economic Studies", "id": "64"}, {"author": "Burns", "year": 1937, "title": "The Organization of Industry and the Theory of Prices", "group": "E", "hook": "Industry studies should start from prices and trace where the \"disintegrated\" entrepreneur's functions have gone.", "claim": "Because competitive individualism no longer describes industry, industry studies should centre on explaining price behaviour through the new distribution of entrepreneurial functions — scale, integration and sales promotion.", "responds_to": ["Theories of imperfect/monopolistic competition, Chamberlin and Robinson (context)", "Older 'Trust and Corporation Problems' studies (context)", "Antitrust, Robinson-Patman Act, NRA (context)"], "answered_by": ["No direct reply in set; compare #69 Machlup 1939 on case studies"], "journal": "Journal of Political Economy", "id": "65"}, {"author": "Kaldor", "year": 1938, "title": "Professor Chamberlin on Monopolistic and Imperfect Competition", "group": "E", "hook": "Chamberlin \"is trying to differentiate his product too far\": one subject, and elasticity, not slope, measures imperfection.", "claim": "Chamberlin's alleged dissimilarities are misconceptions: the theories share one subject, imperfection is measured by elasticity (which rises with numbers), economies of scale underlie imperfect competition, and monopoly need not rest on privilege.", "responds_to": ["#63 Chamberlin 1937", "#58 Kaldor 1935 (defended)", "Cassels, QJE May 1937 (context)"], "answered_by": ["Chamberlin's reply (#67, context, not in folder)"], "journal": "Quarterly Journal of Economics", "id": "66"}, {"author": "Machlup", "year": 1939, "title": "Evaluation of the Practical Significance of the Theory of Monopolistic Competition", "group": "E", "hook": "Differentiated many-seller markets behave nearly competitively; oligopoly is the real case, and may hinge on Firestone's breakfast.", "claim": "Product differentiation among many sellers probably changes little from pure competition; oligopoly, defined by sellers' conjectures, is the common and important case, hard to analyse, yet the theory still gives policy-makers useful concepts and warnings.", "responds_to": ["Chamberlin, Theory of Monopolistic Competition 1933/1936 (context; cf. #63)", "Hicks, Econometrica 1935 (context)", "Mason 1939 (context)", "Machlup 1937 classification (context)"], "answered_by": ["No reply in set"], "journal": "American Economic Review", "id": "69"}];
const CARDS=[{"id": "04", "who": "Hadley 1886", "g": "A", "f": "Hadley (QJE 1886), 'Private Monopolies and Public Rights': main thesis?", "b": "Large fixed investment makes competition ruinous and drives consolidation; accept combination but regulate it through equality of treatment and publicity. Railways show the future of all big-capital industry."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Which 1886 paper said 'regulated combination is better than irresponsible competition'?", "b": "Hadley, 'Private Monopolies and Public Rights', QJE 1(1), Oct 1886 (p. 39)."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Hadley: why is railway competition more disastrous than agricultural competition?", "b": "Railways are not subject to the law of diminishing return: added traffic is handled more and more cheaply, so cut-throat competition has no direct limit and leaves nothing for fixed charges."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Hadley's four ways to deal with the railway being both highway and carrier?", "b": "(1) Keep road and carrier separate; (2) state monopoly; (3) parallel competing private roads; (4) admit monopoly but reserve public rights of control. He favours (4)."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Cloze: In a railway rate war, {{c1::fixed charges}} are disregarded, just as {{c2::rent}} does not enter the price of produce (Hadley).", "b": "fixed charges; rent"}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Hadley's two preferred tools of regulation, instead of legislated rates?", "b": "Enforced equality of treatment (no personal discrimination) and publicity of management. The absolute rate is left to managers."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Whose phrase 'law of the increasing return' does Hadley use to extend the railway case to factories?", "b": "Prof. H. C. Adams (#07). The large producer can expand cheaply and crush small rivals, so factory competition also ends in combination."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Hadley's three phases of US railway legislation?", "b": "(1) Forced active competition, which failed; (2) shippers dictating rates (Granger laws), a worse failure; (3) regulation that tacitly accepts combination but demands publicity and responsibility."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Date card: Hadley's 'Private Monopolies and Public Rights' appeared in which issue of QJE?", "b": "Vol. 1, No. 1, October 1886 (pp. 28–44), the first issue of the Quarterly Journal of Economics."}, {"id": "04", "who": "Hadley 1886", "g": "A", "f": "Which later group-A paper cites Hadley's article as an example of predicting competition's suppression?", "b": "#06 Giddings, 'The Persistence of Competition' (PSQ, Mar 1887), footnote on p. 65."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Clark, 'The Limits of Competition' (PSQ 1887): main thesis?", "b": "The predatory struggle Ricardo generalized from has ended in combination of a few equal survivors. Combinations are normal and evolutionary: accept, study and probably regulate them, but don't suppress them. Residual competition checks prices."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Which 1887 paper described the new era as 'armed neutralities and federations of giants'?", "b": "J. B. Clark, 'The Limits of Competition', PSQ 2(1), Mar 1887 (p. 47)."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Clark's 'residual competition': its two forms?", "b": "Actual: rivalry among members of the pool, who are of roughly equal strength. Potential: between the whole combination and the rest of society (capital and labour can still move in and out)."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "How do Clark's competing groups differ from Cairnes's non-competing groups?", "b": "Cairnes grouped workers by personal or class qualification and potential competition (children entering trades). Clark groups by stage of production (horizontal strata) and real competition. Clark says machinery and education have erased Cairnes's lines."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Cloze: Clark: price-fixing limits {{c1::actual}} competition; restricting production limits {{c2::potential}} competition.", "b": "actual; potential (the transfer of labour and capital between groups)"}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Clark: after combination, where is the 'industrial war' fought?", "b": "Across the horizontal lines, between producers of different articles (e.g. lumbermen vs transporters and furniture makers), rather than among rivals within one stratum."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Clark: why baskets don't combine nationally but silk does?", "b": "Portability: bulky baskets carry high freight costs, so local makers survive; silk costs almost nothing to ship, so a cheap mill can reach the whole country. Combination also needs few, strong, nearly equal rivals."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Clark's view of legal suppression of combinations?", "b": "Permanent suppression is impossible. Temporary repression either drives them into illegal forms or restores the 'internecine war' that evolution ended. Regulation is possible and partly desirable."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Clark ends by leaving residual competition to 'one whose analysis derives weight from practical observation'. Who follows in the same issue?", "b": "#06 Franklin H. Giddings, 'The Persistence of Competition', PSQ 2(1), pp. 62–78, which studies empirically how pools break down."}, {"id": "05", "who": "Clark 1887", "g": "A", "f": "Date card: Clark's 'Limits of Competition' and Giddings's 'Persistence of Competition'?", "b": "Both in Political Science Quarterly vol. 2, no. 1, March 1887, back to back: Clark pp. 45–61, Giddings pp. 62–78."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Giddings, 'The Persistence of Competition' (PSQ 1887): main thesis?", "b": "Combinations will grow but cannot destroy competition, which is a permanent force redirected into new utilities, quality and outside capital. Pools only curb ruinous below-cost competition; normal competition to cost survives."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Giddings: competition in some form is permanent because it is 'an implication of' what?", "b": "The conservation of energy. A society of individuals with unequal energy must show unequal activity, i.e. competition."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Giddings: difference between a combination and a non-competing group?", "b": "Members of a non-competing group compete freely with each other but not with other groups. Members of a combination don't compete with each other but do compete with outsiders."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Which 1887 paper argued combinations deal effectively only with competition 'below the solvency line'?", "b": "Giddings, 'The Persistence of Competition', PSQ 2(1), Mar 1887 (p. 78)."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Giddings's evidence that pools failed to hold prices (two examples)?", "b": "Nail mills grew from 68 to 79 in 1883 despite the pool's shutdowns. In the wall-paper pool (1880), one member paid $10,000 a year in forfeits rather than stop underselling."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Cloze: Giddings: 'The combination {{c1::equilibrium}} may be, at best, an {{c2::unstable}} one.'", "b": "equilibrium; unstable (p. 66)"}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Giddings: where are combinations easiest, and where hardest?", "b": "Easiest in small, compact groups making final, specialized sub-products. Hardest in large, loose primary groups (crude materials) unless protected by natural or patent monopoly (anthracite, steel)."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "Giddings: where does capital shut out of a pooled industry go?", "b": "Into new utilities and superior substitutes (steel replacing iron for rails, nails, wire), and into better quality inside the combination (the brass-goods pool, a Ruskin-style 'higher competition')."}, {"id": "06", "who": "Giddings 1887", "g": "A", "f": "How does Giddings relate to Clark (#05)?", "b": "Next article in the same PSQ issue. He adopts Clark's grouping by stage of production, adds personal-qualification groups cutting across it, and argues more strongly that competition persists and pools are unstable."}, {"id": "07", "who": "Adams 1887", "g": "A", "f": "H. C. Adams (1887): the three classes of industry?", "b": "Constant returns (2x gives 2y, 3x gives 3y; e.g. retail), diminishing returns (3x gives only 2¾y; e.g. farming), increasing returns (3x gives more than 3y; e.g. railways). Only the third needs state control."}, {"id": "07", "who": "Adams 1887", "g": "A", "f": "Cloze: Adams: 'The control of the state over industries should be co-extensive with the application of the law of {{c1::increasing returns}}.'", "b": "increasing returns (p. 60)"}, {"id": "07", "who": "Adams 1887", "g": "A", "f": "Adams: why is competition powerless under increasing returns?", "b": "An established business can expand to meet new demand more cheaply than a new firm can enter. On a railway, extending the old road beats building a new one, so the incumbent is a natural monopoly."}, {"id": "07", "who": "Adams 1887", "g": "A", "f": "Adams: rule of private vs public financiering?", "b": "Private: the highest price that does not curtail profitable business (cost plus profit, checked only by buyers' choice). Public: the lowest price consistent with efficient service, price = cost, checked by publicity of accounts."}, {"id": "07", "who": "Adams 1887", "g": "A", "f": "Which 1887 AEA monograph listed three evils of unrestrained competition: worst man sets the moral plane, monopoly's benefits lost, government weakened?", "b": "Henry C. Adams, 'Relation of the State to Industrial Action', Publications of the AEA 1(6), Jan 1887 (p. 38)."}, {"id": "07", "who": "Adams 1887", "g": "A", "f": "Who borrowed Adams's 'law of the increasing return' to argue that factories, like railways, end in combination?", "b": "#04 Hadley, 'Private Monopolies and Public Rights', QJE Oct 1886 (p. 40)."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall 1890, 'Some Aspects of Competition': where was it given and printed?", "b": "Presidential Address to Section F (Economic Science and Statistics), British Association, Leeds, September 1890; printed in Journal of the Royal Statistical Society 53(4), Dec 1890, pp. 612–643."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Which 1890 address said there was 'a false antithesis between competition and combination'?", "b": "Alfred Marshall, 'Some Aspects of Competition', JRSS 1890 (p. 626)."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall: what makes the competition/combination antithesis false? Give an example.", "b": "Law banned workmen's unions, and later railway pooling or loose trader combinations, while letting one employer or one consolidated firm do the same things. A single firm is a more compact combination than any union."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall's 'indivisible industries': what are they and what policy did he favour?", "b": "Industries like gas, water, railways, tramways and electricity, where only one firm can serve an area. He favoured absolute public control, sometimes public ownership, but private management, not state management."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall's franchise idea for indivisible industries?", "b": "A public authority owns the franchise (and perhaps some fixed capital) and leases it for limited years. Firms compete for it on the price or quality of service rather than on the annual rent paid."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Cloze: Marshall: the pressure of combinations is becoming more {{c1::extensive}} but less {{c2::intensive}}.", "b": "extensive; intensive. Better transport widens a combination's area but weakens its grip at any point (p. 622)."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall: why does pooling of gains tend toward complete consolidation?", "b": "Each member has little to lose by bad management, so the pool shifts work to the best plants and gives ever more power to the centre. It is 'on an inclined plane' toward amalgamation (p. 626)."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall: what is the main reason for unease about large consolidations?", "b": "They exploit existing knowledge but add little new. A multitude of independent moderate-sized undertakers has superior inventive energy, and its benefits are cumulative and underrated."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Marshall: competition in bargaining vs competition in production?", "b": "Bargaining (manoeuvring to buy low and sell high) is 'almost pure waste'. Productive and marketing competition serve the public. Monopolies save petty bargaining but must bargain on a large scale to keep their monopoly."}, {"id": "08", "who": "Marshall 1890", "g": "A", "f": "Who quoted Marshall that a monopoly 'must be always bargaining and manoeuvring on a large scale'?", "b": "#12 Bullock, 'Trust Literature: A Survey and a Criticism', QJE Feb 1901 (pp. 197–198)."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Taussig 1891 explains railway rate classification by what principle?", "b": "Joint cost: most railway expenses are incurred for the traffic as a whole, so rates are apportioned according to demand, as with wool and mutton."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Which German writer did Taussig 1891 attack, and what was his theory?", "b": "Gustav Cohn: railway charges are like taxes based on Leistungsfähigkeit (ability to pay), an ethical matter requiring state ownership or regulation."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Taussig 1891: does return on capital affect railway rates?", "b": "It affects the general level of rates in the long run, but not any particular rate: any traffic paying more than its separate cost is worth carrying."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Taussig: 'what the traffic will bear' is used in {{c1::two distinct senses}}: adaptation to demand from joint cost and from {{c2::monopoly}}.", "b": "Two senses: joint cost and monopoly (p. 457)."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "In what sense does Taussig call the demand for coal transport 'small'?", "b": "Small in sensitivity to price: a large coal traffic comes only at low rates, while dry goods come even at high rates."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Why did the German 'natural' or car-space tariff fail, according to Taussig?", "b": "It charged equal rates per ton-mile assuming dear and cheap goods cost the same to carry, ignoring that neither had much separate cost; demand-based classification returned."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Taussig's verdict on 'value of service' as an explanation of rates?", "b": "Useful popular shorthand, but read as exchange value it is circular: it says charges are determined by what is charged."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Taussig's analogy against Cohn's ethics: rump steak and tenderloin prices are not set as mercy to the poor. What point does it make?", "b": "Differential prices for joint products reflect demand, not justice; so Cohn's ethical argument for state ownership collapses."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Year, journal and author of 'A Contribution to the Theory of Railway Rates'?", "b": "F. W. Taussig, Quarterly Journal of Economics, July 1891 (vol. 5)."}, {"id": "09", "who": "Taussig 1891", "g": "C", "f": "Who later disputed Taussig's 1891 joint-cost explanation in Wealth and Welfare (1912)?", "b": "A. C. Pigou, who argued rates reflect discriminating monopoly; exchange in QJE 1913 (#17, #18)."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "What occasioned Fisher's 1898 article on Cournot?", "b": "N. T. Bacon's 1897 English translation of Cournot's Recherches (1838)."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Fisher's main objection to Cournot's duopoly theory?", "b": "Cournot assumes each rival takes the other's output as constant; real business men forecast rivals' responses, like chess players, making the problem dynamic."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Fisher: if each duopolist assumes the rival's {{c1::price}} fixed, undercutting yields the result of {{c2::unlimited competition}}.", "b": "Cf. Bertrand, Marshall, Pareto, Edgeworth (p. 126)."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Which Cournot theorem on monopoly does Fisher link to American railway theory?", "b": "Fixed charges (costs not varying with output) do not influence monopoly price (Cournot section 30; cf. Hadley)."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Fisher: Cournot's result on complementary goods (copper and zinc for brass)?", "b": "One monopolist of both gives a lower brass price than two separate monopolists; Edgeworth applies it to consolidation of connecting railway lines."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "What did Fisher call Cournot's phi-prime(x) under unlimited competition?", "b": "Marginal cost: price equals marginal cost, making Cournot an anticipator of Jevons, Menger and Walras."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Why are Cournot's 'social income' chapters faulty, per Fisher?", "b": "He lacked consumers' rent, so he ignored the loss to those who stop or reduce buying (the triangle)."}, {"id": "11", "who": "Fisher 1898", "g": "B", "f": "Fisher's check showing Cournot's tariff formula is wrong?", "b": "The effect of the tax should vanish when the tax vanishes, but in Courn
