": "Robinson 1934: two conditions for a perfect market between products A and B?", "b": "All buyers alike in preferences, and each buyer deals with only one firm at a time. Then any relative price rise ends a firm's sales."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Cloze: For Robinson, if there is only {{c1::one buyer}} the market for each firm must be perfect.", "b": "one buyer"}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Robinson 1934: with falling marginal costs in a perfect market, how many firms survive?", "b": "Only one — price-cutting drives the other out, so competition cannot be perfect."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Robinson 1934: what determines the number of firms needed for perfect competition (rising MC)?", "b": "The slopes of their marginal cost curves (and elasticity of total demand): flatter MC → fewer firms needed; vertical MC → indefinitely many."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "What is the point of Robinson's Saturday-night fish market example?", "b": "With perfectly inelastic supply competition is not strictly perfect, yet the competitive output sells at the competitive price unless demand is highly inelastic."}, {"id": "57", "who": "Robinson 1934", "g": "E", "f": "Who replied (1937) that Robinson's argument implies 'for full perfection the requirement is bilateral monopoly'?", "b": "Chamberlin, 'Monopolistic or Imperfect Competition?' QJE Aug 1937 (#63), p. 569 n."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Kaldor 1935: why is Robinson's tangency result 'merely a statement of a tautology'?", "b": "She includes in her cost curves profits not competed away by entry, so tangency holds by definition and implies no excess capacity."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "List the four (implicit) assumptions Kaldor 1935 finds behind Chamberlin's excess-capacity theory.", "b": "(1) Many producers of slightly different products; (2) preferences evenly distributed; (3) no institutional monopoly, i.e. free entry; (4) economies of scale over some range."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Cloze: Kaldor 1935 calls duopoly 'the {{c1::leading species of a large genus}}'.", "b": "leading species of a large genus"}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "What is an 'imagined demand curve' (Kaldor)?", "b": "The producer's own view of how sales respond to his price, based on expected rival and entrant reactions — determinate in his mind, unlike the indeterminate 'real' curve."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Kaldor 1935: what happens with free entry and no economies of scale?", "b": "Entry continues until each firm's demand is infinitely elastic: perfect competition establishes itself. 'The mathematical economists … weren't such fools after all.'"}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Kaldor 1935: why don't economies of scale guarantee tangency?", "b": "An entrant needs a minimum output, which may push all firms into losses; indivisibility shields existing profits and gives a monopolistic advantage to whoever is first in the field."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Define 'institutional monopoly' (Kaldor 1935).", "b": "Anything — patent, copyright, trade-mark, trade-name, unique resources, buyers' inertia — preventing a rival producing an identical product at the same relative cost."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Kaldor 1935 policy footnote: what follows from a uniform taxi fare?", "b": "Too many empty taxis — price agreements without output limits generate excess capacity (likewise under-employed professionals, too many tobacco shops)."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Which 1937 article accepted Kaldor's point that full free entry means anyone could produce an identical product?", "b": "Chamberlin, 'Monopolistic or Imperfect Competition?' (#63), recording a 'change of view': free entry is incompatible with a differentiated product."}, {"id": "58", "who": "Kaldor 1935", "g": "E", "f": "Kaldor 1935 on welfare: why can't excess capacity be called consumers' choice of variety over cheapness?", "b": "Consumers are never actually offered the choice between fewer varieties at lower prices and more varieties at higher prices."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935: when is output 'ideal'?", "b": "When the value of the marginal social product of each marginal unit of a factor is the same in a use as in its alternative occupation."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935: with widespread external economies, which industries should be expanded?", "b": "Those with above-average external economies (per unit increase of employment); those below the average should contract."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935: what tacit assumption reconciles Pigou's rule with Kahn's?", "b": "That external economies and diseconomies are rare, so their average is about zero (Pigou's 'archetypal industry')."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Cloze: 'Dr. Clapham's economic boxes were full all the time, but the economists were looking on the {{c1::wrong shelf}}.'", "b": "wrong shelf (Kahn 1935, p. 13 — the boxes are public utilities/lumpy units to be subsidised)"}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935: ratio of marginal revenue to price?", "b": "(e − 1)/e, where e is the elasticity of demand for the individual firm; e is an inverse measure of imperfection."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935 (irrational imperfection, factors drawn from same industry): which way should hired factors and entrepreneurs move?", "b": "Opposite ways: hired factors into abnormally imperfect industries, entrepreneurs out — e.g. more labour in retailing but fewer shops."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935: what policy device brings an industry to the 'average degree of imperfection'?", "b": "A subsidy (or tax) on hired factors plus a lump-sum tax (or subsidy) per entrepreneur; at the ideal point they exactly offset."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Kahn 1935: when is an entrepreneur's marginal social productivity negative?", "b": "When firms produce at falling average cost of hired factors (irrational imperfection): society gains by concentrating the factors in fewer firms."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Distinguish rational from irrational market imperfection (Kahn 1935).", "b": "Rational: preferences reflecting real satisfactions (transport cost, lasting tastes). Irrational: from ignorance/inertia, causing no loss when the consumer is switched to another firm."}, {"id": "59", "who": "Kahn 1935", "g": "E", "f": "Which 1937 article cited Kahn's p. 20 disclaimer that 'imperfection of competition' carries no monopoly implications?", "b": "Chamberlin, 'Monopolistic or Imperfect Competition?' (#63), as evidence the imperfect-competition school treats monopoly and competition as mutually exclusive."}, {"id": "61", "who": "Harrod 1936", "g": "E", "f": "Harrod 1936: 'the leading principle of the theory of imperfect competition'?", "b": "That entrepreneurs tend to equate marginal cost to marginal revenue (criticised by Chamberlin 1937 as true under any market form)."}, {"id": "61", "who": "Harrod 1936", "g": "E", "f": "Harrod 1936: reward costs vs work costs?", "b": "Reward costs = rates of pay per unit of factor; work costs = number of such units required per unit of output."}, {"id": "61", "who": "Harrod 1936", "g": "E", "f": "Cloze: Harrod (1936) argues that in good times demand is apt to get {{c1::less elastic}} and competition more imperfect.", "b": "less elastic"}, {"id": "61", "who": "Harrod 1936", "g": "E", "f": "Harrod 1936: why does the elasticity of demand fall when incomes rise?", "b": "Searching for the cheapest market is a discommodity the richer buyer (or prosperous firm) can afford not to incur; habit makes buyers careless."}, {"id": "61", "who": "Harrod 1936", "g": "E", "f": "Harrod 1936 numerical example: average elasticity rises from 4 to 5 in a recession — effect?", "b": "Prices fall about 6¼ per cent and profits about 25 per cent."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Chamberlin 1937: what is 'monopolistic competition'?", "b": "A challenge to the view that monopoly and competition are alternatives: most situations are 'composites of both', grounded in product differentiation."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Chamberlin 1937: is the large-group tangency solution central to monopolistic competition?", "b": "No — it 'flows from certain heroic assumptions' and is 'mainly an expositional device', an intermediate stage of the theory."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Chamberlin 1937 on increasing returns and monopolistic competition?", "b": "Falling costs at equilibrium are a result, not part of the definition; increasing returns are 'neither necessary nor sufficient'. The demand curve's shape marks the contrast with pure competition."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Chamberlin 1937: does a larger number of differentiated sellers make firm demand curves approach the horizontal?", "b": "No general presumption: new firms may expand the area or appeal to new buyers; on a line the curve keeps its slope; numbers depend on how broadly the field is defined."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Cloze: Chamberlin (1937), following Kaldor, holds that full 'freedom of entry' is quite incompatible with a {{c1::differentiated product}}.", "b": "differentiated product"}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "How does Chamberlin say Robinson defines a 'monopolist', and his jibe?", "b": "As any individual seller, even under perfect competition — like calling either rail of a railway a 'monorail' or a polygamist's relation with one wife 'monogamy'."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Why does Chamberlin call 'imperfect competition' a 'purely negative' term?", "b": "It merely admits real competition is imperfect, keeping competition and monopoly as non-overlapping categories with minimal interference to old habits of thought."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Chamberlin 1937: three consequences of the monopolistic vs imperfect conception?", "b": "(1) Profits — genuine monopoly profits pervade the system; (2) competitive norms — pure competition is no ideal, variety matters; (3) 'exploitation' — all factors get less than MPP×price."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Chamberlin 1937: why is the entrepreneur not the 'exploiter' under monopolistic competition?", "b": "All shares are paid less than the value of their marginal physical product; Robinson's argument wrongly treats entrepreneur and firm as one indivisible unit, but entrepreneurship is divisible."}, {"id": "63", "who": "Chamberlin 1937", "g": "E", "f": "Date card: Chamberlin's 'Monopolistic or Imperfect Competition?' — where/when?", "b": "QJE, August 1937 (vol. 51, pp. 557–580); parts given at the AEA meeting, Chicago, December 1936."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Coase 1937 (Monopoly Price): what case does he examine?", "b": "A combine formed from the firms of a previously perfectly competitive industry, with no new entry — Robinson's 'comparison of monopoly and competitive output'."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Coase 1937: why might businessmen not set MC = MR?", "b": "Cost accounts make marginal cost hard to discover, demand curves are even harder to know, and dim awareness of the rule tends to entrench the status quo price."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Coase 1937: effect of uncertainty about the demand curve on monopoly price?", "b": "Price is raised step by step, each step revealing a new certain point — approaching but not reaching the monopoly price."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Coase 1937: monopolist who looks only at the short-run demand curve ends up where?", "b": "Above the long-run monopoly price (OP1), since the short-run curve is less elastic above the current price."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Cloze: Coase (1937) argues that 'the notion of a long-run demand curve is in the nature of a {{c1::fiction}}'.", "b": "fiction — because price changes provoke experiments with substitutes that shift demand"}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Coase's examples of price rises permanently lowering demand?", "b": "Greek currant monopoly → people tried raisins; Stevenson rubber restriction → reclaimed rubber research; also tin restriction schemes."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Coase 1937: short-run vs long-run outcome of monopoly compared with Robinson?", "b": "At first less restriction than Robinson's construction suggests; in the long run, as demand becomes lower and more elastic, more restriction."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Whose phrase 'The best of all monopoly profits is a quiet life!' does Coase use, and to what end?", "b": "Hicks (Econometrica 1935); Coase argues it keeps price below the profit-maximising level and slows invention and progress."}, {"id": "64", "who": "Coase 1937", "g": "E", "f": "Don't confuse: Coase's 1937 RES article in this set vs 'The Nature of the Firm'?", "b": "#64 is 'Some Notes on Monopoly Price' (RES, Oct 1937). 'The Nature of the Firm' (Economica, Nov 1937) is not in the folder."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Burns 1937: what should be the central objective of industry studies?", "b": "The analysis (generalised explanation) of the behaviour of prices, aimed at improving general price theory."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Burns 1937: the three categories of 'competitive individualism' now unsuitable?", "b": "The entrepreneur, the competitive market, and the rational individual buyer."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "What does Burns mean by the 'disintegration of the entrepreneur'?", "b": "Functions once under 'a single hat' — risking capital and making price/production policy — are dispersed within the corporation (ownership vs control) and via contracts."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Burns 1937: three relocations of function accompanying the entrepreneur's disintegration?", "b": "(1) Larger scale relative to markets; (2) changed integration of activities (reintegration); (3) transfer of appraising utilities from buyer to seller (sales promotion)."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Cloze: Burns: with sales promotion, the tendency toward normal profits works out partly through the {{c1::raising of costs}}, not falling prices.", "b": "raising of costs"}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Burns 1937: example of an industry where geographical market definition leads to basing-point pricing?", "b": "Cement — many plants nationally but few competing sellers in each area, with overlapping 'chain' markets."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Burns 1937 presented where and when?", "b": "Round table of the American Economic Association, Chicago, December 1936; published JPE October 1937."}, {"id": "65", "who": "Burns 1937", "g": "E", "f": "Burns 1937: why does integration complicate price analysis?", "b": "It blurs costs: costs at each stage and of different products require arbitrary allocations (e.g. of management), and it removes the market as a check on efficiency."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Kaldor 1938: what is the 'heart of the whole matter' that makes MR important?", "b": "The relation of price to marginal cost, which depends on demand elasticity at equilibrium, i.e. on the position of MR."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Kaldor 1938: Chamberlin's 'fundamental' confusion on numbers of firms?", "b": "Confusing slope with elasticity: a leftward shift with unchanged slope still raises elasticity, moving price toward marginal cost."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Cloze: For Kaldor (1938), the slope of a demand curve, though not its elasticity, is a matter of the {{c1::scale of drawing}}.", "b": "scale of drawing"}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Kaldor 1938 on Chamberlin's 'infinite number of infinitesimal firms' objection?", "b": "Pure competition arrives once producers take price as given and set P = MC; it does not require infinitely many firms."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "What did Kaldor (1938) regard as Chamberlin's 'great achievement', now disclaimed?", "b": "Showing that monopoly-like situations can coexist with full freedom of entry — monopoly without privilege, from economies of scale and small demand per variety."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Kaldor 1938 example contrasting privilege vs scale-based monopoly?", "b": "The company store in a company town (privilege) vs Henry Ford (economies of large-scale production)."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Kaldor's 1938 terminological proposal?", "b": "'Monopoly' = institutional privilege; 'imperfect competition' = limitation from economies of scale with free entry; 'monopolistic competition' = limitation from restriction of entry."}, {"id": "66", "who": "Kaldor 1938", "g": "E", "f": "Which paper said Chamberlin had 'fallen a victim to' sellers' tendency and 'is trying to differentiate his product too far'?", "b": "Kaldor, 'Professor Chamberlin on Monopolistic and Imperfect Competition', QJE May 1938."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Machlup 1939: four groups for whom a theory may be 'practical'?", "b": "Pure theorist, applied analyst, government official (political economist), businessman — only applied analysis and government control count here."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "What is 'polypoly' (Machlup)?", "b": "A market where very many sellers compete, each believing rivals won't react to what he does."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Machlup 1939: how is oligopoly defined?", "b": "Subjectively — the seller consciously includes in his calculations the reactions he expects from rivals."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Machlup 1939: two consequences of vague oligopolistic conjectures?", "b": "Price rigidity and increased selling costs."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Machlup 1939: polypoly with differentiated products vs pure competition?", "b": "He surmises prices and output would not be much different — and such markets usually break into small oligopolistic groups."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Cloze: Machlup says the existence of so much oligopoly is a bad blow for {{c1::general equilibrium theory}}.", "b": "general equilibrium theory"}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "What did Machlup conclude from his ten years as an industry executive?", "b": "Neither differentiation nor oligopoly much affected decisions (demand was highly elastic); sensible businessmen act as economists suppose, though they rationalise misleadingly."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Why does Machlup invoke Mr. Firestone's breakfast?", "b": "Oligopoly prices depend on decisions of a few individuals, so theory faces limits that mass (law-of-large-numbers) behaviour does not."}, {"id": "69", "who": "Machlup 1939", "g": "E", "f": "Date card: Machlup's AER evaluation — presented when?", "b": "AEA Round Table, Detroit, 29 Dec 1938; published AER June 1939."}];
const BYID=Object.fromEntries(PAPERS.map(p=>[String(+p.id),p]));
const refIds=list=>{const o=new Set();[].concat(list||[]).forEach(s=>(String(s).match(/#(\d{1,2})\b/g)||[]).forEach(m=>{const k=String(+m.slice(1));if(BYID[k])o.add(k)}));return[...o]};
const redact=(s,author)=>{let t=String(s);String(author).split(/[^A-Za-z']+/).filter(w=>w.length>2&&!/^(and|the|Mrs)$/i.test(w)).forEach(w=>{t=t.replace(new RegExp('\\b'+w.replace(/'s$/,'')+"('s)?\\b",'gi'),'▒▒▒▒')});return t};
const volArg=a=>{if(!a)return 0;const s=String(a).toUpperCase().replace(/^VOL(UME)?/,'');return KEYS[s]||(+s>=1&&+s<=6?+s:0)};

/* ------------------------------------------------ #04 */
{id:'04',year:1886,who:'Hadley',title:'HADLEY 1886 · PRIVATE MONOPOLIES AND PUBLIC RIGHTS',secs:[
 {h:'Why railway competition destroys itself',beats:[
  ["October 1886. The very first issue of the Quarterly Journal of Economics. Arthur Hadley asks what railways teach about competition.","Old transport law had a neat split. The *highway* was public, a natural monopoly. The *carrier* was private and competed. A railway is road and carrier at once, so the split broke."],
  {fig:'steps',a:[{title:"HADLEY'S FOUR WAYS OUT (p. 31)",lines:['1 keep road and carrier separate','  fails: the railway undercuts outside carriers','2 state monopoly','  rejected: he refuses the socialist inference','3 parallel competing private roads','  fails: wasteful, ends in a rate war','4 admit monopoly, keep public rights of control','  his choice']}]},
  ["Now the core argument. In a fight for traffic, any rate above operating expenses pays something. So *fixed charges* are ignored, just as rent does not enter the price of wheat. Rates fall toward operating cost and leave nothing for interest or repairs.","So far railways look like farms. Then comes the twist."],
  ["Farming has *diminishing return*: push output and each extra bushel costs more, which stops the price war. Railways do not. Extra traffic is handled at better and better advantage. In Hadley's words, \"there is thus no direct limit to this cut-throat competition.\""],
  {fig:'bars',a:[{title:'A RATE WAR (illustrative, not his numbers)',rows:[['full cost',100,'interest + operating'],['rate, month 1',90,''],['rate, month 3',70,''],['rate, month 6',55,''],['operating exp.',50,'the only floor']],max:100,note:'nothing left for fixed charges; consolidation follows'}]},
  ["The war has one exit: *consolidation*. On the way it brings discrimination between shippers and unstable rates. Write it this way for the exam: large fixed investment plus no diminishing return means *ruinous competition*, and ruinous competition ends in combination."]],
  q:[mc("In Hadley's argument, why is railway competition more disastrous than agricultural competition?",["Railways are not subject to diminishing return, so the war has no limit","Railways have higher operating expenses than farms","Railway owners are more reckless than farmers","Farmers combine more easily than railways"],"He says it is general economic law, not recklessness: no diminishing return means no natural stop."),
     tf("True or false: Hadley says a railway in a rate war will cut rates toward operating expenses, ignoring fixed charges.",true,"Fixed charges are disregarded just as rent is ignored in the price of wheat."),
     fill("Hadley: fixed charges are ignored in a rate war just as ____ does not enter the price of produce.",['rent'],"The farm analogy on p. 35.")],
  sa:[sa("Why does Hadley's railway rate war have no natural limit?","No diminishing return: extra traffic gets cheaper to carry.",[['diminish','increasing return','cheaper','cheap','advantage'],['return','traffic','cost','carry']]),
      sa("How does Hadley say railway competition ends?","In consolidation of the competing roads.",[['consolidat','combin','merg','monopol','amalgam']],1)],
  line:"fixed charges are ignored so railway rate wars end in consolidation"},

 {h:'Regulated combination, and factories next',beats:[
  ["If competition cannot work, what should the state do? Hadley rejects forcing it. He also rejects fixing rates by law: the Granger laws \"proved so bad\" in their first consequences. And he rejects state ownership.","His tools are two: *equality of treatment* between shippers, and *publicity* of management. Leave the absolute rate to the managers."],
  {fig:'events',a:[{title:'THREE PHASES OF US RAILWAY LAW (p. 44)',events:[['phase 1','forced active competition: failed'],['phase 2','shippers dictate rates (Granger): worse'],['phase 3','accept combination + publicity'],['next?','factory law may follow the same path']]}]},
  ["His line to quote: \"regulated combination is better than irresponsible competition.\" (p. 39). Report: accept, with the reviewer noting that the author is extremely sure of himself."],
  ["Then he generalises. Any industry with large permanent investment behaves like a railway. He borrows the phrase *law of the increasing return* from H. C. Adams (#07). Price wars alternate with monopoly prices: Standard Oil, coal, steel rails.","He calls this monopoly from *capital organization* the type \"characteristic of the present day\". Legal monopoly is largely past; natural monopoly means things like land."],
  {fig:'chain',a:[{title:'WHERE HADLEY SITS',nodes:['ADAMS #07','HADLEY #04','CLARK #05','GIDDINGS #06'],caps:['lends the law of the increasing return','railways: accept and regulate combination','reaches a parallel accept-and-regulate view','footnotes Hadley as a pessimist, p. 65'],end:'Bullock #12 (1901) files Hadley with the inevitabilists',token:'[R]'}]},
  ["Place him in the debate. Hadley responds to old transport law, the Granger Cases, and Adams (#07). Clark (#05) agrees. Giddings (#06) footnotes him among those who wrongly predict competition's suppression. Bullock (#12) lists his later writings among those blaming trusts on destructive competition."]],
  q:[mc("Which remedy did Hadley (1886) recommend for railways?",["Accept combination, with equality of treatment and publicity","State ownership of all railways","Legislated maximum rates, as in the Granger laws","Forced competition through parallel roads"],"He rejects the other three explicitly."),
     mc("From whom did Hadley borrow the 'law of the increasing return'?",["H. C. Adams","J. B. Clark","Alfred Marshall","F. H. Giddings"],"He credits Adams (#07) on p. 40 to extend the argument to factories."),
     tf("True or false: Hadley thought the railway case was special and would not extend to manufacturing.",false,"He predicts factory law will follow the railway path.")],
  sa:[sa("Hadley's two tools for regulating combined railways?","Equality of treatment and publicity of management.",[['equal','discriminat'],['public','publicity','disclos']]),
      sa("Hadley's famous line about combination?","Regulated combination beats irresponsible competition.",[['regulat'],['combin'],['irresponsib','competi']],2)],
  line:"regulated combination is better than irresponsible competition"}
]},

/* ------------------------------------------------ #05 */
{id:'05',year:1887,who:'Clark',title:'CLARK 1887 · THE LIMITS OF COMPETITION',secs:[
 {h:'Federations of giants',beats:[
  ["March 1887, Political Science Quarterly. J. B. Clark opens with Ricardo. Ricardo built permanent laws on a passing age: a *struggle for existence* between unequal rivals. Clark calls it *economic Darwinism*.","That contest is nearly over. The weak are gone. The survivors are few, strong and nearly equal. Further war would ruin all of them, so they combine."],
  {fig:'crowd',a:[{title:'ECONOMIC DARWINISM (sketch)',n:40,per:20,off:'o',on:'.',stages:[{frac:0.4,cap:'unequal rivals: the weak are killed out'},{frac:0.75,cap:'few strong, nearly equal survivors left'},{frac:0.9,cap:'"armed neutralities and federations of giants"'}]}]},
  ["Clark's phrase for the new era: \"armed neutralities and federations of giants\" (p. 47). His examples of employers' combinations: glass, wall-paper, cut nails, screws, files, spool silk, anthracite, steel rails."],
  ["His verdict: combinations \"are to be accepted, studied, and, probably, regulated\" (p. 55). Suppressing them would mean social retrogradation and economic loss. Permanent suppression is impossible anyway; temporary repression drives them into illegal forms or restarts the internecine war."],
  {fig:'steps',a:[{title:'WHEN DOES AN INDUSTRY COMBINE? (Clark)',lines:['few producers, not thousands','  (agriculture has far too many)','nearly equal strength','a portable product','  silk: freight costs almost nothing','  baskets: bulky, local makers survive','cheap freight and tariffs help']}]},
  ["Write it this way. Clark: combination is a *normal product of evolution*, not a crime. Accept and regulate it. Note he says \"probably\" regulated. He is less sure than Hadley (#04) about the state's role, but lands in the same place."]],
  q:[mc("What did Clark (1887) recommend doing with producers' combinations?",["Accept, study and probably regulate them","Suppress them by criminal law","Nationalise them as state monopolies","Ignore them, since pools always collapse"],"p. 55: suppression means social retrogradation."),
     mc("Why, for Clark, does silk combine nationally while baskets do not?",["Silk is portable; bulky baskets carry high freight","Silk has more producers than baskets","Basket makers are protected by patents","Silk is not covered by the tariff"],"Portability lets a cheap mill reach the whole country."),
     tf("True or false: Clark read Ricardo's competition as the economics of a transitional era.",true,"Economic Darwinism between unequal rivals, now nearly over.")],
  sa:[sa("Clark: what kind of firms end up combining?","A few strong, nearly equal surviving firms.",[['few','small number'],['equal','strong','giant','surviv']],1),
      sa("Clark's verdict on combinations in one phrase?","Accept, study and probably regulate them.",[['accept','studi','study'],['regulat']])],
  line:"combinations are normal products of evolution to be accepted and regulated"},

 {h:'Horizontal strata and residual competition',beats:[
  ["Clark's second target is Cairnes's *non-competing groups*. Cairnes grouped workers by class qualification. Competition across groups was only potential: the next generation choosing a better trade.","Clark says machinery and education have erased those class lines. Only unions might rebuild them artificially."],
  {fig:'steps',a:[{title:"CLARK'S FURNITURE GROUP (p. 56)",lines:['finishing        <- competes only with finishers','cabinet making','transporting','lumber dealing   (each layer: capitalists + men)','wood cutting     <- raw-material stage','before combining: war inside a layer','after combining: war across the layers']}]},
  ["Real competition runs along *horizontal strata* of production. A lumber dealer undersells lumber dealers, not cabinet makers. So the groups that compete are the groups that combine.","Then two kinds of limit. Fixing prices limits *actual competition*. Restricting output limits *potential competition*: the flow of labour and capital between strata."],
  {fig:'compare',a:[{left:{h:'CAIRNES',lines:['groups by class','qualification','competition: potential','(next generation)']},right:{h:'CLARK 1887',lines:['groups by stage of','production','competition: actual','(who undersells whom)']},note:'Giddings #06 adds a third grouping: by mental capacity'}]},
  ["What checks a combination's price? *Residual competition*, in two forms. Actual: rivalry among pool members of roughly equal strength. Potential: between the whole combination and the rest of society. Prices are held by competition in \"latent and residual\" forms."],
  ["Clark then hands off. He leaves the study of residual competition to someone whose analysis derives weight from \"practical observation\" (p. 58). The next article in the same issue is Giddings (#06), who does exactly that. Clark parallels Hadley (#04). Bullock (#12) later discusses Clark's *later* papers on potential competition and calls that argument consistent."]],
  q:[mc("How do Clark's competing groups differ from Cairnes's non-competing groups?",["Clark groups by stage of production; Cairnes by class qualification","Clark groups by mental capacity; Cairnes by industry","Clark groups by region; Cairnes by stage of production","Clark groups by firm size; Cairnes by wage level"],"Grouping by mental capacity is Giddings's addition."),
     fill("Clark: price-fixing limits actual competition; restricting output limits ____ competition.",['potential'],"Potential = the transfer of labour and capital between groups."),
     tf("True or false: after combination, Clark says the industrial war is fought across the horizontal lines, between strata.",true,"Lumbermen against transporters and furniture makers, not lumbermen against lumbermen.")],
  sa:[sa("Clark's two forms of residual competition?","Actual among pool members; potential from outside capital.",[['actual','member','inside','within'],['potential','outside','societ']]),
      sa("Who answered Clark in the same PSQ issue?","Giddings, The Persistence of Competition.",[['gidding']],1)],
  line:"competition and combination both run within horizontal strata of production"}
]},

/* ------------------------------------------------ #06 */
{id:'06',year:1887,who:'Giddings',title:'GIDDINGS 1887 · THE PERSISTENCE OF COMPETITION',secs:[
 {h:'Competition is conserved, pools are unstable',beats:[
  ["Same journal, same issue, the very next article. Franklin Giddings takes Clark's (#05) framework and pushes back on emphasis. Hadley (#04) and Clark forecast that competition will be suppressed. Giddings says it will not be destroyed, only converted."],
  ["His odd but memorable reason: competition in some form is \"an implication of the conservation of energy.\" People have unequal energy, so their activity is unequal. When market competition seems suppressed, ask where its forces went.","Two errors to avoid: assuming competition is absent because it is not visible, and ignoring it because it is imperfect."],
  {fig:'steps',a:[{title:'WHY A POOL CANNOT HOLD (pp. 65-67)',lines:['members are unequal, and their fortunes shift','some members cheat on the agreement','outside capital keeps accumulating','high prices invite new capital in','"The combination equilibrium may be,"','"at best, an unstable one." (p. 66)']}]},
  ["Then the facts. One adult's daily supplies cost 43.53 cents in 1870 and 30 cents in 1885, despite the pools. Nail mills grew from 68 to 79 in 1883. The anthracite pool of 1873 broke in 1876.","In the wall-paper pool, one member paid $10,000 a year in forfeits rather than stop underselling."],
  {fig:'bars',a:[{title:'GIDDINGS: POOLS FAIL TO HOLD (pp. 67-69)',rows:[['supplies 1870',43.53,'43.53 cents'],['supplies 1885',30,'30 cents'],['nail mills before',68,'68 mills'],['nail mills 1883',79,'79 mills']],max:80,note:'prices fell and capacity grew despite the pools'}]},
  ["His estimate: probably not one-tenth of the combinations limited competition for long. Write it this way: Giddings is an early empirical case that cartels are unstable, through cheating, entry and the trade cycle."]],
  q:[mc("According to Giddings (1887), competition is permanent because it is an implication of what?",["The conservation of energy","The law of diminishing return","The struggle for existence","The mobility of capital"],"Unequal energies produce unequal activity."),
     mc("Which fact did Giddings use to show a pool failing?",["A wall-paper pool member paid $10,000 a year in forfeits","Standard Oil's transport rebates","Railway rates fell to operating expenses","Silk mills shipped nationally at no cost"],"Rather than stop underselling, he paid the fine."),
     tf("True or false: Giddings agreed with Hadley that competition was being suppressed.",false,"He footnotes Hadley among the pessimists and disagrees.")],
  sa:[sa("Giddings: why is the combination equilibrium unstable?","Unequal members cheat and outside capital enters.",[['cheat','unequal','undersell'],['capital','enter','outsid','new']],1),
      sa("What does Giddings say happens to suppressed competition?","It is converted into other forms, not destroyed.",[['convert','redirect','other form','new form','persist','conserv']],1)],
  line:"competition is never destroyed only converted into other forms"},

 {h:'Cross-cutting groups and the solvency line',beats:[
  ["Giddings adopts Clark's grouping by stage of production. Then he adds groups by *personal qualification*, from responsible brain work to automatic manual work, cutting across Clark's strata. A combination forms inside one cell of that grid."],
  {fig:'compare',a:[{left:{h:'NON-COMPETING GROUP',lines:['members compete with','each other','but not with outsiders']},right:{h:'COMBINATION',lines:['members do not compete','with each other','but do with outsiders']},note:'Giddings p. 71: an exam favourite'}]},
  ["Where are combinations easiest? Among the few producers of final, specialised goods: rails, nails, wire. Hardest among the many producers of crude materials, unless a natural or patent monopoly helps, as in anthracite and steel.","Capital shut out of a pooled field finds new utilities, as steel replaced iron. Inside a pool, rivalry moves to quality: the brass-goods combination."],
  {fig:'compare',a:[{left:{h:'NORMAL COMPETITION',lines:['drives price to cost','supplies demand fully','Ricardo assumed this','keep it']},right:{h:'ABNORMAL COMPETITION',lines:['chronic sale below cost','needs heavy fixed','charges and reserves','pools rightly curb it']},note:'combinations work only "below the solvency line" (p. 78)'}]},
  ["So pools are defensive and track depressions. A pool that holds prices high invites capital, and heavy fixed charges then make the fight ruinous. Pools must let price gravitate to cost of production. He even proposes \"combination actuaries\" to set fines for price-cutting.","Ricardo never assumed chronic selling below cost. Curbing that waste strengthens normal competition, so Ricardo stands."],
  ["Place it. Giddings answers Clark (#05) and footnotes Hadley (#04). Marshall (#08) independently notes trusts fail when they price too high. Bullock (#12) takes up the persistence theme in 1901. Do not write that Giddings is anti-combination. He accepts pools; he disputes how far they suppress competition."]],
  q:[mc("For Giddings, what is the difference between a combination and a non-competing group?",["Combination members compete with outsiders, not each other","Combination members compete with each other, not outsiders","A combination is legal; a non-competing group is not","A non-competing group is always a labour union"],"The non-competing group is the mirror image."),
     mc("What kind of competition did Giddings think pools could rightly suppress?",["Chronic selling below cost under heavy fixed charges","All competition between members","Competition in quality and new products","Competition from outside capital"],"Only competition 'below the solvency line'."),
     tf("True or false: Giddings thought combinations were easiest among many producers of crude materials.",false,"Easiest among few producers of final, specialised goods.")],
  sa:[sa("Which competition do pools curb, per Giddings?","Only ruinous competition below cost, below the solvency line.",[['below','solvency','ruinous','abnormal']],1),
      sa("Where does capital shut out of a pool go, per Giddings?","Into new products, substitutes, and better quality.",[['new','substitut','utilit','qualit','steel']],1)],
  line:"pools only curb competition below the solvency line so ricardo stands"}
]},

/* ------------------------------------------------ #07 */
{id:'07',year:1887,who:'Adams',title:'ADAMS 1887 · RELATION OF THE STATE TO INDUSTRIAL ACTION',secs:[
 {h:'Three classes of industry and the rule for state control',beats:[
  ["January 1887, Publications of the American Economic Association. Henry C. Adams says laissez-faire is a conservative maxim, not a scientific principle. Law should keep competition's benefits and guard against its evils.","Three evils of unregulated competition (p. 38): the worst competitor sets the moral level of a trade; society loses the benefits of monopoly; government is left weak."],
  ["Against the first evil, the state can *raise the plane of competition*. Factory laws on child labour or a normal working day do not restrict competition. They set its legal floor, encoding what the decent majority already wants."],
  {fig:'table',a:[{title:"ADAMS'S THREE CLASSES (pp. 55-59)",head:['returns','2x gives','3x gives','example'],rows:[['constant','2y','3y','retail'],['diminishing','2y','2 3/4 y','farming'],['increasing','2y','more than 3y','railways']],left:[0,3],note:'only the third needs state control'}]},
  ["Constant returns: retail is easy to enter, so competition regulates it. Diminishing returns: farming. \"There is no call for government farming.\" Increasing returns: an established firm can expand more cheaply than a newcomer can enter.","So \"free competition is powerless to exercise a healthy regulating influence\" (p. 60). Widening the old road beats building a new one. Parallel lines get built to be sold to the old road."],
  {fig:'steps',a:[{title:'THE INCREASING-RETURNS ARGUMENT',lines:['incumbent expands cheaply to meet new demand','a new rival cannot enter as cheaply','so competition cannot regulate it','= natural monopoly','choice: extra-legal monopoly or legal one','legal one runs on public financiering:','price = cost, accounts made public']}]},
  ["The rule to write: state control \"should be co-extensive with the application of the law of increasing returns.\" Mind two traps. Adams's increasing returns concern one established firm expanding, not Marshall's industry-wide economies. And high profit from *superior management* is a rent of talent, not monopoly profit.","Placement: Hadley (#04) borrows his law to reach factories. Marshall (#08) wants public control of indivisible industries but not state management."]],
  q:[mc("According to Adams (1887), which industries need state control?",["Industries of increasing returns","Industries of diminishing returns, like farming","Industries of constant returns, like retail","All industries with more than one firm"],"Control should be co-extensive with increasing returns."),
     mc("Why is competition powerless under increasing returns, for Adams?",["The incumbent can expand more cheaply than a rival can enter","Increasing returns raise costs for every firm","Consumers prefer to buy from many sellers","The state already owns these industries"],"Widening the old road beats building a new one."),
     tf("True or false: Adams said factory laws restrict competition and should be avoided.",false,"They raise the plane of competition without restricting it."),
     fill("Adams: under public financiering, price equals ____.",['cost','cost of service'],"Private firms charge the highest price that does not curtail profitable business.")],
  sa:[sa("Adams's rule for the reach of state control?","Co-extensive with the law of increasing returns.",[['increas'],['return']]),
      sa("Adams's example of a diminishing-returns industry?","Farming, so no call for government farming.",[['farm','agricult']],1)],
  line:"state control should match the reach of increasing returns"}
]},

/* ------------------------------------------------ #08 */
{id:'08',year:1890,who:'Marshall',title:'MARSHALL 1890 · SOME ASPECTS OF COMPETITION',secs:[
 {h:'Analysis, not dogma: the trust movement',beats:[
  ["September 1890, Leeds. Alfred Marshall gives the presidential address to Section F of the British Association, printed in the Journal of the Royal Statistical Society in December.","He opens with a method lesson from *Protection*. The old English economists dismissed new-country arguments, such as infant industries and increasing return in manufacture, as heresy. By killing the messenger they lost credibility. Do not repeat that with trusts."],
  {fig:'chain',a:[{title:"MARSHALL'S METHOD LESSON",nodes:['PROTECTION','DOGMA','LOST CREDIT','TRUSTS'],caps:['new countries had partly valid arguments','old economists condemned them wholesale','"killing the messenger" cost them belief','same risk now: analyse, do not denounce'],end:'combinations will be permanent, good and bad',token:'[!]'}]},
  ["Why is the movement stronger in America? England's Free Trade has kept increasing return from strengthening combinations as much as in protectionist America. And better transport makes pressure from combinations \"more extensive but less intensive\": wider areas, weaker grip at any point."],
  ["The American complaint, which he reports from a Congressional committee: firms with big plants sell at *Prime Cost* in slack times. Competition \"burns so furiously as to smother itself in its own smoke.\" Combination then looks like the only escape from ruin."],
  {fig:'steps',a:[{title:"MARSHALL'S REPLY TO THE ALARM",lines:['the trust movement is exaggerated','Standard Oil is special:','  natural and transport advantages','smart trusts follow a moderate price policy','high prices bring cheating, entry, anger','pools slide "on an inclined plane"','  toward full consolidation']}]},
  ["Why do pools slide into consolidation? A pool weakens each member's incentive to manage well, so work shifts to the best plants and power to the centre. And the law helps it along by banning pools while allowing a single amalgamated firm."]],
  q:[mc("What lesson from Protection did Marshall (1890) apply to trusts?",["Don't condemn wholesale what is partly valid; analyse it","Protection always produces trusts, so abolish tariffs","Infant industries should be run by the state","Increasing return makes free trade impossible"],"The old economists lost credibility by dogmatism."),
     fill("Marshall: the pressure of combinations is becoming more extensive but less ____.",['intensive'],"Wider area, weaker grip at any one point (p. 622)."),
     tf("True or false: Marshall argued that pooling tends to slide toward full consolidation.",true,"'On an inclined plane' toward amalgamation.")],
  sa:[sa("Where was Marshall's 1890 address given?","British Association Section F, Leeds.",[['leeds','british association','section f']],1),
      sa("Why do pools drift to consolidation, per Marshall?","Members lose incentive to manage well; power centralises.",[['incentive','manag','centr','power'],['weak','lose','less','shift','central']],1)],
  line:"economists must analyse trusts not condemn them as with protection"},

 {h:'The false antithesis and indivisible industries',beats:[
  ["The famous line: \"There seems to have been set up a false antithesis between competition and combination.\" (p. 626).","His examples: law condemned workmen's unions while the employer, himself a combination of capital, was let alone. Law bans pools and loose combinations while a single consolidated firm may do the same things. The Sherman bill interests him because it reaches individuals who monopolise."],
  {fig:'compare',a:[{left:{h:'STATE CONTROL',lines:['absolute, for gas,','water, railways','sometimes ownership','MARSHALL: yes']},right:{h:'STATE MANAGEMENT',lines:['run by a department','invites jobbery','less inventive','MARSHALL: no']},note:'Adams #07 was open to public management'}]},
  ["For *indivisible industries*, his name for gas, water, railways, tramways and electricity, public interference \"must be absolute\". But private management is more inventive and better at spotting talent.","His device: the public owns the franchise and leases it for limited years. Firms *compete for the franchise* on the price or quality of service they offer, not on rent paid."],
  {fig:'compare',a:[{left:{h:'COMPETITION IN',lines:['BARGAINING','buy low, sell high','"almost pure waste"','trusts save some']},right:{h:'COMPETITION IN',lines:['PRODUCTION','better goods, methods','serves the public','trusts lose this']},note:'monopolies still bargain on a large scale'}]},
  ["In ordinary trades, trusts' claim to stabilise industry is unproven, and many industries reach full economy at moderate size. The deeper point: trusts exploit *existing* knowledge; a multitude of independent firms produces *new* knowledge. That *inventive energy* is competition's chief service.","He ends between \"irresponsible competition\" and an \"ironbound socialism\": public control and public opinion. I have refereed many presidential addresses; this one has content."],
  ["Place it. Marshall answers the American trust debate and, unnamed, younger Americans under German influence. Compare Adams (#07) on control and Hadley (#04) on regulated combination. Bullock (#12) quotes Marshall that a monopoly must keep bargaining and manoeuvring on a large scale."]],
  q:[mc("What did Marshall mean by a 'false antithesis between competition and combination'?",["Law bans loose combinations but lets one firm do the same","Competition and combination always produce identical prices","Combination is merely a slower form of competition","Trusts and unions are both illegal"],"Unions condemned while the employer, a combination of capital, was not."),
     mc("Marshall's policy for indivisible industries such as gas and water?",["Public control, sometimes ownership, but private management","State management by a public department","Laissez-faire with free entry","Compulsory breakup into many small firms"],"Control yes, management no; franchise leasing."),
     tf("True or false: Marshall's main worry about large consolidations was that they add little new knowledge.",true,"Independent firms have superior inventive energy.")],
  sa:[sa("Marshall's franchise idea for indivisible industries?","Lease franchise; firms bid on price or quality.",[['franchis','leas'],['price','qualit','bid','compet']]),
      sa("What do independent firms offer that trusts lack, per Marshall?","Inventive energy producing new knowledge.",[['invent','new knowledge','innovat','new idea','progress']],1)],
  line:"competition versus combination is a false antithesis"}
]},

/* ------------------------------------------------ #12 */
{id:'12',year:1901,who:'Bullock',title:'BULLOCK 1901 · TRUST LITERATURE: A SURVEY AND CRITICISM',secs:[
 {h:'Large-scale production is not monopoly',beats:[
  ["February 1901, Quarterly Journal of Economics. Charles Bullock reviews the flood of trust writing from 1897 to 1900: Jenks, Ely, Collier, von Halle, Baker, the boosters Gunton and Dodd, the Industrial Commission.","He sorts it into eight classes. One camp treats trusts as inevitable, Hadley's later work among them. Another wants competition restored, Clark among them."],
  ["First: trusts are monopolies. Combinations controlling 65 to 95 per cent of output, and a wider margin between materials cost and price after combining, show \"monopolistic intent and monopolistic power\" (p. 185).","Then the key: readers must \"grasp firmly the distinction between large-scale production and monopoly.\""],
  {fig:'compare',a:[{left:{h:'LARGE-SCALE PRODUCTION',lines:['big independent plants','already the norm','not controversial']},right:{h:'MONOPOLY',lines:['one centralised company','replaces those plants','the real trust issue']},note:'pro-trust writers prove the left, claim the right'}]},
  ["The three pro-trust arguments, and why each fails. (a) Efficiency: savings on cross-freights, patents, idle plant and buying are small, and beyond a limit size monopoly breeds apathy. (b) Mass of capital to crush rivals: only temporary, and banning price discrimination removes it. (c) Ruinous competition: the over-investment comes mainly from tariffs and tax laws."],
  {fig:'bars',a:[{title:'POTENTIAL COMPETITION FAILS (p. 211)',rows:[['independent floor',100,'$1.00'],['trust price',99.9,'99.9 cents'],['trust cost',80,'80 cents']],max:100,note:'trust keeps ~19.9 of the 20-cent saving'}]},
  ["The killer example. If an independent needs $1 and the trust's cost is 80 cents, the trust can charge 99.9 cents and invite no entry. Consumers get almost nothing. So whoever believes in trust superiority cannot also rely on *potential competition*.","Clark's version is consistent, Bullock says, because Clark does not think monopoly more efficient."],
  ["Placement. Bullock answers the inevitabilists, including Hadley's line (#04), cites Clark's later papers (#05's line), quotes Marshall (#08), and echoes Giddings (#06) on persistence: trusts buy rivals because their competition is \"dangerous, and not hopeless\". Nothing in your set answers him; he closes group A. Remedy: remove privileges such as tariffs, rebates and patents."]],
  q:[mc("Which distinction does Bullock (1901) tell readers to grasp firmly?",["Large-scale production versus monopoly","Actual versus potential competition","Normal versus abnormal competition","Control versus management"],"The trust issue is replacing big independents with one company."),
     mc("In Bullock's example, independents need $1 and the trust's cost is 80 cents. What can the trust charge?",["99.9 cents, inviting no entry","80 cents, its cost","$1.20, a monopoly mark-up","90 cents, splitting the saving"],"Potential competition only stops price reaching $1."),
     tf("True or false: Bullock rejected Clark's potential-competition argument as inconsistent.",false,"He calls Clark consistent; his target is writers claiming trust superiority too.")],
  sa:[sa("What mainly causes 'ruinous competition', per Bullock?","Over-investment caused by tariffs and tax laws.",[['tariff','tax','protect','government']],1),
      sa("Why can't potential competition protect consumers from a superior trust?","Trust prices just below entrants' cost, keeps savings.",[['below','just under','99','entr','independ'],['keep','sav','pocket','consumer']],1)],
  line:"large scale production is not the same as monopoly"}
]}

],
gloss:[
['fixed charges',"Hadley's term for interest and other costs that do not vary with traffic; in a rate war they are ignored and rates fall toward operating expenses.","A railway cuts rates almost to operating cost, leaving nothing for interest.",['ruinous competition','operating expenses']],
['ruinous competition',"Price-cutting below full cost in industries with heavy fixed investment; Hadley says it ends in consolidation, Giddings calls it abnormal, Bullock blames tariffs.","Hadley's railway rate war, ended by consolidation.",['fixed charges','solvency line']],
['equality and publicity',"Hadley's remedies for combined railways: equal treatment of shippers and compulsory publicity of management, instead of rate-fixing or state ownership.","Regulated combination is better than irresponsible competition.",['ruinous competition']],
['economic Darwinism',"Clark's name for Ricardo's competitive struggle between unequal rivals, which he says belonged to a transitional age.","It ends in armed neutralities and federations of giants.",['residual competition']],
['horizontal strata',"Clark's groups by stage of production (wood cutting, lumber dealing, transport, cabinet making, finishing); competition and combination run within a stratum.","Lumber dealers undersell lumber dealers, not cabinet makers.",['non-competing groups','residual competition']],
['residual competition',"Clark: the competition left after combination; actual among pool members, potential between the combination and outside capital.","Prices held in check by competition in latent and residual forms.",['potential competition','horizontal strata']],
['non-competing groups',"Cairnes's grouping of workers by class qualification. Giddings: members compete with each other but not outsiders, unlike a combination.","Clark says machinery and education erased these lines.",['horizontal strata','combination']],
['combination',"For Giddings, a body whose members do not compete with each other but do compete with outsiders; an unstable, defensive equilibrium.","The wall-paper pool of 1880.",['non-competing groups','solvency line']],
['solvency line',"Giddings: combinations deal effectively only with competition below it, chronic selling below cost; normal competition to cost survives.","Pools must let price gravitate to cost of production.",['ruinous competition','combination']],
['increasing returns',"Adams: product rising more than in proportion as an established enterprise adds capital and labour, so it can expand more cheaply than a rival can enter.","Widening the old railway beats building a new one.",['natural monopoly','plane of competition']],
['plane of competition',"Adams: the legal floor (no child labour, a normal working day) that shapes competition without restricting it.","Factory laws raise the plane of competition.",['increasing returns']],
['false antithesis',"Marshall's charge that law treats combination as the opposite of competition, banning pools and unions while a single firm may do the same.","There seems to have been set up a false antithesis between competition and combination.",['indivisible industries']],
['indivisible industries',"Marshall's name for gas, water, railways, tramways and electricity: public control, sometimes ownership, but private management.","A franchise leased to the firm offering the best price or quality.",['false antithesis','increasing returns']],
['potential competition',"The threat of entry. Bullock: it can only stop price reaching the independents' cost, so it cannot protect consumers from a truly superior trust.","Trust cost 80 cents, entry at $1, price 99.9 cents.",['residual competition','large-scale production']],
['large-scale production',"Bullock: big independent plants, already normal and uncontroversial, as distinct from monopoly by one centralised combination.","Grasp firmly the distinction between large-scale production and monopoly.",['potential competition']]
],
