gloss:[
['cournot duopoly assumption',"Each of two sellers takes the rival's output as given and sets his own (Cournot 1838, context). Gives a determinate price between monopoly and competition.","Two mineral-spring owners; Amoroso's 5 and 8 at price 30.",['bertrand assumption','indeterminate','reaction curve']],
['bertrand assumption',"Each duopolist takes the rival's price as given, so each undersells while profit remains; the result is the competitive price, or no equilibrium (#11, #15).","Fisher: the more natural hypothesis, often tacitly adopted.",['cournot duopoly assumption']],
['marginal cost',"Fisher's (1898) verbal name for Cournot's φ′(x), to which price is equal under unlimited competition.","Cournot thereby anticipated Jevons, Menger and Walras.",['marginal gross revenue']],
["consumers' rent","Marshall's consumers' surplus; Fisher says Cournot lacked it, so his social-income chapters miss the triangle of loss.","Cournot counts only the rectangle TS′.",["consumers' surplus"]],
["consumers' surplus","Total benefit minus payment; Pigou 1904 says the monopolist can attack it because total benefit exceeds maximum monopoly revenue.","Taken by discrimination or by selling in parcels.",['discrimination','parcels']],
['discrimination',"Charging different units or groups different prices; needs goods hard to transfer between persons and through time (Pigou 1904). Dumping is discrimination between markets (Yntema).","Railways raising the charge per pound-mile for strong demand.",['parcels','dumping']],
['parcels',"Pigou 1904: refusing to sell except in lots of a fixed size, pushing the buyer onto the indifference curve through the origin so he keeps no surplus.","Needs four conditions: no buyer combination, no transfer, perishability, similar buyers.",['discrimination',"consumers' surplus"]],
['souvenirs',"Cournot's unpublished memoir of 1859, Moore's main source for his 1905 biography.","Basis of the portrait of a half-blind, independent scholar.",['cournot duopoly assumption']],
['five hypotheses',"Moore 1906: perfect competition bundles I max income, II one price, III negligible effect on price, IV negligible share of output, V ignore rivals.","Cournot uses I, II, V; Bertrand I, II and not-III, not-IV.",['indeterminate','perfect competition']],
['perfect competition',"For Moore 1906, all five hypotheses at once, as against competition in its essential sense (hypothesis I alone).","Labour gets what it produces only under all five.",['five hypotheses']],
['indeterminate',"No single stable price and quantity; price oscillates or is settled by bargaining (Edgeworth, via #15 and #20; Bowley #23).","Edgeworth: cutting and jumping go on for ever.",['five hypotheses','bilateral monopoly']],
['reaction curve',"A seller's best output for each output of the rival; Cournot's equilibrium is where two meet. Edgeworth 1922 says even that point vibrates for complements.","Curves FF′ and GG′ meeting at P (#20, p. 406).",['cournot duopoly assumption']],
['presumptions',"Edgeworth 1915: tendencies drawn from theory and experience, valid prima facie until cause to the contrary is shown; antecedent probabilities after Mill and Laplace.","A tax will reduce demand for the taxed thing.",['prime cost']],
['joint production proper',"Edgeworth 1915: one outlay yields both goods in fixed proportions; relative prices depend on demand.","Mill's gas and coke.",['rival production','prime cost']],
['rival production',"Edgeworth 1915: more of one good makes the other harder to produce; cost F(x+y) is its limiting case.","Tons of coal and copper carried by a railway.",['joint production proper','prime cost']],
['prime cost',"The cost of adding a unit of one product, other things equal; Edgeworth 1915 says it regulates competitive price where cost is F(x+y).","Same per ton for coal and copper, so rates tend to equality.",['rival production']],
['unitary cost',"Amoroso's curve of unitary costs: total cost divided by quantity, i.e. average cost (#20).","Edgeworth compares it to Pigou's construction.",['marginal cost']],
['kartel',"Edgeworth 1922: the quantity-setting convention of Cournot suits a kind of kartel, not monopolists free to vary price.","Amoroso's Primus 5, Secundus 8.",['cournot duopoly assumption']],
['bilateral monopoly',"A single seller facing a single buyer, here of a material (Bowley 1928); the result depends on who dictates the price, with no definite solution otherwise.","Steel-maker and ore monopolist; union and coal-owners.",['offer schedule','indeterminate']],
['offer schedule',"Bowley: the supplier's response to a dictated price, π = φ(x) + xφ′(x); the manufacturer's demand schedule is π = f(x) + xf′(x).","They cross at R0, the joint maximum.",['bilateral monopoly']],
['dumping',"Yntema 1928: selling abroad at a price that discriminates but is not necessarily below cost.","Lowers the home price if marginal cost falls.",['marginal gross revenue','discrimination']],
['marginal gross revenue',"Yntema's term for marginal revenue; set equal to the common marginal cost in each market.","Add the MR curves horizontally and cut with MC.",['dumping','marginal cost']]
],

/* ------------------------------------------------ #09 */
{id:'09',year:1891,who:'Taussig',title:'TAUSSIG 1891 · THE THEORY OF RAILWAY RATES',secs:[
 {h:'Not a tax: the joint cost of a railway',beats:[
  ["July 1891. F. W. Taussig of Harvard writes in the Quarterly Journal of Economics. His target is Gustav Cohn, a German writer on English railway policy.","Cohn says railway charges are like taxes. They follow the payer's means, his *Leistungsfähigkeit* or ability to pay. So rate-making is an ethical question, and the state should own or regulate the railways."],
  {fig:'compare',a:[{left:{h:'COHN (1883)',lines:['rates are like taxes','set by ability to pay','an ethical question','so: state ownership']},right:{h:'TAUSSIG (1891)',lines:['rates are like prices','set by joint cost','and by demand','ordinary value theory']},note:'Same facts: coal cheap, silk dear. Two explanations.'}]},
  ["Start with capital. Operating expenses take fifty to sixty per cent of gross receipts. The other forty to fifty per cent goes to interest and dividends, and that is a necessary cost.","But it fixes only the *general level* of rates in the long run. It plays no part in any *particular* rate. Any traffic that pays more than its own separate cost is worth carrying."],
  ["Now Mill's case of *joint cost*: wool and mutton, gas and coke. Wool will not be sold below the cost of shearing, nor mutton below the cost of dressing. That *separate cost* is the floor.","The rest of the cost is incurred for both together. How it is shared out depends on demand. Taussig says a railway is the same, only bigger."],
  {fig:'steps',a:[{title:'TAUSSIG: WHY DEMAND SETS RELATIVE RATES',lines:['plant and most operating outlay serve all traffic','(Sax: about three-quarters of expense)','each traffic must cover its small separate cost','the joint remainder cannot be assigned to any one','so it is spread according to demand','as with wool and mutton, or gas and coke']}]},
  ["Two pieces of evidence. On the early Pennsylvania road, officers doubted coal could pay two cents a ton-mile. A clear-headed officer saw that most expenses ran anyway. Coal was carried cheaply and the traffic grew large.","And Albert Fink's elaborate cost per ton-mile? Taussig says it represents no real thing: remove the ton and that expense would not disappear."]],
  q:[mc("What principle did Cohn use to explain railway rates, which Taussig (1891) rejected?",["Ability to pay, as with taxes (Leistungsfähigkeit)","Joint cost, as with wool and mutton","Cost of service per ton-mile","Discriminating monopoly, as in Cournot"],"Cohn's tax analogy made rates an ethical matter. Taussig replaced it with joint cost."),
     tf("True or false: Taussig (1891) held that the return on capital helps fix each particular railway rate.",false,"It fixes the general level of rates in the long run, but no particular rate."),
     fill("In Taussig's joint-cost account, no traffic is carried for less than its own ____ cost.",['separate','separable'],"Separate cost is the floor; the joint remainder is shared by demand.")],
  sa:[sa("Why, for Taussig 1891, does coal pay less than silk?","Costs are joint, so rates follow demand.",[['joint'],['demand']]),
      sa("What does return on capital determine, per Taussig 1891?","Only the general level of rates, not particular rates.",[['general','level','overall','total'],['not','no ']])],
  line:"railway costs are joint so relative rates follow demand"},

 {h:'Classification and the two senses of "what the traffic will bear"',beats:[
  ["The fruit of joint cost is *classification*. Coal and ores get low rates. Silks and dry goods pay high ones.","Watch one word. Taussig calls the demand for coal transport \"small\" and for silks \"large\". He means sensitivity to price, not tonnage. A big coal traffic comes only at low rates. Dry goods come even at high rates."],
  ["Germany tried the alternative. The \"car-space\" or \"natural\" tariff, first in Alsace-Lorraine, charged a terminal fee and then an equal rate per ton-mile on all goods.","It failed. Dear goods and cheap goods had little separate cost of their own. After a few years a classified tariff was back, with demand as the prime factor."],
  {fig:'compare',a:[{left:{h:'JOINT-COST SENSE',lines:['rates fit demand','even under competition','total pay = total cost','sets the APPORTIONMENT']},right:{h:'MONOPOLY SENSE',lines:['rates fit demand','to maximise net return','ignores cost','sets the LEVEL']},note:'"what it will bear in two distinct senses" (p. 457)'}]},
  ["Write this carefully. Taussig does not deny monopoly. A railway always has a monopoly over some traffic. Any one rate can reflect both factors: monopoly fixes the general range, joint cost the apportionment.","His claim is narrower and stronger. Classification would appear *even under free competition*."],
  {fig:'steps',a:[{title:'CONSEQUENCES TAUSSIG DRAWS',lines:['"reasonable" rates are well-nigh impossible to define','a state railway on tolls would still classify','  (against Hadley: not every item bears fixed charges)','"value of service" as exchange value is circular','Cohn\'s ethics "may be brushed aside"','railways: "extreme, but not anomalous" (p. 465)']}]},
  ["The jab at Cohn: nobody thinks rump steak is cheap out of mercy to the poor, or tenderloin dear as a tax on the rich. Note that Taussig still thinks the case for public management survives. Only Cohn's argument for it falls.","Debate: he answers Cohn, Hadley and the ICC. Pigou attacks him in Wealth and Welfare (1912, not in your folder). Taussig defends in #17, Pigou replies in #18, and Edgeworth backs Pigou in #19 (1915)."]],
  q:[mc("In what sense did Taussig call the demand for coal transport 'small'?",["Highly sensitive to price: much coal comes only at low rates","Small in tonnage compared with silks","Small because coal mines own their railways","Small because coal is carried only short distances"],"He means sensitiveness to change in price, not quantity."),
     mc("What, according to Taussig (1891), are the two senses of 'charging what the traffic will bear'?",["Adaptation to demand from joint cost, and from monopoly","Value of service, and cost of service","Ability to pay, and benefit received","Local discrimination, and long-haul discrimination"],"Monopoly sets the general level; joint cost sets the apportionment. A rate can reflect both."),
     tf("True or false: Taussig argued that even a state railway charging on the principle of tolls would still classify freight.",true,"Its own finances and the best use of the plant would push it to charge what traffic will bear.")],
  sa:[sa("Why did Germany's natural (car-space) tariff fail?","Goods had little separate cost; demand had to decide.",[['separate','joint'],['demand','classif']],1),
      sa("Taussig's rump steak analogy shows what?","Joint products are priced by demand, not mercy.",[['demand','joint'],['not','mercy','ethic','justice']])],
  line:"what the traffic will bear has a joint cost sense and a monopoly sense"}
]},

/* ------------------------------------------------ #16 */
{id:'16',year:1911,who:'Edgeworth',title:'EDGEWORTH 1911 · THEORY OF RAILWAY RATES I',secs:[
 {h:'Railways as monopoly, and the size of the dose',beats:[
  ["September 1911. F. Y. Edgeworth begins a series in the Economic Journal. Railways, he says, are the leading type of public works marked by monopoly of a kind that justifies state intervention.","Notice the frame. From the first page this is a monopoly problem, not a competitive one."],
  ["He plans five sections laid over Mill's five books: laws of return and cost; value under monopoly; *duopoly*; taxation under monopoly; state regulation.","Duopoly is a term he takes from Einaudi: two, or at most very few, dealers serving a numerous public. Your file holds Section I only. It ends \"(To be continued.)\""],
  ["Before rates, the laws of return must be exact. Edgeworth borrows Carver's farm table. Doses of five days' labour are added to a field, and the crop is counted.","Returns increase while each dose adds more than the last. The increment peaks at 120 bushels with the third dose. After that, returns diminish."],
  {fig:'table',a:[{title:"CARVER'S TABLE, AS USED BY EDGEWORTH (p. 351)",head:['days','crop','increment','crop per dose'],rows:[['5','50','50','50'],['10','150','100','75'],['15','270','120 ◀','90'],['20','380','110','95 ◀'],['25','450','70','90'],['30','510','60','85']],left:[0],note:'◀ peaks: increment at dose 3, average at dose 4'}]},
  ["The answer depends on the *size of the dose*. Use doses of fifteen days and the increments run 270, 240, 120: no increasing returns at all.","Railway version. Extra carriages on trains already running may give increasing return. Extra trains on a crowded track give decreasing return. A new track may give increasing return again."],
  {fig:'plot',a:[{title:'MARGINAL VS AVERAGE (Carver data)',xl:'doses 2 to 10 (5 days\' labour each)',yl:'bushels',xr:[2,10],yr:[0,130],curves:[{pts:[[1,50],[2,100],[3,120],[4,110],[5,70],[6,60],[7,50],[8,40],[9,30],[10,20]],ch:'m',name:'increment (primary)'},{pts:[[1,50],[2,75],[3,90],[4,95],[5,90],[6,85],[7,80],[8,75],[9,70],[10,65]],ch:'a',name:'average (secondary)'}],eq:[0,1],eqf:(x,y)=>'m falls below a near dose '+x.toFixed(1)+': average peaks',cap:'Two tests, two answers: dose 3 or dose 4'}]}],
  q:[mc("How does Edgeworth (1911) open his railway series?",["Railways are public works marked by monopoly that justifies state intervention","Railway rates are explained by joint cost, as with wool and mutton","Railway rates are taxes levied by ability to pay","Railways are competitive industries like cotton mills"],"Monopoly is the frame from the first page."),
     fill("Edgeworth took the term ____ from Einaudi for two, or very few, dealers serving a numerous public.",['duopoly'],"Planned as Section III of the series."),
     tf("True or false: in Carver's table, increasing returns end at the third dose on the marginal test and the fourth on the average test.",true,"Increment peaks at 120 (dose 3); crop per dose peaks at 95 (dose 4).")],
  sa:[sa("Why does the size of the dose matter for Edgeworth?","Different dose sizes give increasing or diminishing returns.",[['dose','size','carriage','train','track'],['increas','diminish','decreas','differ']]),
      sa("What term did Edgeworth borrow from Einaudi?","Duopoly.",[['duopoly']],1)],
  line:"whether returns increase depends on the size of the dose"},

 {h:'Primary for monopoly, secondary for competition',beats:[
  ["The general definition splits into two species. The *primary definition* compares successive increments: the marginal test, the criterion of a maximum. The *secondary definition* compares the average product per unit of outlay, measured from zero.","They can disagree, as Carver's table showed. So which one matters? It depends on the regime."],
  {fig:'table',a:[{title:'WHICH SENSE OF RETURNS FOR WHICH REGIME',head:['regime','maximises','sense'],rows:[['competition','(averages count)','secondary'],['private monopoly','amount of profit','primary'],['state monopoly','consumers\' surplus','primary']],left:[0,1],note:'"the greater of these is the primary" (p. 362)'}]},
  ["Under competition, averages matter and external economies come in, so the secondary sense fits.","Under monopoly the secondary sense is \"even fallacious\". Authors who say a monopolist maximises the average return on outlay are wrong: he maximises the amount of profit, not the rate. A state railway maximising consumers' surplus also needs the primary sense."],
  ["His Fig. 1A plots outlay against product, starting from a fixed outlay L for the road-bed. Up to P, primary increasing returns. Q is where a tangent from the origin touches: average increasing returns end there. R is the competitive optimum.","Competition works only beyond Q. A monopolist facing inelastic demand may stop between P and Q, even below P."],
  ["Many factors, and jumps. Some inputs come only in lumps, like the four-foot steps of the Great Pyramid: carriages, then trains, then tracks.","A big fixed outlay followed by variable outlay gives *Increasing Return par excellence*. It explains why railway net receipts rise more than in proportion to gross receipts, the fact Ripley used for American railways."],
  {fig:'plot',a:[{title:'FIXED + VARIABLE OUTLAY (sketch)',xl:'traffic',yl:'cost',xr:[1,10],yr:[0,24],curves:[{f:x=>20/x+3,ch:'A',name:'average cost'},{f:x=>3,ch:'v',name:'variable cost per unit'}],cap:'Fixed outlay spread thinner: average cost keeps falling'}]},
  ["Exam warning. This instalment only mentions joint cost: a footnote says joint cost and discrimination make a clean railway example hard to find. It takes no side between Taussig and Pigou, and it predates Wealth and Welfare (1912).","Edgeworth's verdict for Pigou comes in #19 (1915, group B). Yntema #24 (1928) builds on the primary definition. The rest of this series is not in your folder."]],
  q:[mc("Why does Edgeworth call the secondary (average) definition 'even fallacious' under monopoly?",["A monopolist maximises the amount of profit, not the rate on outlay","A monopolist always produces where average returns are rising","Under monopoly, external economies dominate","Monopolists cannot measure their average product"],"Amount, not rate, of profit: that needs the marginal test."),
     mc("Where does Edgeworth deliver his verdict for Pigou in the joint-cost dispute?",["In #19 (1915), not in this 1911 instalment","In this 1911 paper, Section I","In a reply printed after #18 in 1913","He never comments on the dispute"],"#16 predates Wealth and Welfare and takes no side. The verdict is #19."),
     tf("True or false: Edgeworth says a state railway maximising consumers' surplus should judge returns by the primary (marginal) sense.",true,"A maximum is characterised by the primary definition.")],
  sa:[sa("Define Edgeworth's primary sense of increasing returns.","Each successive dose adds more product than the last.",[['dose','increment','marginal','success','addition'],['more','greater','larger','rising','increas']]),
      sa("What is Edgeworth's Increasing Return par excellence?","Large fixed outlay followed by variable outlay.",[['fixed','road','permanent','overhead'],['variable','operat']])],
  line:"under monopoly the primary marginal sense of returns governs"}
]},

/* ------------------------------------------------ #17 */
{id:'17',year:1913,who:'Taussig',title:'TAUSSIG 1913 · JOINT COST ONCE MORE',secs:[
 {h:"Pigou's charge and Taussig's concession",beats:[
  ["In 1912 Pigou's Wealth and Welfare, chapter xii (not in your folder), named Taussig as sponsor of the joint-cost view and rejected it.","Pigou's charge: carrying tons from A to B is one homogeneous commodity, like plain cotton cloth sold at home and abroad. Calling it \"transport of copper\" and \"transport of coal\" is an \"accident of language\". Rate differences are discriminating monopoly."],
  ["February 1913. Taussig replies in a short QJE note. Two questions: is railway supply in fact joint? And if so, are the services homogeneous?","On the first, he gives ground. Transport from A to B and from B to C is not joint when each stretch is a full operating division. So *local discrimination* is a different problem from *classification*."],
  {fig:'compare',a:[{left:{h:'CLASSIFICATION',lines:['many goods, one stretch','coal vs copper A to B','mostly joint cost','Taussig: explained']},right:{h:'DISTANCE RATES',lines:['A to B vs B to C','division points','little joint cost','Taussig: conceded']},note:'Middle case: A to B en route to C (long and short haul)'}]},
  ["The middle case is through traffic, A to B on the way to C. That leads to the long-and-short-haul problem. There Taussig is not convinced that Pigou has refuted Hadley.","Over one stretch, he holds, cost is joint. Pigou already admits one case: *back loading*, the return haul."],
  {fig:'steps',a:[{title:'WHY ONE STRETCH IS JOINT SUPPLY',lines:['no service is "necessarily" produced with another','not even back loading: it has extra separable cost','but the greater part of total expense is joint','and a road must offer all services to pay','a coal-only or logging road: no joint cost at all']}]},
  ["So *classification* is the salient consequence of joint cost. A railway must offer many sorts of transport over one stretch to use its capacity, and for these its expenses are joint."]],
  q:[mc("What did Taussig concede to Pigou in February 1913?",["Transport over different long stretches (A to B, B to C) is not joint","Railway rates are mainly discriminating monopoly","Copper and coal transport are one homogeneous commodity","Back loading is not a case of joint cost"],"Distance and local discrimination are a separate problem from classification."),
     tf("True or false: Taussig (1913) says a railway carrying only coal would still show joint cost between its services.",false,"With one kind of traffic filling the plant, joint cost has no application."),
     fill("Pigou called the joint-cost doctrine the product of an 'accident of ____'.",['language'],"He meant the habit of saying 'transport of coal' rather than transport sold to coal merchants.")],
  sa:[sa("Which railway phenomenon does joint cost explain, per Taussig 1913?","Classification of freight and passengers.",[['classif']],1),
      sa("Which joint-cost case does Pigou himself admit?","Back loading, the return haul.",[['back','return']],1)],
  line:"joint cost explains classification not distance discrimination"},

 {h:'Homogeneous in demand, and the missing monopoly revenue',beats:[
  ["Now the second question. Taussig grants that railways supply one thing, \"place utility\". But that is not the sense that matters. What matters is the conditions of *demand*.","Tenderloin, sirloin, rump, round and flank are all beef. Their demand schedules differ, so they behave as joint products."],
  {fig:'compare',a:[{left:{h:'PIGOU: HOMOGENEOUS',lines:['physically one service','carriage of tons','like plain cotton cloth','so: discrimination']},right:{h:'TAUSSIG: NOT',lines:['demand schedules differ','copper vs coal','like cuts of beef','so: joint cost']},note:'Same word, two tests: physical sameness vs demand'}]},
  ["More cases. Cotton fibre and seed, his most striking case of joint supply, differ in demand curves. Pigou's own electricity, sold for light by night and power by day, is one thing physically, yet jointly supplied.","Copper has large value for small bulk. It can stand a rate that would stop coal. Pigou's own pages on rich and poor passengers, and dear and cheap goods, grant the essential thing."],
  {fig:'steps',a:[{title:'THE MONOPOLY-REVENUE TEST',lines:['if rates were discriminating monopoly...','no traffic would pay below specific cost','high payers would add monopoly revenue','so monopoly revenue should be large','British railways earn none, yet classify the same','so joint cost, not monopoly, explains it']}]},
  ["Why no monopoly profit? Railways are held back by habit and tradition, and more by public opinion and regulation or the fear of it.","Pigou, \"trained in the mathematical school\", applies monopoly price theory too readily. Taussig's verdict: a \"much restricted monopoly conducted under the conditions of joint cost\"."],
  ["Debate. This note answers Pigou 1912 and restates #09. Pigou replied in the May QJE and Taussig answered again; neither is in your folder. Pigou's August reply is #18, with a comment by Taussig. Edgeworth #19 (1915) backs Pigou.","Report on Taussig: accept. On Pigou's reading of him: major revisions."]],
  q:[mc("What does 'homogeneous' mean for Taussig in 1913?",["Having the same demand schedule","Being physically the same service","Being carried over the same distance","Costing the same per ton-mile"],"For Pigou, physical sameness; for Taussig, the same demand schedule."),
     mc("What empirical test did Taussig use against Pigou's monopoly explanation?",["Railways, notably British ones, earn no large monopoly revenue yet classify","Railway costs per ton-mile are equal for all goods","Railways charge less on long hauls than short","State railways do not classify freight"],"Discriminating monopoly should yield monopoly revenue; British railways show none."),
     tf("True or false: Taussig said railways are restrained from exploiting monopoly by habit, public opinion and regulation.",true,"Hence a 'much restricted monopoly'.")],
  sa:[sa("Why are copper and coal transport not homogeneous, per Taussig?","Their demand schedules differ.",[['demand'],['differ','not the same','distinct','vary']]),
      sa("What do British railways show, per Taussig 1913?","Classification without monopoly revenue.",[['monopoly'],['revenue','profit','return'],['no ','without','not','lack','little']])],
  line:"no monopoly revenue so joint cost not monopoly explains classification"}
]},

/* ------------------------------------------------ #18 */
{id:'18',year:1913,who:'Pigou',title:'PIGOU 1913 · RAILWAY RATES AND JOINT COSTS',secs:[
 {h:'Where they agree, and the narrowed dispute',beats:[
  ["August 1913, QJE. A. C. Pigou of Cambridge writes one more note, with Taussig's comment in the same issue. His view, he says, has not changed since Wealth and Welfare.","He frames it as policy for the Interstate Commerce Commission: admit the \"value of service\" principle, or aim at *uniform mileage rates*, equal per ton per mile? Like protection against free trade, nobody wants a sudden switch."],
  ["First, agreement. Where differential rates are what make a railway between two places profitable at all, both men want them. Pigou adds a reservation in favour of state bounties.","Pigou reaches this through monopoly theory, Taussig through joint cost. Where even the cheapest possible railway could not fill its capacity, the two approaches are \"equally suitable\"."],
  {fig:'table',a:[{title:'THE CASES, AS PIGOU SORTS THEM',head:['line pays...','policy','route'],rows:[['only if rates differ','discriminate','monopoly'],[' (cheapest not full)','discriminate','either'],['at uniform rates','uniform','DISPUTED']],left:[0,1,2],note:'The fight is only over the last row'}]},
  ["The dispute is narrowed to lines that would pay under uniform rates. Pigou admits jointness between A-to-B and B-to-A traffic, and a few minor cases. Otherwise: \"Professor Taussig sees jointness everywhere, and I see it nowhere\".","For argument's sake he even concedes that copper transport and coal transport are two things. The question left: are they supplied jointly?"],
  {fig:'chain',a:[{title:'THE EXCHANGE',nodes:['T 1891','P 1912','T Feb 13','P Aug 13','E 1915'],caps:['#09: classification from joint cost','Wealth and Welfare: one service, monopoly','#17: demand differs; no monopoly revenue','#18: common costs, not joint costs','#19: Edgeworth sides with Pigou'],end:'May 1913 note and rejoinder: not in your folder',token:'[$]'}]}],
  q:[mc("On which case do Pigou and Taussig agree in 1913?",["Discrimination is desirable where a line would not pay under uniform rates","Uniform mileage rates are always the ideal","Copper and coal transport are joint products","Railways earn large monopoly revenue"],"They agree at the goal, by different routes (p. 688)."),
     tf("True or false: Pigou (1913) opposed railway rate discrimination in all cases.",false,"He endorses it where a line would not otherwise pay, with a reservation for state bounties."),
     fill("Pigou framed the choice for the ICC as 'value of service' versus uniform ____ rates.",['mileage','ton-mile','ton mile'],"Equal rates per ton per mile.")],
  sa:[sa("By what route does Pigou justify discriminating rates?","Through the theory of discriminating monopoly.",[['monopol']],1),
      sa("What is the narrowed Pigou–Taussig dispute about?","Lines that would pay under uniform mileage rates.",[['pay','profit'],['uniform','mileage','equal']])],
  line:"both accept discrimination where a line would not otherwise pay"},

 {h:'Common costs, not joint costs',beats:[
  ["Taussig had written that railway supply is \"preponderately joint\": almost all the plant, and over half of operating expense, serve the traffic as a whole. Pigou does not dispute the fact.","He disputes the inference. A large mass of *supplementary expenses* does not mean joint cost of a kind that would make ton-mile rates unequal under free competition. Three arguments follow."],
  {fig:'steps',a:[{title:"PIGOU'S THREE ARGUMENTS (pp. 690-692)",lines:['1 ANALOGY: cotton mills and steelworks have','  heavy overheads; nobody calls batches sold','  to different markets "joint"','2 ANALYSIS: copper transport depends on one','  variable, total transport: COMMON costs','3 DIRECT: competing sellers shift supply to the','  dearer market until prices are level']}]},
  ["The analysis is the core. The supply price of cotton seed depends on two variables: seed output and the price of fibre. You cannot raise fibre without raising seed.","But a railway built for x tons of copper and y of coal can be altered to carry x + h of copper and the same y of coal. So copper and coal transport share *common costs*, not *joint costs*."],
  {fig:'compare',a:[{left:{h:'JOINT COSTS',lines:['cotton fibre and seed','more of one means more','of the other','prices can differ']},right:{h:'COMMON COSTS',lines:['copper and coal haul','outputs vary apart','overheads shared','competition: equal']},note:'Pigou #18. Taussig: the distinction is not vital.'}]},
  ["Conclusion: where a line pays under uniform rates, the ICC should aim at uniform mileage rates, special cases apart. \"Value of service\" has a stronger claim in the sparse Western states than the Eastern.","Taussig's comment: American complexity began in pioneer days and survives partly by tradition. Joint cost applies whenever the most profitable traffic alone cannot fill capacity. The New Haven fills its plant with passengers, then with lower-rate freight."],
  ["And the common/joint line is not vital, says Taussig. Electricity by night and day, back loading, a mail car on a passenger train: none is \"necessarily\" produced, yet Pigou calls them joint.","Debate: #18 answers #17 and Taussig's May rejoinder (not in your folder). Edgeworth #19 (1915) judges for Pigou. Bridge: Pigou already treated rates as monopoly discrimination in #13 (1904)."]],
  q:[mc("How does Pigou (1913) distinguish joint costs from common costs?",["Joint: one output cannot rise without the other; common: shared overheads, outputs vary separately","Joint: costs that are fixed; common: costs that vary with output","Joint: costs of a monopoly; common: costs under competition","Joint: costs paid by passengers; common: costs paid by freight"],"Cotton fibre and seed are joint; copper and coal transport only common."),
     mc("Which of these is NOT one of Pigou's three arguments in 1913?",["British railways earn no monopoly revenue","Factories also carry heavy overheads without joint supply","Copper transport's supply price depends on total transport only","Competing sellers would equalise prices across markets"],"The monopoly-revenue test is Taussig's (#17), used against Pigou."),
     tf("True or false: in his comment, Taussig said joint cost applies when a railway cannot fill its capacity with the most profitable traffic alone.",true,"His example is the New Haven: passengers first, then freight at lower rates.")],
  sa:[sa("Why are coal and copper transport only common costs, per Pigou?","One can be increased without increasing the other.",[['increas','more','vary','varied','expand','raise'],['without','separat','independ','apart']]),
      sa("What rate policy does Pigou 1913 recommend where lines pay?","Uniform mileage rates, equal per ton-mile.",[['uniform','equal','same'],['mile','ton']])],
  line:"copper and coal transport share common costs not joint costs"}
]}

],
gloss:[
['joint cost',"Cost incurred for several products or services together that cannot be assigned to any one of them; Taussig (#09) says relative prices are then set by demand. For Pigou (#18), costs are joint only if one output cannot rise without the other.","Wool and mutton; cotton fibre and seed; for Taussig, most railway plant and operating outlay.",['separate cost','common costs','classification']],
['separate cost',"Taussig's floor: the cost incurred for one item of traffic alone. No traffic is carried below it.","The cost of shearing for wool; the cost of moving one extra coal train.",['joint cost']],
['Leistungsfähigkeit',"Cohn's ability-to-pay principle: railway charges set like taxes, by the payer's means. Taussig (#09) brushes it aside.","Rump steak is not cheap out of mercy to the poor.",['joint cost']],
['what the traffic will bear',"Fitting rates to demand. Taussig (#09): two senses, one from joint cost (apportionment, even under competition), one from monopoly (the general level).","Coal pays little, silk much.",['classification','value of service']],
['primary definition',"Edgeworth (#16): returns increase when a further dose adds more product than the one before. The marginal test; the criterion of a maximum, relevant under monopoly.","In Carver's table, increasing returns end at the third dose.",['secondary definition']],
['secondary definition',"Edgeworth (#16): returns increase while average product per unit of outlay, measured from zero, rises. Suits competition; 'even fallacious' for monopoly.","In Carver's table, increasing returns last to the fourth dose.",['primary definition']],
['duopoly',"Edgeworth's term (after Einaudi), 1911: two, or very few, dealers competing for a numerous public.","Planned as Section III of his railway series.",['primary definition']],
['classification',"Charging different rates by commodity or passenger class over the same stretch. For Taussig the salient consequence of joint cost; for Pigou discriminating monopoly.","Coal and ores low; silks and dry goods high.",['joint cost','what the traffic will bear']],
['homogeneous',"Pigou: physically one service (carriage of tons, like plain cotton cloth). Taussig (#17): homogeneous only if demand schedules are the same.","Cuts of beef are all beef but differ in demand.",['classification','joint cost']],
['common costs',"Pigou (#18): overheads shared by several outputs that can still be varied separately; under competition they leave prices equal.","Copper and coal transport on one line.",['joint cost','uniform mileage rates']],
['uniform mileage rates',"Equal rates per ton per mile: the cost-of-service ideal Pigou (#18) sets for the ICC where a line pays under them.","Eastern states, not the sparse West.",['value of service','common costs']],
['value of service',"Rates set by what the traffic will bear. Taussig (#09) finds it circular as exchange value; Pigou (#18) grants it a stronger claim in sparse Western states.","Silk charged more than coal.",['uniform mileage rates','what the traffic will bear']]
],
