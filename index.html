/* ------------------------------------------------ #26 */
{id:'26',year:1913,who:'Young',title:"YOUNG 1913 · REVIEW OF PIGOU'S WEALTH AND WELFARE",secs:[
 {h:"Pigou's second curve",beats:[
  ["August 1913. Allyn Young, an American, reviews Pigou's *Wealth and Welfare* (1912, not in your folder) in the Quarterly Journal of Economics. Most of the review is praise. The pages on cost are not.","Those pages are the first shot of the cost controversy. Everything in this volume circles back to them."],
  ["Pigou draws two curves. The ordinary supply curve, SS1, gives the price that keeps each output going. His *curve of marginal supply prices*, SS2, shows how much each extra unit adds to the industry's total expenses.","Young renames SS2 the *curve of aggregate expenses*. Write that name down. Edgeworth (#21) later credits Young with it."],
  {fig:'plot',a:[{title:'PIGOU VIA YOUNG (sketch)',xl:'output of a diminishing-return industry',yl:'P',xr:[0,9],yr:[1,10],curves:[{f:x=>9.5-0.75*x,ch:'D',name:'demand'},{f:x=>2+0.5*x,ch:'s',name:'SS1 supply'},{f:x=>2+x,ch:'M',name:'SS2 aggregate expenses'}],eq:[0,1],eqf:(x,y)=>'competitive output ~'+x.toFixed(1)+' (D = SS1)',cap:'Pigou: ideal output is where D meets SS2, to the left'}]},
  ["Under diminishing returns SS2 lies above SS1. Under increasing returns it lies below. Competition stops where demand meets SS1, so Pigou concludes output is too large in the first case and too small in the second.","His policy: *tax* diminishing-return industries, give *bounties* to increasing-return ones. A perfectly discriminating monopolist, who equates demand with SS2, would do better than competition."],
  ["Young grants one thing: the curve is a fine tool for *monopoly*. And in a footnote he doubts Pigou's other prop. He says he \"cannot imagine\" external economies strong enough to give increasing returns to an industry whose firms each face diminishing returns. Robertson (#31) later quotes that footnote."]],
  q:[mc("What did Allyn Young (1913) call Pigou's 'curve of marginal supply prices'?",["The curve of aggregate expenses","The curve of final trade cost","The curve of marginal social net product","The curve of transfer elements"],"Young's name: it shows how much each extra unit adds to total industry expenses, rent included. Final trade cost is Shove 1928; transfer elements is Pigou 1928."),
     mc("On Young's summary, what policy did Pigou's two curves recommend?",["Tax diminishing-return industries, give bounties to increasing-return ones","Tax increasing-return industries, give bounties to diminishing-return ones","Nationalise all increasing-return industries","Leave all competitive industries alone"],"Competitive output is too big where SS2 lies above SS1 (diminishing returns), too small where it lies below."),
     tf("True or false: Young said Pigou's curve of marginal supply prices was useless for every purpose.",false,"He found it a fine tool for monopoly analysis (the perfectly discriminating monopolist). His objection is to its use for competition.")],
  sa:[sa("What does Pigou's curve of marginal supply prices measure?","How much each extra unit adds to total expenses.",[['total','aggregate','whole'],['expens','cost']]),
      sa("Which book was Young reviewing in 1913?","Pigou's Wealth and Welfare (1912).",[['wealth and welfare','wealth']],1)],
  line:"pigou's second curve counts what each unit adds to total expenses"},

 {h:'Rents are transfers, not resources used up',beats:[
  ["Now the core objection. Why does SS2 lie above SS1 in a diminishing-return industry? Because expansion bids up the rent of land on every unit, not just the last one.","Is that higher rent a social cost? Young says no. Higher prices for land \"merely represent transferences of purchasing power.\" Landlords gain what producers pay."],
  {fig:'steps',a:[{title:"YOUNG'S OBJECTION IN FIVE STEPS",lines:['industry expands under diminishing returns','rent rises on all the land it uses','so aggregate expenses rise faster than price','but higher rent uses up no extra resources','it is a transfer to landlords, not waste','so no case for taxing the industry']}]},
  ["Young pins the slip on one word. Pigou's *resources* sometimes means real services of labour and capital, sometimes entrepreneurs' money expenses. Mix the two and rent turns into waste.","Be consistent, says Young: measure cost and product both in money, or both in physical units. Either way you get back toward the old result that competition maximises the product."],
  ["Write it this way: Young 1913 first showed that Pigou's tax case counts *rents* as cost, but rents are *transfers*.","Do not confuse him with two later stories. The two-roads example is Knight 1924 (#30), attacking Pigou's 1920 book. And Young 1928 (#37) is a different paper, on the division of labour."],
  {fig:'chain',a:[{title:'ONE FOOTNOTE, ELEVEN YEARS',nodes:['YOUNG 13','KNIGHT 24','ROBERTSON 24','PIGOU 24'],caps:['#26: rents are transfers, not cost','#30 fn. 8 credits Young','#31 re-presses the point','reply in #31: "substantially valid"'],end:'Edgeworth (#21) and Pigou (#35) build it in',token:'[$]'}]},
  ["Placing it: Young answers *Wealth and Welfare*. Pigou's 1920 *Economics of Welfare* (not in your folder) replied, inadequately. Knight (#30) and Robertson (#31) took up the point; Pigou conceded in March 1924; Edgeworth (#21) admitted it in 1925; Pigou 1928 (#35) calls such items *transfer elements*."]],
  q:[mc("What was Young's central objection (1913) to Pigou's case for taxing diminishing-return industries?",["Higher rents are transfers of purchasing power, not resources used up","Diminishing returns never occur in manufacturing","No one can say which industries are in which box","The State lacks the information to set the tax"],"Clapham (1922) made the 'which box' point. Young's point is about rent."),
     tf("True or false: the two-roads example comes from Young's 1913 review.",false,"It comes from Pigou's Economics of Welfare (1920), as attacked by Knight 1924 (#30)."),
     fill("Young 1913: Pigou is inconsistent about the meaning of which word? (one word)",['resources','resource'],"Sometimes real services of labour and capital, sometimes money expenses.")],
  sa:[sa("Why are higher land rents not a social cost, per Young?","They transfer purchasing power to landlords; nothing extra used up.",[['transfer','redistribut'],['landlord','purchasing','nothing','no extra','not used','resourc']],1),
      sa("Who conceded Young's point in March 1924?","Pigou, in his reply appended to Robertson.",[['pigou']],1)],
  line:"higher rents merely transfer purchasing power they are not social cost"}
]},

/* ------------------------------------------------ #27 */
{id:'27',year:1922,who:'Clapham',title:'CLAPHAM 1922 · OF EMPTY ECONOMIC BOXES',secs:[
 {h:'The historian visits the hat factory',beats:[
  ["September 1922. The Economic Journal prints a paper by J. H. Clapham, an economic historian at Cambridge. He has been reading Pigou's *Economics of Welfare* (1920), nearly a thousand pages without one illustration of which industry goes where.","His complaint fits one image. Economists carry mental boxes labelled diminishing, constant and increasing returns. Nobody has ever opened one and said \"Increasing Return Industry, hats.\""],
  {fig:'compare',a:[{left:{h:'THE "ANALYTIC"',lines:['thinks in categories','boxes: laws of returns','then monopoly, taxes','conclusions on welfare']},right:{h:'THE HISTORIAN',lines:['studies things','hats, coal, boots','asks: which box?','finds: none known']},note:'Clapham plays the second role, on purpose'}]},
  ["He tries it himself, among the hat factories of Denton. What is a unit of resources? A unit of hats? Is the industry national or world-wide? Coal, rabbit fur, shellac, pulp and wool each come from world markets, or are joint products, or are simply unknown.","He leaves the factory with no opinion about the proper box for hats. That failure is the paper."],
  {fig:'steps',a:[{title:'TRYING TO BOX "HATS"',lines:['define a unit of resources: unclear','define a unit of product: unclear','national or world industry? unclear','raw materials: world markets, joint products','constant returns: a mathematical point','result: no box can be filled']}]},
  ["Constant returns, he adds, \"must always remain a mathematical point, their box an empty one.\"","Write the charge exactly. Clapham does not say increasing returns are false. He says the *empty boxes* have never been filled with real industries, so welfare and tax conclusions built on them stand on nothing."]],
  q:[mc("What is Clapham's central charge in 'Of Empty Economic Boxes' (1922)?",["The returns categories have never been filled with real industries","Increasing returns do not exist anywhere in industry","Rents are transfers and so not part of cost","Monopoly is more common than competition"],"He denies their measurability, not their existence. The rent point is Young 1913."),
     tf("True or false: Clapham argued that increasing returns cannot exist.",false,"'Not a denial of the reality of increasing returns... only a denial of their measurability.'"),
     mc("In Clapham's parable, which industry does the economist try and fail to box?",["Hats","Railways","Medals","Cotton spinning"],"The hat factory. Railways belong to Hadley; medals to Robertson's Class I; cotton to Pigou 1928.")],
  sa:[sa("What are Clapham's 'empty boxes'?","Returns categories never filled with actual industries.",[['return','categor','box','law'],['industr','fill','empty','never','no one','real']]),
      sa("Which book did Clapham attack in 1922?","Pigou's Economics of Welfare.",[['pigou','welfare']],1)],
  line:"the returns boxes have never been filled with real industries"},

 {h:'Organisation, invention and "the world has moved on"',beats:[
  ["Second charge: the boxes may be unfillable. Marshall's increasing returns are meant to come from better *organisation* as an industry grows, with invention left out.","Clapham's reply: you cannot measure the two apart. Freezing water-logged strata to sink the Doncaster coal pits was an invention and an organisational change at once. Either the boxes stay empty or you lump in every invention."],
  {fig:'chain',a:[{title:"CLAPHAM'S THREE CHARGES",nodes:['EMPTY','USELESS','UNFILLABLE'],caps:['the boxes have no industries in them','filled, they would guide policy little','organisation and invention cannot be split'],end:'answered by Pigou (#28); Robertson (#31) goes inside',token:'[?]'}]},
  ["Third charge: even filled boxes would give little practical guidance. Marshall's tax rule depends on other things being equal, and they never are.","\"In all these matters the economist is, willy-nilly, an historian.\" By the time his conclusions are ripe, the world has moved on."],
  ["His modest advice: if anyone insists on filling boxes, begin with simple industries such as wheat, timber and rubber, where diminishing returns are most plausible."],
  {fig:'events',a:[{title:'THE EMPTY BOXES EXCHANGE',events:[['Sep 1922','Clapham: Of Empty Economic Boxes #27'],['Dec 1922','Pigou: A Reply #28'],['Dec 1922','Clapham rejoinder #29 (not in folder)'],['Mar 1924','Robertson: Those Empty Boxes #31']]}]},
  ["Placing it: Clapham answers Pigou's 1920 book and Marshall. Pigou replies in December 1922 (#28); Clapham's short rejoinder (#29) is not in your folder. Robertson (#31) moves the fight inside Pigou's apparatus. Sraffa's 1926 attack, not in your folder, grows from the same argument."]],
  q:[mc("Why did Clapham say Marshall's increasing returns could not be measured?",["Organisation and invention cannot be separated in practice","Firms refuse to publish their cost data","Increasing returns only appear under monopoly","Marshall never defined increasing returns"],"Doncaster's frozen strata: an invention and an organisational change at once."),
     mc("Which goods did Clapham suggest as the place to start filling the boxes?",["Simple diminishing-return goods such as wheat, timber and rubber","Hats, because he had studied them closely","Railways, because their costs are public","Coal, because it shows clear increasing returns"],"Start where the case is simplest."),
     fill("Clapham: 'In all these matters the economist is, willy-nilly, an ___.'",['historian'],"And the world has moved on before his conclusions are ripe.")],
  sa:[sa("Why can't Marshall's organisation economies be measured, per Clapham?","Invention and organisation cannot be separated.",[['invent'],['organi','separat','apart','split','disentangl']]),
      sa("Who replied to Clapham in December 1922?","Pigou, in 'Empty Economic Boxes: A Reply'.",[['pigou']],1)],
  line:"organisation and invention cannot be measured apart"}
]},

/* ------------------------------------------------ #28 */
{id:'28',year:1922,who:'Pigou',title:'PIGOU 1922 · EMPTY ECONOMIC BOXES: A REPLY',secs:[
 {h:'Four propositions and a surfeit of lampreys',beats:[
  ["December 1922, same journal. Pigou accepts the label \"analytic\", but suspects the boxes \"analytic\" and \"realistic\" are themselves empty. Then he boils Clapham down to four propositions."],
  {fig:'steps',a:[{title:'CLAPHAM IN FOUR PROPOSITIONS (PIGOU)',lines:['1 returns are hard to conceive   -> true, old news','2 the boxes are hard to fill     -> disputed','3 filled, they would do no good  -> denied','4 so abolish them               -> denied']}]},
  ["Clearing ground: there is *pure* knowledge of implications (logic, mathematics) and *realistic* knowledge of facts. \"If X, then Y\" is as much knowledge as \"In the year 1600, X\", or the English king who died of a surfeit of lampreys.","Will Clapham ask the mathematicians to abandon their empty boxes and join his researches about lampreys?"],
  {fig:'compare',a:[{left:{h:'PURE KNOWLEDGE',lines:['implications','"if X, then Y"','logic, mathematics','the analytic']},right:{h:'REALISTIC KNOWLEDGE',lines:['matters of fact','"in 1600, X"','lampreys, hats','the historian']},note:'Pigou: both are knowledge; but he wants fruit'}]},
  ["But note the twist. Pigou does not rest on knowledge for its own sake. He says plainly that practical usefulness, not necessarily immediate, is what he looks for in economics.","So his real defence is that the boxes are \"elements in the intellectual machinery\" of value theory. Pull them out and the whole analysis of how output and cost relate breaks."]],
  q:[mc("How did Pigou (1922) treat Clapham's first proposition, that returns are hard to conceive?",["Granted it as true but old news","Denied it outright","Called it the heart of the matter","Said statistics had already solved it"],"He grants only proposition 1, and says economists have known it for a quarter-century."),
     tf("True or false: Pigou's 1922 reply defends pure theory for its own sake, regardless of use.",false,"He makes the lampreys point but says practical usefulness is what he looks for."),
     fill("Pigou 1922: the boxes are 'elements in the intellectual ___' of economic thought.",['machinery'],"They are organic parts of value theory, not detachable boxes.")],
  sa:[sa("What does Pigou's lampreys example show?","Knowledge of implications is as real as historical fact.",[['implication','if x','logic','pure'],['fact','histor','knowledge','real']]),
      sa("Which of Clapham's four propositions did Pigou grant?","Only the first: returns are hard to conceive.",[['first','one','1','conceiv']],1)],
  line:"knowledge of implications is as much knowledge as matters of fact"},

 {h:'Valises, little cases and Jevons',beats:[
  ["Use one: even empty, the boxes help *negatively*. When a politician says a tax always raises price by the full amount of the tax, we know he is quietly assuming constant returns, and is almost certainly wrong.","Science helps practice by exposing charlatanry as well as by finding truths."],
  ["Use two: the boxes are not what policy needs anyway. Increasing versus diminishing returns are the bulky *valises* in the shop window. Inside them are *little cases*: numerical ranges of the elasticities of supply and demand near the present output.","Knowing only the valise is like knowing a man's temperature is above normal, but not by how much."],
  {fig:'compare',a:[{left:{h:'VALISES',lines:['increasing returns?','diminishing returns?','rough direction only','"temperature above"']},right:{h:'LITTLE CASES',lines:['elasticity of supply','elasticity of demand','near current output','what tax policy needs']},note:'Pigou 1922: fill the little cases, not just the valises'}]},
  ["Clapham said other considerations also matter for taxes, so knowing the box is useless. Pigou mocks it: like refusing to check which of two suits fits, because price matters too.","Can the cases be filled? Hard, not impossible. Better statistics are coming. We need more men like Jevons, at home in both theory and industry, or else specialists working together."],
  {fig:'chain',a:[{title:'FROM METHOD TO MACHINERY',nodes:['CLAPHAM','PIGOU','ROBERTSON'],caps:['#27 the boxes are empty','#28 they are machinery; fill the little cases','#31 the machinery itself is faulty'],end:'Pigou drops the duplex curves (Mar 1924)',token:'[>]'}]},
  ["Placing it: Pigou answers Clapham (#27). Clapham's rejoinder (#29) is not in your folder. Robertson (#31) leaves this methods quarrel aside and attacks Pigou's apparatus from inside. Report on the reply: accept, but the author's own curves are next in line."]],
  q:[mc("What are Pigou's 'little cases' (1922)?",["Numerical ranges of supply and demand elasticities near current output","The diminishing and increasing returns categories","Particular industries such as hats and coal","Short-period cases of monopoly"],"The valises are the broad returns categories; the little cases inside are elasticities."),
     mc("Which 'negative use' of the empty boxes does Pigou give?",["Exposing the hidden constant-returns assumption in 'a tax raises price by the full tax'","Proving that monopoly always restricts output","Showing that rents are transfers","Refuting Clapham's history of hats"],"The boxes expose hidden assumptions even when empty."),
     tf("True or false: Pigou held up Jevons as the model economist at home in both theory and industrial facts.",true,"The 'towering exception'. Train more like him, or make specialists cooperate.")],
  sa:[sa("Valises versus little cases: what is the difference?","Broad returns categories versus precise elasticities.",[['broad','categor','return','valise'],['elastic','precis','numer']]),
      sa("How could the little cases be filled, per Pigou?","Statistics plus cooperation of theorists and business experts.",[['statist','business','expert','cooperat','together','jevons']],1)],
  line:"policy needs the little cases of elasticities inside the valises"}
]},

/* ------------------------------------------------ #30 */
{id:'30',year:1924,who:'Knight',title:'KNIGHT 1924 · FALLACIES IN THE INTERPRETATION OF SOCIAL COST',secs:[
 {h:'Two roads and a toll',beats:[
  ["August 1924, Quarterly Journal of Economics. Frank Knight takes Pigou's famous example from *The Economics of Welfare* (1920, p. 194, not in your folder): the *two roads*.","One road is broad but poor, and never crowded. The other is narrow but good, and congests. Trucks are free to choose."],
  {fig:'steps',a:[{title:"PIGOU'S TWO ROADS (AS KNIGHT STATES IT)",lines:['trucks pick the narrow good road first','congestion builds on it','until cost per truck is equal on both','move a few trucks off: those left gain','so free choice over-crowds the good road','a tax on the narrow road is "a clear gain"']}]},
  ["Knight's verdict: the logic is \"quite unexceptionable.\" The assumptions are the problem. They reverse the key feature of competition: *private ownership* of the scarce factor.","Let someone own the narrow road. He charges a toll for its \"superiority\". To maximise rent he sets it where the marginal truck adds no more than it could on the free road. So \"the toll will exactly equal the ideal tax.\""],
  {fig:'plot',a:[{title:"KNIGHT'S CHART D (sketch)",xl:'trucks on the narrow road',yl:'product',xr:[0,16],yr:[0,10],curves:[{f:x=>10-0.5*x,ch:'a',name:'avg product'},{f:x=>10-x,ch:'m',name:'marginal product'},{f:x=>4,ch:'-',name:'free road'}],eq:[1,2],eqf:(x,y)=>'toll stops traffic at M ~'+x.toFixed(0)+' trucks',cap:'unowned: trucks enter until avg = free road (M\' ~12)'}]},
  ["Same story as a superior farm next to free land. Without an owner, labour floods the good farm until product per man equals the free land. With an owner, rent stops it at the margin. \"It is the social function of ownership to prevent this excessive investment in superior situations.\"","Pigou was misled, says Knight, by measuring efficiency in cost of output instead of output of resources."]],
  q:[mc("In Knight's 1924 rebuttal, what does the private owner of the narrow road do?",["Charges a rent-maximising toll that exactly equals Pigou's ideal tax","Lets traffic in until average cost is equal on both roads","Asks the State for a bounty to widen the road","Charges nothing, because competition drives tolls to zero"],"Rent stops traffic where the marginal truck's product equals the free road's."),
     tf("True or false: Knight said Pigou's two-roads logic was internally faulty.",false,"'As logic, quite unexceptionable.' The fault is an assumption: no private ownership."),
     mc("Where does the two-roads example come from?",["Pigou's Economics of Welfare (1920)","Young's 1913 review","Clapham's Empty Boxes (1922)","Robertson's Those Empty Boxes (1924)"],"Knight attacks the 1920 book, p. 194.")],
  sa:[sa("Why does the toll equal Pigou's ideal tax?","Owner maximises rent where marginal product equals free road's.",[['marginal'],['rent','toll','owner','free road','free']]),
      sa("What feature of competition do Pigou's roads leave out?","Private ownership of the scarce road.",[['owner','property','private','appropriat']],1)],
  line:"a private owner's toll does exactly what pigou's tax would do"},

 {h:'Value changes, technological changes, and no decreasing cost',beats:[
  ["Cost, for Knight, is the alternative given up: what transferable resources would produce elsewhere. Measured in value, increasing cost has two sources. Knight's own words: *value changes* and *technological changes* (factors used in worse proportions, less suitable factors drawn in).","Higher payments to specialised factors, the rent elements, \"do not represent social costs at all, but redistributions of product merely.\""],
  {fig:'compare',a:[{left:{h:'SOCIAL COST',lines:['resources used up','could produce elsewhere','worse proportions','less suitable factors']},right:{h:'REDISTRIBUTION',lines:['rent of scarce factors','paid to owners','no resources used up','not a social cost']},note:'Knight 1924; cf. Young 1913, Pigou 1928 #35'}]},
  ["A labelling trap. Knight says \"value\" versus \"technological\". The label *pecuniary* versus technological comes later, from Viner 1931, which is not in your folder. Do not put \"pecuniary\" in Knight's mouth.","In a footnote (fn. 8) Knight credits Allyn Young's 1913 review (#26) with spotting the fallacy first."],
  {fig:'steps',a:[{title:'KNIGHT: DECREASING COST IS A FALLACY',lines:['technical economies come from unit size','not from the output of the industry','competition grows units to best size','"external" economies: internal to another firm','lasting economies end in monopoly','so no decreasing cost under competition']}]},
  ["He also hits F. D. Graham's 1923 case for protection under decreasing cost (not in your folder). Knight's conclusion: free enterprise has real faults, but they lie outside \"the mechanics of exchange\": ignorance, unequal inheritance, manufactured wants, monopoly, the State."],
  ["Placing it: Knight answers Pigou 1920 and Graham, and credits Young (#26). Robertson (#31) had already pressed the rent point in March 1924, and Pigou had conceded. Pigou 1928 (#35) builds the point in as *transfer elements*. Compare Pigou 1927 (#33), who still defends decreasing cost."]],
  q:[mc("What were Knight's own names (1924) for the two sources of increasing cost?",["Value changes and technological changes","Pecuniary and technological externalities","Internal and external economies","Class I and Class II"],"'Pecuniary' is a later label (Viner 1931, not in your folder). Class I/II is Robertson."),
     mc("Why did Knight hold that decreasing cost is incompatible with competition?",["Economies come from unit size, so lasting ones end in monopoly","Rents always rise faster than output","Demand curves always slope upward","The State taxes all large firms"],"External economies are just internal economies of some other firm."),
     tf("True or false: Knight credited Allyn Young's 1913 review with having already exposed Pigou's fallacy.",true,"Footnote 8, citing QJE August 1913.")],
  sa:[sa("Why are rents not social costs, per Knight?","They redistribute product; no resources are used up.",[['redistribut','transfer'],['product','resourc','owner','income']],1),
      sa("Where does Knight say competition's real faults lie?","Outside the mechanics of exchange: ignorance, monopoly, inheritance.",[['outside','mechanic','ignoran','monopol','inherit']],1)],
  line:"rents are redistributions of product not social costs"}
]},

/* ------------------------------------------------ #31 */
{id:'31',year:1924,who:'Robertson',title:'ROBERTSON 1924 · THOSE EMPTY BOXES',secs:[
 {h:"David's pebble: two kinds of decreasing cost",beats:[
  ["March 1924, Economic Journal. D. H. Robertson calls the Clapham–Pigou exchange \"a battle of giants\" and declines to join it directly. He casts himself as David, with a pebble aimed at one giant, Pigou, on his own ground.","First, words. Say *increasing cost* and *decreasing cost* for industries. Keep \"diminishing return\" for the law of variable proportions."],
  ["Decreasing cost comes in two kinds. *Class I*: lumpy fixed capital spread over more units. Cunynghame's medal: a £20 steel die, then 5s of metal and stamping per medal. Railways and newspapers work the same way. Raise demand and average cost falls at once.","*Class II*: improvements in technique and organisation that, given time, let a larger output be made more cheaply."],
  {fig:'table',a:[{title:"CLASS I: THE MEDAL DIE (Cunynghame's figures)",head:['medals','average cost','marginal cost'],rows:[['1','£20 5s','£20 5s'],['2','£10 5s','5s'],['50','13s','5s']],left:[0],note:'Pigou\'s marginal curve: flat at 5s after medal 2'}]},
  ["Now the reductio. The fiftieth medal is not the net product of the last 5s alone; the die shares in it. Yet Pigou's rule says produce until price equals 5s. A nationalised industry would then need a subsidy for \"the whole burden of the charges of the fixed original plant.\" Absurd. It should cover total costs, as competition does."],
  ["Class II: Pigou treats all these economies as *external*, ignoring internal ones that Marshall's representative firm captures. Suppose a National Guild owned the whole industry and reaped every economy. It still would not push output to Pigou's ideal; that means a loss. It would make receipts cover total costs: the competitive result."],
  {fig:'compare',a:[{left:{h:'CLASS I',lines:['lumpy fixed plant','medal die, railways','cost falls at once','time "innocent"']},right:{h:'CLASS II',lines:['technique, organisation','improves over time','larger output, cheaper','infant-industry case']},note:'Robertson 1924: Pigou lumps these together'}]}],
  q:[mc("What is Robertson's Class I decreasing cost?",["Lumpy fixed capital spread over more units, like the medal die","Gradual improvements in technique over time","External economies from the industry's growth","Falling rents as land is abandoned"],"Class II is gradual improvement; Class I is the die, the railway, the newspaper."),
     mc("What absurd policy did Robertson say Pigou's rule implied for a nationalised Class I industry?",["Subsidising the whole burden of the fixed original plant","Taxing it until output fell to zero","Selling it back to private owners","Pricing every medal at average cost"],"Price at 5s marginal cost leaves the die unpaid for; the State must cover it."),
     tf("True or false: Robertson's National Guild would push output to Pigou's 'ideal' level.",false,"It would make total receipts cover total costs, exactly as competition does.")],
  sa:[sa("Robertson's two classes of decreasing cost?","Class I lumpy fixed plant; Class II gradual improvement.",[['lump','fixed','plant','die','indivisib'],['improv','technique','time','gradual','organi']]),
      sa("Which words does Robertson prefer for industries?","Increasing and decreasing cost, not returns.",[['cost']],1)],
  line:"class one is lumpy plant class two is improvement over time"},

 {h:'External diseconomies: who in the world are they?',beats:[
  ["Now increasing cost. For Pigou's gap to appear here, each producer's expansion must make *other* producers less efficient. Robertson names the needed force *external diseconomies*. The phrase is his own: in a footnote he says he is not fathering the phrase on Pigou, only the conception.","External economies we know: transport, the telephone, the trade journal. \"But these external diseconomies, mathematically no less powerful, who in the world are they?\""],
  {fig:'steps',a:[{title:'ROBERTSON ON INCREASING COST',lines:['Pigou needs external diseconomies','no one can name one','real cause: diminishing return from land','more output pushes the margin further','rents rise: transfers, as Young showed','so no "rigid mathematical sin"']}]},
  ["Pigou had said an industry can get extra land at the old rent. Robertson cannot unlearn that rent depends on the land's use: recall Marshall's farmer sure his land should grow hops, or a cinema boom raising site values in a town.","His verdict: competitive output, though not impeccable, \"commits no such rigid mathematical sin.\" The only State help he accepts is a temporary *infant-industry* subsidy."],
  ["Pigou's reply is printed right after. He has \"no particular affection for the duplex curve apparatus\" and drops it from the new edition. His conclusions are Marshall's (*Principles* V.xiii). The subsidy reductio is \"a grotesque misunderstanding.\" And Young's criticism is \"substantially valid as regards long-period problems.\"","Robertson rejoins: his quarrel was with the reasoning, not the geometry."],
  {fig:'events',a:[{title:'THE RENT POINT, 1913 TO 1925',events:[['Aug 1913','Young: rents are transfers #26'],['1920','Pigou replies in Economics of Welfare'],['Mar 1924','Robertson #31; Pigou concedes'],['Aug 1924','Knight: two roads and a toll #30'],['Mar 1925','Edgeworth admits the error #21']]}]},
  ["Placing it: Robertson answers Pigou's 1920 apparatus, picks up from Clapham (#27) and Pigou (#28), and transcribes Young (#26). Pigou's appended reply concedes. Edgeworth (#21) weighs his objections in 1925. Robertson returns in the 1930 symposium (#38, group D2)."]],
  q:[mc("Who coined the phrase 'external diseconomies' in this debate?",["Robertson, in 1924, as a label for what Pigou's case needed","Pigou, in The Economics of Welfare","Marshall, in the Principles","Knight, in 1924"],"Robertson's footnote: he does not father the phrase on Pigou, only the conception."),
     mc("What did Pigou concede in his reply appended to Robertson (March 1924)?",["Young's rent criticism is substantially valid for long-period problems","That increasing returns do not exist","That Clapham was right about the empty boxes","That the State should never give bounties"],"He also dropped the duplex curves, but called the subsidy reductio a grotesque misunderstanding."),
     tf("True or false: Robertson rejected even temporary infant-industry subsidies.",false,"He accepts the old infant-industry argument; he rejects permanent bounties.")],
  sa:[sa("What is Robertson's real cause of increasing cost?","Diminishing return from land; rent rises are transfers.",[['land','rent'],['diminish','transfer','scarc','limit']],1),
      sa("What did Pigou drop from his new edition in 1924?","The duplex curve apparatus.",[['duplex','twin','two curve','curve']],1)],
  line:"external diseconomies who in the world are they"}
]},

/* ------------------------------------------------ #21 */
{id:'21',year:1925,who:'Edgeworth',title:'EDGEWORTH 1925 · THE REVISED DOCTRINE OF MARGINAL SOCIAL PRODUCT',secs:[
 {h:'The old defender concedes the rent, keeps the conclusion',beats:[
  ["March 1925. Old F. Y. Edgeworth reviews the 2nd edition (1924) of Pigou's *Economics of Welfare* (not in your folder). He grumbles that Pigou keeps rearranging his treatise, like the Sibyl's scattered leaves, and collates the three versions.","Pigou now speaks of *marginal social net product*. Edgeworth rebuilds the theory with his own diagrams."],
  ["He draws a curve of *marginal supply prices* so the area under it equals total cost. Under increasing returns it lies below the falling supply curve. Competition stops where demand meets supply; the best output is where demand meets the marginal curve, further right.","He credits Young with the better name, *curve of aggregate expenses*, but says Young's paraphrase makes the theory sound like laissez-faire."],
  {fig:'plot',a:[{title:'EDGEWORTH FIG. 1, INCREASING RETURNS (sketch)',xl:'output',yl:'P',xr:[0,12],yr:[0,11],curves:[{f:x=>11-0.9*x,ch:'D',name:'demand'},{f:x=>8-0.3*x,ch:'S',name:'supply'},{f:x=>8-0.6*x,ch:'m',name:'marginal supply price'}],eq:[0,1],eqf:(x,y)=>'competitive output ~'+x.toFixed(0)+' (D = supply)',cap:'best output: D meets the marginal curve, further right'}]},
  ["Against Young's doubt, increasing returns are real, citing Robertson's own list of external economies. External diseconomies exist too: imported raw materials rising in price, or a fanciful free Irish state whose landlords keep their rights and emigrate, so rising rents leave the community.","Robertson's objections get weight; the propositions are \"curious and may be useful.\""],
  ["Then the concession. Bring the absentee landlords home as citizens, and \"it is an error to treat the rents paid as a cost.\" Credit to Young and Maurice Clark. Edgeworth admits he made the same error himself.","But the main outcome, \"the blow given to the abstract doctrine of laissez faire,\" is not much affected. Write it this way: he concedes the rent, not the bounty."],
  {fig:'compare',a:[{left:{h:'CONCEDED',lines:['rents paid to citizens','are not a cost','(Young, J. M. Clark)','"we ourselves" erred']},right:{h:'DEFENDED',lines:['increasing returns real','optimum > competitive','case for bounties','blow to laissez-faire']},note:'Edgeworth 1925 on Pigou\'s revised doctrine'}]},
  ["Placing it: Edgeworth answers Pigou's 1924 edition, Young (#26) and Robertson (#31). No direct reply in your folder. Pigou's restatements of 1927 (#33) and 1928 (#35) carry the doctrine on, after Sraffa 1926 (not in your folder)."]],
  q:[mc("What did Edgeworth (1925) concede to Pigou's critics?",["Rents paid to members of the community are not a cost","Increasing returns do not exist","The anti-laissez-faire result collapses","The marginal-supply-price curve is meaningless"],"He concedes the rent error but defends the blow to laissez-faire."),
     tf("True or false: Edgeworth said the rent correction destroyed the case against laissez-faire.",false,"The main outcome is 'not much affected'."),
     mc("Which edition of Pigou's book does Edgeworth's 1925 article review?",["The 2nd edition of The Economics of Welfare (1924)","Wealth and Welfare (1912)","The 1st edition of The Economics of Welfare (1920)","Pigou's Analysis of Supply (1928)"],"He collates it with the 1912 and 1920 versions.")],
  sa:[sa("What does Edgeworth concede and what does he keep?","Concedes rents not cost; keeps case against laissez-faire.",[['rent'],['laissez','bount','increasing return','keep','defend']]),
      sa("Whom does Edgeworth credit with spotting the rent error?","Allyn Young and Maurice Clark.",[['young','clark']],1)],
  line:"edgeworth concedes rents are not cost but keeps the blow to laissez faire"}
]},

/* ------------------------------------------------ #33 */
{id:'33',year:1927,who:'Pigou',title:'PIGOU 1927 · THE LAWS OF DIMINISHING AND INCREASING COST',secs:[
 {h:'Agreeing with Sraffa on increasing costs',beats:[
  ["June 1927. Pigou writes in response to Sraffa's \"The Laws of Returns under Competitive Conditions\" (Economic Journal, December 1926, not in your folder). He concedes half and fights the other half. Learn which half is which."],
  ["First, the *cost function*: the long-period, \"normal now\" link between output and aggregate cost, after full adjustment, in today's state of knowledge. It counts only changes *caused by* the scale of output. Spontaneous inventions and changes in taste are out.","Costs can only be added in a common unit if relative factor prices stay fixed. So Pigou studies industries too small to move factor prices."],
  ["Average cost and marginal cost can slope differently, so say \"increasing average\" or \"increasing marginal\" costs. Only \"constant costs\" is unambiguous."],
  {fig:'steps',a:[{title:'WHY NO INCREASING COSTS (SMALL INDUSTRY)',lines:['the industry uses a small share of each factor','so factor prices do not move','raise every factor 10 per cent','output rises at least 10 per cent','a cheaper method only helps','so increasing costs are impossible']}]},
  ["So for such an industry, \"it is impossible for production anywhere to take place under conditions of increasing costs.\" That is the half he grants Sraffa.","Internal economies under monopoly come in two sorts: gradual (specialisation, invention) and *minimum apparatus*: a medal die, a printed book, a railway at £100,000 for the first hundredweight and 6d for each after. Under competition the representative firm has an optimum size, so only *external* economies are left."],
  {fig:'compare',a:[{left:{h:'AGREES WITH SRAFFA',lines:['small industry','no increasing costs','internal economies','limited by firm size']},right:{h:'DISAGREES',lines:['external economies','are not negligible','decreasing costs live','bounty still warranted']},note:'Pigou 1927: do not swap the two columns'}]}],
  q:[mc("On what did Pigou (1927) agree with Sraffa (1926)?",["Increasing costs are impossible for an industry too small to move factor prices","External economies special to one industry are negligible","Competition always maximises satisfaction","Decreasing costs require monopoly"],"He agreed on increasing costs and disagreed on external economies."),
     tf("True or false: Pigou's 1927 cost function includes spontaneous inventions that would occur at any output.",false,"Only changes caused by the scale of output count."),
     fill("Pigou 1927 calls the medal-die and railway type of internal economy 'minimum ___'.",['apparatus'],"A big first outlay, then a small cost per unit.")],
  sa:[sa("Why can't a small industry have increasing costs?","Raising every factor 10% raises output at least 10%.",[['factor','input'],['output','product','proportion','10','ten']]),
      sa("Which 1926 paper prompted Pigou's 1927 article?","Sraffa's Laws of Returns under Competitive Conditions.",[['sraffa']],1)],
  line:"pigou grants sraffa that small industries cannot have increasing costs"},

 {h:'Second-order quantities, first-order ratio',beats:[
  ["Sraffa said a small expansion of one industry gives negligible external economies. Pigou: of course it does. What matters is the *ratio* of the cost saving to the output increase, and \"the ratio between two quantities which are both of the second order\" can be of the first order."],
  {fig:'steps',a:[{title:"PIGOU'S 12½ PER CENT EXAMPLE",lines:['100,000 units cost £100,000: £1.00 each','200,000 units cost £175,000: 17s 6d each','marginal cost falls at a constant rate','one extra unit saves ·0012 of a penny','spread over the whole industry: negligible?','no: doubling output cuts average cost 12½%']}]},
  {fig:'bars',a:[{title:'AVERAGE COST PER UNIT (Pigou 1927)',rows:[['100,000 units',100,'£1.00'],['200,000 units',87.5,'17s 6d (-12½%)']],max:100,note:'tiny per-unit savings, first-order total'}]},
  ["External economies arrive gradually, like new buyers when price falls, not in jumps. Under decreasing costs the supply curve follows *average* cost, which lies above *marginal* cost."],
  {fig:'plot',a:[{title:'DECREASING COSTS (sketch)',xl:'industry output',yl:'P',xr:[0,16],yr:[2,16],curves:[{f:x=>16-x,ch:'D',name:'demand'},{f:x=>10-0.25*x,ch:'A',name:'AC = supply'},{f:x=>10-0.5*x,ch:'m',name:'MC'}],eq:[0,1],eqf:(x,y)=>'competitive output ~'+x.toFixed(0),cap:'optimum where D meets MC (~12): output too small'}]},
  ["Satisfaction is maximised where demand meets marginal cost. Competition stops where demand meets supply, that is average cost. So in decreasing-cost industries output falls short, unless the State gives a *bounty*.","Placing it: Pigou answers Sraffa 1926 (not in your folder). His fuller version is #35; Young 1928 (#37) and the 1930 symposium (#38, group D2) respond."]],
  q:[mc("In Pigou's 1927 example, what happens to average cost when output doubles from 100,000 to 200,000 units?",["It falls 12½ per cent","It falls by ·0012 of a penny","It rises 12½ per cent","It stays constant"],"£100,000 to £175,000 for twice the output: £1 to 17s 6d per unit."),
     mc("Pigou 1927: with decreasing costs, which curve does the supply curve follow?",["The average cost curve","The marginal cost curve","The demand curve","The curve of transfer elements"],"Supply follows AC, which lies above MC; the optimum is at MC."),
     tf("True or false: Pigou 1927 concluded that decreasing-cost industries over-produce under competition.",false,"They under-produce; a bounty is warranted.")],
  sa:[sa("What does Pigou's 'second-order' point say?","Tiny savings over tiny output rises give first-order ratio.",[['ratio','proportion','relative'],['small','tiny','second','first','negligib']]),
      sa("What is Pigou's 1927 policy for decreasing-cost industries?","A State bounty to raise output.",[['bount','subsid']],1)],
  line:"tiny savings over tiny increases can make a large ratio"}
]},

/* ------------------------------------------------ #34 */
{id:'34',year:1928,who:'Robbins',title:'ROBBINS 1928 · THE REPRESENTATIVE FIRM',secs:[
 {h:'A pale visitant from the world of the unborn',beats:[
  ["September 1928. Lionel Robbins goes after Marshall's *representative firm*. It was an afterthought, missing from the first edition of the *Principles*. It lurks in Book V \"like some pale visitant\" from the world of the unborn. Keynes has called this quarter the least complete in Marshall's analysis.","And, as is the way with ghosts, it bids fair to outlast more virile creations."],
  ["Marshall's definition: a firm with \"a fairly long life and fair success\", normal ability, and normal access to internal and external economies. It is a long-period business unit. Not a plant. Not a statistical average.","So statistics can neither refute it nor make it useful."],
  ["Robertson's 1927 article on the Colwyn Report (not in your folder) says it was built for cases where producers differ in efficiency. Robbins splits those differences in two."],
  {fig:'compare',a:[{left:{h:'STATIC DISPARITIES',lines:['best factors are scarce','persist in equilibrium','e.g. rare managers','earn rent-like profit']},right:{h:'DYNAMIC DISPARITIES',lines:['maladjustment','during change','demand or supply moves','vanish when settled']},note:'Robbins 1928: neither needs a representative firm'}]},
  {fig:'steps',a:[{title:'WHY IT IS SUPERFLUOUS',lines:['equilibrium: each factor earns its next best','unequal lands earn unequal rents','unequal managers earn unequal profits','extra-marginal ones become employees','holds static, stationary and dynamic','no representative firm is needed']}]},
  ["Write it this way: for Robbins, unequal normal profits are like *differential rents* of scarce ability. Equilibrium needs no typical firm, only that every factor earns at least what it could get elsewhere."]],
  q:[mc("Why does Robbins (1928) think the representative firm is superfluous?",["Unequal managers earn unequal profits, like rents, so equilibrium needs no typical firm","Every industry has one optimum firm size","External economies make firms identical","Statistics have shown it does not exist"],"Profits differ like rents; each factor need only earn its alternative."),
     mc("Robbins's 'static disparities' between producers are...",["Differences from scarce superior factors that persist in equilibrium","Differences caused by maladjustment during change","Differences in short-period demand","Differences between plants inside one firm"],"Dynamic disparities are the maladjustments of change."),
     tf("True or false: Robbins says the representative firm appeared in the first edition of Marshall's Principles.",false,"'It does not figure at all in the first edition': an afterthought.")],
  sa:[sa("Why are unequal profits no problem for equilibrium?","They are rents of scarce managerial ability.",[['rent'],['abilit','manag','scarc','talent']]),
      sa("Static versus dynamic disparities?","Scarce factors persisting versus maladjustment during change.",[['scarc','persist','equilibrium','last'],['maladjust','change','dynamic','transit']])],
  line:"unequal profits are rents of ability so no representative firm is needed"},

 {h:'Not enough Josiah Stamps to go round',beats:[
  ["Worse than superfluous: misleading. H. D. Henderson's *Supply and Demand* (not in your folder) says the marginal concern is run by a manager of average ability. That ignores diminishing returns to scarce talent.","\"There are not enough Josiah Stamps to go round.\" The best lands and the best men are limited."],
  ["Talent does not run out industry by industry. Most industries will have some brilliant managers, some average, some at the margin. Then the quip: \"if all entrepreneurs were at least of average managerial ability, they would at once cease to be average.\""],
  ["In partial equilibrium with diminishing cost, output can change through the *number* of firms, so one firm's cost curve may stop being representative. External economies are doubtful, he says, citing Young and Robertson, and partly a matter of management."],
  {fig:'steps',a:[{title:"ROBBINS'S THREE CONCLUSIONS",lines:['1 no tendency of profits to equality','2 not one optimum firm size but many','3 the Colwyn debate needs no such firm','plus: it hides the variety of ability']}]},
  ["Two footnotes matter for the exam. One: the paper was written and set up before Pigou's \"Analysis of Supply\" (#35); Robbins only hopes his points apply to the equilibrium firm. Two: he credits Allyn Young's idea that growth by differentiation makes the firm misleading, developed in #37."],
  {fig:'chain',a:[{title:'THE FIRM, THREE WAYS IN 1928',nodes:['MARSHALL','ROBBINS','PIGOU','YOUNG'],caps:['representative firm: typical, normal ability','#34: superfluous and misleading','#35: equilibrium firm, any size','#37: the firm loses its identity'],end:'answered by Robertson, Trees of the Forest (#38, D2)',token:'[f]'}]},
  ["Placing it: Robbins answers Marshall, Henderson and Robertson's Colwyn article. Compare Pigou (#35) and Young (#37). Robertson's \"Trees of the Forest\" in the 1930 symposium (#38, group D2) answers him."]],
  q:[mc("What does Robbins's line 'not enough Josiah Stamps to go round' express?",["Diminishing returns to scarce managerial ability","The absence of external economies","The impossibility of increasing costs","The need for State bounties"],"The best men, like the best lands, are limited."),
     mc("Which is NOT one of Robbins's conclusions?",["Every industry tends to one optimum firm size","There is no tendency of profits to equality","There are many optimum sizes, not one","The Colwyn debate needs no representative firm"],"He says the opposite: many optimum sizes."),
     tf("True or false: Robbins's 1928 paper discusses Pigou's equilibrium firm in detail.",false,"Written before #35 appeared; a footnote only hopes the remarks apply.")],
  sa:[sa("What is Robbins's quip against Henderson?","If all were average or better, they'd cease being average.",[['average'],['cease','stop','no longer','ceas']]),
      sa("Whose idea does Robbins credit about firms and differentiation?","Allyn Young's.",[['young']],1)],
  line:"there are not enough josiah stamps to go round"}
]},

/* ------------------------------------------------ #35 */
{id:'35',year:1928,who:'Pigou',title:'PIGOU 1928 · AN ANALYSIS OF SUPPLY',secs:[
 {h:'The equilibrium firm',beats:[
  ["June 1928. Pigou rebuilds supply theory. New names first: laws of decreasing, constant and increasing *supply price*. \"Returns\" and \"cost\" are ambiguous, since average and marginal can move opposite ways; supply price is not."],
  ["The problem: firms grow and shrink even when the industry is at rest, like Marshall's trees in a forest. Their tendencies cancel. \"This fact gives warrant for the conception of what I shall call the *equilibrium firm*\": a firm that is in equilibrium whenever the industry is."],
  {fig:'compare',a:[{left:{h:'REPRESENTATIVE FIRM',lines:['Marshall','typical, average size','normal ability','Robbins #34 attacks']},right:{h:'EQUILIBRIUM FIRM',lines:['Pigou 1928','any size at all','in eq. when industry is','a logical device']},note:'Pigou fn.: firms "might be of all varieties of size"'}]},
  ["Two marginal costs. *Marginal additive cost*: the extra cost of one more unit if rivals' output stays put. *Marginal substitute cost*: the extra cost if industry output stays put, so rivals contract. Pigou uses substitute cost for the many-firm case."],
  ["Equilibrium needs two equalities. Price = the equilibrium firm's marginal cost, or it would expand or contract. Price = its average cost, or firms would enter or leave. Stability needs rising marginal cost: the bottom of a U-shaped average cost curve."],
  {fig:'plot',a:[{title:'THE EQUILIBRIUM FIRM (sketch)',xl:'output of the equilibrium firm',yl:'cost',xr:[1,10],yr:[0,13],curves:[{f:x=>0.5*x+12.5/x,ch:'A',name:'SSa average cost'},{f:x=>x,ch:'m',name:'SSm marginal cost'}],eq:[0,1],eqf:(x,y)=>'p = MC = AC at the minimum of AC',cap:'stable: rising MC cuts the U at its bottom'}]}],
  q:[mc("Define Pigou's 'equilibrium firm' (1928).",["A firm in equilibrium whenever the industry is, of any size","A typical firm of average size and normal ability","The largest firm in the industry","A firm whose costs depend only on industry output"],"Unlike Marshall's representative firm, it need not be average or typical."),
     mc("What two conditions hold for the equilibrium firm in a many-firm industry?",["Price equals its marginal cost and its average cost","Price equals marginal revenue and demand","Marginal cost equals final trade cost","Average cost equals the rate of rent"],"p = MC (no gain from expanding) and p = AC (no entry or exit)."),
     tf("True or false: Pigou's marginal substitute cost assumes industry output stays unchanged.",true,"Rivals contract by what the firm adds. Additive cost holds rivals' output fixed.")],
  sa:[sa("Equilibrium firm versus representative firm?","Equilibrium firm need not be typical or average-sized.",[['typical','average','size','norm'],['need not','not','any']]),
      sa("Why must price equal the equilibrium firm's average cost?","Otherwise firms would enter or leave.",[['enter','leave','exit','entry','outsider']],1)],
  line:"the equilibrium firm is in equilibrium whenever the industry is"},

 {h:'Transfer elements and the death of increasing supply price',beats:[
  ["Three cost cases settle the laws of supply price."],
  {fig:'table',a:[{title:"PIGOU 1928: THE FIRM'S COSTS AND THE LAW",head:['costs depend on','form','supply price'],rows:[['own output only','F(x)','constant'],['own + external','F(x)+(x/y)Φ(y)','rise or fall'],['own and industry','F(x, y)','any law']],left:[0,1],note:'case 2 example: raw cotton prices'}]},
  ["Next the old rent point, finally built in. When industry output rises, factor prices may rise. Those increments are *transfer elements*: not a net cost to the community, only transfers of purchasing power to factor owners.","This is Young's (#26) and Knight's (#30) point, now in Pigou's own algebra."],
  {fig:'steps',a:[{title:'CORRECTED FOR TRANSFER ELEMENTS',lines:['remove factor-price rises (transfers)','raise every factor 1 per cent','output cannot rise less than 1 per cent','so increasing supply price: impossible','except imported materials, one country\'s view','decreasing supply price: "likely"']}]},
  ["Why is decreasing supply price likely in manufacturing? A bigger industry lets firms specialise. Sir Sydney Chapman on English cotton: spinning separates from weaving, and firms split between fine and coarse counts.","The exception: if imported materials get dearer, the transfer goes to foreigners, so for that one country it does not cancel."],
  ["Welfare: corrected marginal supply price lies above, at, or below supply price under increasing, constant or decreasing supply price. Satisfaction is greatest where demand meets the corrected marginal supply price.","Placing it: Pigou answers Sraffa (not in your folder), his own #33, and the rent critics #26, #30, #31. Robbins (#34) notes it in a footnote. Shove (#36) follows in the same issue. Harrod 1930 (#41) and the 1930 symposium (#38, group D2) carry it on."]],
  q:[mc("What are Pigou's 'transfer elements' (1928)?",["Rises in supply price from higher factor prices that merely transfer income to factor owners","Costs of moving goods between markets","External economies passed between firms","Taxes and bounties paid by the State"],"The Young/Knight rent point, built in."),
     mc("Corrected for transfer elements, what does Pigou say about increasing supply price?",["Impossible, except for imported materials from one country's view","Likely in most manufacturing","Common wherever land is used","Possible only under monopoly"],"A 1 per cent rise in all factors cannot give less than 1 per cent more output."),
     tf("True or false: if the equilibrium firm's costs depend only on its own output, the industry has constant supply price.",true,"Firm output and cost are fixed independently of industry output.")],
  sa:[sa("Why are transfer elements not a social cost?","They only transfer purchasing power to factor owners.",[['transfer','redistribut'],['owner','factor','purchasing','landlord']],1),
      sa("Why is decreasing supply price likely in manufacturing?","Bigger industry lets firms specialise, as in cotton.",[['speciali','cotton','chapman']],1)],
  line:"correct for transfer elements and increasing supply price vanishes"}
]},

/* ------------------------------------------------ #36 */
{id:'36',year:1928,who:'Shove',title:'SHOVE 1928 · VARYING COSTS AND MARGINAL NET PRODUCTS',secs:[
 {h:"Pigou's asymmetry and the infra-marginal units",beats:[
  ["June 1928, same issue as Pigou's \"Analysis of Supply\" (#35). G. F. Shove, a Cambridge Marshallian, targets the 2nd edition of *The Economics of Welfare* (not in your folder)."],
  {fig:'compare',a:[{left:{h:'DIMINISHING RETURNS',lines:['price rises','buyers lose','landlords gain the same','social = private']},right:{h:'INCREASING RETURNS',lines:['price falls','buyers gain','"offset by nothing"','social > private']},note:'Pigou, 2nd ed., as Shove states it'}]},
  ["From this asymmetry Pigou drew his presumption: tax diminishing-return industries, give bounties to increasing-return ones.","Shove's first move: under competition, price = *marginal cost* = the cost of the least-favoured unit. Rent is the sum of the cost advantages of the better, *infra-marginal* units."],
  ["Expansion can change infra-marginal costs too. A haulage economy can cut costs for all producers; port congestion can raise them. Whether landlords' gain offsets buyers' loss depends on what happens to those costs, not on whether marginal cost rises or falls."]],
  q:[mc("Which Pigou doctrine does Shove (1928) attack?",["Buyers' loss is offset by landlords' gain under diminishing returns, but buyers' gain is 'offset by nothing' under increasing returns","Increasing costs are impossible in small industries","The equilibrium firm must be of average size","The returns boxes cannot be filled"],"The 2nd-edition asymmetry behind the tax-bounty rule."),
     tf("True or false: for Shove, marginal cost under competition is the cost of the least-favoured unit.",true,"Rent measures the advantages of infra-marginal units over it.")],
  sa:[sa("What decides whether rents offset buyers' losses, per Shove?","Expansion's effect on infra-marginal costs, not returns' direction.",[['infra','inframarginal','other units','rest of'],['cost']]),
      sa("What is rent in Shove's account?","Sum of infra-marginal units' cost advantages.",[['infra','advantage','differential']],1)],
  line:"rents depend on infra-marginal costs not on the direction of returns"},

 {h:'Final trade cost',beats:[
  ["The algebra. Output rises from x to x+1; price from p₁ to p₂. Total non-rent cost goes from c₁ to c₂. Buyers lose (p₂ − p₁)x. Landlords gain that, minus [(c₂ − p₂) − c₁].","The two are equal only if expansion leaves the cost of the other units unchanged. That condition holds \"whether returns are diminishing, increasing or constant.\""],
  {fig:'steps',a:[{title:"SHOVE'S ALGEBRA",lines:['buyers lose (p2 - p1)x','landlords gain (p2 - p1)x - [(c2 - p2) - c1]','gain - loss = p2 - (c2 - c1)','= marginal cost - final trade cost','zero only if other units cost the same','same test for rising or falling returns']}]},
  ["Name the new term. *Final trade cost* = c₂ − c₁, the rise in total cost, rent excluded, when output rises one unit. Marginal cost minus final trade cost measures *net external economies*.","Pigou's imported-raw-material case is just one example of the condition, not a special exception."],
  ["Verdict: the tax-bounty doctrine \"collapses\" in its unqualified form. Marshall's cautious original \"remains unshaken.\" \"The effects on rents must be allowed for in both types of industry.\"","Restated rule: move resources toward industries where marginal cost is far above final trade cost (large net external economies). Increasing returns make that likelier, not certain."],
  {fig:'chain',a:[{title:'THE TAX-BOUNTY DOCTRINE, 1912 TO 1928',nodes:['PIGOU 12','YOUNG 13','PIGOU 28','SHOVE 28'],caps:['tax diminishing, bounty increasing','tax half: rents are transfers','bounty half survives (decreasing price)','both halves need net external economies'],end:'Shove returns in #38 and #47 (group D2)',token:'[%]'}]},
  ["Placing it: Shove answers Pigou's 2nd edition, using Marshall's *Principles*. It runs beside Pigou's transfer elements (#35) and extends Young (#26) and Knight (#30). Shove continues in the 1930 symposium (#38) and Shove 1933 (#47), both group D2."]],
  q:[mc("What is Shove's 'final trade cost'?",["The rise in total non-rent cost when output rises by one unit","The cost of the least-favoured unit","The rent paid on the marginal land","The price of imported raw materials"],"c₂ − c₁. The cost of the least-favoured unit is marginal cost."),
     mc("In what form, per Shove, does the tax-bounty doctrine survive?",["Marshall's cautious original form, restated as marginal cost vs final trade cost","Pigou's unqualified form","Not at all: Shove rejects all intervention","Only for industries using imported materials"],"Unqualified, it collapses; Marshall's form 'remains unshaken'."),
     tf("True or false: Shove said rent effects need allowing for under diminishing returns only.",false,"'In both types of industry, not in one only.'")],
  sa:[sa("Landlords' gain minus buyers' loss equals what, per Shove?","Marginal cost minus final trade cost.",[['marginal'],['final trade','final']]),
      sa("Where should resources move under Shove's restated rule?","Toward industries with large net external economies.",[['external econom','net external','marginal cost'],['large','high','toward','more','great']])],
  line:"marginal cost minus final trade cost measures net external economies"}
]},

/* ------------------------------------------------ #37 */
{id:'37',year:1928,who:'Young',title:'YOUNG 1928 · INCREASING RETURNS AND ECONOMIC PROGRESS',secs:[
 {h:'The division of labour depends on the division of labour',beats:[
  ["Glasgow, 10 September 1928. Allyn Young gives the presidential address to Section F of the British Association; the Economic Journal prints it in December. Same Young as #26, fifteen years on. Different paper: this one is about growth."],
  ["Start with Marshall's split between *internal* and *external* economies. It is useful: it guards against the error that increasing returns must mean monopoly. But it is a partial view. External economies are not just the sum of firms' internal ones; the field changes in kind as well as size."],
  ["His text is Adam Smith: the division of labour is limited by the extent of the market. The key economies are those of *roundabout* (capitalistic) methods: labour used indirectly, through tools and machines.","\"It would be wasteful to make a hammer to drive a single nail.\" Mr. Ford's methods would be absurdly uneconomical at small output."],
  {fig:'steps',a:[{title:"YOUNG'S ARGUMENT IN STEPS",lines:['economies come from roundabout methods','they pay only with a large market','the market is the volume of production','more of one good = demand for others','so growth spreads cumulatively','division of labour feeds division of labour']}]},
  ["Two warnings. The economies are of capitalistic methods, not of large *firms*: think *large production*, not large-scale production. And they depend on the market, so \"rationalisation\" cannot simply seize them. America's productivity reflects its huge market, not cleverer managers."],
  {fig:'chain',a:[{title:'THE CUMULATIVE LOOP',nodes:['MARKET','DIVISION','OUTPUT','MARKET'],caps:['a wider market','more specialised, roundabout methods','more production at lower cost','production is itself the market'],end:'"depends in large part upon the division of labour"',token:'[@]'}]}],
  q:[mc("For Young (1928), where do the principal economies of increasing returns come from?",["Roundabout methods and the division of labour among industries","The large size of individual firms","Monopoly control of markets","Falling rents on land"],"Large production, not large-scale production."),
     tf("True or false: Young (1928) held that increasing returns necessarily lead to monopoly.",false,"He praises Marshall's distinction for guarding against exactly that error."),
     fill("Young 1928: 'It would be wasteful to make a ___ to drive a single nail.'",['hammer'],"Roundabout methods pay only with a large market.")],
  sa:[sa("What limits the division of labour, per Young?","The extent of the market, itself total production.",[['market'],['extent','size','production','volume']],1),
      sa("What does the hammer example show?","Roundabout methods pay only at large output.",[['roundabout','tool','machine','indirect','capital'],['large','market','output','scale','volume']])],
  line:"the division of labour depends on the division of labour"},

 {h:'The representative firm loses its identity',beats:[
  ["In an inclusive view, the size of the market is the volume of production. With elastic *reciprocal demand*, more of one good is more demand for others. So change does not settle into equilibrium; it propagates. Young calls it a *moving equilibrium*. Human resistance and the need to accumulate capital make it take time."],
  ["Growth works by *industrial differentiation*. Printing spawned separate industries for pulp, paper, inks, type-metal and type, illustration, and printing machinery. An intricate nexus of specialised firms grows between raw material and consumer."],
  {fig:'crowd',a:[{title:'DIFFERENTIATION: ONE TRADE BECOMES MANY',n:40,per:20,off:'.',on:'#',stages:[{frac:0.15,cap:'printing: firms of all work'},{frac:0.5,cap:'pulp, paper, ink, type split off'},{frac:0.9,cap:'a nexus of specialists: the old firm dissolves'}]}]},
  ["\"The representative firm, like the industry of which it is a part, loses its identity.\" Its internal economies dissolve into those of its specialised successors.","So firm-by-firm or industry-by-industry partial equilibrium, the supply-curve apparatus of #33 and #35, cannot see increasing returns."],
  {fig:'steps',a:[{title:"YOUNG'S THREE CONCLUSIONS",lines:['1 see industry as an interrelated whole','2 increasing returns come through the','  division of labour and roundabout methods','3 market and division of labour','  depend on each other']}]},
  ["Placing it: Young answers Marshall's internal/external split, Adam Smith, and implicitly Sraffa (not in your folder) and Pigou's apparatus (#33, #35). Robbins (#34) credits the idea in a footnote. The 1930 symposium (#38, group D2) follows. Do not confuse with Young 1913 (#26), the rent critique."]],
  q:[mc("What happens to the representative firm, per Young (1928)?",["It loses its identity as industries differentiate","It becomes the equilibrium firm","It grows into a monopoly","It is unaffected by the division of labour"],"Its internal economies dissolve into those of specialised successors."),
     mc("Young's printing example illustrates...",["Industrial differentiation into specialised industries","Lumpy fixed plant, like the medal die","Diminishing returns from land","The negative use of empty boxes"],"Pulp, paper, ink, type and machinery split off."),
     tf("True or false: Young 1928 is the same paper that argued rents are transfers.",false,"That was Young 1913 (#26). 1928 is cumulative growth.")],
  sa:[sa("Why can't partial equilibrium capture increasing returns, per Young?","They arise from economy-wide division of labour, cumulatively.",[['division','speciali','differentiat','whole','economy'],['cumulat','labour','interrelat','spread','whole','industr']]),
      sa("What is industrial differentiation?","New specialised industries splitting off as markets grow.",[['speciali','split','new industr','separate'],['market','grow','industr']])],
  line:"as industries differentiate the representative firm loses its identity"}
]}

],
gloss:[
['curve of aggregate expenses',"Young's 1913 name for Pigou's 'curve of marginal supply prices': how much each extra unit adds to the industry's total expenses, rent included.","Under diminishing returns it lies above the supply curve, because expansion raises rent on every unit.",['transfer','marginal supply price']],
['transfer',"A payment that redistributes purchasing power without using up resources. Young 1913: higher land rents are transfers, not social cost.","A landlord's higher rent is the farmer's loss and the landlord's gain.",['curve of aggregate expenses','transfer elements','value changes']],
['empty boxes',"Clapham's 1922 name for the diminishing, constant and increasing returns categories that no one had filled with real industries.","Nobody could say whether hats belonged in the increasing-returns box.",['organisation','little cases']],
['organisation',"In Marshall, the source of increasing returns as an industry grows (better division of labour, external economies), as distinct from invention.","Clapham: freezing strata at Doncaster was invention and organisation at once.",['empty boxes']],
['little cases',"Pigou 1922: the numerical ranges of supply and demand elasticities inside the broad returns 'valises'; what policy actually needs.","Knowing only that returns increase is like knowing a temperature is above normal.",['empty boxes','negative use']],
['negative use',"Pigou 1922: even empty, the returns categories expose hidden assumptions in popular claims.","'A tax always raises price by the full tax' quietly assumes constant returns.",['little cases']],
['two roads',"Pigou's 1920 example of a broad poor road and a narrow good road; free choice over-crowds the good one, so a tax would raise output. Knight 1924: a private owner's toll does the same.","The toll stops traffic where the marginal truck adds no more than on the free road.",['transfer','value changes']],
['value changes',"Knight 1924: one of two sources of increasing cost, beside technological changes. The later label 'pecuniary' is Viner 1931, not Knight.","Rents paid to specialised factors are redistributions, not social cost.",['two roads','transfer']],
['decreasing cost',"Robertson 1924's preferred term for an industry whose average full cost falls with output; he splits it into Class I and Class II.","Class I: the £20 medal die; Class II: gradual improvement in technique.",['class I','external diseconomies']],
['class I',"Robertson 1924: decreasing cost from lumpy fixed capital spread over more units; cost falls at once when demand rises. Class II is gradual improvement in technique and organisation.","£20 die + 5s a medal: 50 medals cost 13s each.",['decreasing cost']],
['external diseconomies',"Robertson's 1924 label for the force Pigou's increasing-cost case needed: each producer's expansion making others less efficient.","'Who in the world are they?' Robertson found none but rising rents.",['decreasing cost','transfer']],
['marginal social net product',"Pigou's 1924 term for the addition to the national dividend from the marginal unit of resources, counting effects on others; Edgeworth 1925 reviews it.","Under increasing returns it exceeds the private product, Edgeworth argues.",['curve of aggregate expenses']],
['cost function',"Pigou 1927: the long-period, 'normal now' link between output and aggregate cost, counting only changes caused by scale.","Spontaneous inventions that would occur at any output are excluded.",['minimum apparatus']],
['minimum apparatus',"Pigou 1927: internal economies from a big first outlay and small cost after; relevant under monopoly.","Rail: £100,000 for the first hundredweight, 6d for each after.",['cost function','class I']],
['representative firm',"Marshall: a typical long-lived firm of normal ability with normal access to internal and external economies. Robbins 1928 calls it superfluous; Young 1928 says it loses its identity.","Robbins: unequal managers earn unequal profits, like rents.",['equilibrium firm','static disparities']],
['static disparities',"Robbins 1928: efficiency differences from scarce superior factors, which persist in equilibrium; dynamic disparities come from maladjustment during change.","Rare managers like Josiah Stamp earn rent-like profits.",['representative firm']],
['equilibrium firm',"Pigou 1928: a firm that is in equilibrium whenever the industry is; price equals its marginal and average cost; it need not be typical or average-sized.","Stable equilibrium at the minimum of its U-shaped average cost.",['representative firm','marginal substitute cost']],
['marginal substitute cost',"Pigou 1928: the extra cost of one more unit to the equilibrium firm if industry output is unchanged (rivals contract); additive cost holds rivals' output fixed.","Pigou uses substitute cost for the many-firm case.",['equilibrium firm']],
['transfer elements',"Pigou 1928: rises in supply price from higher factor prices, which only transfer income to factor owners. Corrected for them, increasing supply price is impossible.","Exception: imported materials, from one country's point of view.",['transfer','equilibrium firm']],
['infra-marginal costs',"Shove 1928: the non-rent costs of units produced with differential advantages; expansion can change them.","A haulage economy lowers them; port congestion raises them.",['final trade cost']],
['final trade cost',"Shove 1928: the rise in total non-rent cost when output rises one unit (c₂ − c₁). Marginal cost minus it measures net external economies.","Shift resources to industries where marginal cost far exceeds final trade cost.",['infra-marginal costs','transfer elements']],
['roundabout methods',"Young 1928: using labour indirectly through tools and machines; worthwhile only with a large market.","A hammer for one nail is wasteful; Ford's methods need huge output.",['industrial differentiation']],
['industrial differentiation',"Young 1928: new specialised industries split off as the market grows; the main vehicle of increasing returns.","Printing spawned pulp, ink, type and printing-machinery industries.",['roundabout methods','representative firm']]
],
