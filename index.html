/* ------------------------------------------------ #38 */
{id:'38',year:1930,who:'Robertson, Sraffa & Shove',title:'SYMPOSIUM 1930 · INCREASING RETURNS AND THE REPRESENTATIVE FIRM',secs:[
 {h:'Robertson: the trees of the forest',beats:[
  ["March 1930. The Economic Journal prints a symposium, 'Increasing Returns and the Representative Firm'. The editor assigns the parts: Robertson a partial rehabilitation of Marshallian orthodoxy, Sraffa negative and destructive criticisms, Shove constructive suggestions.","The puzzle is old. If a firm's own *internal economies* make it cheaper as it grows, why does one firm not take the whole trade?"],
  {fig:'chain',a:[{title:'THE 1930 SYMPOSIUM (EJ, PP. 79-116)',nodes:['ROBERTSON','SRAFFA','SHOVE'],caps:['rehabilitates Marshall: the representative firm','destroys: discard Marshall\'s theory','constructs: imperfect markets and time'],end:'one question: internal economies vs competition',token:'[?]'}]},
  ["Robertson answers Robbins (#34), who called the *representative firm* unhelpful. Robertson needs it to separate normal profit from the losses of firms on the way out: the newcomer struggling in, the mature firm on a run of bad luck, the obsolete concern.","Marshall: some trees are tall, some short. Robbins: because some are oaks and some hawthorns. Robertson: 'some oaks are taller than other oaks'."],
  ["Part II lists the escape routes others tried. Schumpeter denies the falling supply curve. Sraffa turns to monopoly. Pigou leans on *external economies* and, in 1928, an 'external-internal' hybrid (#33, #35). Young widens external economies (#37)."],
  {fig:'compare',a:[{left:{h:'PIGOU: EQUILIBRIUM FIRM',lines:['price = AC = MC','at minimum average cost','economies exhausted']},right:{h:'MARSHALL: REP. FIRM',lines:['AC still falling','price above MC','yet no firm expands']},note:"Robertson's Figs. 1 and 2 (p. 88)"}]},
  ["Why does no firm expand? There is no identifiable entity with a continuing will that has both the power and the inducement to expand. Messrs. Smith and Robinson have every normal property of the representative firm except one: expanding indefinitely at falling cost.","His metaphor: real firms are *water-drops* forming part of a wave. The wave travels on; the drops do not travel with it."],
  ["Write it this way: Robertson 1930 says the representative firm can be in equilibrium with falling average cost and price above marginal cost, because no actual firm has both the power and the motive to take the trade."]],
  q:[mc("In the 1930 symposium, why can Robertson's representative firm be in equilibrium with falling costs?",["No identifiable firm has both the power and motive to expand","External economies exactly offset the internal ones","The firm's demand curve slopes down steeply","Price equals marginal cost at minimum average cost"],"Firms are water-drops in a wave: none lasts long enough to ride the falling cost curve to monopoly."),
     tf("True or false: the editor described Sraffa's contribution as 'constructive suggestions'.",false,"Sraffa gave 'negative and destructive criticisms'. Shove gave the constructive suggestions."),
     fill("Robertson (1930): real firms are like ___-drops forming part of a wave.",['water','water-drops','water drops'],"The wave (the representative firm) has properties no single drop (Smith and Robinson) shares.")],
  sa:[sa("Robertson's reason no firm takes the whole trade?","No identifiable firm has both power and motive to expand.",[['identifi','actual','real','no firm','no single'],['power','motive','inducement','will','expand','grow']]),
      sa("Whose 1928 paper was Robertson answering?","Robbins 1928 on the representative firm.",[['robbins']],1)],
  line:"no identifiable firm has both the power and motive to expand"},

 {h:'Sraffa says discard; Shove calls in markets and time',beats:[
  ["Sraffa grants that internal economies drive firms *towards* equilibrium. At equilibrium they must have stopped, so the firm sits at minimum average cost.","Restated, Robertson's firm is 'a position occupied by a firm'. Then Sraffa's question: if new, bigger firms are cheaper, 'why didn't they come into existence before?' Why in the new equilibrium and not the old?"],
  {fig:'plot',a:[{title:'SRAFFA 1930: FREE COMPETITION (sketch)',xl:"output of the firm",yl:'cost',xr:[0,10],yr:[1,5],curves:[{f:x=>2+0.08*(x-5)*(x-5),ch:'C',name:'average cost'},{f:x=>2,ch:'-',name:'demand facing the firm'}],eq:[0,1],eqf:(x,y)=>'tangent at minimum cost: no Providence needed',cap:"the firm's demand curve is horizontal",yf:v=>v.toFixed(0)}]},
  ["Robertson's rejoinder: diminishing utility always operates, yet it helps fix equilibrium, so why not internal economies? And Sraffa is in effect asking 'why slavery was not abolished' sooner.","Sraffa's last word: under free competition the firm's horizontal demand curve touches its cost curve at the minimum, with no Providence required. Marshall's theory cannot be both consistent and true to the facts: 'I think it is Marshall's theory that should be discarded.'"],
  ["Shove sides with Robbins: the representative firm is brilliant but not indispensable. Equilibrium is the placing of unlike units of resources, 'a jig-saw puzzle rather than a problem in hydro-dynamics'.","He drops internal and external. New labels: *economies of individual expansion* (one firm grows, industry output fixed) and *economies of large-scale industry* (the whole industry grows). Add economies of concentration, zero in equilibrium, and of rationalisation."],
  {fig:'steps',a:[{title:'SHOVE: HOW MANY FIRMS SURVIVE FALLING COST',lines:["1 invading a rival's market costs more","  than adding to your own (transport, tastes)","  -> falling supply price, yet no monopoly","  cf. Pigou: marginal substitute vs additive cost","2 even in a perfect market: time","  luck and ability change as a firm grows","  -> the lead passes from firm to firm"]}]},
  ["Marshall himself limited the trees analogy to the era before joint-stock companies. Shove offers a replacement: 'a cluster of variable stars', long-lived firms whose fluctuations offset each other.","Don't confuse: Sraffa here uses the logic of perfect competition to show Marshall inconsistent. He is not calling perfect competition realistic."],
  ["Place it. The symposium answers Robbins (#34), Pigou (#33, #35), Shove's own #36, Young (#37) and Robertson (#31); Sraffa 1926 is not in your folder. Harrod (#41, #43) and Robinson (#44) build on Shove's imperfect market. Shove returns in #47 and #52."]],
  q:[mc("What did Sraffa conclude in the 1930 symposium?",["Marshall's theory should be discarded","The representative firm needs external economies","Imperfect markets rescue Marshall's theory","Supply curves belong to a theory of variations"],"'I think it is Marshall's theory that should be discarded' (p. 93)."),
     tf("True or false: Sraffa's 1930 rejoinder says that under free competition the firm's demand curve is tangent to its cost curve at minimum cost.",true,"A horizontal demand line can only touch a U-shaped cost curve at its bottom."),
     mc("Which pair of labels did Shove (1930) put in place of internal and external economies?",["Individual expansion vs large-scale industry","Marginal substitute vs marginal additive cost","Minimum cost vs special cost","Actual vs potential uses of factors"],"Does one firm grow at rivals' expense, or does the whole industry grow?")],
  sa:[sa("Sraffa's question about Robertson's 'position' firm?","Why didn't bigger cheaper firms come into existence before?",[['before','earlier','sooner','old equilibrium'],['firm','bigger','cheaper','new','exist']]),
      sa("Shove's first reason internal economies fit competition?","Invading rivals' markets costs more than expanding your own.",[['invad','rival','trespass','other firm','competitor'],['cost','transport','prefer','dear','expens']])],
  line:"sraffa says discard marshall shove says imperfect markets and time"}
]},

/* ------------------------------------------------ #41 */
{id:'41',year:1930,who:'Harrod',title:'HARROD 1930 · NOTES ON SUPPLY',secs:[
 {h:'The increment of aggregate demand curve',beats:[
  ["June 1930, three months after the symposium. Roy Harrod's 'Notes on Supply' calls itself propaedeutic, groundwork, to Pigou (#35) and Shove (#38). His unit is a *source of supply*: a firm or plant whose costs split into prime and supplementary."],
  ["Section I, short period. With fixed equipment, marginal prime cost KCm cuts average prime cost at its minimum E, and average total cost LCt at its minimum F, the *optimum output*.","Under perfect competition the source faces a horizontal demand line. Output goes where rising marginal cost meets it: increasing supply price."],
  ["Section II. A source that is not small faces a falling demand curve DD′. From it Harrod derives DD″: total receipts from x units minus total receipts from x−1 units, 'which I propose to call the increment of aggregate demand curve'.","That is marginal revenue in all but name. Output goes where marginal cost cuts DD″."],
  {fig:'plot',a:[{title:'HARROD 1930 FIG. 2 (sketch)',xl:'output of the source',yl:'price',xr:[0,10],yr:[0,8.5],curves:[{f:x=>8-0.5*x,ch:'D',name:"DD′ demand"},{f:x=>8-x,ch:'I',name:'DD″ increment'},{f:x=>0.1*(x-8)*(x-8)+1.4,ch:'M',name:'KCm (MC)'}],eq:[1,2],eqf:(x,y)=>'MC cuts DD″ while MC is still falling',cap:'output where marginal cost cuts DD″, not DD′',yf:v=>v.toFixed(0)}]},
  ["Two results. Under perfect competition DD′ and DD″ coincide, so nothing changes. But a monopolistic source can show *decreasing supply price*: in the short period if it has excess capacity, in the long period through larger plant. With a few sources, all may.","Write it this way: Harrod 1930 first drew the marginal revenue curve and called it the increment of aggregate demand curve. Robinson renamed it in 1932 (#44)."]],
  q:[mc("What did Harrod (1930) call the curve later known as marginal revenue?",["The increment of aggregate demand curve","The long-period productive cost curve","The particular demand curve of the source","The marginal substitute cost curve"],"Harrod's DD″ (p. 238). Robinson renamed it in 1932."),
     tf("True or false: under perfect competition Harrod's DD′ and DD″ coincide.",true,"With a horizontal demand line, one more unit adds exactly the price to receipts."),
     fill("Who renamed Harrod's curve the 'marginal revenue curve' in 1932?",['robinson','joan robinson','mrs robinson','mrs. robinson'],"Robinson, EJ December 1932, p. 546 n. Harrod accepted the name in 1933.")],
  sa:[sa("Where does Harrod's monopolistic source set output?","Where marginal cost cuts the increment of aggregate demand curve.",[['marginal cost','mc','kcm'],['increment','marginal revenue','mr','dd']]),
      sa("What does Harrod's DD″ curve measure?","Receipts from x units minus receipts from x−1 units.",[['receipt','revenue','price','total'],['minus','extra','additional','one more','increment','less']])],
  line:"harrod 1930 called marginal revenue the increment of aggregate demand curve"},

 {h:'Decreasing cost conditions and the agriculture puzzle',beats:[
  ["Back in Section I. A source *working under capacity*, one that could lower its average prime cost by expanding, is evidence of *quasi-monopoly*. Under perfect competition it would simply expand."],
  ["Long period. Some fixed equipment and goodwill outlast the period. When demand falls, equipment is not renewed, so short-period cost schedules rise. Harrod calls this the *law of decreasing cost conditions*.","It is asymmetric: permanent equipment can be increased but not decreased."],
  {fig:'steps',a:[{title:'LAW OF DECREASING COST CONDITIONS',lines:['demand for the source falls','worn equipment is not renewed','short-period cost schedules shift up','asymmetry: equipment can be added,','  but not taken away']}]},
  ["Section III changes the subject. Suppose an industry uses factor A in more than the national-average proportion. It can only get more of A at a rising price, so it has *increasing supply price*, and the bigger the industry, the stronger the effect.","Make A land and you have classical agriculture. Harrod says this explains it better than the 'inelasticity of land'."],
  {fig:'compare',a:[{left:{h:'SEC. II: FALLING PRICE',lines:['source faces falling','  demand','output where MC','  cuts DD″']},right:{h:'SEC. III: RISING PRICE',lines:['industry uses factors','  in unusual proportions','bids up their prices','agriculture and land']},note:'Sec. III works through factor prices, not firm costs'}]},
  ["Place it. Harrod 1930 builds on Pigou (#35) and Shove (#38). He extends Section II in 1931 (#43). Robinson renames his curve in 1932 (#44) and he accepts the name in 1933 (#45). Robinson 1941 (#51) runs the Section III factor-proportions logic again."]],
  q:[mc("For Harrod (1930), what is evidence of quasi-monopoly?",["Sources working under capacity","Sources earning exactly normal profit","Industries using land intensively","A horizontal demand curve for the source"],"A source that could cut average prime cost by expanding, but doesn't, must face a falling demand curve."),
     mc("Why does agriculture face increasing supply price, per Harrod 1930 Section III?",["It uses land in more than the average proportion","The supply of land is perfectly inelastic","Farms face falling particular demand curves","Farm equipment cannot be scaled down"],"Expansion bids up the relative price of the factor it uses heavily."),
     tf("True or false: Harrod's law of decreasing cost conditions says short-period cost schedules rise after demand falls.",true,"Fixed equipment is not renewed, so costs at each output rise.")],
  sa:[sa("Harrod's evidence of quasi-monopoly?","Sources working under capacity.",[['capacity','excess','below optimum','under'],['source','firm','plant','work']]),
      sa("Harrod 1930: why rising supply price in agriculture?","It uses land in more than average proportion.",[['land','factor'],['proportion','average','intensiv','more than']])],
  line:"an industry using factors in unusual proportions faces rising supply price"}
]},

/* ------------------------------------------------ #43 */
{id:'43',year:1931,who:'Harrod',title:'HARROD 1931 · THE LAW OF DECREASING COSTS',secs:[
 {h:'Marketing costs and MC = p − p/η',beats:[
  ["December 1931. Harrod claims decreasing costs are compatible with competitive equilibrium by two routes: competitive *marketing costs*, or a falling demand curve for the firm, or both."],
  ["Route one. *Marginal competitive marketing costs* are the cost of trespassing into a neighbour's territory. If extra demand is spread evenly, every firm can grow without trespass.","So cost depends on output and on the state of demand: 'every demand schedule has its own appropriate supply schedule'. The plane supply curve breaks down; you need three dimensions."],
  {fig:'steps',a:[{title:'ROUTE ONE: MARKETING COSTS',lines:["firm grows by taking a neighbour's buyers","  -> high marginal marketing cost","demand rises evenly everywhere","  -> each firm grows without trespass","  -> lower cost at the larger output","supply price can fall: decreasing costs"]}]},
  ["Route two. If the firm's demand curve slopes down, the marginal increment of receipts falls short of price by price/elasticity. In equilibrium MC = p − p/η.","Harrod says this formula 'has universal applicability'. Perfect competition is the case of infinite elasticity, so MC = p. With finite elasticity, normal profit is possible while costs are still falling."],
  {fig:'table',a:[{title:'MC = p − p/η WITH p = 10 (illustrative)',head:['elasticity','p/η','MC'],rows:[['infinite','0','10'],['10','1','9'],['5','2','8'],['2','5','5']],note:'perfect competition = infinite elasticity'}]},
  ["Write it this way: Harrod 1931 says decreasing costs *may* coexist with competitive equilibrium. Keep the word 'may'. Robinson will say 'must' (#44)."]],
  q:[mc("Which formula did Harrod (1931) say 'has universal applicability'?",["MC = price − price/elasticity","Price = AC = MC","AR = AC at the point of tangency","Cost = value of displaced alternatives"],"Perfect competition is the special case of infinite elasticity (p. 570)."),
     tf("True or false: for Harrod 1931, with competitive marketing costs, supply price depends on the state of demand as well as on output.",true,"'Every demand schedule has its own appropriate supply schedule.'"),
     mc("Why can an evenly spread rise in demand lower costs in Harrod 1931?",["Firms can expand without trespassing on neighbours","New firms bring external economies with them","Factor prices fall as the industry grows","Each plant moves past its optimum output"],"No trespass, so no extra marginal marketing cost.")],
  sa:[sa("What are Harrod's marginal competitive marketing costs?","The cost of trespassing into a neighbour's territory.",[['trespass','invad','neighbour','neighbor','rival'],['cost','expens']]),
      sa("Harrod 1931: perfect competition is which special case?","Infinite elasticity of demand, so MC equals price.",[['infinit','perfectly elastic','horizontal'],['elastic','demand']])],
  line:"marginal cost equals price minus price over elasticity"},

 {h:'The envelope and increasing returns industries',beats:[
  ["Section III, long period. Won't firms below optimum size merge? Not if transport costs rise with concentration. Nor if *individualism* persists: firms' wish to keep their own identity. Here he cites Shove (#38)."],
  ["Section IV. Decreasing costs are normal where technical progress makes the optimum plant grow faster than demand. Even then, a firm builds the plant that meets expected normal demand most cheaply."],
  {fig:'plot',a:[{title:'HARROD 1931 FIG. 2: ENVELOPE (sketch)',xl:'output',yl:'cost',xr:[0,10],yr:[0,7],curves:[{f:x=>5+0.5*(x-2)*(x-2),ch:'1',name:'small'},{f:x=>3.5+0.5*(x-5)*(x-5),ch:'2',name:'medium'},{f:x=>2+0.5*(x-8)*(x-8),ch:'3',name:'large'},{f:x=>5.875-0.5*x,ch:'E',name:'envelope'}],cap:'E touches each plant curve left of its minimum',yf:v=>v.toFixed(0)}]},
  ["The envelope is Harrod's *long-period productive cost curve*. It touches each plant curve at the output that plant serves best. Where the envelope falls, it touches each parabola on its falling side, so the chosen plant is worked below its own optimum."],
  ["His conclusion: enough to establish 'the legitimacy of the conception of increasing returns industries'.","Place it. He builds on his own #41 and answers Sraffa 1926 (not in your folder). Robinson (#44) objects that price = AC with MR = MC is no accident, and that the motive to merge is monopoly profit. Harrod replies in 1933 (#45)."]],
  q:[mc("What is Harrod's 'long-period productive cost curve' (1931)?",["The envelope of a family of plant-cost curves","The marginal cost curve of the optimum plant","The industry supply curve under perfect competition","The increment of aggregate demand curve"],"Fig. 2: one parabola per plant size; the envelope touches each."),
     tf("True or false: where Harrod's envelope falls, the chosen plant is worked beyond its own optimum output.",false,"Below it: the envelope touches each parabola on the parabola's falling side."),
     mc("Which two long-period reasons does Harrod 1931 give for firms below optimum size not merging?",["Transport costs and individualism","Monopoly profit and entry costs","Indivisibilities and expectations","Luck and the ageing of managers"],"Concentration raises transport costs, and firms want to keep their identity.")],
  sa:[sa("Where are decreasing costs normal, per Harrod 1931?","Where optimum plant size grows faster than demand.",[['optimum','plant'],['faster','grow','outpace','than demand']]),
      sa("What is the long-period productive cost curve?","The envelope of the plant cost curves.",[['envelope','touch','tangent'],['plant','parabola','short']])],
  line:"the envelope touches each plant curve on its falling side"}
]},

/* ------------------------------------------------ #44 */
{id:'44',year:1932,who:'Robinson',title:'ROBINSON 1932 · IMPERFECT COMPETITION AND FALLING SUPPLY PRICE',secs:[
 {h:"The double condition and Kahn's tangency",beats:[
  ["December 1932. Joan Robinson isolates imperfect competition. Assume identical firms, factors in perfectly elastic supply, no external or disintegration economies, no time problems. The market is imperfect only through transport costs or fixed preferences."],
  ["From each firm's demand curve she derives the *marginal revenue* curve. Her footnote: it is the 'increment of aggregate demand curve' of Mr. Harrod (#41). Her name sticks.","Two conditions. The firm: MR = MC. The industry: price = AC, with *normal profit* counted in AC, normal meaning the level whose excess draws in new firms."],
  {fig:'plot',a:[{title:'ROBINSON 1932 FIG. 2 (sketch)',xl:"firm's output",yl:'cost',xr:[0,10],yr:[0,7],curves:[{f:x=>2+0.1*(x-7)*(x-7),ch:'C',name:'AC'},{f:x=>5.3-0.6*x,ch:'A',name:'AR (demand)'},{f:x=>5.3-1.2*x,ch:'R',name:'MR'},{f:x=>x<2.5||x>7?NaN:0.3*x*x-2.8*x+6.9,ch:'M',name:'MC'}],eq:[1,0],eqf:(x,y)=>'P: AR tangent to AC on its falling part',cap:'MR cuts MC directly below P',yf:v=>v.toFixed(0)}]},
  ["Both hold only where the demand curve is *tangent* to the AC curve. She credits R. F. Kahn, who reached it by 'pursuing Mr. Sraffa's argument'. Since demand slopes down, the tangency lies on the falling part of AC.","Her words: average costs 'may be falling: they must be falling.'"],
  {fig:'steps',a:[{title:'THE DOUBLE CONDITION',lines:['firm equilibrium: MR = MC','industry equilibrium: price = AC','  (normal profit counted in AC)','both at once: AR touches AC (Kahn)','AR slopes down, so AC slopes down there','=> equilibrium average cost is falling']}]},
  ["She turns on Harrod (#43): the double condition is no accident, and the chief motive to amalgamate is monopoly profit, since a bigger share means less elastic demand. Not savings on marketing costs."]],
  q:[mc("What is Robinson's 'double condition' (1932)?",["MR = MC and price = AC","MC = price and AC at its minimum","MR = AR and MC = AC","Price = MC and zero normal profit"],"Firm equilibrium plus industry equilibrium with normal profit."),
     tf("True or false: Robinson credits the tangency theorem to R. F. Kahn.",true,"Footnote p. 547: Kahn, 'pursuing Mr. Sraffa's argument'."),
     fill("Robinson 1932: in full equilibrium the firm's average costs 'must be ___'.",['falling','decreasing','declining'],"A downward-sloping AR can only touch AC where AC also slopes down.")],
  sa:[sa("Why must AC fall in Robinson's equilibrium?","Demand slopes down and is tangent to AC there.",[['tangen','touch'],['slope','fall','downward','down']]),
      sa("What did Robinson rename Harrod's curve?","The marginal revenue curve.",[['marginal revenue']],1)],
  line:"the demand curve touches average cost where average cost is falling"},

 {h:'Falling cost is not falling supply price',beats:[
  ["Now raise total demand. New firms enter until tangency is restored. Factor prices are constant and firms identical, so the AC curve does not move. What moves is the firm's demand curve, and the new price depends on its *elasticity*."],
  {fig:'plot',a:[{title:'FIG. 5: MORE ELASTIC DEMAND (sketch)',xl:"firm's output",yl:'cost',xr:[0,10],yr:[0,7],curves:[{f:x=>2+0.1*(x-7)*(x-7),ch:'C',name:'AC'},{f:x=>5.3-0.6*x,ch:'A',name:'AR'}],eq:[1,0],eqf:(x,y)=>'tangency: price '+y.toFixed(1),shift:{curve:1,to:{f:x=>3.875-0.3*x},cap:'flatter AR: new tangency lower and to the right'},cap:'old tangency at P',yf:v=>v.toFixed(0)}]},
  {fig:'table',a:[{title:'ROBINSON FIGS. 3-5: AFTER DEMAND RISES',head:['new demand','price','example'],rows:[['same elasticity','unchanged','new suburbs'],['less elastic','higher','fringe buyers'],['more elastic','lower','denser population']],note:'most frequent, she thinks: the last row'}]},
  ["The most frequent case: demand spread evenly over a denser population, new firms set up between the old ones, buyers more indifferent, elasticity up, price down.","Relax the assumptions and falling supply price becomes 'highly probable'. Imperfection blocks lateral and vertical *disintegration*; more demand releases that reservoir of economies."],
  ["Write it this way: under imperfect competition the firm's *average cost must fall*, but the *supply price* of the commodity may rise, fall or stay the same. Her supply curve depends on the type of change in demand."],
  ["Place it. Robinson answers Sraffa 1926 (not in your folder), the symposium (#38) and Harrod (#41, #43). In 1933 Pigou confirms her in algebra (#46), Shove questions her cost curve and normal profit (#47), and Harrod says 'may', not 'must' (#45). Report: accept, and expect three referees."]],
  q:[mc("In Robinson 1932, when does a rise in total demand lower supply price?",["When the new individual demand curves are more elastic","When the new individual demand curves are less elastic","Whenever average cost of the firm is falling","When factor prices fall as the industry grows"],"Same elasticity: unchanged. Less elastic: higher. More elastic: lower."),
     tf("True or false: Robinson 1932 concludes that falling average cost of the firm always means falling supply price.",false,"Firm AC must fall; supply price may go either way."),
     mc("Which of Robinson's examples leaves price unchanged?",["New suburbs whose residents switch to new local firms","Denser population with new firms set up in between","New firms taking the indifferent fringe of buyers","Disintegration releasing a reservoir of economies"],"The new firms' demand curves are like the old ones, so elasticity is unchanged.")],
  sa:[sa("What decides supply price after demand rises, per Robinson?","Elasticity of the new individual demand curves.",[['elastic'],['demand','individual','firm']]),
      sa("Falling firm AC or falling supply price: which must hold?","Falling average cost must hold; supply price may not.",[['average cost','ac ','firm'],['must']])],
  line:"the firm's cost must fall but supply price may go either way"}
]},

/* ------------------------------------------------ #46 */
{id:'46',year:1933,who:'Pigou',title:'PIGOU 1933 · A NOTE ON IMPERFECT COMPETITION',secs:[
 {h:'Two equations, two unknowns',beats:[
  ["March 1933. Pigou doubts that Robinson's two conditions can always hold together: each firm maximises net monopoly revenue, and no firm wants to enter or leave. So he rebuilds her geometry in algebra.","His own modest description: 'improving, on a rather bleak ice-wall, a staircase which has already been made and ascended'."],
  {fig:'steps',a:[{title:'PIGOU 1933: THE ALGEBRA',lines:['F(p): total demand at works price p','f(p): output of a firm whose AC is p','n: number of firms','ψ(p,n): firm\'s demand if it alone moves p','(1) (1/n)F(p) = f(p)','(2) (1/n)F′(p) − ∂ψ/∂p = f′(p)','two equations, two unknowns: p and n']}]},
  ["So the conditions are compatible and the problem is determinate. The equations still work when firms differ in size, reading n as how many times the firm's output divides into the total, and in situation, for firms themselves in equilibrium.","His results 'add nothing of significance' to hers, he says, but they drop her assumption of identical firms."],
  ["The degree of imperfection decides scale. In a perfect market ∂ψ/∂p is infinitely negative, so the firm is at optimum scale. Any finite imperfection puts it below optimum scale: falling AC. Infinite imperfection meets both conditions only at nil output.","∂ψ/∂p, the rate at which customers switch to other firms, is his *measure of market imperfection*."],
  {fig:'compare',a:[{left:{h:'PIGOU #46',lines:['confirms Robinson','algebra in p and n','unequal firms allowed']},right:{h:'SHOVE #47',lines:['questions Robinson','what is the AC curve?','normal profit a range']},note:'same issue of the EJ, March 1933'}]},
  ["Place it. Pigou answers Robinson 1932 (#44). Read him beside Shove (#47), printed right after him, and Harrod (#45). One confirms; the other two question."]],
  q:[mc("What did Pigou (1933) show by restating Robinson's analysis in algebra?",["Her two conditions are compatible and determinate","Her two conditions are generally incompatible","Firms reach optimum scale despite imperfection","Normal profit is a range, not a single level"],"Two equations in two unknowns, p and n."),
     tf("True or false: for Pigou 1933, any finite market imperfection puts the firm below optimum scale.",true,"Only a perfect market (∂ψ/∂p infinitely negative) gives optimum scale."),
     mc("What does Pigou's ∂ψ/∂p measure?",["Market imperfection: customers switching to rivals","The elasticity of aggregate demand","The slope of the firm's average cost curve","The number of firms in the industry"],"He proposes it as 'a measure of market imperfection'.")],
  sa:[sa("What are Pigou's two unknowns?","Price and the number of firms.",[['price'],['number','firms']]),
      sa("Did Pigou 1933 overturn Robinson?","No, he confirmed her results in algebra.",[['confirm','agree','support','no'],['algebra','equation','robinson','result']])],
  line:"pigou confirms robinson with two equations in price and number of firms"}
]},

/* ------------------------------------------------ #47 */
{id:'47',year:1933,who:'Shove',title:'SHOVE 1933 · THE IMPERFECTION OF THE MARKET',secs:[
 {h:"Shove's two questions and Robinson's reply",beats:[
  ["Same issue, March 1933. Shove does not reject Robinson's conclusion; he questions her proof. First a small matter: he never held that falling firm costs must mean falling supply price. In 1930 he wrote 'often (though not always or necessarily)'."],
  ["First question: what does her AC curve show? She says an industry's supply curve depends on the kind of demand change. So does a firm's cost: why don't old firms open suburban branches? Her curve cannot be minimum cost, or Kahn's theorem fails. It cannot be actual cost, which moves with demand."],
  ["Second question: what is *normal profit* when entry is costly? Output has no tendency to change while profit lies between the exit level and the entry level. So normal profit is a range, and tangency shows only maximum profit: a definition, not a condition."],
  {fig:'steps',a:[{title:'SHOVE 1933: TWO QUESTIONS',lines:['Q1 what costs does the AC curve show?','   cost depends on how the firm expands','   which depends on the kind of demand','Q2 what is normal profit with entry costs?','   a range: exit level to entry level','   tangency = maximum profit only']}]},
  ["His alternative splits cost into *minimum cost*, the cheapest known way to make an output, and *special cost*: advertising, transport, facilities that raise its selling value. Demand 'is not simply a datum to which the producers adjust'; they create and mould it."],
  {fig:'compare',a:[{left:{h:'SHOVE ASKS',lines:['cost moves with demand','normal profit = range','tangency = definition']},right:{h:'ROBINSON REPLIES',lines:['concedes: costs vary','  only with output','firm vs industry','  equilibrium confused']},note:'her reply is printed at the end, pp. 124-125'}]},
  ["Robinson concedes one unstated assumption: costs vary only with output. She charges Shove with mixing *equilibrium of the firm* (MR = MC) with *equilibrium of the industry* (entry: price vs AC).","Place it. Shove answers Robinson (#44) and defends his own #38. Harrod (#45) builds on his normal-profit point."]],
  q:[mc("What were Shove's two questions to Robinson (1933)?",["What her AC curve shows, and what normal profit is","Why firms merge, and why transport costs rise","Whether her conditions are compatible and determinate","Why bigger firms did not appear earlier, and where"],"The cost curve question and the normal-profit question."),
     tf("True or false: in reply, Robinson conceded she had assumed costs vary only with output.",true,"She admits costs probably vary with the nature of the demand increase."),
     mc("What is Shove's 'special cost'?",["Spending such as advertising that raises selling value","The cheapest known way to produce an output","The cost of a firm's marginal plant","The cost of entering a new industry"],"Minimum cost is the technical cheapest; special cost is extra selling outlay.")],
  sa:[sa("Normal profit with entry costs, per Shove?","A range between the exit and entry levels.",[['range','band','between'],['entry','exit','enter','leave']]),
      sa("Which distinction did Robinson say Shove missed?","Equilibrium of the firm versus of the industry.",[['firm'],['industry']])],
  line:"with entry costs normal profit is a range not a single level"}
]},

/* ------------------------------------------------ #45 */
{id:'45',year:1933,who:'Harrod',title:'HARROD 1933 · A FURTHER NOTE ON DECREASING COSTS',secs:[
 {h:'May, not must',beats:[
  ["June 1933. Harrod first accepts the new name: Mrs. Robinson has 're-christened' his clumsy increment of aggregate demand curve with 'the more elegant name' marginal revenue.","Then he goes after her normal profit."],
  ["Robinson's normal profit neither attracts nor repels firms. But a unique rate that attracts entrants above it and drives firms out below it should surely mean perfect competition. Under imperfect competition her definition gives only a range of rates."],
  ["Harrod's own rate: the return just enough to make the firm itself add fixed equipment. It probably sits above the exit rate and below the entry rate. It is earned on the *marginal plant*, not on average."],
  {fig:'steps',a:[{title:'HARROD 1933: WHY TANGENCY IS NOT NEEDED',lines:['long-period cost = envelope of plants (#43)','each plant built on the normal rate','equilibrium: marginal plant earns that rate','average profit can differ from it','so price need not equal average total cost','no tangency needed: costs may fall, or not']}]},
  {fig:'compare',a:[{left:{h:'ROBINSON 1932',lines:['normal profit: entry','tangency forced','AC must fall']},right:{h:'HARROD 1933',lines:['normal profit: margin','tangency not needed','AC may fall']},note:'the exam word: may vs must'}]},
  ["If price exceeds average total cost, the long-period cost curve may not slope down at all. After a long depression, decreasing costs become more than usually likely. 'It is not true that there is a unique normal rate of profit' in her sense.","Place it. Harrod answers Robinson (#44) and builds on Shove (#47). He keeps his 1931 'may' (#43). The normal-profit argument continues in group E."]],
  q:[mc("How does Harrod (1933) define the normal rate of profit?",["The rate on the marginal plant that induces the firm to extend it","The rate whose excess attracts new firms into the industry","Any rate between the entry and the exit rates","The rate at which price equals minimum average cost"],"Set by the firm's own investment at the margin, not by entry."),
     tf("True or false: Harrod 1933 agrees with Robinson that average costs must be falling in equilibrium.",false,"Harrod: may. Robinson: must."),
     mc("When does Harrod 1933 say long-period decreasing costs are more than usually likely?",["After a prolonged depression","During a rapid boom","When markets are perfect","When all firms are identical"],"Firms settle at low output, prices and profits.")],
  sa:[sa("Harrod 1933 vs Robinson 1932 on falling costs?","Harrod says may; Robinson says must.",[['may'],['must']]),
      sa("Where must Harrod's normal rate of profit be earned?","On the firm's marginal plant.",[['margin'],['plant','equipment','installation','capital']])],
  line:"normal profit is earned at the margin so costs may fall not must"}
]},

/* ------------------------------------------------ #48 */
{id:'48',year:1934,who:'Robbins',title:'ROBBINS 1934 · CERTAIN ASPECTS OF THE THEORY OF COSTS',secs:[
 {h:"Wieser's Law and the theory of variations",beats:[
  ["March 1934, from a lecture in Vienna on 7 April 1933. Not Robbins 1928 (#34) on the representative firm. Here cost is 'what must be surrendered in order to get it': the value of displaced alternatives, which he calls *Wieser's Law*.","He rejects the purely technical view of Knight and Haberler, 'the cost of beaver is deer'. It fails with fixed coefficients and ignores the valuations entrepreneurs face."],
  ["Consequence: from a position of equilibrium, other things equal, expanding one line must raise its cost. So what of Marshall's constant and falling supply curves?","No contradiction. They belong to a *Theory of Variations*: they compare one equilibrium with another after the data change, as demand shifts and factors are released elsewhere."],
  {fig:'compare',a:[{left:{h:"WIESER'S LAW",lines:['inside one equilibrium','one line expands','cost must rise']},right:{h:'THEORY OF VARIATIONS',lines:['equilibrium vs equilibrium','after the data change','flat or falling curves']},note:'Robbins reclassifies the curves; he does not deny them'}]},
  ["Supply curves are rough schemata. They mislead about the system as a whole, and the Young (#26) and Knight (#30) critique of Pigou shows the danger. General equilibrium and marginal productivity are safer."],
  ["Where do falling costs under competition come from? External economies that wait on market size because factors are *indivisible*. Competition rules out indivisibility in actual uses, not in *potential uses*: the gifted marketer works as ordinary labour until demand makes a specialist worthwhile.","This is Young's theory (#37): many industries and vertical disintegration, incompatible with the supply curve."],
  {fig:'steps',a:[{title:'ROBBINS 1934 IN FOUR PARTS',lines:['I   cost = displaced alternatives','II  rises at equilibrium; curves = variations','III falling costs: indivisible potential uses','IV  short and long period: one process;','    prime cost depends on expectations']}]},
  ["Place it. Robbins draws on Young (#26, #37), Knight (#30), Edgeworth (#21) and Shove (#38); Sraffa 1926 is not in your folder. Robinson 1941 (#51) cites him on factor proportions."]],
  q:[mc("What does Robbins (1934) mean by Wieser's Law?",["Cost is the value of displaced alternatives","Cost is the quantity of goods technically foregone","Costs fall as the market widens","Short and long period are separate processes"],"'What must be surrendered in order to get it.'"),
     tf("True or false: Robbins 1934 denies that falling supply curves exist.",false,"He reclassifies them as a Theory of Variations."),
     mc("Robbins 1934's source of falling costs under competition?",["Indivisible potential uses of factors","Internal economies of the representative firm","Falling particular demand curves","Rising relative factor prices"],"Indivisibility survives competition in potential, not actual, uses.")],
  sa:[sa("How does Robbins reconcile Wieser's Law with falling supply curves?","The curves compare equilibria: a theory of variations.",[['variation','compar','differen'],['equilibri','curve','data']]),
      sa("What did Robbins call cost as displaced alternatives?","Wieser's Law.",[['wieser']],1)],
  line:"cost rises at equilibrium falling curves belong to a theory of variations"}
]},

/* ------------------------------------------------ #51 */
{id:'51',year:1941,who:'Robinson',title:'ROBINSON 1941 · RISING SUPPLY PRICE',secs:[
 {h:'Transfer of demand and rising supply price',beats:[
  ["February 1941, in Economica. Robinson calls her purpose 'frankly escapist'. The right value question is how supply responds to a *transfer of demand* from other goods, not to a net increase.","Marshall's net increase, with full employment, presupposes more resources: 'putting the cart before the horse'."],
  ["Assume full employment, perfect competition, no economies of large-scale industry and, at first, fixed factor supplies. Demand moves to a commodity she calls alpha. If alpha uses factors in average proportions, its supply price is constant."],
  {fig:'chain',a:[{title:'ROBINSON 1941: WHY SUPPLY PRICE RISES',nodes:['TRANSFER','ALPHA GROWS','FACTORS DEAR','PRICE RISES'],caps:['demand moves to alpha from goods in general','alpha needs factors in unaverage proportions','their prices rise against the composite unit','alpha has rising supply price'],end:'perfect competition, full employment',token:'[$]'}]},
  ["Otherwise expanding alpha 'turns the relative factor prices against itself'. Supply price is measured in a *composite unit of resources*: factors weighted by their proportions in industry as a whole."],
  {fig:'steps',a:[{title:'WHAT MAKES THE RISE STRONGER',lines:["1 alpha's share of all factors","2 how idiosyncratic its factor needs are","3 low elasticity of substitution","4 inelastic supply of its factors","  (once factor supplies can vary)"]}]},
  ["With variable factor supplies, falling supply price can occur: Pigou's 'decreasing supply price simpliciter'. Marshall's agriculture/manufacture contrast survives on new grounds: rare vs common, cranky vs adaptable factors. Manufactures: near-constant supply price.","Place it. Same logic as Harrod 1930 Section III (#41); she cites Robbins (#48). Not her 1932 *falling* supply price under imperfect competition (#44)."]],
  q:[mc("Robinson 1941: what is the proper value-theory question about supply price?",["Response to a transfer of demand from other goods","Response to a net increase in total demand","Response to a change in the number of firms","Response to a change in money wages"],"A net increase presupposes more resources: cart before the horse."),
     tf("True or false: Robinson's 1941 rising supply price arises under perfect competition, through relative factor prices.",true,"It is not her 1932 imperfect-competition argument."),
     mc("Which earlier paper runs the same factor-proportions logic as Robinson 1941?",["Harrod 1930, Section III (#41)","Harrod 1931, Section IV (#43)","Pigou 1933 (#46)","Shove 1933 (#47)"],"Harrod explained agriculture by unusual factor proportions, not by land as such.")],
  sa:[sa("Why does alpha have rising supply price?","It turns relative factor prices against itself.",[['factor'],['price','dear','against']]),
      sa("In what unit does Robinson 1941 measure supply price?","A composite unit of resources.",[['composite']],1)],
  line:"a transfer of demand turns relative factor prices against the industry"}
]},

/* ------------------------------------------------ #52 */
{id:'52',year:1942,who:'Shove',title:"SHOVE 1942 · THE PLACE OF MARSHALL'S PRINCIPLES",secs:[
 {h:'Marshall the reformed Ricardian',beats:[
  ["December 1942, the centenary of Marshall's birth. Shove's verdict: the analytical backbone of the *Principles* is a mathematical completion and generalisation of Ricardo's theory as expounded by Mill.","He rejects the 'synthesis' reading, Ricardo–Mill fused with Jevons and the Austrians (Whittaker, Gray). Marshall's debts were to Cournot and von Thünen."],
  ["Marshall translated Mill's Ricardo into differential equations in 1867–8. Filling four Ricardian gaps, demand, variable coefficients, the supply of labour and the supply of capital, leads to his mathematical Note XXI."],
  {fig:'steps',a:[{title:'THE RICARDIAN BACKBONE',lines:['Ricardo, as expounded by Mill','  + demand','  + variable coefficients','  + supply of labour, supply of capital','= Note XXI: mutual determination','three epochs: Classical, Ricardian,','  Marshallian or reformed-Ricardian']}]},
  ["The new element is a transformation: mutual determination, balance at the margin, substitution as master-key. And the *equilibrium of the firm* comes to the fore, because increasing returns must be reconciled with competition.","Hence Marshall's *three expedients*: external economies, imperfection of the market, and the representative firm, the shift of advantage through luck and the waxing and waning of managers."],
  {fig:'chain',a:[{title:"MARSHALL'S THREE EXPEDIENTS",nodes:['EXTERNAL','IMPERFECT MKT','REP. FIRM'],caps:['economies outside the firm','invading rivals\' markets is costly','advantage shifts from firm to firm'],end:'all three are argued over in 1930 (#38)',token:'[M]'}]},
  ["Biology shapes his view of change: organic growth. So the long-period supply curves were 'cast for a minor role only'. His epigram, 'The Mecca of the economist lies in economic biology', carries its date on its face."]],
  q:[mc("What does Shove (1942) say is the analytical backbone of Marshall's Principles?",["A mathematical completion of Ricardo–Mill","A synthesis of Ricardo with Jevons and the Austrians","A biological theory of organic growth","A generalisation of Cournot's monopoly theory"],"He explicitly rejects the synthesis reading."),
     tf("True or false: Shove 1942 lists the representative firm among Marshall's three expedients for reconciling increasing returns with competition.",true,"With external economies and market imperfection."),
     fill("Shove 1942 calls the Marshallian epoch '___-Ricardian'.",['reformed'],"Classical, Ricardian, then Marshallian or reformed-Ricardian.")],
  sa:[sa("Marshall's three expedients, per Shove 1942?","External economies, market imperfection, the representative firm.",[['external'],['imperfect'],['representative']],2),
      sa("Shove's label for the Marshallian epoch?","Reformed-Ricardian.",[['reformed','ricardian']],1)],
  line:"marshall completed ricardo and mill by mathematics not a synthesis with jevons"},

 {h:"Trees knocked away; MR as Marshall's algebra",beats:[
  ["The decay of *atomic competition*, many small units, dates the theory. In the sixth edition Marshall rewrote the trees of the forest in the past tense: joint-stock companies 'often stagnate, but do not readily die'.","Shove says the rewording knocks away the main prop of the reconciliation of competition and increasing returns, for a large and growing section of industry."],
  {fig:'events',a:[{title:'THE TREES OF THE FOREST',events:[['6th ed.','Marshall: firms "do not readily die"'],['1930','Robertson defends the trees (#38)'],['1930','Shove: variable stars instead (#38)'],['1942','Shove: the main prop is knocked away']]}]},
  ["Then the 1930s. Imperfect competition, MR = MC with entry where receipts equal costs, is essentially Marshall's. The marginal revenue curve is a handy tool, 'but it is no more than a geometrical version of Marshall's algebra'. A teaching change, not new substance."],
  ["The real gap is the ground between atomic competition and monopoly: domination by a few large units, *oligopoly*, and complex controls. He notes that Chamberlin (1933, not in your folder) treats selling costs, product differentiation and oligopoly.","Other gaps: weak dynamics, a return to Ricardo's mechanical method, and Keynes's demand that money be joined to value theory."],
  {fig:'compare',a:[{left:{h:'WHAT LASTS',lines:['mutual determination','balance at the margin','short vs long period','elasticity']},right:{h:'WHAT IS MISSING',lines:['oligopoly','dynamics','money (Keynes)','firms that do not die']},note:"real cost: 'drive out ... with a pitchfork', it returns"}]},
  ["Place it. Shove closes the group. He returns to his own 1930 point on the trees (#38) and judges Robinson (#44) and the imperfect-competition work of group E as Marshall redrawn. Report: a new diagram for an old theory."]],
  q:[mc("Which change does Shove (1942) say knocks away the main prop of the competition/increasing-returns reconciliation?",["Marshall's sixth-edition rewording of the trees","Robinson's renaming of the increment curve","Sraffa's demand that Marshall be discarded","Keynes's integration of money and value"],"Joint-stock companies 'often stagnate, but do not readily die'."),
     tf("True or false: Shove 1942 calls the marginal revenue curve a major break with Marshall.",false,"'No more than a geometrical version of Marshall's algebra.'"),
     fill("Shove 1942: which market form, between atomic competition and monopoly, does Marshall's theory fail to cover?",['oligopoly'],"Domination by a few large units, and complex controls.")],
  sa:[sa("Shove 1942's verdict on the marginal revenue curve?","A geometrical version of Marshall's algebra.",[['geometr','diagram'],['marshall','algebra']]),
      sa("Why does the sixth-edition trees change matter?","Joint-stock firms do not readily die, so the prop goes.",[['joint','compan','firm'],['die','stagnat','live','death']])],
  line:"the mr curve is only marshall's algebra drawn as geometry"}
]}
