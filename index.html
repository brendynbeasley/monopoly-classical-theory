    root.innerHTML=H('EXPORT',esc(deck.name)+` · ${cards.length} cards`,B('browse','back','esc'))+`<div class="abody"><div class="opts"><button type="button" class="chip ${expFmt==='tsv'?'on':''}" data-fmt="tsv">tab-separated · Anki, Quizlet, spreadsheets</button><button type="button" class="chip ${expFmt==='json'?'on':''}" data-fmt="json">JSON · back into this app</button></div>
      <textarea class="inp keepcase" id="ex" rows="12" readonly spellcheck="false">${esc(txt)}</textarea><div class="rowh"><button type="button" class="btn pri" data-a="copy">copy all</button><button type="button" class="btn" data-a="file">save as a file</button><span class="dim small">If nothing downloads, this viewer blocks files: copy the text instead.</span></div></div><div class="afoot"><span><kbd>esc</kbd> back</span></div>`};

  const draw=()=>{({decks:drawDecks,study:drawStudy,done:()=>{},empty:drawEmpty,browse:drawBrowse,edit:drawEdit,imp:drawImport,exp:drawExport})[scr]();updateStatus()};
  const act=async(a,t)=>{
    if(a==='home')return app.close();if(a==='decks'){st=null;scr='decks';return draw()}
    if(a==='new'){const d=newDeck('Deck '+(S.decks.length+1));deck=findDeck('u'+d.id);editing=null;play('select');scr='edit';return draw()}
    if(a==='imp'){scr='imp';return draw()}
    if(a==='rev'){st.rev=!st.rev;play('select');return drawStudy()}if(a==='write'){st.write=!st.write;play('select');return drawStudy()}if(a==='undo')return undo();if(a==='end'){if(st&&st.n)return finish();scr='decks';return draw()}
    if(a==='more'||a==='study')return begin(findDeck(deck.key));if(a==='cram')return begin(deck,{all:true});
    if(a==='browse'){deck=findDeck(deck.key);editing=null;scr='browse';return draw()}
    if(a==='add'){editing=null;scr='edit';return draw()}if(a==='save')return saveCard();
    if(a==='delcard'){const u=deck.user;if(!await confirmBox('DELETE CARD',`Delete this card? <span class="dim">${esc(String(editing.f).slice(0,80))}</span>`,'delete it'))return;u.cards=u.cards.filter(c=>c!==editing);delete S.mem['u:'+u.id+'.'+editing.id];editing=null;save();dueDirty();play('deny');deck=findDeck(deck.key);scr='browse';return draw()}
    if(a==='ren'){const u=deck.user;const b=root.querySelector('.ahead .ttl');b.outerHTML=`<input class="inp keepcase" id="rn" value="${escA(u.name)}" style="width:28ch" aria-label="Deck name">`;const i=root.querySelector('#rn');i.focus();i.select();const done=()=>{u.name=i.value.trim().slice(0,60)||u.name;save();deck=findDeck(deck.key);drawBrowse()};i.onblur=done;i.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();e.stopPropagation();i.blur()}};return}
    if(a==='del'){const u=deck.user;if(await confirmBox('DELETE DECK',`Delete "${esc(u.name)}" and its ${u.cards.length} card${u.cards.length===1?'':'s'}? This cannot be undone.`,'delete it')){userIds(u).forEach(id=>delete S.mem[id]);S.decks=S.decks.filter(d=>d!==u);save();dueDirty();play('deny');scr='decks';draw()}return}
    if(a==='reset'){if(await confirmBox('FORGET PROGRESS',`Forget everything you have learned in "${esc(deck.name)}"? The cards stay; their memory records are wiped.`,'forget it')){deck.ids.forEach(id=>delete S.mem[id]);save();dueDirty();drawBrowse()}return}
    if(a==='exp'){scr='exp';return draw()}if(a==='doimp')return doImport();
    if(a==='copy')return copyText(root.querySelector('#ex').value,t);if(a==='file')return saveFile(deck.name.replace(/[^\w-]+/g,'_')+(expFmt==='tsv'?'.txt':'.json'),root.querySelector('#ex').value)};
  on(root,'click',e=>{const t=e.target;let b;
    if((b=t.closest('[data-a]')))return act(b.dataset.a,b);
    if((b=t.closest('[data-g]')))return grade(+b.dataset.g);
    if((b=t.closest('[data-b]'))){deck=findDeck(b.dataset.b);filt='';scr='browse';return draw()}
    if((b=t.closest('.deck[data-k]'))){play('select');return begin(findDeck(b.dataset.k))}
    if((b=t.closest('[data-lay]'))){imp.mode=b.dataset.lay;imp.text=root.querySelector('#it').value;return drawImport()}
    if((b=t.closest('[data-fmt]'))){expFmt=b.dataset.fmt;return drawExport()}
    if((b=t.closest('tr[data-id]'))&&deck&&deck.user){const id=b.dataset.id.slice(2).split('.')[1];editing=deck.user.cards.find(c=>c.id===id)||null;if(editing){scr='edit';draw()}}});
  app.key=e=>{if(panelEl)return false;const k=e.key,inField=e.target.matches&&e.target.matches('input,textarea,select');
    if(e.repeat&&scr==='study'&&(k===' '||k==='Enter'||/^[1-4]$/.test(k)))return true;      // a key held down must not flip and grade a row of cards
    if(inField){if(k==='Escape'){e.target.blur();if(scr==='edit')act('browse');else if(scr==='imp')act('decks');return true}
      if(k==='Enter'&&(e.ctrlKey||e.metaKey)){if(scr==='edit')saveCard();else if(scr==='imp')doImport();return true}
      if(k==='Enter'&&e.target.id==='wr'){if(!st.flip)turn();else grade(st.sug||3);return true}
      if(e.target.id==='wr'&&st&&st.flip&&/^[1-4]$/.test(k)){grade(+k);return true}return false}
    if(e.ctrlKey||e.metaKey||e.altKey)return false;
    if(scr==='decks'){if(k==='ArrowDown'||k==='ArrowUp'){if(navs.length){sel=(sel+(k==='ArrowDown'?1:navs.length-1))%navs.length;mark();navs[sel].scrollIntoView({block:'nearest'});play('move')}return true}
      if(k==='Enter'&&navs[sel]){play('select');begin(findDeck(navs[sel].dataset.k));return true}if((k==='l'||k==='b')&&navs[sel]&&navs[sel].dataset.k!=='due'){deck=findDeck(navs[sel].dataset.k);filt='';scr='browse';draw();return true}
      if(k==='x'&&navs[sel]&&navs[sel].dataset.k!=='due'){deck=findDeck(navs[sel].dataset.k);scr='exp';draw();return true}if(k==='n'){act('new');return true}if(k==='i'){act('imp');return true}if(k==='Escape'){app.close();return true}return false}
    if(scr==='study'){if(k===' '||k==='Enter'){if(!st.flip)turn();else grade(st.sug||3);return true}if(/^[1-4]$/.test(k)&&st.flip){grade(+k);return true}if(k==='u'){undo();return true}if(k==='r'&&deck.rev){act('rev');return true}if(k==='w'){act('write');return true}if(k==='Escape'){act('end');return true}return false}
    if(scr==='done'||scr==='empty'){if(k==='Enter'){const b=root.querySelector('.btn.pri')||root.querySelector('[data-a="decks"]');act(b.dataset.a,b);return true}if(k==='Escape'){act(scr==='done'?'home':'decks');return true}return false}
    if(scr==='browse'){if(k==='Enter'){act('study');return true}if(k==='a'&&deck.user){act('add');return true}if(k==='x'){act('exp');return true}if(k==='Escape'){act('decks');return true}return false}
    if(k==='Escape'){act(scr==='exp'?'browse':scr==='edit'?'browse':'decks');return true}return false};
  app.refresh=()=>{if(scr==='decks')draw()};      // only the deck list shows anything a dialog can change; redrawing an editor would throw away what is being typed
  if(args.a&&args.a[0]==='import')scr='imp';else if(args.a&&args.a[0]==='new'){act('new');return}
  draw()};

/* ══════════════════════════════════════════════════════════════════════════════
   ENGINE · 9c · ARCADE  —  five quick games that run on whatever the course (or your own deck) contains
     MATCH     pair each term with its meaning, against the clock
     RAIN      meanings fall; type (or tap) the term before they land
     BLITZ     sixty seconds of true or false
     ORDER     put the steps of a process, or the events of a timeline, in the right order
     GAUNTLET  question after question, faster and faster, until the third miss
   Games do not move the review schedule. A miss simply brings that item to the front of the queue.
   ══════════════════════════════════════════════════════════════════════════════ */
const clip=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s};
const GAMES=[
 ['match','MATCH','Pair each term with its meaning. The clock is running.',['[A]··┐   [C]','[B]  └──▶[A]','[C]      [B]'],v=>v?'best '+v.toFixed(1)+'s':''],
 ['rain','RAIN','Meanings fall. Name each one before it lands.',[' ▒    ▒     ','    ▒     ▒ ','▁▁▁▁▁▁▁▁▁▁▁▁'],v=>v?'best '+v:''],
 ['blitz','BLITZ','True or false? Sixty seconds. Go.',['  ◀ F   T ▶ ','   ░░▓▓██   ','    0:60    '],v=>v?'best '+v:''],
 ['order','ORDER','Rebuild the sequence: what comes first, what comes next.',[' 3 ──┐      ',' 1 ──┼─▶ 123',' 2 ──┘      '],v=>v?'best '+v:''],
 ['gauntlet','GAUNTLET','Every question in the unit, faster each time. Three strikes.',[' ✗ ✗ ·      ',' ▶▶▶▶▶▶▶▶   ','   x 21     '],v=>v?'best '+v:'']];
APPS.arcade=(root,args,app)=>{ctx='arcade';loc='';
  let src='unit',sel=0,navs=[],halt=null,keyFn=null,playing=null;
  const touched=()=>{const u=CHN().filter(n=>modsDone(BOOK.ch[n])||BOOK.ch[n].gloss.some(g=>S.terms[n+'|'+g.n]));return u.length?u:[C.n]};
  const units=()=>src==='all'?touched().map(n=>BOOK.ch[n]):[C];
  const udeck=()=>src.startsWith('u:')?S.decks.find(d=>d.id===src.slice(2)):null;
  const pairs=()=>{const d=udeck();if(d)return d.cards.filter(c=>c.f&&c.b).map(c=>({id:'u:'+d.id+'.'+c.id,t:c.f,d:c.b,own:1}));return units().flatMap(c=>c.gloss.map(g=>({id:'t:'+c.n+'.'+g.n,t:g.n,d:maskTerm(g.d,g.n),c,g})))};
  const questions=()=>{const d=udeck(),P=pairs();if(d)return shuffle(P).map(p=>({id:p.id,q:mc(p.t,[p.d,...shuffle(P.filter(x=>x!==p&&norm(x.d)!==norm(p.d))).slice(0,3).map(x=>x.d)],'')})).filter(x=>x.q.o.length>=2);
    return shuffle(units().flatMap(c=>[...unitItems(c).filter(x=>x.kind==='q').map(x=>({id:x.id,q:ITEMS.get(x.id).it})).filter(x=>x.q.t==='mc'||x.q.t==='tf'),...c.gloss.map(g=>({id:'t:'+c.n+'.'+g.n,q:termQ(c,g,'d2t')}))]))};
  const sets=()=>udeck()?[]:shuffle(units().flatMap(orderSets));
  const srcName=()=>{const d=udeck();return d?d.name:src==='all'?`${touched().length} ${UNITP} you have opened`:`${UTAG} ${C.n} · ${C.short}`};
  let gen=0;                                    // every game that starts gets a number: whatever an ended game still had pending is dropped
  const later=(fn,ms)=>{const g=gen;return setTimeout(()=>{if(g===gen&&APP===app)fn()},ms)};
  const stopGame=()=>{gen++;if(halt){try{halt()}catch(e){}halt=null}keyFn=null;playing=null;music(null)};
  const HUD=h=>{const e=root.querySelector('.hud');if(e)e.innerHTML=h};
  const frame=(name,foot)=>{root.innerHTML=`<div class="ahead"><span class="ttl">${name}</span><span class="hud"></span><span class="sp"></span><button type="button" class="btn sm" data-a="quit"><kbd>esc</kbd>quit</button></div><div class="abody" id="gb"></div><div class="afoot">${foot||''}</div>`;return root.querySelector('#gb')};
  const countdown=async gb=>{if(!S.anim||REDUCED)return true;const g=gen;for(const n of ['3','2','1','GO']){if(g!==gen||APP!==app)return false;gb.innerHTML=`<div class="result" style="flex:1;display:flex;flex-direction:column"><pre class="bigword" style="font-size:1.6em">${banner(n,true).join('\n')}</pre></div>`;play(n==='GO'?'go':'tickdown');await sleep(n==='GO'?380:520)}return g===gen&&APP===app};
  const need=(n,what)=>{root.innerHTML=`<div class="ahead"><span class="ttl">ARCADE</span></div><div class="abody result"><div class="big">Not enough to play with.</div><div class="dim">This game needs at least ${n} ${what}. Choose another source, or another game.</div><div class="rowh" style="justify-content:center"><button type="button" class="btn pri" data-a="menu"><kbd>↵</kbd>back to the arcade</button></div></div>`;keyFn=e=>{if(e.key==='Enter'||e.key==='Escape'){menu();return true}}};

   The page carries one course. Others arrive as text: the student copies a brief for an AI assistant, pastes the
   answer here, and the text is run in a sealed copy of the core and checked before anything is kept.
   A course that passes is stored in this browser and opened in the built-in course's place (see ENGINE · 0).
   ══════════════════════════════════════════════════════════════════════════════ */
// the TEMPLATE GUIDE sits in a comment at the top of the page: read it from there, so there is only ever one copy
const guideText=()=>{try{const w=document.createTreeWalker(document,NodeFilter.SHOW_COMMENT);let n;while((n=w.nextNode()))if(/TEMPLATE GUIDE/.test(n.data))return n.data.replace(/^\s*\n/,'').replace(/\s+$/,'')}catch(e){}return''};
const briefText=()=>['You are going to write a course for TERMINAL TUTOR, a study app that runs in one web page. Its authoring guide',
  'is below. Follow it exactly: the app checks everything you write.','',
  'WHAT TO SEND BACK',
  'One code block of JavaScript: one  const COURSE={...};  followed by one  BOOK.add({...});  for each unit',
  '(a unit that needs helpers of its own is wrapped whole, as the guide shows:  (()=>{ ... BOOK.add({...}); })(); ).',
  'No HTML, no script tags, and nothing after the code block. I will paste your answer straight into the app.',
  'If the app reports problems I will send them to you: then send the whole corrected block again.',
  'If my material is long, write the first unit completely before you write any other thinly, and say in one',
  'line above the code block which units are still to come (if none are, send the code block alone). When I ask',
  'for one more unit of a course you have already started, send only its  BOOK.add({...}); .','',
  guideText()||'(the guide is missing from this copy of the page: ask for the original file)','',
  'MY MATERIAL','(replace this line with your notes, chapter, slides or word list)',''].join('\n');

// Run a course's text in a sealed copy of the core (an empty frame of its own) and report on it. Nothing here touches the running app.
function probeCourse(text,base){const out={ok:false,fatal:'',hint:'',line:0,code:'',errors:[],warnings:[],stats:null,cfg:null,units:[],text},off=base?base.split('\n').length+1:0;let fr=null;
  if(!text.trim()){out.fatal='There is nothing to check yet.';return out}
  if(/<\/script/i.test(text))out.warnings.push('the text contains a closing script tag: it works here, but it would break a page it is built into');
  try{fr=el('iframe');fr.setAttribute('aria-hidden','true');fr.tabIndex=-1;fr.style.cssText='position:fixed;left:-9px;top:-9px;width:1px;height:1px;border:0;visibility:hidden';document.body.appendChild(fr);
    const w=fr.contentWindow,d=w.document;let last=null;w.onerror=(m,src,line)=>{last={msg:String(m).replace(/^Uncaught\s+/,'').replace(/Failed to execute '\w+' on '\w+':\s*/,''),line:line||0};return true};
    const run=t=>{last=null;const s=d.createElement('script');s.textContent=t;(d.head||d.documentElement).appendChild(s);return last};
    run($('#core').textContent);

async function sessionEnd(xp0,rv0,t0){const d=day(),xp=S.xp-xp0,rv=S.stats.rev-rv0,min=Math.max(1,Math.round((Date.now()-t0)/60000)),st=streakNow();

  if(v===QUIT)return'home';if(!v)continue;const c=resolveCmd(v.trim().split(/\s+/)[0].toLowerCase());

    next=await shell()}catch(e){console.error(e);showTerm();try{await type('internal error: '+(e&&e.message||e),{cls:'err'})}catch(x){}next='home';await sleep(1200)}}}
