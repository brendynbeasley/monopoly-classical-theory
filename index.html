(()=>{
const N2=v=>(+(+v).toFixed(2)).toLocaleString('en-US');
const CALC={
 monopoly:()=>{const b=pick([1,2,0.5]),c=rint(10,40,2),a=c+rint(20,80,4),Q=(a-c)/(2*b),P=(a+c)/2;return{q:`Demand is P = ${a} − ${b}Q and marginal cost is a constant ${c}. What price does a profit-maximising monopolist charge?`,a:P,tol:.001,
   steps:[`total revenue = (${a} − ${b}Q)Q, so marginal revenue = ${a} − ${2*b}Q`,`set MR = MC: ${a} − ${2*b}Q = ${c}`,`Q = (${a} − ${c}) / ${2*b} = ${N2(Q)}`,`P = ${a} − ${b} × ${N2(Q)} = ${N2(P)}`]}},
 restrict:()=>{const b=pick([1,2]),c=rint(10,30,2),a=c+rint(20,80,4),Qc=(a-c)/b,Qm=Qc/2;return{q:`Demand P = ${a} − ${b}Q, constant cost ${c}. Competitive output (price = cost) is ${N2(Qc)}. What output does a simple monopolist choose?`,a:Qm,tol:.001,
   steps:['with linear demand and constant cost, MR falls twice as fast as demand',`competition: ${a} − ${b}Q = ${c} → Q = ${N2(Qc)}`,`monopoly: ${a} − ${2*b}Q = ${c} → Q = ${N2(Qm)}`,`the monopolist restricts output to half: ${N2(Qm)}`]}},
 discrim:()=>{const b=pick([1,2]),c=rint(10,30,2),a=c+rint(20,80,4),Q=(a-c)/b;return{q:`Demand P = ${a} − ${b}Q, constant cost ${c}. A monopolist can discriminate perfectly (each unit sold at its demand price). What output does it produce?`,a:Q,tol:.001,
   steps:['perfect discrimination: the demand curve is the marginal revenue curve','so produce until demand price = marginal cost',`${a} − ${b}Q = ${c}`,`Q = ${N2(Q)}, the same as the competitive output (Pigou's point)`]}},
 cournot:()=>{const b=pick([1,2]),a=rint(60,180,6);const q=a/(3*b),P=a/3;return{q:`Cournot's springs: two owners, no costs, demand P = ${a} − ${b}(q1 + q2). In Cournot equilibrium, what is the market price?`,a:P,tol:.001,
   steps:[`each owner maximises (${a} − ${b}(q1+q2))·qi taking the other's output as given`,`reaction: qi = (${a} − ${b}qj) / ${2*b}`,`symmetric equilibrium: q = ${a} / ${3*b} = ${N2(q)} each`,`price = ${a} − ${b} × ${N2(2*q)} = ${N2(P)} (a third of the choke price; monopoly would charge half)`]}},
 mr:()=>{const p=rint(10,60,2),e=pick([1.25,1.5,2,2.5,3,4,5]),mr=p*(1-1/e);return{q:`Price is ${p} and the elasticity of demand facing the firm is ${e}. What is marginal revenue (Harrod's "increment of aggregate demand")?`,a:mr,tol:.002,
   steps:['MR = price × (1 − 1/elasticity)',`MR = ${p} × (1 − 1/${e})`,`MR = ${p} × ${N2(1-1/e)}`,`MR = ${N2(mr)}`]}},
 markup:()=>{const mc=rint(10,60,2),e=pick([1.5,2,2.5,3,4,5,6]),p=mc/(1-1/e);return{q:`A firm sets marginal revenue equal to a marginal cost of ${mc}. Its demand elasticity is ${e}. What price does it charge?`,a:p,tol:.002,
   steps:['MR = P(1 − 1/e) and MR = MC at the optimum','so P = MC / (1 − 1/e)',`P = ${mc} / ${N2(1-1/e)}`,`P = ${N2(p)} (the less elastic the demand, the bigger the markup)`]}},
 excess:()=>{const k=rint(4,10),cap=k*10,out=cap-rint(1,4)*k;const ex=Math.round((cap-out)/cap*100);return{q:`At the tangency equilibrium a firm produces ${out} units; its average cost would be lowest at ${cap} units. What percentage of capacity is idle (excess capacity)?`,a:ex,tol:.01,
   steps:['excess capacity = (minimum-cost output − actual output) / minimum-cost output',`= (${cap} − ${out}) / ${cap}`,`= ${N2((cap-out)/cap)}`,`= ${ex}% idle: the tangency lies on the falling part of the AC curve`]}}
};

const CALCS={1:[],2:['monopoly','restrict','discrim','cournot','monopoly','cournot'],3:['discrim','discrim','monopoly'],4:['restrict','mr'],5:['mr','markup','mr','monopoly'],6:['markup','excess','mr','excess']};

const PAPERS=[{"author": "Hadley", "year": 1886, "title": "Private Monopolies and Public Rights", "group": "A", "hook": "Railways teach the rule for all big-capital industry: competition ruins, so accept combination, but regulate it.", "claim": "Where fixed investment is large, as on railways, competition is impossible or ruinous and ends in consolidation, so the state should accept combination and control it through equal treatment and publicity rather than forced competition, rate-fixing or state ownership.", "responds_to": ["Traditional transport law: public highway vs private carrier", "Hudson, The Railways and the Republic (context)", "Henry George vs Hyndman on land and capital (context)", "US Supreme Court Granger Cases (Munn v. Illinois) (context)", "#07 H. C. Adams: Hadley borrows his 'law of the increasing return' (p. 40)"], "answered_by": ["#06 Giddings 1887 (footnotes Hadley among those predicting suppression of competition, p. 65)", "#05 Clark 1887 (parallel accept-and-regulate view)", "#12 Bullock 1901 (classes Hadley's later writings with those blaming trusts on destructive competition)"], "journal": "Quarterly Journal of Economics", "id": "04"}, {"author": "Clark", "year": 1887, "title": "The Limits of Competition", "group": "A", "hook": "Clark: competition's war ends in 'federations of giants'; accept, study and regulate combinations, and rely on residual competition.", "claim": "Ricardian competition belonged to a transitional age; in manufacturing and transport, combinations of a few equal survivors are a normal product of evolution that should be accepted and regulated, with prices checked by latent and residual competition.", "responds_to": ["Ricardo, read as the 'economic Darwinism' of a transitional era (context)", "Cairnes, non-competing groups (Leading Principles), quoted pp. 48–50", "#04 Hadley 1886 (parallel accept-and-regulate view)"], "answered_by": ["#06 Giddings 1887, the next article in the same PSQ issue: builds on Clark's grouping and supplies the 'practical observation' of residual competition Clark hands off (p. 58)", "#12 Bullock 1901 (discusses Clark's later papers on potential competition, not this one)"], "journal": "Political Science Quarterly", "id": "05"}, {"author": "Giddings", "year": 1887, "title": "The Persistence of Competition", "group": "A", "hook": "Giddings: competition is never destroyed, only converted. Pools curb only ruinous below-cost rivalry, so Ricardo still stands.", "claim": "Competition is a permanent force that combinations only redirect; pools are unstable, defensive bodies that can suppress only ruinous below-cost competition, leaving normal Ricardian competition (price driven to cost) intact.", "responds_to": ["#05 Clark 1887 (preceding article, same issue): uses his grouping by stage of production and supplies the practical study of residual competition", "#04 Hadley 1886 (footnoted p. 65 among those predicting suppression of competition)", "Bagehot, Postulates of English Political Economy (context)", "Cairnes, non-competing groups (context)"], "answered_by": ["#12 Bullock 1901 (persistence-of-competition theme with new evidence; cites Giddings's later Democracy and Empire)", "#08 Marshall 1890 (independently: trusts fail when they price too high)"], "journal": "Political Science Quarterly", "id": "06"}, {"author": "Adams", "year": 1887, "title": "Relation of the State to Industrial Action", "group": "A", "hook": "Adams: competition handles constant- and diminishing-returns industries; increasing returns create natural monopoly, which needs state control.", "claim": "Laissez-faire is only a maxim; law should keep competition's benefits and curb its evils, and since industries of increasing returns are natural monopolies beyond competitive control, state control should match the reach of increasing returns.", "responds_to": ["Spencer, The Man versus the State (context)", "Mill and Cairnes on laissez-faire as a maxim (context)", "Bastiat (context)", "German presumption in favour of the state (context)", "J. B. Clark, Philosophy of Wealth (cited on business moral dualism)"], "answered_by": ["#04 Hadley 1886 (already uses Adams's 'law of the increasing return', p. 40)", "#08 Marshall 1890 (public control of 'indivisible' industries, but not state management)"], "journal": "Publications of the American Economic Association", "id": "07"}, {"author": "Marshall", "year": 1890, "title": "Some Aspects of Competition (Presidential Address, Section F, British Association, Leeds 1890)", "group": "A", "hook": "Marshall: competition vs combination is a 'false antithesis'; publicly control indivisible industries, but don't let the state run them.", "claim": "Combinations will be permanent and mixed in effect, so economists must analyse rather than denounce them; the competition/combination antithesis is false, indivisible industries need public control but private management, and independent firms' inventiveness is competition's chief service.", "responds_to": ["Older English economists' dogmatism on Protection in new countries (List, Carey, Mill's infant-industry concession; Patten rejected) (context)", "American trust movement and a Congressional committee report (context)", "Senator Sherman's bill, passed by the Senate 8 April 1890 (context)", "German state socialism and 'younger American economists' under German influence (unnamed; cf. #07 Adams, context)", "Baker, Monopolies and the People; Rae; Foxwell (context)"], "answered_by": ["#12 Bullock 1901 (quotes Marshall on monopoly's bargaining and on central responsibility vs individual energy)"], "journal": "Journal of the Royal Statistical Society", "id": "08"}, {"author": "Taussig", "year": 1891, "title": "A Contribution to the Theory of Railway Rates", "group": "C", "hook": "Railway rate 'anomalies' are joint-cost pricing, like wool and mutton, not Cohn's ethics of ability-to-pay.", "claim": "Because most railway costs are joint across traffic with demands of differing intensity, classification and 'charging what the traffic will bear' follow from ordinary joint-cost value theory, not from an ethical (ability-to-pay) principle.", "responds_to": ["Gustav Cohn, Englische Eisenbahnpolitik 1883 (taxation / Leistungsfähigkeit view; summarised in text)", "Hadley, Railroad Transportation (fixed charges; discrimination) (context)", "Seligman and the ICC on 'value of service'", "Mill, Principles Bk III ch. xvi on joint cost"], "answered_by": ["Pigou, Wealth and Welfare 1912 ch. xii (context, not in folder)", "#17 Taussig 1913 (his own defence)", "#18 Pigou 1913", "#19 Edgeworth 1915 (sides with Pigou)"], "journal": "Quarterly Journal of Economics", "id": "09"}, {"author": "Fisher", "year": 1898, "title": "Cournot and Mathematical Economics", "group": "B", "hook": "Fisher hails Cournot as founder of mathematical economics but faults his duopoly, tariff and 'social income' reasoning.", "claim": "Cournot's 1838 Recherches founded mathematical economics and its price theory remains largely unsuperseded, but his duopoly assumption is unrealistic, his tariff result a mathematical blunder, and his social-income chapters vitiated by lacking consumers' rent.", "responds_to": ["Cournot, Recherches 1838, in N. T. Bacon's 1897 translation (context)", "Bertrand 1883 (context)", "Edgeworth, Giornale degli Economisti 1897 (context)"], "answered_by": ["#15 Moore 1906 (cites Fisher p. 126)", "#14 Moore 1905", "#20 Edgeworth 1922 (continues anti-Cournot duopoly line)"], "journal": "Quarterly Journal of Economics", "id": "11"}, {"author": "Bullock", "year": 1901, "title": "Trust Literature: A Survey and a Criticism", "group": "A", "hook": "Bullock: separate large-scale production from monopoly. If trusts really were superior, potential competition could never protect consumers.", "claim": "Surveying 1897–1900 trust writing, Bullock argues that trusts are monopolies whose claimed economies over large independent firms are slight, that 'ruinous competition' is largely caused by tariffs and tax laws, and that belief in trust superiority is incompatible with relying on potential competition.", "responds_to": ["Jenks, The Trust Problem; Ely, Monopolies and Trusts; Collier; von Halle; Baker; Gunton; Dodd (context)", "US Industrial Commission 1900 (context)", "Hadley's Economics 1896 and later articles (the line from #04)", "J. B. Clark's later papers on potential competition (the line from #05)", "#08 Marshall 1890 (quoted)", "Taussig on iron prices and the tariff, QJE vol. 14 (context)"], "answered_by": [], "journal": "Quarterly Journal of Economics", "id": "12"}, {"author": "Pigou", "year": 1904, "title": "Monopoly and Consumers' Surplus", "group": "B", "hook": "Pigou asks how monopolists seize consumers' surplus: discriminate, sell only in fixed parcels, or squeeze out rivals.", "claim": "Because total benefit exceeds maximum monopoly revenue, monopolists can gain by attacking consumers' surplus directly (discrimination or selling in fixed parcels, which needs four rarely co-existing conditions) or indirectly (threatening to withhold supply to extrude competitors).", "responds_to": ["Marshall, Principles (monopoly revenue, consumers' surplus) (context)", "Edgeworth, Mathematical Psychics (indifference curves; indeterminate bargain) (context)", "Walras, Neumann; Hadley and Acworth on railway charging (context)"], "answered_by": ["Pigou, Wealth and Welfare 1912, degrees of discrimination (context, not in folder)", "#18 Pigou 1913 (railway rates as discriminating monopoly)", "#24 Yntema 1928 (discrimination between markets)"], "journal": "Economic Journal", "id": "13"}, {"author": "Moore", "year": 1905, "title": "The Personality of Antoine Augustin Cournot", "group": "B", "hook": "Moore's Cournot: half-blind, under-recognised, fiercely independent, winning his 'case of 1838' late and losing that of 1863.", "claim": "From Cournot's unpublished Souvenirs, Moore portrays a model scholar working under adverse conditions whose reputation lagged because of his independence, truthfulness and dislike of self-advertisement.", "responds_to": ["Cournot's unpublished Souvenirs (1859)", "Neglect of the Recherches (Walras: no French review by 1873)"], "answered_by": ["#15 Moore 1906 (uses Cournot as test case)"], "journal": "Quarterly Journal of Economics", "id": "14"}, {"author": "Moore", "year": 1906, "title": "Paradoxes of Competition", "group": "B", "hook": "Moore: 'competition' bundles five hypotheses; with few sellers, results like 'labour gets what it produces' fail.", "claim": "Perfect competition tacitly bundles five hypotheses; projecting results valid under all five onto industries with few producers produces paradoxes (Cournot vs Bertrand vs Edgeworth), so the doctrine that labour gets what it produces holds only under perfect competition.", "responds_to": ["Cournot, Recherches ch. VII and IX (context)", "Bertrand 1883 (context)", "Edgeworth, Giornale 1897 (context)", "Marshall, Principles Notes XIV and III", "#11 Fisher 1898 (cited p. 220)", "Doctrine that labour gets what it produces (context: J. B. Clark, Distribution of Wealth 1899; not named by Moore)"], "answered_by": ["#20 Edgeworth 1922 (indeterminacy restated)", "Group E imperfect competition debate (context)"], "journal": "Quarterly Journal of Economics", "id": "15"}, {"author": "Edgeworth", "year": 1911, "title": "Contributions to the Theory of Railway Rates [Part I]", "group": "C", "hook": "Edgeworth splits 'increasing returns' into marginal (primary) and average (secondary) senses, and says monopoly needs the primary.", "claim": "Treating railways as monopolised public works, Edgeworth first clarifies the laws of return: the primary (marginal) definition is the criterion of a maximum and governs monopoly and state regulation, while the secondary (average) definition suits competition and is 'even fallacious' for monopoly.", "responds_to": ["Marshall, Principles (diminishing return; external economies) (context)", "Carver, Distribution of Wealth (numerical table; secondary definition)", "Walker, Seligman, Bullock, Flux (definitions of returns)", "J. M. Clark on local discriminations and 'law of joint cost'", "Pigou, 'Producers' and Consumers' Surplus', EJ 1910 (context)"], "answered_by": ["Later instalments of this series (not in folder; one is cited as EJ XXI p. 565 in #19)", "#19 Edgeworth 1915 (applies analysis to railway joint cost, backs Pigou)", "#24 Yntema 1928 (uses the primary/marginal definition, citing Edgeworth's Papers)"], "journal": "Economic Journal", "id": "16"}, {"author": "Taussig", "year": 1913, "title": "Railway Rates and Joint Cost Once More", "group": "C", "hook": "Taussig: coal and copper transport have different demand schedules, so joint cost, not monopoly, explains classification.", "claim": "Conceding that distance-based discrimination is not a joint-cost matter, Taussig holds that different traffics over one stretch are jointly supplied and non-homogeneous in demand, and that railways' lack of monopoly revenue shows joint cost rather than monopoly explains most discrimination.", "responds_to": ["Pigou, Wealth and Welfare 1912 ch. xii 'The Special Case of Railway Rates' (context, quoted)", "#09 Taussig 1891 (restated)"], "answered_by": ["Pigou's note, QJE May 1913, and Taussig's rejoinder (not in folder; referred to in #18)", "#18 Pigou 1913", "#19 Edgeworth 1915"], "journal": "Quarterly Journal of Economics", "id": "17"}, {"author": "Pigou", "year": 1913, "title": "Railway Rates and Joint Costs (with comment by Taussig)", "group": "C", "hook": "Pigou: coal and copper transport share 'common', not 'joint', costs, so competition would equalise ton-mile rates.", "claim": "Where a railway would pay under uniform mileage rates, its services are not joint (overheads are common costs only), so competition would equalise rates per ton-mile and uniform rates should be the ICC's ideal; discrimination is justified only where a line would otherwise not pay.", "responds_to": ["#17 Taussig 1913", "Taussig's May 1913 rejoinder (not in folder; quoted 'p. 537')", "Pigou, Wealth and Welfare 1912 (context)"], "answered_by": ["Taussig's comment in the same issue (pp. 692–694)", "#19 Edgeworth 1915 (sides with Pigou, citing Fanno)"], "journal": "Quarterly Journal of Economics", "id": "18"}, {"author": "Edgeworth", "year": 1915, "title": "Recent Contributions to Mathematical Economics [Section II]", "group": "B", "hook": "Edgeworth backs Pigou: railway 'joint cost' confuses gas-and-coke with costs depending on total tons carried.", "claim": "Mathematical theory yields presumptions useful for practice; applied to railway rates, costs depending on a sum of outputs (coal plus copper tons) are the opposite of true joint production, so competitive rates tend to equal prime cost and the cost-of-service principle is a regulative rule, as Pigou argued.", "responds_to": ["Pigou, Wealth and Welfare 1912 (context)", "Quarterly Review critic (footnote ties to J. Shield Nicholson)", "#17 and #18 Pigou–Taussig QJE 1913", "Fanno on joint cost (context)"], "answered_by": [], "journal": "Economic Journal", "id": "19"}, {"author": "Edgeworth", "year": 1922, "title": "The Mathematical Economics of Professor Amoroso", "group": "B", "hook": "Reviewing Amoroso, Edgeworth again insists duopoly is indeterminate: rivals cut and jump prices forever.", "claim": "Amoroso's Cournot-style determinate duopoly equilibrium is illegitimate: monopolists free to vary price will undercut and then jump prices indefinitely, so duopoly has no determinate equilibrium.", "responds_to": ["Amoroso, Lezioni di Economia Matematica 1921 (context)", "Cournot (context)", "Pigou, Wealth and Welfare p. 193 (context)"], "answered_by": [], "journal": "Economic Journal", "id": "20"}, {"author": "Edgeworth", "year": 1925, "title": "The Revised Doctrine of Marginal Social Product", "group": "D1", "hook": "Old Edgeworth defends Pigou's anti-laissez-faire conclusion but admits treating rents as cost was an error.", "claim": "Restating Pigou's revised doctrine diagrammatically, Edgeworth upholds the case against laissez-faire under increasing returns while conceding (with Young and Clark) that rents paid to members of the community are not a cost, a correction that leaves the main result little affected.", "responds_to": ["Pigou, Economics of Welfare 2nd ed. 1924 (context)", "#26 Young 1913", "#31 Robertson 1924"], "answered_by": ["No direct reply in folder; see #33 Pigou 1927 and #35 Pigou 1928 restatements"], "journal": "Economic Journal", "id": "21"}, {"author": "Bowley", "year": 1928, "title": "Bilateral Monopoly", "group": "B", "hook": "Steel monopolist meets ore monopolist: whoever dictates the price decides the outcome; otherwise it is indeterminate.", "claim": "In bilateral monopoly the outcome depends on which side dictates the price; combination maximises joint gain at the intersection of the manufacturer's demand and supplier's offer schedules, but that price is unstable, so without collusion or arbitration there is no definite solution.", "responds_to": ["Wicksell's critique of Bowley's Mathematical Groundwork of Economics, reprinted by Schumpeter, Archiv für Sozialwissenschaft Bd 58 (context)"], "answered_by": [], "journal": "Economic Journal", "id": "23"}, {"author": "Yntema", "year": 1928, "title": "The Influence of Dumping on Monopoly Price", "group": "B", "hook": "Yntema: dumping abroad lowers home monopoly price if marginal costs fall, raises it if they rise.", "claim": "A dumping monopoly equates marginal gross revenue in each market to common marginal cost; dumping lowers the domestic price under decreasing marginal costs and raises it under increasing marginal costs, contrary to Viner's claim of no effect.", "responds_to": ["Viner, Dumping: A Problem in International Trade (context)", "Graham's review, AER 1924 (context)", "Barone (context)", "Edgeworth's primary/secondary returns (cf. #16)"], "answered_by": ["Joan Robinson's theory of price discrimination 1933 (context, not in folder)"], "journal": "Journal of Political Economy", "id": "24"}, {"author": "Young", "year": 1913, "title": "Review: Pigou's Wealth and Welfare", "group": "D1", "hook": "Young: Pigou's 'marginal supply price' counts higher land rents as cost, but rents are mere transfers.", "claim": "Pigou's curve of marginal supply prices (Young: 'curve of aggregate expenses') wrongly counts higher rents, which are transfers of purchasing power, as resources used up, so his case for taxing diminishing-return and subsidising increasing-return industries fails.", "responds_to": ["Pigou, Wealth and Welfare 1912 (context)", "Edgeworth's endorsement of Pigou (context)"], "answered_by": ["Pigou, Economics of Welfare 1920 pp. 934–6 (context)", "#30 Knight 1924 (credits Young, fn. 8)", "#31 Robertson 1924 (endorses, §11; Pigou concedes in appended reply)", "#21 Edgeworth 1925"], "journal": "Quarterly Journal of Economics", "id": "26"}, {"author": "Clapham", "year": 1922, "title": "Of Empty Economic Boxes", "group": "D1", "hook": "Historian Clapham tours a hat factory and finds he cannot put any industry in the 'returns' boxes.", "claim": "The categories of diminishing, constant and increasing returns have never been filled with actual industries, and drawing welfare and tax conclusions from such empty boxes is dangerous for a practical science.", "responds_to": ["Pigou, The Economics of Welfare 1920 (context)", "Marshall, Principles and Industry and Trade (context)"], "answered_by": ["#28 Pigou, Empty Economic Boxes: A Reply (Dec 1922)", "Clapham's rejoinder, Notes and Memoranda, Dec 1922 (context)", "#31 Robertson 1924"], "journal": "Economic Journal", "id": "27"}, {"author": "Pigou", "year": 1922, "title": "Empty Economic Boxes: A Reply", "group": "D1", "hook": "Pigou to Clapham: the boxes hold 'little cases' of elasticities, which are useful, and fillable with statistics.", "claim": "The returns categories are integral parts of value theory, useful even when empty for exposing hidden assumptions; what matters for practice are the 'little cases' of numerical elasticities, which cooperation between theorists, business experts and statisticians may fill.", "responds_to": ["#27 Clapham 1922"], "answered_by": ["Clapham's rejoinder, Notes and Memoranda, Dec 1922 (context)", "#31 Robertson 1924"], "journal": "Economic Journal", "id": "28"}, {"author": "Knight", "year": 1924, "title": "Some Fallacies in the Interpretation of Social Cost", "group": "D1", "hook": "Knight's two roads: a private owner's toll on the good road equals Pigou's ideal tax.", "claim": "Pigou's case that competition over-invests in increasing-cost industries confuses social and entrepreneurial cost: private ownership and rent stop investment at the social optimum, rents are redistributions not social costs, and decreasing cost is incompatible with competition.", "responds_to": ["Pigou, Economics of Welfare 1920, p. 194 two roads (context)", "F. D. Graham, QJE 1923 (context)", "#26 Young 1913 (credited, fn. 8)"], "answered_by": ["Pigou's concession appended to #31 (Mar 1924)", "#35 Pigou 1928 ('transfer elements')"], "journal": "Quarterly Journal of Economics", "id": "30"}, {"author": "Robertson", "year": 1924, "title": "Those Empty Boxes", "group": "D1", "hook": "David's pebbles at the giant Pigou: 'external diseconomies… who in the world are they?'", "claim": "Pigou's twin-curve apparatus runs together two different kinds of decreasing cost and invents 'external diseconomies' for increasing cost; properly understood, competitive output commits no 'rigid mathematical sin', so permanent bounties and taxes are unjustified.", "responds_to": ["#27 Clapham 1922", "#28 Pigou 1922", "#26 Young 1913", "Pigou, Economics of Welfare 1920 (context)"], "answered_by": ["Pigou's reply appended (pp. 30–31)", "#21 Edgeworth 1925", "#38 Robertson 1930 symposium (group D2)"], "journal": "Economic Journal", "id": "31"}, {"author": "Pigou", "year": 1927, "title": "The Laws of Diminishing and Increasing Cost", "group": "D1", "hook": "Pigou accepts Sraffa: no increasing costs; but tiny external economies can still add up to decreasing costs.", "claim": "For industries too small to affect factor prices increasing costs are impossible (agreeing with Sraffa), but external economies special to an industry can produce decreasing costs under competition, in which case output falls short of the optimum and a bounty is warranted.", "responds_to": ["Sraffa, 'The Laws of Returns under Competitive Conditions', EJ Dec 1926 (context)"], "answered_by": ["#35 Pigou 1928 (fuller analysis)", "#37 Young 1928", "#38 1930 symposium (group D2)"], "journal": "Economic Journal", "id": "33"}, {"author": "Robbins", "year": 1928, "title": "The Representative Firm", "group": "D1", "hook": "Robbins: the representative firm is a superfluous, misleading ghost, since 'not enough Josiah Stamps to go round'.", "claim": "Marshall's representative firm is unnecessary for any problem in value theory, since unequal managerial ability yields unequal normal profits just as unequal land yields unequal rents, and it misleads by hiding the heterogeneity of business ability.", "responds_to": ["Marshall, Principles Bk IV ch. xiii and Bk V (context)", "Robertson's 1927 Colwyn Report article (context)", "H. D. Henderson, Supply and Demand (context)", "#35 Pigou 1928 (noted in footnote, not discussed)"], "answered_by": ["#38 Robertson 1930, 'The Trees of the Forest' (group D2)"], "journal": "Economic Journal", "id": "34"}, {"author": "Pigou", "year": 1928, "title": "An Analysis of Supply", "group": "D1", "hook": "Pigou's 'equilibrium firm': price equals its marginal and average cost; correct for transfers, and increasing supply price vanishes.", "claim": "Using an 'equilibrium firm' whose marginal and average costs both equal the industry's supply price, Pigou shows that decreasing supply price requires costs dependent on industry output, and that once transfer elements are removed increasing supply price is impossible while decreasing supply price is likely in manufacturing.", "responds_to": ["Sraffa 1926 (context)", "#33 Pigou 1927", "#26 Young 1913, #30 Knight 1924, #31 Robertson 1924 (rent/transfer critique)", "Marshall's representative firm (context)"], "answered_by": ["#34 Robbins 1928 (footnote only)", "#38 1930 symposium and #41 Harrod 1930 (group D2)"], "journal": "Economic Journal", "id": "35"}, {"author": "Shove", "year": 1928, "title": "Varying Costs and Marginal Net Products", "group": "D1", "hook": "Shove: rent effects must be counted under increasing and diminishing returns alike, so Pigou's asymmetry collapses.", "claim": "Whether purchasers' gains or losses from expansion are offset by landlords' rents depends on expansion's effect on infra-marginal costs, not on whether returns increase or diminish, so Pigou's tax-bounty asymmetry collapses and must be restated as a gap between marginal cost and 'final trade cost'.", "responds_to": ["Pigou, Economics of Welfare 2nd ed., Part II ch. x (context)", "Marshall, Principles pp. 472–5 and Appendix H (context)"], "answered_by": ["#38 1930 symposium and #47 Shove 1933 (group D2)"], "journal": "Economic Journal", "id": "36"}, {"author": "Young", "year": 1928, "title": "Increasing Returns and Economic Progress", "group": "D1", "hook": "Young: the division of labour depends on the division of labour, so increasing returns make growth cumulative.", "claim": "Increasing returns arise from the progressive division of labour among industries and roundabout methods, limited by a market that is itself total production, so they propagate cumulatively and cannot be grasped by firm- or industry-level equilibrium analysis.", "responds_to": ["Adam Smith (division of labour limited by the market) (context)", "Marshall's internal/external economies and representative firm (context)", "Sraffa 1926 and the supply-curve apparatus of #33/#35 (implicit)"], "answered_by": ["#38 1930 symposium (group D2)", "compare #34 Robbins 1928 footnote"], "journal": "Economic Journal", "id": "37"}, {"author": "Robertson, Sraffa & Shove", "year": 1930, "title": "Increasing Returns and the Representative Firm: A Symposium", "group": "D2", "hook": "Robertson defends Marshall's trees; Sraffa says discard Marshall; Shove relabels economies and calls in imperfect markets and time.", "claim": "How competitive equilibrium can coexist with increasing returns from internal economies: Robertson says through the representative firm (no identifiable firm can expand), Sraffa says it cannot (equilibrium means minimum cost) so Marshall's theory should be discarded, and Shove says through costlier invasion of rivals' markets and through time.", "responds_to": ["#34 Robbins 1928 (The Representative Firm)", "#33 Pigou 1927", "#35 Pigou 1928", "#36 Shove 1928", "#37 Young 1928", "#31 Robertson 1924", "Sraffa 1926 (context)"], "answered_by": ["#41", "#43", "#44", "#47", "#52"], "journal": "Economic Journal", "id": "38"}, {"author": "Harrod", "year": 1930, "title": "Notes on Supply", "group": "D2", "hook": "Harrod draws the marginal revenue curve first, calling it the 'increment of aggregate demand curve'.", "claim": "A source facing a falling demand curve sets output where marginal cost cuts the 'increment of aggregate demand curve' (marginal revenue), which allows decreasing supply price; separately, industries using factors in unusual proportions (agriculture) face increasing supply price.", "responds_to": ["#35 Pigou 1928 and #38 Shove 1930 (paper is 'propaedeutic' to them)", "classical agriculture vs manufacturing distinction"], "answered_by": ["#43", "#44", "#45", "#51"], "journal": "Economic Journal", "id": "41"}, {"author": "Harrod", "year": 1931, "title": "The Law of Decreasing Costs", "group": "D2", "hook": "Harrod: with marketing costs or sloping firm demand, competitive equilibrium and decreasing costs coexist; MC = price − price/elasticity.", "claim": "Competitive equilibrium is compatible with short- and long-period decreasing costs when there are competitive marketing costs (which make supply depend on the state of demand) or falling particular demand curves, and decreasing costs are normal where optimum plant grows faster than demand.", "responds_to": ["#41 Harrod 1930", "Sraffa 1926 (context)", "#38 Shove 1930", "Pigou's equilibrium firm, Economics of Welfare 1929 (cf. #35)"], "answered_by": ["#44", "#45"], "journal": "Economic Journal", "id": "43"}, {"author": "Robinson", "year": 1932, "title": "Imperfect Competition and Falling Supply Price", "group": "D2", "hook": "Robinson: with imperfect competition, equilibrium firms must have falling average cost, yet supply price may rise, fall or stay put.", "claim": "Under imperfect competition with free entry, the double condition (MR = MC, price = AC) means the firm's demand curve is tangent to its falling AC curve, but whether more demand lowers supply price depends on whether individual demand curves become more or less elastic.", "responds_to": ["Sraffa 1926 (context)", "#38 Symposium 1930", "#41 Harrod 1930", "#43 Harrod 1931", "Kahn's tangency theorem (unpublished, credited p. 547 n.)"], "answered_by": ["#45", "#46", "#47"], "journal": "Economic Journal", "id": "44"}, {"author": "Harrod", "year": 1933, "title": "A Further Note on Decreasing Costs", "group": "D2", "hook": "Harrod: under imperfect competition 'normal profit' is a range, so decreasing costs are possible, not compulsory.", "claim": "Defining normal profit as the rate on the firm's marginal fixed equipment that induces it to extend plant, price need not equal average total cost, so a firm in imperfect competition may, but need not, show decreasing costs in equilibrium.", "responds_to": ["#44 Robinson 1932", "#47 Shove 1933"], "answered_by": [], "journal": "Economic Journal", "id": "45"}, {"author": "Pigou", "year": 1933, "title": "A Note on Imperfect Competition", "group": "D2", "hook": "Pigou rebuilds Robinson's geometry in algebra: two equations, two unknowns, so her conditions are compatible and determinate.", "claim": "Writing Robinson's two equilibrium conditions algebraically gives two equations in price and number of firms, showing they are compatible and determinate, extending her results to unequal firms, and yielding ∂ψ/∂p as a measure of market imperfection.", "responds_to": ["#44 Robinson 1932"], "answered_by": [], "journal": "Economic Journal", "id": "46"}, {"author": "Shove (with reply by Robinson)", "year": 1933, "title": "The Imperfection of the Market: A Further Note", "group": "D2", "hook": "Shove asks Robinson: what does your cost curve show, and what is 'normal' profit when entry is costly?", "claim": "Robinson's proof is doubtful because a firm's cost of a given output depends on the character of demand, so her cost curve cannot stay fixed, and with entry costs normal profit is a range, so tangency defines maximum profit rather than a necessary equilibrium condition.", "responds_to": ["#44 Robinson 1932", "#38 Shove 1930 (his own pp. 106, 108)"], "answered_by": ["#45"], "journal": "Economic Journal", "id": "47"}, {"author": "Robbins", "year": 1934, "title": "Remarks upon Certain Aspects of the Theory of Costs", "group": "D2", "hook": "Robbins: cost is displaced alternatives (Wieser's Law); Marshall's flat and falling supply curves belong to a 'Theory of Variations'.", "claim": "Costs are the value of displaced alternatives, so cost rises at equilibrium; Marshallian constant and falling supply curves describe differences between equilibria, not equilibrium itself, and competitive decreasing costs come from exploiting indivisible potential uses of factors across many industries.", "responds_to": ["Sraffa 1926 (context)", "Knight 1928 and Haberler on technical-displacement cost (context)", "#26 Young 1913", "#30 Knight 1924", "#21 Edgeworth 1925", "#37 Young 1928", "#38 Shove 1930"], "answered_by": ["#51"], "journal": "Economic Journal", "id": "48"}, {"author": "Kaldor", "year": 1934, "title": "The Equilibrium of the Firm", "group": "E", "hook": "Co-ordination is the firm's only fixed factor — and in static equilibrium it becomes a free good.", "claim": "The only factor that can limit a firm's long-run size is co-ordinating ability, but co-ordination is needed only for adjustment to change, so long-period static equilibrium and perfect competition are incompatible.", "responds_to": ["#08 Marshall's representative firm", "#34 Robbins 1928 on the representative firm", "#38 Robertson in the 1930 symposium", "Pigou's 'equilibrium firm', Economics of Welfare (context)", "Harrod, 'Decreasing Costs', EJ June 1933 (cf. #45)", "Chamberlin 1933 and Robinson 1933 books (context)"], "answered_by": ["#58 Kaldor 1935 builds on it", "#50 Robinson 1934 cites it on entrepreneurship as a factor", "#59 Kahn 1935 cites it (roads/external diseconomies)", "Coase, 'The Nature of the Firm' 1937 (context, not in folder)"], "journal": "Economic Journal", "id": "49"}, {"author": "Robinson", "year": 1934, "title": "Euler's Theorem and the Problem of Distribution", "group": "E", "hook": "The adding-up problem was never a problem: profits are zero, positive or negative as returns are constant, diminishing or increasing.", "claim": "Euler's theorem and economic reasoning agree: profits are zero, positive or negative as returns (physical under perfect competition, in value and outlay under imperfect competition) are constant, diminishing or increasing, and under imperfect competition entrepreneurs receive more than their marginal product to the industry.", "responds_to": ["Wicksteed, Co-ordination of the Laws of Distribution 1894 (context)", "Clark, Edgeworth, Pareto, Walras, Hobson, Marshall, Wicksell (context)", "Hicks, Theory of Wages 1932 (context)", "#49 Kaldor 1934"], "answered_by": ["#59 Kahn 1935 (builds on it)", "#63 Chamberlin 1937 (rejects entrepreneur-as-exploiter)"], "journal": "Economic Journal", "id": "50"}, {"author": "Robinson", "year": 1941, "title": "Rising Supply Price", "group": "D2", "hook": "Robinson: when demand shifts to a commodity, it turns relative factor prices against itself, so supply price rises.", "claim": "For a transfer of demand under perfect competition and full employment, any industry using factors in unaverage proportions has rising supply price in terms of a composite unit of resources, its strength depending on size, idiosyncrasy, substitutability and factor-supply elasticity.", "responds_to": ["Marshall's long-period supply curve", "Hicks, Value and Capital 1939 (context)", "Sraffa 1926 (context)", "#33 Pigou 1927", "#48 Robbins 1934"], "answered_by": [], "journal": "Economica", "id": "51"}, {"author": "Shove", "year": 1942, "title": "The Place of Marshall's Principles in the Development of Economic Theory", "group": "D2", "hook": "Shove's centenary verdict: Marshall is 'reformed Ricardian', and the marginal revenue curve is Marshall's algebra drawn as geometry.", "claim": "Marshall's Principles is a mathematical completion of Ricardo–Mill rather than a synthesis with Jevons and the Austrians; the 1930s imperfect-competition theory follows Marshall's lines, but oligopoly, dynamics and Keynesian money remain gaps.", "responds_to": ["Keynes's memoir and Schumpeter 1941 on Marshall (context)", "Sraffa 1926 (context)", "#44 Robinson 1932 and the group E imperfect-competition literature", "Chamberlin 1933, Zeuthen 1930, Kahn 1937 (context)", "#38 Shove 1930"], "answered_by": [], "journal": "Economic Journal", "id": "52"}, {"author": "Kaldor", "year": 1934, "title": "Mrs. Robinson's 'Economics of Imperfect Competition' (review)", "group": "E", "hook": "A brilliant treatise on monopoly misnamed: it leaves out duopoly, marketing costs and the \"imagined demand curve.\"", "claim": "Robinson's book, omitting duopoly and marketing costs, is really an admirable ultra-Marshallian treatise on monopoly whose 'industry' and objective demand-curve concepts are unsuited to imperfect competition.", "responds_to": ["Robinson, The Economics of Imperfect Competition 1933 (context)"], "answered_by": ["#58 Kaldor 1935 develops it", "#59 Kahn 1935 cites it"], "journal": "Economica", "id": "53"}, {"author": "Schumpeter (and Nichol)", "year": 1934, "title": "Robinson's Economics of Imperfect Competition (reviews)", "group": "E", "hook": "Schumpeter: marginal revenue unifies price theory, yet the book is \"Marshallian to the core\"; Nichol: geometry can't handle monopolies.", "claim": "Schumpeter praises marginal revenue as unifying price theory but finds Robinson's book Marshallian partial-equilibrium to the core; Nichol finds its geometric methods inadequate for a world of monopolies.", "responds_to": ["Robinson, The Economics of Imperfect Competition 1933 (context)"], "answered_by": ["No reply in set; compare #53"], "journal": "Journal of Political Economy", "id": "54"}, {"author": "Nichol", "year": 1934, "title": "Professor Chamberlin's Theory of Limited Competition", "group": "E", "hook": "Far-sighted duopolists reach the monopoly price only with costless production; change the costs and price moves above or below monopoly.", "claim": "Chamberlin's theorem that far-sighted oligopolists reach the monopoly price rests on the costless case; with decreasing variable costs duopoly price exceeds monopoly price, and with unequal increasing costs it falls below it.", "responds_to": ["Chamberlin, 'Duopoly: Value When Sellers Are Few', QJE 1929 (context)", "Chamberlin, Theory of Monopolistic Competition 1933, ch. III (context)", "Cournot and Edgeworth duopoly theories (context; group B)"], "answered_by": ["No reply in set"], "journal": "Quarterly Journal of Economics", "id": "55"}, {"author": "Harrod", "year": 1934, "title": "Doctrines of Imperfect Competition", "group": "E", "hook": "Downward-sloping demand means either excess profits at optimum scale, or normal profits with too-small, under-used plant.", "claim": "Imperfect competition makes long-period equilibrium consistent with excess profits or with sub-optimal, under-used lay-outs, distorts resource allocation from the optimum, and through decreasing costs destabilises total output in the trade cycle.", "responds_to": ["Robinson 1933 and Chamberlin 1933 books (context)", "#41, #43, #45 Harrod's earlier EJ notes", "Viner 1931 cost curves (context)", "Pigou, Industrial Fluctuations (context)"], "answered_by": ["#57 Robinson 1934", "#61 Harrod 1936 (extension)"], "journal": "Quarterly Journal of Economics", "id": "56"}, {"author": "Robinson", "year": 1934, "title": "What Is Perfect Competition?", "group": "E", "hook": "Perfect competition just means a perfectly elastic demand curve for each seller. Free entry and normal profits are separate questions.", "claim": "Perfect competition should mean only that each seller faces perfectly elastic demand; it is analytically distinct from free entry and normal profits, and the number of firms needed for it depends on the slopes of marginal cost curves.", "responds_to": ["Knight, Risk, Uncertainty and Profit (context)", "Sraffa 1926 (context)", "#38 Shove in the 1930 symposium", "Shove, EJ March 1933 (cf. #47)", "Chamberlin 1933 book, pure vs perfect competition (context)", "#56 Harrod 1934", "Cournot's large-numbers condition (context)"], "answered_by": ["#63 Chamberlin 1937 (agrees on entry, rebuts on differentiation, numbers of buyers, and '100 firms')"], "journal": "Quarterly Journal of Economics", "id": "57"}, {"author": "Kaldor", "year": 1935, "title": "Market Imperfection and Excess Capacity", "group": "E", "hook": "Free entry into differentiated markets is \"the creator of excess capacity\", but only under Chamberlin's heroic assumptions.", "claim": "Chamberlin's excess-capacity (tangency) result is logically sound but depends on unrealistic assumptions — evenly spread preferences, short-sighted producers, no institutional monopoly — though some rise in costs rather than fall in price from entry remains likely.", "responds_to": ["Chamberlin, Theory of Monopolistic Competition 1933, ch. V (context)", "Robinson, Economics of Imperfect Competition 1933, ch. 7 (context)", "Shove, 'The Imperfection of the Market', EJ March 1933 (cf. #47)", "#49 Kaldor 1934", "#53 Kaldor's review of Robinson"], "answered_by": ["#63 Chamberlin 1937 (rejects numbers/divisibility, accepts free-entry point)", "#66 Kaldor 1938 rejoinder"], "journal": "Economica", "id": "58"}, {"author": "Kahn", "year": 1935, "title": "Some Notes on Ideal Output", "group": "E", "hook": "What matters is deviation from the average. If every industry were equally imperfect, there would be nothing to correct.", "claim": "Ideal output equalises the value of marginal social product across uses, so interference is warranted only by an industry's deviation from the average degree of external economy or imperfect competition — with hired factors and entrepreneurs to be shifted in opposite directions.", "responds_to": ["Pigou, Economics of Welfare 4th ed. 1932 (context)", "#36 Shove 1928 'Varying Costs and Marginal Net Products'", "#50 Robinson 1934 Euler's theorem", "Robinson, EIC ch. 27 'A World of Monopolies' (context)", "#27 Clapham's empty boxes", "#26 Young 1913", "#30 Knight 1924", "#21 Edgeworth 1925", "#49 Kaldor 1934", "#53 Kaldor 1934 review"], "answered_by": ["#63 Chamberlin 1937 (quotes Kahn p. 20; rejects negative marginal product of entrepreneurship)"], "journal": "Economic Journal", "id": "59"}, {"author": "Harrod", "year": 1936, "title": "Imperfect Competition and the Trade Cycle", "group": "E", "hook": "Demand gets less elastic in booms and more elastic in slumps, so prices and profits swing more than costs.", "claim": "If entrepreneurs equate MR and MC, the greater amplitude of price and profit fluctuations than of cost fluctuations is explained by demand becoming less elastic in booms and more elastic in slumps.", "responds_to": ["#56 Harrod 1934", "Psychological trade-cycle theories (context)"], "answered_by": ["#63 Chamberlin 1937 (MR = MC is not peculiar to imperfect competition)"], "journal": "Review of Economic Statistics", "id": "61"}, {"author": "Chamberlin", "year": 1937, "title": "Monopolistic or Imperfect Competition?", "group": "E", "hook": "Monopolistic competition is a blend of monopoly and competition, while \"imperfect\" competition keeps the old dichotomy.", "claim": "Monopolistic competition, built on product differentiation, treats most situations as blends of monopoly and competition, whereas Robinson's 'imperfect competition' keeps them mutually exclusive — a difference with consequences for profits, competitive norms and 'exploitation'.", "responds_to": ["Robinson, Economics of Imperfect Competition 1933 (context)", "#57 Robinson 1934", "#58 Kaldor 1935", "#59 Kahn 1935", "#61 Harrod 1936", "#50 Robinson 1934 Euler", "J. M. Clark; White 1936; Machlup 1937 (context)"], "answered_by": ["#66 Kaldor 1938", "Chamberlin's reply to Kaldor (#67, context, not in folder)", "#69 Machlup 1939 (discusses narrow vs wide sense of the term)"], "journal": "Quarterly Journal of Economics", "id": "63"}, {"author": "Coase", "year": 1937, "title": "Some Notes on Monopoly Price", "group": "E", "hook": "A real monopolist, ignorant of demand, raises prices slowly at first and, in the long run, restricts output more.", "claim": "Once ignorance, uncertainty about demand, short- vs long-run demand, demand shifts caused by price changes, dynamics and the 'quiet life' are allowed for, a newly formed monopoly first raises price less than Robinson predicts but in the long run restricts output more and slows progress.", "responds_to": ["Robinson, Economics of Imperfect Competition 1933 (context)", "Hicks, 'The Theory of Monopoly', Econometrica 1935 (context)"], "answered_by": ["No reply in set; compare #65 Burns 1937 and #69 Machlup 1939"], "journal": "Review of Economic Studies", "id": "64"}, {"author": "Burns", "year": 1937, "title": "The Organization of Industry and the Theory of Prices", "group": "E", "hook": "Industry studies should start from prices and trace where the \"disintegrated\" entrepreneur's functions have gone.", "claim": "Because competitive individualism no longer describes industry, industry studies should centre on explaining price behaviour through the new distribution of entrepreneurial functions — scale, integration and sales promotion.", "responds_to": ["Theories of imperfect/monopolistic competition, Chamberlin and Robinson (context)", "Older 'Trust and Corporation Problems' studies (context)", "Antitrust, Robinson-Patman Act, NRA (context)"], "answered_by": ["No direct reply in set; compare #69 Machlup 1939 on case studies"], "journal": "Journal of Political Economy", "id": "65"}, {"author": "Kaldor", "year": 1938, "title": "Professor Chamberlin on Monopolistic and Imperfect Competition", "group": "E", "hook": "Chamberlin \"is trying to differentiate his product too far\": one subject, and elasticity, not slope, measures imperfection.", "claim": "Chamberlin's alleged dissimilarities are misconceptions: the theories share one subject, imperfection is measured by elasticity (which rises with numbers), economies of scale underlie imperfect competition, and monopoly need not rest on privilege.", "responds_to": ["#63 Chamberlin 1937", "#58 Kaldor 1935 (defended)", "Cassels, QJE May 1937 (context)"], "answered_by": ["Chamberlin's reply (#67, context, not in folder)"], "journal": "Quarterly Journal of Economics", "id": "66"}, {"author": "Machlup", "year": 1939, "title": "Evaluation of the Practical Significance of the Theory of Monopolistic Competition", "group": "E", "hook": "Differentiated many-seller markets behave nearly competitively; oligopoly is the real case, and may hinge on Firestone's breakfast.", "claim": "Product differentiation among many sellers probably changes little from pure competition; oligopoly, defined by sellers' conjectures, is the common and important case, hard to analyse, yet the theory still gives policy-makers useful concepts and warnings.", "responds_to": ["Chamberlin, Theory of Monopolistic Competition 1933/1936 (context; cf. #63)", "Hicks, Econometrica 1935 (context)", "Mason 1939 (context)", "Machlup 1937 classification (context)"], "answered_by": ["No reply in set"], "journal": "American Economic Review", "id": "69"}];
