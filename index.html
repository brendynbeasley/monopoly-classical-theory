 WHAT THIS FILE IS
 ─────────────────
 One self-contained web page: a tutor that lives in a retro terminal. It teaches a course a piece at a
 time, checks every piece, and then brings each fact back just before the student would forget it, until
 it is permanent. No server, no libraries, no network. It saves progress in the browser.

 The page has three script blocks. Only one of them is about the subject:

     script id="core"      helpers, figure templates, the memory model      never changes
     script id="course"    the course: one COURSE object + the units        THE ONLY BLOCK YOU REPLACE
     script id="engine"    the app                                          never changes

 TO TURN NEW MATERIAL INTO A COURSE
 ──────────────────────────────────
  1  Write one COURSE object (who is teaching, what things are called).
  2  Write one BOOK.add({...}) per unit. A unit is a chapter, a lecture, a week: whatever the source uses.
     Those two things together are "the course block". It is all you ever write.
  3  Put the block into the app, in one of two ways:
       in the app     type  courses , paste the block, press check, press load. It is kept in the browser
                      beside the built-in course and the file is never edited. If you can only answer
                      with text, answer with the course block in one code block and nothing else: this
                      is where it will be pasted.
       in the file    copy this file, replace the contents of  script id="course"  with the block, and
                      change the page title. Touch nothing else.
  4  Check it. The  courses  screen checks whatever is pasted into it. In a finished page, type  validate .
     Without a browser, run the Node line at the bottom of this guide. Fix every error. Read every warning.
  5  Do not put a closing script tag anywhere inside the course block, not even inside a string.

 What to make of the source:
     a textbook chapter, a lecture, long notes      one unit: 6 to 8 modules of 2 to 4 sections each
     a whole book or course                         one unit per chapter, grouped into parts
     a vocabulary list, a set of flashcards         units that hold only a glossary (everything except
                                                    the lessons still works: cards, games, boss, exam).
                                                    One unit per topic, or per 20 to 40 words; at least 6
                                                    words a unit, or some games have too little to play.
                                                    The word to be learned is the term, its meaning the
                                                    definition (cards and games ask both ways). A few
                                                    short lessons on the pairs people mix up are welcome.
     anything with numbers                          add calc generators and lab simulators
 Teach what the source says. Do not invent facts, figures or quotations. An analogy, a worked example
 or a picture of your own is welcome as a way of teaching, as long as it adds no new claim about the
 subject. When a picture is a sketch and not data, say so in its title: (illustrative).
 Scale to the source and never pad: one page of notes is 4 to 6 modules; a word list needs no lessons at all.

 WHAT MAKES A COURSE GOOD HERE
 ─────────────────────────────
 These are the reasons the format works. Keep to them and any subject will work.
  · ONE VOICE. The persona is a character with a name, a place and a manner: dry, exact, first person,
    a little impatient, never chirpy. Short sentences. Jokes are one-line asides, not the point.
  · ONE IDEA PER SECTION, taught in 5 to 8 beats. A beat is one to three short paragraphs, or a moving
    picture. Alternate them: text, picture, text. Never two long text beats in a row.
  · CONCRETE FIRST. Open with a case the student can see (a student buys a coffee), then name the idea.
  · NAME THE TRAP. Say what gets confused with what, and how to tell them apart. Exams are built there.
  · BOLD EACH KEY TERM ONCE, on first use, written *like this*. If the bold words are a glossary term
    the student collects it at that moment: spell it as the glossary does (capitals do not matter, and
    a plural in s is fine). Other bold is just bold: put a formula on a line of its own, in bold.
  · EVERY SECTION ENDS IN RECALL: two checkpoint questions (a retry gets the other one), one or two
    short answers, and one key line. The short answers double as the module's learning objectives.
  · WRONG ANSWERS HAVE CONSEQUENCES: the section is replayed and the key line is typed out. So the key
    line must be the one sentence worth keeping: lower case, about a dozen words, and no punctuation
    except what a number needs (2.5, 100,000).
  · QUESTIONS TEST UNDERSTANDING, NOT WORDING. Ask for the reason, the consequence, the case that fits.
    Wrong options are real misconceptions, and as long and as well-formed as the right one.
  · EVERYTHING IS ASKED AGAIN LATER, so every question must make sense on its own, out of context.
  · CHECKPOINTS ARE CLOSED BOOK. While a checkpoint is asked, its section is folded away. Ask about the
    idea, so that remembering it is enough. Never ask for a phrase the student could only find on screen.
  · THE RIGHT OPTION IS NOT THE LONGEST. Make the wrong options as long and as specific as the right
    one. The check warns when the right one is the longest in more than 40% of the questions, and names the worst.
  · NAME THE PAIRS. Put the subject's opposites and roles in COURSE.opposites (lender:'borrower',
    real:'nominal', spring:'neap'). The marker uses them to catch a short answer that turns the model round.

 A UNIT
 ──────
 BOOK.add({
   n:1,                           REQUIRED. A whole number, unique. Use the source's own (week 3 is n:3).
   short:'Six Parts, Five Principles',                REQUIRED. A few words, for menus.
   title:'Full title',            optional
   modules:[ {id:'why-finance', title:'THE AIR SUPPLY', secs:[ SECTION, SECTION ]}, ... ],
   gloss:[ ['term','definition','example',['related term', ...]], ... ],
   cheat:[ '*HEADING*', '  a line', ... ],
   calc:[ ()=>({q, a, u, tol, steps:[...]}), ... ],
   lab:[ {cmd, usage, eg, run:args=>({fig, a, say})}, ... ],
   cases:[ {t, s:[...], o:[[choice, score, outcome, best?], ...], l, fig}, ... ],   caseGame:{...},
   boss:{name:'THE CREDIT FREEZE', art:[7 lines], taunts:[4 lines]},
   figs:{ name:(args)=>({n, fps, hold, r:i=>text}) }
 });
 Wrap a unit in  (()=>{ ... })();  when it needs helpers of its own, and keep them inside the wrapper:
 the only name a course declares at the top level is COURSE (any other could collide with the engine's).
 Only  n  and  short  are required, plus either modules or gloss. Everything else switches a feature on.

 A SECTION
 ─────────
 {h:'One morning, five transactions',
  beats:[
    ["First paragraph. Two to four sentences.","Second paragraph. *Bold* a key term on first use."],
    {fig:'chain', a:[{title:'...', nodes:[...], caps:[...]}]},          a template, with its options
    ["More text."],
    {fig:'freeze'}                                                       one of the unit's own figures
  ],
  q:[ mc("Question?", ["the right answer","wrong","wrong","wrong"], "One sentence saying why."),
      tf("True or false: a statement.", false, "Why.") ],
  sa:[ sa("Why do lenders charge interest?", "To be compensated for the time borrowers use their funds.",
          [['compensat','rent','reward','paid for'], ['time','while','period','use of']]) ],
  line:"interest compensates the lender for the time you use the funds"}

 Question builders
     mc(question, [RIGHT, wrong, wrong, wrong], why)     the first option is the right one; shown shuffled
     tf(statement, true|false, why)
     fill("A sentence with a ___ gap.", ['accepted','answers'], why)
     nm(question, number, why, unit '$' | '%' | '', tolerance)        default tolerance 0.6%
     sa(question, model answer, [[idea 1 stems], [idea 2 stems], ...], ideasNeeded)
 Short answers are marked by key ideas. Each inner list is ONE idea, written as stems and synonyms, any
 of which counts ('compensat' matches compensate, compensated, compensation). All ideas are needed
 unless you give ideasNeeded. The model answer must fit the word limit and must pass its own marking.
 Marking ignores capitals, accents and punctuation everywhere (short answers, gaps, typed terms, key
 lines: anden counts for andén), and a stem matches anywhere in the answer ('pacific' finds Pacific).
 A word is whatever stands between two spaces: 100,000 is one word. The limit is 10 words unless
 COURSE.sa.words says otherwise.
 Key words alone can still say the opposite, so one short answer gets four more checks. It is not marked
 right if it has more negatives than the model (not, never, can't), swaps a word for its opposite (rise for
 fall), names a pair the other way round (real GDP divided by nominal), or is two words where the model
 needs six or more. The student is shown the model and the reason and decides; a yes counts as hard. In an
 exam it is marked "check" and not counted. Pairs come from a built-in list (rise/fall, higher/lower,
 lender/borrower, assets/liabilities, near/far ...) plus COURSE.opposites. So: write model answers without
 needless negatives, and list your subject's own pairs. Free recall (blurt) uses the key ideas alone.

 FIGURES
 ───────
 A figure is text that moves. Use a template by name with one options object:  {fig:'bars', a:[{...}]}
 Every line of every frame must be 56 characters or fewer, so it fits a phone.
     bars     {title, rows:[[label,value,text?]], max?, note?, seq?}          bars that grow
     morph    {title, rows:[[label,from,to,suffix|fn]], max?, capA, capB}     bars sliding between two states
     steps    {title, lines:[...]}                                            lines appear one at a time
     chain    {title, nodes:[...], caps:[one for each node], end?, token?}    a token hops along boxes
     cycle    {title, nodes:[...], caps:[...], note?}                         a marker walks round a loop
     events   {title, events:[[when,what], ...]}                              a timeline
     lanes    {left:[...], mid:'BANK', right:[...], sym:'$', lh, mh, rh, note}   flow through a middle
     compare  {left:{h,lines:[...]}, right:{h,lines:[...]}, note?}            two ideas side by side
     table    {title, head:[...], rows:[[...]], note?, left:[0]}              rows appear one at a time; left = the
                                                                              columns (from 0) set flush left
     plot     {title, xl, yl, xr:[a,b], yr:[a,b], curves:[{f:x=>y | pts:[[x,y]], ch, name}],
               shift?:{curve, to:{f|pts}, cap}, eq?:[i,j], cap?}              curves, a shift, a crossing
     taccount {title, frames:[{cap, A:[[name,value]], L:[[name,value]]}]}     a balance sheet in steps
     crowd    {title, n, per, off, on, stages:[{frac,cap}]}                   a crowd changing state
     ticker   {title, start, vol, drift, note?}                               a random-walk chart
     tree     {title, root, kids:[[branch,[leaf, ...]], ...], note?}          a hierarchy
     stack    {title, layers:[[name,what], ...], note?}                       the layers of a system
     split    {title, parts:[[label,value], ...], unit?, note?}               one whole in shares
     quadrant {title, x:[left,right], y:[top,bottom], cells:[tl,tr,bl,br], note?}     a 2 x 2 map
     seq      {title, actors:[a,b,c?], msgs:[[0,1,text], ...], note?}         who says what to whom; from and to
                                                                              are places in actors, from 0
     formula  {title, expr, parts:[[symbol,meaning], ...], eg?}               a formula, symbol by symbol
     label    {title, art:[lines], labels:[[row,text], ...], note?}           a drawing with callouts

 What fits in 56 columns (the check warns about anything wider):
     a title, note, cap or step line: 52; a tree leaf: 46      bars   label + text after the bar: 40
     chain    nodes + 4 for each arrow: 4 nodes of 10, 5 of 7      compare   24 a line left, 26 right
     table    all cells of a row + 2 a column: 54      events   the when + the what: 50
     lanes    left label + right label: 30, middle 6   taccount names 13, numbers as numbers
     quadrant a cell is two lines of 15 (it wraps); axis words 16     stack   name + description: 44
     seq      a message is shorter than the gap it crosses: 14 with three actors, 34 with two
     formula  expr 50; symbol + meaning 48             label    art + callout: 50; row counts from 0
     cycle    a node: 44                               numline  a label: 42
 A figure of your own goes in the unit's  figs  and is used by name:  {fig:'freeze'}  or  {fig:'x', a:[1,2]}
 The list in  a  is handed over as the arguments:  {fig:'x', a:[1,2]}  calls  x(1,2) . Give every argument
 a default. A simulator's  fig  may be a template or one of the unit's own figures.
     name:(first=1, second=2)=>({n:40, fps:8, hold:3000, intro:20, r:i=>'line one\nline two'})
     n = last frame · fps = speed · hold = ms to rest on the last frame (0 loops without resting)
     intro = frames to play before the lesson moves on (default: all of them) · once:1 plays once and stops
     reset() is called each time the loop restarts, for figures that draw fresh random numbers
     r(i) returns the whole picture at frame i, for i from 0 to n. Frame n is the finished picture.

 THE REST OF A UNIT
 ──────────────────
 gloss   20 to 30 terms. Write the definition without the term in it: it is shown as a clue (if the
         term is there it is blanked out). Give an example (shown with the answer, never as a clue)
         and two or three related terms. Say a term in *bold* where a lesson teaches it, so that it is
         collected there; a term no lesson bolds is learned through cards, crack and the games.
 cheat   the unit on one screen. A line that starts and ends with * is a heading.
 calc    each generator returns fresh numbers every call:
           ()=>{const L=rint(4,20)*1000, r=pick([3,4,5]); const a=L*r/100;
                return{q:`You borrow ${fmt(L)} at ${r}% for a year. How much interest, in dollars?`,
                       a, u:'$', steps:['Interest = principal x rate', `   = ${fmt(L)} x ${r}%`, `   = ${fmt(a)}`]}}
         The first step states the method. The last step states the answer. u is the unit shown after
         the answer: '$' and '%' are special, any other short word is printed as it is ('km', 'years').
 lab     a simulator the student can drive with sliders:
           {cmd:'loan', usage:'loan [amount$] [rate%] [years]', eg:'loan 10000 4 4',
            run:a=>{const L=clamp(arg(a,0,10000),1000,100000); ... return{fig:'carloan', a:[L], say:'One line.'}}}
         arg(a, index, default) reads a number. Each [name] in usage becomes a slider (one word each,
         hyphens allowed). Written exactly as  clamp(arg(a,0,10000),1000,100000)  with plain numbers, the
         slider takes that default and range; otherwise a range is guessed from the default. Or state
         them: params:[{name, min, max, step, def}]. cmd is one lower-case word that is not an engine
         command (help, learn, review, cards, exam, boss, map, lab ...): the check says if it is taken.
 cases   a decision game. Each case: {t:'TITLE', s:['the situation'], l:'the lesson', fig:['name', args],
           o:[['a choice', +15, 'what happens', 1], ['another', -25, 'what happens'], ...]}   1 marks the best
         caseGame:{cmd:'bank', title, tile, intro:[...], label:'capital', pre:'$', post:'k', start:100,
           max:220, failTitle, failText, endLabel, verdicts:[[score,'verdict'], ...]}   is optional dressing
 boss    a name, seven lines of art no wider than 44 characters with (o) for eyes, and four taunts.

 HOW MUCH TO WRITE (per unit of about one textbook chapter; less for less source, never padded)
     6 to 8 modules · 20 to 24 sections · 2 or 3 figures per section · 2 questions + 1 or 2 short
     answers + 1 key line per section · 20 to 30 glossary terms · a 30-line cheat sheet · 6 to 8 calc
     generators and 4 or 5 simulators if the subject has numbers · one boss

 WHAT CHANGED IN ENGINE 5
 ────────────────────────
 Course blocks written for engine 4 run unchanged. Three things behave differently for the student:
  · checkpoints are closed book: the section folds away while it is asked, and can be opened again once it
    is passed (settings > study > checkpoints switches it off)
  · a short answer whose key words are there but which says the reverse is not marked right (see A SECTION)
  · on a touch screen a short answer is typed. Word tiles are a hint the student asks for ("words"), and an
    answer built from them counts as hard. An exam offers no tiles.
 Fixed: a short answer over the word limit stopped the lesson with "internal error: T is not a function".

 CHECKING A COURSE
 ─────────────────
 In the page: type  validate  at the prompt. It runs every figure through every frame, every generator
 25 times, every simulator, and marks every model answer against its own key ideas. The  courses  screen
 runs the same check on whatever is pasted into it, before anything is kept, and gives the line number of
 a syntax error.
 A course is also tidied as it loads. Anything malformed is repaired where the meaning is plain (a bare
 string where a list was wanted) and left out where it is not (a question with no answer), so one bad
 item never stops the app. Every repair is listed by the check: an error is something that was left out.
 Without a browser (Node 18 or later), all on one line. It also stops with "Identifier ... has already
 been declared" if the course declares a top-level name that the engine uses too:
   node -e "const h=require('fs').readFileSync(process.argv[1],'utf8'),g=i=>h.split('<script id=\"'+i+'\">')[1].split('</scr'+'ipt>')[0];new(require('vm').Script)(g('core')+';'+g('course')+';'+g('engine'));const r=new Function(g('core')+';'+g('course')+';return validateCourse({deep:true})')();console.log(r.stats);r.errors.forEach(e=>console.log('E',e));r.warnings.forEach(w=>console.log('W',w));process.exit(r.errors.length?1:0)" your-file.html
 Also useful at the prompt:  warp 3d  moves the clock forward three days, to watch reviews come due.
 To build a page from a course block without opening an editor (Node; all on one line): it copies this
 file, puts your block where the course goes and sets the page title.
   node -e "const fs=require('fs'),[,f,c,o,t]=process.argv,h=fs.readFileSync(f,'utf8'),k='<script id=\"course\">',a=h.indexOf(k)+k.length,b=h.indexOf('</scr'+'ipt>',a);fs.writeFileSync(o,(h.slice(0,a)+'\n'+fs.readFileSync(c,'utf8')+'\n'+h.slice(b)).replace(/<title>[^<]*<\/title>/,'<title>'+(t||'Terminal Tutor')+'</title>'))" this-file.html course.js new-file.html "Page Title"

#bar button:hover{background:var(--barfg);color:var(--bar);opacity:1}

.dots{display:none;gap:6px;flex:none}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}

/* ── the terminal ── */

  padding:14px max(16px,calc((100% - 112ch)/2)) 30px;padding-left:max(calc(16px + var(--sal)),calc((100% - 112ch)/2));padding-right:max(calc(16px + var(--sar)),calc((100% - 112ch)/2))}

.ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.say{padding-left:var(--who,9ch);text-indent:calc(-1*var(--who,9ch))}.say.cont{text-indent:0}

/* ── the dock: tap targets under the terminal ── */

@media (max-width:700px){#toasts{bottom:auto;top:calc(3.4em + var(--sat));flex-direction:column}.say{padding-left:0;text-indent:0}.say .who{display:block}body{font-size:calc(13.5px*var(--fs))}#screen{padding-top:10px;padding-bottom:24px}#status{font-size:.8em}#ttl{display:none}#bar .l{flex:0 1 auto}#bar{justify-content:space-between}}

/* ══════════════════════════════════════════════════════════════════════════════
   STYLE · 2 · FULL-SCREEN PROGRAMS
   The same grammar everywhere: a head strip, a scrolling body of titled panels, a foot of key hints.
   ══════════════════════════════════════════════════════════════════════════════ */
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.ahead{flex:none;display:flex;gap:1.5ch;align-items:center;flex-wrap:wrap;padding:.45em max(calc(16px + var(--sal)),calc((100% - 124ch)/2)) .45em;padding-right:max(calc(16px + var(--sar)),calc((100% - 124ch)/2));border-bottom:1px solid var(--line)}

.ahead .sp{flex:1}
.abody{flex:1;min-height:0;overflow:auto;scrollbar-color:var(--dim) transparent;overscroll-behavior:contain;display:flex;flex-direction:column;gap:1.25em;
  padding:1.2em max(calc(16px + var(--sal)),calc((100% - 124ch)/2)) 1.4em;padding-right:max(calc(16px + var(--sar)),calc((100% - 124ch)/2))}
.abody>*{animation:rise .3s both;flex-shrink:0}
.abody>*:nth-child(2){animation-delay:.04s}.abody>*:nth-child(3){animation-delay:.08s}.abody>*:nth-child(4){animation-delay:.12s}.abody>*:nth-child(5){animation-delay:.16s}.abody>*:nth-child(n+6){animation-delay:.2s}
.afoot{flex:none;border-top:1px solid var(--line);display:flex;gap:.2em 2ch;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:.88em;text-shadow:none;
  padding:.35em max(calc(16px + var(--sal)),calc((100% - 124ch)/2));padding-right:max(calc(16px + var(--sar)),calc((100% - 124ch)/2))}
.afoot b{color:var(--fg)}
kbd{font:inherit;font-size:.92em;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 .6ch;color:var(--fg);background:var(--soft);white-space:nowrap}
.afoot button.k{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}.afoot button.k:hover{color:var(--fg)}

/* panels */
.pnl{position:relative;border:1px solid var(--line);border-radius:var(--rad);padding:1.05em 1.5ch .85em;min-width:0}
.pnl>.cap{position:absolute;top:-.8em;left:1.2ch;padding:0 .8ch;background:var(--bg);color:var(--acc);font-weight:700;letter-spacing:.06em;white-space:nowrap;max-width:calc(100% - 3ch);overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

.cols{display:grid;gap:1.25em 2ch;grid-template-columns:repeat(auto-fit,minmax(min(100%,26ch),1fr))}
.cols.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,44ch),1fr))}
.stackv{display:flex;flex-direction:column;gap:.5em;min-width:0}

.grow{flex:1;min-width:0}
.right{margin-left:auto}
.small{font-size:.9em}.big{font-size:1.5em;line-height:1.2}

/* buttons */
.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:max(2px,var(--rad));padding:.22em 1.2ch;cursor:pointer;text-transform:inherit;white-space:nowrap;text-shadow:inherit;line-height:1.5}
.btn:hover,.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg);text-shadow:none}
.btn.pri{border-color:var(--acc);color:var(--acc);font-weight:700}.btn.pri:hover{background:var(--acc);color:var(--bg)}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.ok:hover{background:var(--ok);color:var(--bg)}
.btn.bad{border-color:var(--err);color:var(--err)}.btn.bad:hover{background:var(--err);color:var(--bg)}
.btn.sm{font-size:.88em;padding:.05em .9ch}
.btn:disabled{opacity:.35;pointer-events:none}
.btn kbd{border-color:currentColor;background:none;color:inherit;margin-right:.6ch;font-size:.85em}
body.touch .btn{min-height:42px;padding:.5em 1.4ch}body.touch .btn.sm{min-height:36px}
.link{color:var(--info);cursor:pointer;text-decoration:underline dotted;text-underline-offset:.2em;background:none;border:0;font:inherit;padding:0}
.link:hover{color:var(--bg);background:var(--info);text-decoration:none}

/* form fields */
.inp{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:max(2px,var(--rad));padding:.3em 1ch;caret-color:var(--acc);width:100%;min-width:0;text-shadow:none}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}

.inp::placeholder{color:var(--dim);opacity:.8}
.fld{display:grid;gap:.25em}.fld>span{color:var(--dim);font-size:.88em;text-transform:uppercase;letter-spacing:.05em}

/* tabs and option rows */
.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line)}

.tab:hover{color:var(--fg)}.tab.on{color:var(--acc);border-color:var(--line);background:var(--bg);font-weight:700}
.opts{display:flex;gap:6px;flex-wrap:wrap}

/* lists you can walk with the arrow keys */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:0 2ch;align-items:baseline;padding:.18em 1ch;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;border-radius:var(--rad);text-transform:inherit;text-shadow:inherit}
.row:hover{background:var(--soft2)}
.row.sel{background:var(--fg);color:var(--bg);text-shadow:none}.row.sel *{color:inherit!important}
.row .meta{color:var(--dim);white-space:nowrap;font-size:.92em}

/* meters made of cells */
.seg{display:inline-flex;gap:2px;vertical-align:-.08em}

.seg i.on{background:currentColor}
.seg.ok{color:var(--ok)}.seg.acc{color:var(--acc)}.seg.info{color:var(--info)}.seg.err{color:var(--err)}
.memmap{font-family:var(--mono);line-height:1.15;letter-spacing:.12ch;word-break:break-all;text-transform:none}
.s0{color:var(--dim);opacity:.55}.s1{color:var(--err)}.s2{color:var(--acc)}.s3{color:var(--info)}.s4{color:var(--ok)}.s5{color:var(--ok);font-weight:700;text-shadow:0 0 6px var(--ok)}
.memmap i{cursor:default}
.legend{display:flex;gap:.2em 2ch;flex-wrap:wrap;color:var(--dim);font-size:.88em}

/* ══ HOME ══ */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.25em 2ch;align-items:stretch}

.logo .sub{color:var(--dim)}
.me{display:grid;gap:.22em;align-content:center}

.ticker span{display:inline-block;animation:marquee linear infinite}
@keyframes marquee{to{transform:translateX(-50%)}}
.cta{display:grid;grid-template-columns:auto 1fr auto;gap:0 1.5ch;align-items:center;width:100%;font:inherit;color:var(--bg);background:var(--acc);border:0;border-radius:var(--rad);padding:.55em 1.6ch;cursor:pointer;text-align:left;text-shadow:none;text-transform:inherit}

.cta .go{font-size:1.5em;line-height:1;animation:pulse 1.6s infinite}
.cta .t{font-weight:700;font-size:1.08em;letter-spacing:.03em}.cta .d{grid-column:2;opacity:.85;font-size:.92em}
.cta kbd{background:none;border-color:currentColor;color:inherit}
.plan{display:flex;gap:.3em 1ch;flex-wrap:wrap;margin-top:.7em;align-items:center}

.ht.off{opacity:.45}
.unitp .mods{display:flex;gap:4px;flex-wrap:wrap;margin:.1em 0 .5em}
.unitp .mod{font:inherit;font-size:.9em;border:1px solid var(--line);background:none;color:var(--fg);padding:0 .8ch;cursor:pointer;border-radius:var(--rad);white-space:nowrap;max-width:26ch;overflow:hidden;text-overflow:ellipsis;text-transform:inherit}
.unitp .mod.done{border-color:var(--ok);color:var(--ok)}.unitp .mod.now{border-color:var(--acc);color:var(--acc);font-weight:700}
.unitp .mod:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools{display:flex;gap:.2em 1.8ch;flex-wrap:wrap;color:var(--dim);font-size:.92em;border-top:1px dashed var(--line);margin-top:.6em;padding-top:.5em}
.cmdline{flex:none;padding:.4em max(calc(16px + var(--sal)),calc((100% - 124ch)/2)) .3em;padding-right:max(calc(16px + var(--sar)),calc((100% - 124ch)/2));border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word;cursor:text;min-height:2.3em}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 max(calc(16px + var(--sal)),calc((100% - 124ch)/2)) .3em;font-size:.88em;text-shadow:none}
.sugg:empty{display:none}
.sugg .chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}

/* ══ FLASHCARDS ══ */
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 2ch;align-items:center;padding:.3em 1ch;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;border-radius:var(--rad);text-transform:inherit;text-shadow:inherit}
.deck:hover{background:var(--soft2)}.deck.sel{background:var(--fg);color:var(--bg);text-shadow:none}.deck.sel *{color:inherit!important}
.deck .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .ct{font-size:.9em;white-space:nowrap;font-variant-numeric:tabular-nums}
.deck .ct .new{color:var(--info)}.deck .ct .lrn{color:var(--err)}.deck .ct .due{color:var(--ok)}.deck .ct .z{color:var(--dim);opacity:.6}
.study{align-items:center;justify-content:center;gap:1.1em}
.cardwrap{perspective:1400px;width:min(100%,64ch);flex:0 1 auto}

.card.flip{transform:rotateX(180deg)}
.card.noanim{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--fg);border-radius:max(4px,var(--rad));background:var(--bg);box-shadow:8px 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;padding:.7em 2ch 1em;overflow:auto;text-transform:none}

.face .txt{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.35em;line-height:1.35;padding:.6em 0;white-space:pre-wrap;word-break:break-word;gap:.4em}
.face .txt.long{font-size:1.08em;text-align:left;align-items:stretch}
.face .ex{color:var(--dim);font-size:.9em;text-align:center}

.card.out-r{transition:transform .28s,opacity .28s;transform:translateX(120%) rotate(12deg);opacity:0}

.grade small{opacity:.8;font-size:.82em}.grade b{font-weight:700}
.grade.g1{color:var(--err)}.grade.g2{color:var(--acc)}.grade.g3{color:var(--ok)}.grade.g4{color:var(--info)}
.grade:hover,.grade.on{color:var(--bg)}.grade.g1:hover,.grade.g1.on{background:var(--err);border-color:var(--err)}.grade.g2:hover,.grade.g2.on{background:var(--acc);border-color:var(--acc)}.grade.g3:hover,.grade.g3.on{background:var(--ok);border-color:var(--ok)}.grade.g4:hover,.grade.g4.on{background:var(--info);border-color:var(--info)}
body.touch .grade{min-height:54px}
.prog{height:4px;background:var(--soft2);width:100%;position:relative;overflow:hidden}.prog i{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .3s}
.pv{border:1px solid var(--line);max-height:15em;overflow:auto;border-radius:var(--rad)}
.pv table{margin:0}.pv td,.pv th{padding-left:1ch!important}
.drop{border:1px dashed var(--line);border-radius:var(--rad);padding:.6em 1ch;color:var(--dim);text-align:center}
.drop.over{border-color:var(--acc);color:var(--acc);background:var(--soft)}

/* ══ ARCADE ══ */
.games{display:grid;gap:1.25em 2ch;grid-template-columns:repeat(auto-fill,minmax(min(100%,30ch),1fr))}
.game{display:flex;flex-direction:column;gap:.3em;text-align:left;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:var(--rad);padding:.7em 1.4ch;cursor:pointer;text-transform:inherit;text-shadow:inherit;min-width:0}
.game:hover,.game.sel{border-color:var(--acc);background:var(--soft);box-shadow:5px 5px 0 rgba(0,0,0,.3);transform:translate(-2px,-2px)}
.game{transition:transform .12s,box-shadow .12s}
.game pre{color:var(--acc);font:inherit;font-family:var(--mono);line-height:1.1;margin:0 0 .3em;text-transform:none}
.game .nm{font-weight:700;color:var(--acc);letter-spacing:.06em}.game .ds{color:var(--dim);font-size:.92em}
.game .hi{color:var(--ok);font-size:.88em;margin-top:auto}
.game.off{opacity:.45;pointer-events:none}
.hud{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud b{color:var(--acc)}.hud .life{color:var(--err);letter-spacing:.2ch}
.field{position:relative;flex:1;min-height:16em;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--soft)}
.drop-it{position:absolute;left:0;top:0;max-width:min(46ch,86%);border:1px solid var(--line);background:var(--bg);padding:.15em 1ch;border-radius:var(--rad);font-size:.92em;will-change:transform;text-transform:none;line-height:1.3}
.drop-it.hot{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.drop-it.zap{transition:opacity .25s,filter .25s;opacity:0;filter:brightness(3) blur(2px)}
.drop-it.boom{border-color:var(--err);color:var(--err);transition:opacity .4s;opacity:0}
.field .floor{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--err);box-shadow:0 0 12px var(--err)}
.field .laser{position:absolute;width:2px;background:var(--acc);box-shadow:0 0 8px var(--acc);transform-origin:bottom center;pointer-events:none;animation:fade .2s reverse forwards}
.typebar{display:flex;gap:1ch;align-items:center}
.typebar .inp{font-size:1.1em}
.match{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,21ch),1fr));align-content:start}
.mt{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:var(--rad);padding:.5em 1ch;min-height:5.2em;cursor:pointer;text-align:left;font-size:.9em;line-height:1.3;transition:transform .12s,opacity .3s,background .15s;text-transform:none;text-shadow:inherit;overflow:hidden}
.mt.t{font-weight:700;color:var(--acc);font-size:1em;display:grid;place-items:center;text-align:center}
.mt:hover{border-color:var(--fg)}.mt.pick{background:var(--fg);color:var(--bg);transform:scale(1.03);text-shadow:none}
.mt.gone{opacity:0;pointer-events:none;transform:scale(.8)}.mt.no{animation:shake .35s;border-color:var(--err)}
.blitz{align-items:center;justify-content:center;gap:1em}
.claim{width:min(100%,62ch);border:2px solid var(--fg);border-radius:max(4px,var(--rad));padding:1.1em 2ch;min-height:9em;display:flex;flex-direction:column;justify-content:center;gap:.5em;background:var(--bg);box-shadow:8px 8px 0 rgba(0,0,0,.35);text-transform:none;font-size:1.08em}
.claim.yes{border-color:var(--ok)}.claim.no{border-color:var(--err);animation:shake .3s}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,62ch)}
.tfrow .btn{padding:.6em;font-size:1.1em;font-weight:700}
.timer{height:6px;background:var(--soft2);width:min(100%,62ch)}.timer i{display:block;height:100%;background:var(--acc);transition:width .1s linear}.timer.low i{background:var(--err)}
.order{display:flex;flex-direction:column;gap:6px;width:min(100%,60ch)}
.ord{display:grid;grid-template-columns:3ch 1fr auto;gap:1ch;align-items:center;font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:var(--rad);padding:.35em 1ch;cursor:grab;text-align:left;text-transform:none;text-shadow:inherit;touch-action:none;user-select:none;-webkit-user-select:none}
.ord.sel{border-color:var(--acc);background:var(--soft2)}.ord.drag{opacity:.5}.ord.good{border-color:var(--ok);color:var(--ok)}.ord.badp{border-color:var(--err)}
.ord .mv{display:flex;gap:4px}.ord .mv button{font:inherit;background:none;border:1px solid var(--line);color:inherit;cursor:pointer;padding:0 .8ch;border-radius:var(--rad)}
.bigword{font-family:var(--mono);white-space:pre;line-height:1.05;color:var(--acc);text-align:center;text-transform:none}
.result{align-items:center;justify-content:center;text-align:center;gap:.9em}

/* ══ MAP · STATS · SETTINGS · BADGES ══ */
.urow{display:grid;grid-template-columns:5ch minmax(0,1fr) auto;gap:0 1.5ch;align-items:baseline;padding:.15em .5ch;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;text-transform:inherit;text-shadow:inherit}
.urow:hover{background:var(--soft2)}.urow.now .nm{color:var(--acc);font-weight:700}
.urow .mm{font-family:var(--mono);letter-spacing:.05ch;white-space:nowrap;font-size:.92em}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content}
.heat i{width:1.05em;height:1.05em;background:var(--soft2);display:block;border-radius:2px}
.heat i.h1{background:color-mix(in srgb,var(--ok) 30%,var(--bg))}.heat i.h2{background:color-mix(in srgb,var(--ok) 55%,var(--bg))}.heat i.h3{background:color-mix(in srgb,var(--ok) 80%,var(--bg))}.heat i.h4{background:var(--ok)}.heat i.today{outline:1px solid var(--fg)}
.bars{display:flex;align-items:flex-end;gap:3px;height:6em}
.bars i{flex:1;background:var(--info);min-height:1px;display:block;position:relative}.bars i.now{background:var(--acc)}
.kpi{display:flex;flex-direction:column;gap:0;min-width:0}.kpi b{font-size:1.5em;line-height:1.15;color:var(--acc);font-variant-numeric:tabular-nums}.kpi span{color:var(--dim);font-size:.88em;text-transform:uppercase;letter-spacing:.05em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(13ch,1fr));gap:.8em 2ch}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,27ch),1fr))}
.badge{border:1px solid var(--line);border-radius:var(--rad);padding:.5em 1.2ch;display:grid;grid-template-columns:auto 1fr;gap:0 1.2ch;align-items:center}
.badge .ic{font-size:1.5em;color:var(--acc);grid-row:span 2;font-family:var(--mono)}.badge b{color:var(--acc)}.badge span{color:var(--dim);font-size:.9em}
.badge.lock{opacity:.5}.badge.lock .ic,.badge.lock b{color:var(--dim)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,25ch),1fr));gap:10px}
.swatch{font:inherit;font-size:.82em;line-height:1.3;text-align:left;border:2px solid;border-radius:4px;padding:.4em 1ch;cursor:pointer;overflow:hidden;white-space:nowrap;text-transform:none;text-shadow:none;position:relative;transition:transform .1s}
.swatch:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.swatch.cur-t{outline:3px solid var(--acc);outline-offset:2px}
.swatch .nm{font-weight:700;display:block;margin-bottom:.15em;overflow:hidden;text-overflow:ellipsis}
.swatch .fav{position:absolute;right:.6ch;top:.3em;opacity:.9}
.sgrid{display:grid;grid-template-columns:minmax(14ch,22ch) 1fr;gap:.6em 2ch;align-items:center}
.sgrid>.k{color:var(--dim)}
.nano{flex:1;min-height:0;display:flex;flex-direction:column}
.nano textarea{flex:1;min-height:12em;width:100%;font:inherit;color:var(--fg);background:transparent;border:0;outline:none;resize:none;padding:.6em 0;caret-color:var(--acc);line-height:1.5}
.nano .nbar{background:var(--fg);color:var(--bg);padding:0 1ch;display:flex;justify-content:space-between;gap:2ch;text-shadow:none;font-weight:700}

@media (max-width:980px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.hero{grid-template-columns:1fr}.logo{justify-content:center}.logo .emblem{display:none}.logo .word{align-items:center;text-align:center}.sgrid{grid-template-columns:1fr;gap:.2em}.sgrid>.k{margin-top:.5em}
  .afoot .wide{display:none}.face .txt{font-size:1.15em}.grades{gap:5px}.deck{grid-template-columns:minmax(0,1fr) auto}.deck .bar{display:none}}
@media (max-width:480px){.menu{grid-template-columns:1fr}.me .l{grid-template-columns:7ch 1fr}.me .clip{white-space:normal}.cta{grid-template-columns:auto 1fr}.cta kbd{display:none}.ahead .btn kbd{display:none}.ahead{gap:.4em 1ch}}
@media (max-height:520px){.logo .emblem{display:none}}

.pnl>.cap.r select{max-width:min(46ch,58vw)}
body.touch .afoot:not(.keep){display:none}
/* phones zoom the page when a field's text is smaller than 16px */
body.touch .inp,body.touch .nano textarea{font-size:16px}

/* ── courses: the library and the three steps that make a new one ── */
.steps{margin:0;padding-left:3.2ch;display:grid;gap:.95em}
.steps>li{padding-left:.4ch;min-width:0}.steps>li::marker{color:var(--acc);font-weight:700}
.steps .rowh{margin-top:.5em}.steps textarea{display:block;margin-top:.5em;min-height:7em;resize:vertical}
.rep{margin-top:.7em;display:grid;gap:.15em;overflow-wrap:anywhere}.rep:empty{display:none}
pre.code{margin:.25em 0;padding:.3em 1ch;border-left:2px solid var(--err);background:var(--soft);white-space:pre-wrap;word-break:break-word;font:inherit;text-transform:none}
table.lib td{vertical-align:middle;padding-top:.35em;padding-bottom:.35em}table.lib .acts{white-space:nowrap;text-align:right}table.lib .acts .btn{margin-left:.7ch}table.lib tr.on td{background:var(--soft)}
body.touch .btn[data-a]>kbd,body.touch .btn[data-g]>kbd{display:none}      /* no keys to press on a touch screen */
.card.flip,.card.flip .face{touch-action:none}      /* face up, a swipe grades the card: the browser must not take it for a scroll. A face too long to fit keeps its own up-and-down scrolling (set where the card is drawn). */

/* ══════════════════════════════════════════════════════════════════════════════
   STYLE · 3 · SCREEN EFFECTS AND WINDOW CHROME
   A theme switches these on by name: data-fx="crt flicker", data-chrome="mac".
   They are layers over the same page, so every program gets them for free.
   ══════════════════════════════════════════════════════════════════════════════ */
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.2;display:none}
[data-fx~=matrix] #rain{display:block}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
/* cathode-ray tube: scanlines and a darkened rim */
[data-fx~=crt] #fx{display:block;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
[data-fx~=scan] #fx{display:block;background:repeating-linear-gradient(rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
[data-fx~=flicker] #stage{animation:flicker 6s infinite steps(1)}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.93}49%{opacity:1}82%{opacity:.96}83%{opacity:1}}
[data-fx~=curve] #stage{box-shadow:inset 0 0 110px rgba(0,0,0,.6)}
/* reflective lcd: a faint dot grid, and ink with a soft shadow */

<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="win">
  <div id="bar"><div class="l"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="ttl"></span></div>

  <div id="stage">
    <div id="screen" role="log"><div id="out"><div class="ln dim">LOADING . . .</div></div><div id="inl" hidden><span id="ps1"></span> <span id="typed"></span><span id="wc"></span></div></div>
    <div id="app" hidden></div>

</div>
<form id="ghostf"><input id="ghost" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input"></form>
<div id="fx" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div><canvas id="burst" aria-hidden="true"></canvas><div id="toasts" role="status" aria-live="polite"></div><div id="crash" hidden></div><div id="sheet"></div>

<!-- ═══════════════ CORE: pure helpers, figure templates, memory model, importers, validator. No DOM. ═══════════════ -->
<script id="core">
/* ══════════════════════════════════════════════════════════════════════════════
   CORE · 1 · HELPERS
   Pure functions: no DOM, no storage. Everything in the three CORE blocks also
   runs under Node, which is how the course validator works outside a browser.
   Course content may use any of these names.
   ══════════════════════════════════════════════════════════════════════════════ */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// the same, for text that goes inside an attribute: a quote in a card's name must not end value="..." early
const escA=s=>esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b,step=1)=>a+step*Math.floor(Math.random()*(Math.floor((b-a)/step)+1));
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmt2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=1)=>(+n).toFixed(d)+'%';
const commas=(n,d=2)=>(+n).toLocaleString('en-US',{maximumFractionDigits:d});      // 1,234,567: for numbers that are not money
const rep=(c,n)=>n>0?c.repeat(Math.round(n)):'';
const padE=(s,n)=>String(s).padEnd(n),padS=(s,n)=>String(s).padStart(n);
const bar=(v,max,w)=>{const k=Math.max(0,Math.min(w,Math.round(v/max*w)));return rep('█',k)+rep('░',w-k)};
const rot=(s,k)=>{k=((k%s.length)+s.length)%s.length;return s.slice(k)+s.slice(0,k)};
const lane=(pat,len,k)=>rot(pat.repeat(Math.ceil(len/pat.length)+1),k).slice(0,len);
const pts=(P,x)=>{if(x<=P[0][0])return P[0][1];for(let k=1;k<P.length;k++)if(x<=P[k][0]){const a=P[k-1],b=P[k];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return P[P.length-1][1]};
// Letters are letters in every alphabet. Marking ignores case, punctuation and accents ("anden" counts for "andén"), so a
// course can be in any language. A full stop survives only inside a number (0.6). Plain English reads exactly as it always did.
const ASCII=/^[\x00-\x7f]*$/,LN=/[\p{L}\p{N}]/u,fold=s=>ASCII.test(s)?s:s.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');
const norm=s=>{s=String(s==null?'':s).toLowerCase();return(ASCII.test(s)?s.replace(/[^a-z0-9.]+/g,' '):fold(s).replace(/[^\p{L}\p{M}\p{N}.]+/gu,' ')).replace(/\.(?!\d)/g,' ').replace(/ {2,}/g,' ').trim()};
// two answers are the same when they read the same; answers made only of symbols (≤, →, 🙂) have to match exactly
const sameAnswer=(typed,answer)=>{const a=norm(typed),b=norm(answer);return a||b?a===b:String(typed).trim()===String(answer).trim()};
const num=s=>{s=String(s==null?'':s).toLowerCase().replace(/[$,%\s]/g,'');let m=1;if(/k$/.test(s)){m=1000;s=s.slice(0,-1)}else if(/m$/.test(s)){m=1e6;s=s.slice(0,-1)}const v=parseFloat(s);return isNaN(v)?NaN:v*m};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const arg=(a,i,d)=>{const v=num(a&&a[i]);return isNaN(v)?d:v};
const words=s=>String(s==null?'':s).trim().split(/\s+/).filter(w=>LN.test(w)).length;
// numeric marking: within tol (default 0.6%); a trailing k/m suffix is also accepted as plain units ("4.5m" for an answer in $ millions)
const numOK=(str,a,tol)=>{const near=x=>!isNaN(x)&&Math.abs(x-a)<=Math.max(Math.abs(a)*(tol||.006),.006);return near(num(str))||near(parseFloat(String(str).replace(/[$,%\s]/g,'')))};

/* ── question builders ─────────────────────────────────────────────────────────
   mc(question, [correct, wrong, wrong, wrong], why)     the FIRST option is the right one; they are shuffled on screen
   tf(statement, true|false, why)
   fill(sentence with ___, [accepted answers], why)
   nm(question, number, why, unit '$'|'%'|'' , tolerance)
   sa(question, model answer, [[idea 1 synonyms], [idea 2 synonyms], ...], ideasNeeded)                                  */
const mc=(q,o,why)=>({t:'mc',q,o,why}),tf=(q,a,why)=>({t:'tf',q,a,why}),fill=(q,a,why)=>({t:'fill',q,a,why}),nm=(q,a,why,u,tol)=>({t:'num',q,a,why,u,tol});
const sa=(q,m,k,need)=>({t:'sa',q,m,k,need});
// a short answer is right when enough of its key ideas are present; each idea is a list of stems/synonyms
const gradeSA=(it,ans)=>{const a=' '+norm(ans)+' ';return it.k.filter(g=>g.some(s=>{const k=norm(s);return k&&a.includes(k)})).length>=(it.need||it.k.length)};
const saHits=(it,ans)=>{const a=' '+norm(ans)+' ';return it.k.map(g=>g.some(s=>{const k=norm(s);return k&&a.includes(k)}))};
/* ── marking ONE short answer: key ideas, then four checks ─────────────────────
   gradeSA only asks whether the key ideas are there. On its own it also passes "it is not true that <model>", a bare
   list of keywords, and the model with a direction or a role turned round ("real GDP divided by nominal GDP"). So a
   single answer gets four more checks. An answer that trips one is NOT marked right on the spot: the student sees the
   model and the reason and decides for themselves, and a yes counts as hard. (Free recall, blurt, still uses gradeSA.)
     negation   the answer says not / no / never / can't ... more often than the model does
     opposite   it uses the opposite of a word in the model, and not the word itself       (rise for fall)
     order      the model names both halves of a role pair, the answer swaps them          (nominal ... real)
                or two pairs are crossed: near ... most, far ... least  becomes  far ... most, near ... least
     thin       two words or fewer, where the model needs six or more
   Pairs: SA_DIR and SA_ROLE below, plus COURSE.opposites. List a subject's own pairs there: the marker checks with them.
   markSA(it, answer) → {ok, keys, flag:''|'negation'|'opposite'|'order'|'thin', note}                                   */
const SA_DIR='rise fall|rises falls|rising falling|rose fell|raise lower|raises lowers|raised lowered|increase decrease|increases decreases|increased decreased|increasing decreasing|higher lower|high low|more less|more fewer|up down|above below|gain loss|gains losses|positive negative|strong weak|stronger weaker|larger smaller|bigger smaller|expand contract|expands contracts|expansion contraction|appreciate depreciate|appreciates depreciates|appreciation depreciation|always never|buy sell|buys sells|buying selling|bought sold|inflow outflow|inflows outflows|surplus deficit|cheaper dearer|cheaper costlier|safer riskier|longer shorter|overstates understates|overvalued undervalued|import export|imports exports|most least|near far|nearer farther|nearest farthest|closer farther';
const SA_ROLE='lender borrower|lenders borrowers|saver borrower|savers borrowers|asset liability|assets liabilities|buyer seller|buyers sellers|creditor debtor|creditors debtors|principal agent|nominal real|importer exporter|importers exporters|numerator denominator';
const SA_NEG=new Set('not no never none nothing nobody neither nor cannot cant dont doesnt didnt isnt arent wasnt werent wont wouldnt shouldnt couldnt hasnt havent hadnt mustnt'.split(' '));
const SA_JOIN=new Set('and or the a an of to'.split(' '));
let saOppSrc,saOppMap,saRoleMap;
function saPairs(){const src=typeof COURSE!=='undefined'&&isObj(COURSE)&&isObj(COURSE.opposites)?COURSE.opposites:null;if(saOppMap&&saOppSrc===src)return[saOppMap,saRoleMap];
  const mk=()=>new Map(),add=(m,a,b)=>{a=norm(a);b=norm(b);if(!a||!b||a===b||a.includes(' ')||b.includes(' '))return;(m.get(a)||m.set(a,new Set()).get(a)).add(b);(m.get(b)||m.set(b,new Set()).get(b)).add(a)};
  const O=mk(),R=mk();SA_DIR.split('|').forEach(p=>{const[a,b]=p.split(' ');add(O,a,b)});SA_ROLE.split('|').forEach(p=>{const[a,b]=p.split(' ');add(O,a,b);add(R,a,b)});
  if(src)Object.keys(src).forEach(k=>{if(typeof src[k]==='string')add(O,k,src[k])});
  saOppSrc=src;saOppMap=O;saRoleMap=R;return[O,R]}
function markSA(it,ans){const keys=gradeSA(it,ans),res=(flag,note)=>({ok:keys&&!flag,keys,flag:flag||'',note:note||''});if(!keys)return res();
  const[O,R]=saPairs(),toks=x=>norm(String(x).replace(/n['\u2019]t\b/gi,' not').replace(/\bcannot\b/gi,'can not')).split(' ').filter(Boolean);
  const canon=w=>O.has(w)?w:w.length>3&&w.endsWith('s')&&O.has(w.slice(0,-1))?w.slice(0,-1):w;
  const A=toks(ans).map(canon),M=toks(it.m).map(canon),As=new Set(A),Ms=new Set(M);
  const neg=l=>l.filter(w=>SA_NEG.has(w)).length,nA=neg(A),nM=neg(M);
  if(nA>nM){const w=(String(ans).match(/\b(?:\w+n['\u2019]t|cannot|not|no|never|none|nothing|nobody|neither|nor)\b/i)||[])[0]||'not';return res('negation',`you wrote "${w}" and the model answer ${nM?'has fewer negatives':'has none'}. Check that yours does not say the opposite`)}
  // a word of the model said fewer times, and its opposite more times, than in the model ("payments fall when rates rise")
  const cnt=l=>l.reduce((m,w)=>m.set(w,(m.get(w)||0)+1),new Map()),cA=cnt(A),cM=cnt(M),c=(m,w)=>m.get(w)||0;
  for(const w of Ms){const os=O.get(w);if(!os||c(cA,w)>=c(cM,w))continue;for(const o of os)if(c(cA,o)>c(cM,o))return res('opposite',`you wrote "${o}" where the model says "${w}"`)}
  // a role pair named in the model in one order and in the answer in the other. "borrower and lender" is a plain list, so it is let through.
  const listed=(L,i,j)=>{const a=Math.min(i,j),b=Math.max(i,j);return L.slice(a+1,b).every(x=>SA_JOIN.has(x))};
  // every pair whose two halves are in both the model and the answer
  const both=[];for(const[w,os]of O)for(const o of os)if(w<o&&M.includes(w)&&M.includes(o)&&A.includes(w)&&A.includes(o))both.push([w,o]);
  // a role pair alone in the sentence: its order is the meaning ("nominal GDP divided by real GDP"). With a second pair beside it the crossing check below decides.
  for(let i=0;i<M.length;i++){const os=R.get(M[i]);if(!os)continue;for(const o of os){const j=M.indexOf(o,i+1);if(j<0||listed(M,i,j))continue;
    if(both.some(q=>!(q.includes(M[i])&&q.includes(o))))continue;
    const ai=A.indexOf(M[i]),aj=A.indexOf(o);if(ai>=0&&aj>=0&&aj<ai&&!listed(A,ai,aj))return res('order',`"${M[i]}" and "${o}" are the other way round from the model`)}}
  // two pairs that go together in the model (near ... most, far ... least) and are crossed in the answer (far ... most, near ... least)
  const dir=(L,[w,o])=>Math.sign(L.indexOf(w)-L.indexOf(o));
  for(let i=0;i<both.length;i++)for(let j=i+1;j<both.length;j++){const p=both[i],q=both[j];if(p.includes(q[0])||p.includes(q[1]))continue;
    if(dir(M,p)*dir(M,q)!==dir(A,p)*dir(A,q))return res('order',`"${p[0]}" and "${p[1]}" are matched with "${q[0]}" and "${q[1]}" the other way round from the model`)}
  if(A.length<=2&&M.length>=6)return res('thin','yours is very short. Check that it carries the whole idea');
  return res()}

/* ── the course registry ───────────────────────────────────────────────────────
   Every unit of content registers itself with BOOK.add({...}). See the TEMPLATE GUIDE.
   A course may be written by a person or by a machine, so nothing is taken on trust. What is malformed is repaired
   where the meaning is plain, dropped where it is not, and written down in BOOK.bad for the validator to report.
   The engine therefore only ever meets units that are safe to run. Well-formed content passes through untouched. */
const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x),isText=x=>typeof x==='string'&&x.trim()!=='',textish=x=>isText(x)||(typeof x==='number'&&isFinite(x));
// a calc generator that throws, or returns something that is not a question, must not stop a session: a stand-in takes its place
const safeCalc=f=>{const g=()=>{let r,why='';try{r=f()}catch(e){why='the generator threw: '+(e&&e.message||e)}

/* ══════════════════════════════════════════════════════════════════════════════
   CORE · 3 · MEMORY  —  spaced repetition
   A three-number model of each thing you know (the FSRS family of schedulers):
     stability  s   days until the chance of recalling it falls to 90%
     difficulty d   1 (easy) .. 10 (hard); hard items gain stability more slowly
     retrievability  the chance you could recall it right now, from s and the time since the last review
   Every answer anywhere in the app is a grade: 1 again · 2 hard · 3 good · 4 easy.
   A right answer after a long, nearly-forgotten gap strengthens a memory far more than one made while it is fresh,
   which is why reviews are spaced out further each time: 3 days, 11, 35, 100, 270...
   ══════════════════════════════════════════════════════════════════════════════ */
const MEM=(()=>{
  const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
  const DECAY=-0.5,FACTOR=19/81,DAY=1440;                      // time is kept in whole minutes
  const cD=d=>Math.min(10,Math.max(1,d)),r2=x=>Math.round(x*100)/100;
  const S0=g=>W[g-1];
  const D0=g=>cD(W[4]-Math.exp(W[5]*(g-1))+1);
  const nextD=(d,g)=>cD(W[7]*D0(4)+(1-W[7])*(d-W[6]*(g-3)*(10-d)/9));
  const recallS=(d,s,r,g)=>s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
  const forgetS=(d,s,r)=>Math.min(s,W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-r)));
  const shortS=(s,g)=>s*Math.exp(W[17]*(g-3+W[18]));
  const R=(days,s)=>Math.pow(1+FACTOR*Math.max(0,days)/s,DECAY);
  let warp=0;                                                  // minutes added to the clock (the hidden `warp` command, for testing)
  const now=()=>Math.floor(Date.now()/60000)+warp;
  // chance of recalling this right now, 0..1
  const retr=(m,t)=>!m||!m.s?0:R(((t==null?now():t)-m.t)/DAY,m.s);
  // days to wait so that recall will have fallen to the target retention
  const ivl=(s,ret,maxDays)=>clamp(Math.round(s/FACTOR*(Math.pow(ret||.9,1/DECAY)-1)),1,maxDays||36500);
  /* next(m, grade, t, {retention, maxDays, fuzz}) → the new record. m may be null (never seen). */
  function next(m,g,t,o={}){
    t=t==null?now():t;let s,d,st,l=m?m.l||0:0,n=(m?m.n||0:0)+1,due;
    if(!m||!m.st){s=S0(g);d=D0(g);st=g>=3?2:1}
    else{const el=(t-m.t)/DAY;d=nextD(m.d,g);
      if(m.st===2&&el>=.5){const r=R(el,m.s);if(g===1){s=forgetS(m.d,m.s,r);l++;st=3}else{s=recallS(m.d,m.s,r,g);st=2}}
      else if(m.st===2){if(g===1){s=forgetS(m.d,m.s,R(el,m.s));l++;st=3}else return{s:m.s,d:m.d,t:m.t,due:m.due,n,l,st:2}}   // recalled again the same day: nothing durable is gained, so the schedule stands (ten repeats must not add up to months)
      else{s=shortS(m.s,g);st=g===1?m.st:g===2?m.st:2}}                                                   // learning steps
    s=clamp(s,.02,36500);
    if(g===1)due=t+(st===3?10:1);
    else if(g===2&&st!==2)due=t+6;
    else{let days=ivl(s,o.retention,o.maxDays);if(o.fuzz!==false&&days>=4)days=Math.max(2,Math.round(days*(.95+Math.random()*.1)));due=t+days*DAY}
    return{s:r2(s),d:r2(d),t,due,n,l,st}}
  // what each of the four grades would do to the wait, in minutes: shown on the flashcard buttons
  const preview=(m,t,o={})=>[1,2,3,4].map(g=>{t=t==null?now():t;return next(m,g,t,Object.assign({},o,{fuzz:false})).due-t});
  /* how well it is known, 0..5 */
  const stage=m=>!m||!m.st?0:(m.st!==2||m.s<2)?1:m.s<10?2:m.s<45?3:m.s<180?4:5;
  const STAGES=[['new','·'],['learning','░'],['familiar','▒'],['solid','▓'],['mastered','█'],['locked in','★']];
  const pack=m=>[m.s,m.d,m.t,m.due,m.n,m.l,m.st],unpack=a=>a?{s:a[0],d:a[1],t:a[2],due:a[3],n:a[4],l:a[5],st:a[6]}:null;
  const span=min=>{if(min<1)return'now';if(min<60)return Math.round(min)+'m';if(min<DAY)return Math.round(min/60)+'h';const d=min/DAY;return d<30?Math.round(d)+'d':d<365?(d/30).toFixed(d<90?1:0)+'mo':(d/365).toFixed(1)+'y'};

})();

/* ── everything reviewable in a course has a stable id ───────────────────────────
     q:<unit>.<module>.<section>.<i>    a checkpoint question
     sa:<unit>.<module>.<section>.<i>   a short answer
     ln:<unit>.<module>.<section>       the section's key line (asked as a fill-the-gap)
     t:<unit>.<term>                    a glossary term
     calc:<unit>.<i>                    a calculation generator (fresh numbers every time)
     u:<deck>.<card>                    one of your own flashcards                                   */
const ITEMS={
  ofUnit(c){const out=[];c.modules.forEach((m,mi)=>m.secs.forEach((s,si)=>{const p=c.n+'.'+mi+'.'+si;
      (s.q||[]).forEach((_,i)=>out.push({id:'q:'+p+'.'+i,kind:'q',ch:c.n,mi,si,i}));
      (s.sa||[]).forEach((_,i)=>out.push({id:'sa:'+p+'.'+i,kind:'sa',ch:c.n,mi,si,i}));
      if(s.line)out.push({id:'ln:'+p,kind:'ln',ch:c.n,mi,si})}));
    c.gloss.forEach(g=>out.push({id:'t:'+c.n+'.'+g.n,kind:'t',ch:c.n,term:g.n}));
    (c.calc||[]).forEach((_,i)=>out.push({id:'calc:'+c.n+'.'+i,kind:'calc',ch:c.n,i}));return out},
  ofSection(c,mi,si){const s=c.modules[mi].secs[si],p=c.n+'.'+mi+'.'+si,out=[];
    (s.q||[]).forEach((_,i)=>out.push('q:'+p+'.'+i));(s.sa||[]).forEach((_,i)=>out.push('sa:'+p+'.'+i));if(s.line)out.push('ln:'+p);return out},
  // id → the thing itself
  get(id){const k=id.indexOf(':'),kind=id.slice(0,k),rest=id.slice(k+1);
    if(kind==='u')return{id,kind};
    if(kind==='t'){const d=rest.indexOf('.'),c=BOOK.ch[rest.slice(0,d)],g=c&&c.gloss.find(x=>x.n===rest.slice(d+1));return g?{id,kind,c,g,ch:c.n}:null}
    const p=rest.split('.').map(Number),c=BOOK.ch[p[0]];if(!c)return null;
    if(kind==='calc')return c.calc&&c.calc[p[1]]?{id,kind,c,ch:c.n,i:p[1],gen:c.calc[p[1]]}:null;
    const m=c.modules[p[1]],s=m&&m.secs[p[2]];if(!s)return null;
    if(kind==='ln')return s.line?{id,kind,c,ch:c.n,mi:p[1],si:p[2],sec:s,line:s.line}:null;
    const it=(kind==='q'?s.q:s.sa||[])[p[3]];return it?{id,kind,c,ch:c.n,mi:p[1],si:p[2],i:p[3],sec:s,it}:null}
};

/* ── the section where each glossary term is first said in bold ──────────────── */
const termMatches=(bold,term,alias)=>{const t=String(bold).toLowerCase(),n=term.toLowerCase();return (alias&&alias[t]===term)||t===n||t===n+'s'||(' '+t+' ').includes(' '+n+' ')};
function termHomes(c,alias){if(c._homes)return c._homes;const H={};c.modules.forEach((m,mi)=>m.secs.forEach((s,si)=>s.beats.forEach(b=>{if(!Array.isArray(b))return;
    b.forEach(p=>{for(const x of String(p).matchAll(/\*([^*]+)\*/g))for(const g of c.gloss)if(!H[g.n]&&termMatches(x[1],g.n,alias))H[g.n]=[mi,si]})})));return c._homes=H}

/* ── questions made automatically, so every unit can be drilled even if it only has a glossary ── */
const STOP=new Set('the a an and or but of to in on for with by at from is are was were be been being it its that this these those as than then so not no can cannot will would should must may might have has had do does did you your they them their we our us more less most much many when which what who whom how why if because into over under about only also each every all any some such both between through out up down off per one two there here very just like get gets made make makes use uses used take takes'.split(' '));
// a key line with one meaningful word removed; `variant` chooses which, so the gap moves from review to review
function clozeOf(line,variant){const ws=String(line).split(/\s+/),cand=[],bare=w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');
  ws.forEach((w,i)=>{const k=w.toLowerCase().replace(/[^\p{L}\p{N}'-]/gu,'');if([...k].length>=4&&!STOP.has(k))cand.push(i)});
  if(!cand.length)ws.forEach((w,i)=>{if([...w.replace(/[^\p{L}\p{N}]/gu,'')].length>=3)cand.push(i)});if(!cand.length)return null;
  const i=cand[(variant||0)%cand.length],a=bare(ws[i]);
  return{text:ws.map((w,k)=>k===i?w.replace(a,'_____'):w).join(' '),a,n:cand.length,others:uniq(cand.filter(k=>k!==i).map(k=>bare(ws[k])))}}
// hide a term inside its own definition, so the definition can be used as a clue
const maskTerm=(def,term)=>{const esc2=String(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),isW=c=>!!c&&LN.test(c);
  return String(def).replace(new RegExp(esc2+'(s|es)?','giu'),(m,suf,off,str)=>isW(str[off-1])||isW(str[off+m.length])?m:m.replace(/[\p{L}\p{N}]/gu,'▒'))};
// three wrong terms for a right one: related terms first (they make the better trap), then others from the unit, then the rest of the course
function termRivals(c,g,n=3){const out=[],add=x=>{if(x&&x.n!==g.n&&!out.some(y=>norm(y.n)===norm(x.n))&&norm(x.n)!==norm(g.n))out.push(x)};
  shuffle(g.see||[]).forEach(s=>add(c.gloss.find(x=>x.n===s)));shuffle(c.gloss).forEach(add);
  if(out.length<n)Object.values(BOOK.ch).forEach(o=>o!==c&&shuffle(o.gloss).forEach(add));return out.slice(0,n)}
const termQ=(c,g,dir)=>dir==='t2d'?mc(`What is meant by "${g.n}"?`,[g.d,...termRivals(c,g).map(x=>x.d)],g.ex?'e.g. '+g.ex:''):mc('Which term is this?  '+maskTerm(g.d,g.n),[g.n,...termRivals(c,g).map(x=>x.n)],g.ex?'e.g. '+g.ex:'');
// true/false statements made from the glossary: half pair a term with its own definition, half with a rival's
function termTF(c,g){const lie=Math.random()<.5,r=lie?termRivals(c,g,1)[0]:null;if(lie&&!r)return termTF2(g);
  return{t:'tf',q:`"${g.n}" means: ${maskTerm(lie?r.d:g.d,lie?r.n:g.n)}`,a:!lie,why:lie?`That describes ${r.n}. ${cap1(g.n)}: ${g.d}`:(g.ex?'e.g. '+g.ex:''),term:g.n}}
const termTF2=g=>({t:'tf',q:`"${g.n}" means: ${maskTerm(g.d,g.n)}`,a:true,why:g.ex?'e.g. '+g.ex:'',term:g.n});
// things that happen in a fixed order, found in the figures a unit already has: timelines, chains, cycles, sequences
function orderSets(c){const out=[];c.modules.forEach((m,mi)=>m.secs.forEach((s,si)=>s.beats.forEach(b=>{if(Array.isArray(b)||!b.a||!b.a[0])return;const o=b.a[0];let items=null;
    if(b.fig==='events'&&o.events)items=o.events.map(e=>e[1]);
    else if((b.fig==='chain'||b.fig==='cycle')&&o.nodes)items=o.nodes.slice();
    else if(b.fig==='stack'&&o.layers)items=o.layers.map(l=>l[0]);
    if(items&&items.length>=3&&items.length<=7&&uniq(items.map(norm)).length===items.length)out.push({title:o.title||s.h,items,ch:c.n,mi,si,sec:s.h})})));return out}

/* ══════════════════════════════════════════════════════════════════════════════
   CORE · 4 · CARDS  —  reading flashcards out of almost any text, and writing them back
   CARDS.parse(text, {mode, swap}) → {decks:[{name, cards:[{f, b, h?}]}], format, note}
   Understands: tab / comma / semicolon separated rows (quoted fields too), "term - definition" lines,
   "term: definition", "term :: definition", Q:/A: blocks, blank-line separated blocks, markdown tables,
   Anki text exports (with their # header lines), {{cloze}} sentences, and JSON in several shapes.
   ══════════════════════════════════════════════════════════════════════════════ */
const CARDS=(()=>{
  const ENT={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' '};
  const strip=h=>String(h).replace(/<br\s*\/?>|<\/(div|p|li)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&(#\d+|#x[0-9a-f]+|\w+);/gi,(m,e)=>{if(e[0]!=='#')return ENT[e.toLowerCase()]||m;try{return String.fromCodePoint(e[1]==='x'||e[1]==='X'?parseInt(e.slice(2),16):+e.slice(1))}catch(x){return m}}).replace(/\n{3,}/g,'\n\n').trim();
  const clean=s=>String(s==null?'':s).replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').trim();
  // rows of a delimited text; fields may be "quoted" and may then hold the separator, new lines and "" for a quote
  function rows(text,sep,lit){const out=[];let row=[],f='',q=false,i=0,qi=-1;const T=text;lit=lit||new Set();
    while(i<T.length){const c=T[i];
      if(q){if(c==='"'){if(T[i+1]==='"'){f+='"';i+=2;continue}q=false;i++;continue}f+=c;i++;continue}
      if(c==='"'&&f===''&&!lit.has(i)){q=true;qi=i;i++;continue}
      if(T.startsWith(sep,i)){row.push(f);f='';i+=sep.length;continue}
      if(c==='\n'){row.push(f);out.push(row);row=[];f='';i++;continue}
      f+=c;i++}
    if(q&&lit.size<200){lit.add(qi);return rows(text,sep,lit)}        // that quote never closed: read it as an ordinary character and start again
    row.push(f);out.push(row);return out.filter(r=>r.some(x=>x.trim()))}
  const HEAD=/^(front|back|term|terms|definition|definitions|question|answer|q|a|word|meaning|prompt|response|key|value|hint|tags?|example|concept|description)$/i;
  const KF=['front','f','term','q','question','word','prompt','key','name','n','concept','title'],KB=['back','b','definition','a','answer','meaning','response','value','d','description','def','text'],KH=['hint','h','example','ex','note','notes','extra'];
  const pickKey=(o,keys)=>{const m={};Object.keys(o).forEach(k=>m[k.toLowerCase()]=k);for(const k of keys)if(m[k]!=null&&o[m[k]]!=null&&typeof o[m[k]]!=='object')return String(o[m[k]]);return null};
  const card=(f,b,h)=>({f:clean(f),b:clean(b),h:clean(h||'')});
  function fromList(a){const out=[];for(const x of a){
      if(Array.isArray(x)){if(x.length)out.push(card(x[0],x[1],x[2]))}
      else if(x&&typeof x==='object'){if(Array.isArray(x.fields))out.push(card(strip(x.fields[0]||''),strip(x.fields[1]||''),strip(x.fields[2]||'')));else{const f=pickKey(x,KF),b=pickKey(x,KB);if(f!=null||b!=null)out.push(card(f||'',b||'',pickKey(x,KH)))}}
      else if(typeof x==='string'){const p=splitFirst(x,[' :: ','::','\t',' — ',' – ',' - ',': ','=']);out.push(card(p[0],p[1]||''))}}
    return out}
  function fromJSON(v){
    if(Array.isArray(v))return[{name:'',cards:fromList(v)}];
    if(v&&typeof v==='object'){
      if(Array.isArray(v.decks))return v.decks.map(d=>({name:String(d.name||d.title||''),cards:fromList(d.cards||d.notes||[])}));
      const list=v.cards||v.notes||v.items||v.terms||v.flashcards;
      if(Array.isArray(list))return[{name:String(v.name||v.title||''),cards:fromList(list)}];
      const ks=Object.keys(v);if(ks.length&&ks.every(k=>typeof v[k]==='string'||typeof v[k]==='number'))return[{name:'',cards:ks.map(k=>card(k,v[k]))}]}
    return null}
  const splitFirst=(line,seps)=>{for(const s of seps){const i=line.indexOf(s);if(i>0)return[line.slice(0,i),line.slice(i+s.length)]}return[line]};
  // the separators we look for in plain lines, most specific first
  const SEPS=[['tab','\t'],['dcolon','::'],['emdash',' — '],['endash',' – '],['dash',' - '],['semicolon',';'],['pipe','|'],['arrow','=>'],['arrow2','->'],['equals',' = '],['colon',': '],['comma',',']];
  function sniff(lines){let best=null;for(const[name,sep]of SEPS){const hit=lines.filter(l=>l.indexOf(sep)>0&&l.indexOf(sep)<l.length-sep.length).length,cov=hit/lines.length;if(cov>=.7)return name;if(cov>=.5&&(!best||cov>best[1]))best=[name,cov]}return best?best[0]:null}
  const QA=/^\s*(q|question|front|term|prompt)\s*\d*\s*[:.)]\s*/i,AA=/^\s*(a|answer|back|definition|response)\s*\d*\s*[:.)]\s*/i;
  function parse(text,o={}){
    let T=String(text||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');const mode=o.mode||'auto',res=(cards,format,note,name)=>finish([{name:name||'',cards}],format,note,o);
    if(!T.trim())return{decks:[],format:'empty',note:'Nothing to read yet.'};
    // JSON
    if((mode==='auto'||mode==='json')&&/^\s*[\[{]/.test(T)){try{const d=fromJSON(JSON.parse(T));if(d&&d.some(x=>x.cards.length))return finish(d,'json','',o)}catch(e){if(mode==='json')return{decks:[],format:'json',note:'That is not valid JSON: '+e.message}}}
    // Anki-style header lines
    let sepHint=null,html=false,skip=new Set();const body=[];
    for(const l of T.split('\n')){const m=/^#\s*(separator|html|tags|columns|notetype|deck|guid)(?:\s+column)?\s*:\s*(.*)$/i.exec(l);
      if(m&&body.length===0){const k=m[1].toLowerCase().trim(),v=m[2].trim().toLowerCase();if(k==='separator')sepHint={tab:'\t',comma:',',semicolon:';',pipe:'|',space:' ',colon:':'}[v]||(v.length===1?v:null);else if(k==='html')html=v==='true';else if(/^(notetype|deck|tags|guid)$/.test(k)&&+v)skip.add(+v-1);continue}
      body.push(l)}
    T=body.join('\n');const lines=T.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length)return{decks:[],format:'empty',note:'Nothing to read yet.'};
    const H=s=>html?strip(s):s;
    // cloze sentences
    if(mode==='cloze'||(mode==='auto'&&lines.filter(l=>/\{\{.+?\}\}/.test(l)).length>=lines.length*.6)){
      const gap=lines.filter(l=>/\{\{.+?\}\}/.test(l)),rest=lines.length-gap.length;
      return res(gap.map(l=>{const hid=[];const f=H(l).replace(/\{\{(?:c\d+::)?(.+?)(?:::(.+?))?\}\}/g,(m,a,hint)=>{hid.push(a);return hint?'['+hint+']':'[...]'});return card(f,hid.join(', '))}),'cloze','Each {{hidden}} part became a gap.'+(rest?' '+rest+' line'+(rest>1?'s':'')+' with no {{gap}} '+(rest>1?'were':'was')+' left out.':''))}
    // Q: / A: blocks
    if(mode==='qa'||(mode==='auto'&&lines.filter(l=>QA.test(l)).length>=1&&lines.filter(l=>AA.test(l)).length>=1&&lines.filter(l=>QA.test(l)||AA.test(l)).length>=lines.length*.5)){
      const out=[];let cur=null,side='';for(const l of T.split('\n')){if(QA.test(l)){if(cur)out.push(cur);cur={f:l.replace(QA,''),b:''};side='f'}else if(AA.test(l)&&cur){cur.b=l.replace(AA,'');side='b'}else if(cur&&l.trim())cur[side]+='\n'+l.trim()}
      if(cur)out.push(cur);return res(out.map(c=>card(H(c.f),H(c.b))),'qa','Read as question / answer pairs.')}
    // markdown table
    if(mode==='auto'&&lines.filter(l=>l.startsWith('|')).length>=lines.length*.8&&lines.some(l=>/^\|?\s*:?-{2,}/.test(l))){
      const rs=lines.filter(l=>!/^\|?\s*:?-{2,}[\s:|-]*$/.test(l)).map(l=>l.replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));return res(table(rs,skip,H,o),'table','Read as a table.')}
    // rows whose "quoted fields" run over several lines (a spreadsheet, an Anki export, this app's own export): counting lines would mislead
    if(mode==='auto'&&!sepHint&&T.includes('\t')&&/(^|[\t\n])"/.test(T)){const r=rows(T,'\t');if(r.length&&r.filter(x=>x.length>=2).length>=r.length*.7)return res(table(r,skip,H,o),'tab','')}
    // separated rows
    const named={tab:'tab',comma:'comma',semicolon:'semicolon',dash:'dash',colon:'colon',pipe:'pipe'}[mode];
    let kind=named||(sepHint?'hint':null)||(mode==='auto'?sniff(lines):null);
    if(mode==='alt'){const out=[];for(let i=0;i+1<lines.length;i+=2)out.push(card(H(lines[i]),H(lines[i+1])));return res(out,'alt','Odd lines are fronts, even lines are backs.')}
    if(mode==='blocks'||(mode==='auto'&&!kind)){const bl=T.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
      if(mode==='blocks'||(bl.length>=2&&bl.filter(b=>b.includes('\n')).length>=bl.length*.6))return res(bl.map(b=>{const i=b.indexOf('\n');return i<0?card(H(b),''):card(H(b.slice(0,i)),H(b.slice(i+1)))}),'blocks','Read as blocks: first line is the front, the rest is the back.')}
    if(!kind)return res(lines.map(l=>card(H(l),'')),'lines','I could not find a separator, so each line became a card with an empty back. Pick how your text is laid out below.');
    const sep=kind==='hint'?sepHint:(SEPS.find(s=>s[0]===kind)||[])[1];
    const quoted=(sep===','||sep===';')&&new RegExp('(^|\\n|\\'+sep+')[ \\t]*"').test(T);      // "a field", in quotes: only then is it real CSV
    let rs;if(sep==='\t'||quoted)rs=rows(T,sep);else rs=lines.map(l=>{if(sep==='\t')return l.split('\t');return splitFirst(l,kind==='dash'?[' — ',' – ',' - ']:[sep])});
    return res(table(rs,skip,H,o),kind==='hint'?'anki':kind,'')}
  function table(rs,skip,H,o){let R=rs.map(r=>r.filter((_,i)=>!skip.has(i)).map(x=>H(String(x)).trim()));
    if(R.length>1&&R[0].length>=2&&R[0].slice(0,2).every(x=>HEAD.test(x))&&o.header!==false)R=R.slice(1);
    return R.map(r=>card(r[0],r[1]||'',r[2]||''))}
  function finish(decks,format,note,o){let dropped=0,cut=0;decks.forEach(d=>{const seen=new Set();d.cards=d.cards.map(c=>o.swap?{f:c.b,b:c.f,h:c.h}:c).filter(c=>{const k=c.f+'\u0001'+c.b;if(!c.f||seen.has(k)){dropped++;return false}seen.add(k);return true}).map(c=>{if(c.f.length>2000||c.b.length>4000||(c.h||'').length>500)cut++;return{f:c.f.slice(0,2000),b:c.b.slice(0,4000),h:(c.h||'').slice(0,500)}})});
    decks=decks.filter(d=>d.cards.length);const n=sum(decks.map(d=>d.cards.length)),nb=sum(decks.map(d=>d.cards.filter(c=>!c.b).length));

  const cell=s=>/["\t\n]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':s;

  const toJSON=(decks,app)=>JSON.stringify({app:app||'terminal-tutor',kind:'decks',v:1,decks:decks.map(d=>({name:d.name,cards:d.cards.map(c=>c.h?{f:c.f,b:c.b,h:c.h}:{f:c.f,b:c.b})}))},null,1);
  return{parse,toTSV,toJSON,strip,rows};
})();

/* ── arithmetic you can type anywhere a number is wanted: 48*226-10000, 100/1.05^2, sqrt(2), 5% ── */
function calcExpr(src){
  if(/[\d.)%]\s+[\d.(]/.test(String(src==null?'':src)))return NaN;              // "2 3" is two numbers, not one
  let s=String(src==null?'':src).toLowerCase().replace(/[\s$,_]/g,'').replace(/[×·]|x(?=[\d(.-])/g,'*').replace(/÷/g,'/').replace(/\*\*/g,'^').replace(/[−–]/g,'-'),i=0;
  const F={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs,round:Math.round},K={pi:Math.PI,e:Math.E};
  const fail=()=>{throw 0},peek=()=>s[i];
  const prim=()=>{if(peek()==='('){i++;const v=expr();if(peek()!==')')fail();i++;return v}
    const m=/^(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/.exec(s.slice(i));if(m){i+=m[0].length;let v=parseFloat(m[0]);const u=s[i];if((u==='k'||u==='m'||u==='b')&&!/[a-z]/.test(s[i+1]||'')){v*={k:1e3,m:1e6,b:1e9}[u];i++}return v}
    const id=/^[a-z]+/.exec(s.slice(i));if(id){i+=id[0].length;if(F[id[0]]){if(peek()!=='(')fail();i++;const v=expr();if(peek()!==')')fail();i++;return F[id[0]](v)}if(id[0] in K)return K[id[0]]}fail()};
  const post=()=>{let v=prim();while(peek()==='%'){v/=100;i++}return v};
  const unary=()=>peek()==='-'?(i++,-unary()):peek()==='+'?(i++,unary()):pow();
  const pow=()=>{const b=post();if(peek()==='^'){i++;return Math.pow(b,unary())}return b};

/* ══════════════════════════════════════════════════════════════════════════════
   CORE · 6 · A COURSE AS TEXT
   A course normally lives in the page's  script id="course"  block. It can also arrive as text pasted into the
   running app (type  courses ). What people paste is rarely just the code: it may be a whole page, sit inside
   ``` fences with a sentence before and after, or still carry its script tag. courseText() finds the code in it.
   ══════════════════════════════════════════════════════════════════════════════ */
const CORE_FIGS=Object.keys(FIG),CORE_TPLS=Object.keys(TPL);   // the figures that belong to the engine; any others belong to a course
function courseText(raw){let t=String(raw==null?'':raw).replace(/\r\n?/g,'\n').replace(/[​﻿]/g,'');
  const looks=x=>/\bBOOK\s*\.\s*add\s*\(|\b(?:const|let|var)\s+COURSE\b/.test(x);
  const page=t.match(/<script\b[^>]*\bid\s*=\s*["']?course["']?[^>]*>([\s\S]*?)<\/script\s*>/i);if(page)return page[1].trim();
  const fence=/(^|\n)[ \t]*```[^\n`]*\n([\s\S]*?)\n[ \t]*```[ \t]*(?=\n|$)/g,blocks=[...t.matchAll(fence)].map(m=>m[2]);
  // fences around the code are wrapping; fences inside the code (a lesson that shows a code sample) are content
  if(blocks.length&&!looks(t.replace(fence,'\n'))){const code=blocks.filter(looks);t=(code.length?code:blocks).join('\n\n')}
  else if(!blocks.length)t=t.replace(/^\s*```[^\n`]*\n/,'').replace(/\n[ \t]*```\s*$/,'');      // a fence that never closed: the reply was cut short
  return t.replace(/^\s*<script\b[^>]*>[ \t]*\n?/i,'').replace(/<\/script\s*>\s*$/i,'').trim()}
