modules:[

/* ------------------------------------------------ #49 */
{id:'49',year:1934,who:'Kaldor',title:'KALDOR 1934 · THE EQUILIBRIUM OF THE FIRM',secs:[
 {h:'What stops a competitive firm from growing?',beats:[
  ["March 1934, Economic Journal. Nicholas Kaldor asks a question the cost controversy kept dodging. A Marshallian supply curve needs perfect competition, which Kaldor defines as \"all prices are given to the individual firm\". It also needs a determinate long-run cost curve for each firm.","Under perfect competition only rising costs can stop a firm growing. So what makes the firm's long-run cost curve rise?"],
  ["His first complaint is about method. Since Marshall, writers have drawn firm cost curves to fit the industry's supply curve. The *representative firm* becomes a helper construction. The firm's equilibrium is made to depend on the industry's, when it should be the other way round."],
  {fig:'chain',a:[{title:'KALDOR ELIMINATES THE CANDIDATES',nodes:['INDIVIS.','EXTERNAL','RISK','SUPERVISE','CO-ORD'],caps:['indivisibilities: costs fall back to the same min','external diseconomies: hit all firms equally','uncertainty: joint-stock companies spread it','supervision: you can double the foremen','co-ordination: fixed for the firm. survives.'],end:'the one fixed factor is co-ordinating ability',token:'[x]'}]},
  ["Take the eliminations one at a time. *Indivisibilities* give a cost curve that dips and rises, but with all factors variable it falls again to the same minimum at larger outputs. Size is not limited. *External diseconomies* affect every firm alike. They explain rising industry costs, not why one firm's costs rise relative to the rest."],
  ["Then the *entrepreneurial function*. Kaldor splits it into uncertainty-bearing and management, and management into supervision and co-ordination. Supervision checks that contracts are carried out and can be divided. Co-ordination decides which contracts to make. Every decision must be compared with all others, so it \"must therefore pass through a single brain.\""],
  ["Hence his definition, worth writing verbatim in the exam: a firm is a \"productive combination possessing a given unit of co-ordinating ability\". Note the care: *co-ordinating ability* is fixed in supply to the firm, but fixity is not indivisibility."]],
  q:[mc("In Kaldor (1934), which factor is fixed for the firm even in the long run?",["Co-ordinating ability","Supervision of workers","Uncertainty-bearing","An indivisible piece of plant"],"Supervision can be divided, risk can be spread; co-ordination must pass through a single brain."),
     tf("True or false: Kaldor (1934) argued external diseconomies explain why one firm's long-run costs rise.",false,"External diseconomies hit all firms equally, so they cannot limit one firm relative to the industry."),
     mc("Why do indivisibilities fail to limit firm size under perfect competition (Kaldor 1934)?",["Costs fall back to the same minimum at larger outputs","Indivisible factors are always hired from outside","Indivisibilities only matter under monopoly","They raise all firms' costs equally"],"With every factor variable, a larger scale reproduces the same minimum cost.")],
  sa:[sa("How does Kaldor (1934) define a firm?","A productive combination with a given unit of co-ordinating ability.",[['co ordinat','coordinat'],['given','fixed','unit','one']]),
      sa("Why can't supervision be the fixed factor?","Supervision can be divided among many supervisors.",[['supervis','foremen','foreman'],['divid','divisib','double','many','increas','split']])],
  line:"co-ordination must pass through a single brain so it is fixed"},

 {h:'Co-ordination is dynamic, so static equilibrium kills perfect competition',beats:[
  ["Now the twist. Co-ordination is needed only to adjust the business to changing data. It is a feature of disequilibrium. As the firm settles down, the co-ordinating tasks shrink.","In Marshall's stationary state nothing changes, so co-ordination becomes a *free good*. Nothing then stops the firm growing. Its optimum size is infinite or indeterminate."],
  {fig:'plot',a:[{title:'LAC AS DATA SETTLE (sketch)',xl:'output of the firm',yl:'AC',xr:[1,20],yr:[2,6],curves:[{f:x=>2.4+5/x+0.2*x,ch:'L',name:'long-run AC of the firm'}],shift:{curve:0,to:{f:x=>2.4+5/x+0.005*x},cap:'stationary state: rising branch fades, size open'},cap:'in disequilibrium: co-ordination binds, AC rises',yf:v=>v===6?'high':'low'}]},
  {fig:'steps',a:[{title:'THE CHAIN OF THE ARGUMENT',lines:['perfect competition: firm size limited only by costs','rising long-run costs need a factor fixed to the firm','only candidate left: co-ordinating ability','co-ordination needed only to adjust to change','stationary state: co-ordination is a free good','so optimum size is infinite or indeterminate','static equilibrium + perfect competition: incompatible']}]},
  ["Write the conclusion this way: long-period static equilibrium and perfect competition are incompatible assumptions. There is a continual tendency for firms to grow, and their size depends on the degree of disequilibrium, not on the data.","Drop perfect competition and the falling demand curve limits size instead. But the cost curve stays partly indeterminate, mainly its rising section."],
  ["Kaldor is honest about the practical stakes. The effect is insignificant beside instability from money, price rigidities and trade. Like ripples on the sea, it is absorbed by the more powerful waves.","Report: accept. The referee notes the author proved his own result unimportant in practice."],
  ["Place it. It answers Marshall's representative firm (#08), Robbins (#34) and Robertson (#38). Robinson cites it in her Euler paper (#50); Kahn cites it (#59); Kaldor builds on it in #58. Coase's \"Nature of the Firm\" (1937) asks the same size question, but is not in your folder. Do not confuse #49 with the excess-capacity paper, #58."]],
  q:[mc("What does Kaldor (1934) conclude?",["Long-period static equilibrium and perfect competition are incompatible","Perfect competition always produces excess capacity","Firms are limited by external diseconomies in the long run","Monopoly is the normal condition of every industry"],"Co-ordination vanishes in a stationary state, so nothing limits the competitive firm."),
     fill("In a stationary state, co-ordinating ability becomes a ____ good (Kaldor 1934).",['free'],"It is needed only to adjust to change, so in a stationary state its marginal value is nil."),
     tf("True or false: Kaldor (1934) thought the indeterminacy from co-ordination was a major cause of real-world instability.",false,"He called it insignificant beside monetary and trade disturbances: ripples absorbed by waves.")],
  sa:[sa("Why is co-ordination essentially dynamic for Kaldor?","It is needed only to adjust to changing data.",[['adjust','change','disequilibri','dynamic'],['need','requir','only']]),
      sa("Under imperfect competition, what limits the firm's size?","The downward-sloping demand curve.",[['demand'],['slop','fall','down','curve']])],
  line:"static equilibrium and perfect competition are incompatible assumptions"}
]},

/* ------------------------------------------------ #50 */
{id:'50',year:1934,who:'Robinson',title:"ROBINSON 1934 · EULER'S THEOREM AND DISTRIBUTION",secs:[
 {h:'The adding-up problem, settled',beats:[
  ["September 1934, Economic Journal. Joan Robinson takes up an old puzzle, the *adding-up problem*: if every factor is paid its marginal product, is the total product exactly used up? Or is there a residue, or a deficit, left for the entrepreneur?","Wicksteed (1894) answered with Euler's theorem, which needs constant returns. Pareto, Walras and Edgeworth objected. Robinson closes the file."],
  ["Wicksteed's subtle error: to rule out increasing returns he defined factors so finely, each plough a factor, that marginal products of indivisible factors could not be defined. Of Hobson and Marshall she says each was right in what they assert and wrong in what they deny."],
  {fig:'table',a:[{title:'PROFITS AND RETURNS TO THE FIRM',head:['returns to the firm','profits'],rows:[['constant','zero'],['diminishing','positive'],['increasing','negative']],left:[0],note:'"we reach a self-evident conclusion" (p. 407)'}]},
  ["Under perfect competition, which here means infinitely elastic demand and factor supplies for the firm, with no reference to free entry or normal profits, zero profit puts the firm at minimum average cost. There physical returns are constant, and Euler holds. Positive normal profits mean just enough diminishing returns to yield them."],
  ["Imperfect competition. Factors earn their marginal product in value, MPP times marginal revenue. At zero profit average cost is tangent to a falling demand curve, so physical returns are increasing but returns *in value* are constant. Measured in value and outlay, the same table holds. \"The harmony between the economist\" and the mathematician is complete."],
  {fig:'steps',a:[{title:'AT THE LEVEL OF THE INDUSTRY',lines:["entrepreneur's marginal product to the industry =","  firm's output minus what its hired factors","  would produce dispersed among other firms","imperfect competition: hired factors get less","  than MPP valued at price","so entrepreneurs get MORE than their product","too many entrepreneurs: firms uneconomically small"]}]},
  ["Place it. Robinson cites Kaldor #49 on entrepreneurship as a factor. Kahn (#59) builds on the result that the entrepreneur earns more than his marginal product. Chamberlin (#63) attacks it: entrepreneurship is divisible, all factors get less than MPP times price, and there is no single exploiter."]],
  q:[mc("Robinson (1934, Euler): under perfect competition, profits are positive when returns to the firm are…",["Diminishing","Constant","Increasing","Equal to the rate of interest"],"Zero, positive, negative as returns are constant, diminishing, increasing."),
     mc("Under imperfect competition with constant physical returns to the industry, entrepreneurs receive…",["More than their marginal product, so firms are uneconomically small","Less than their marginal product, so firms are too large","Exactly their marginal product, as Wicksteed showed","Nothing, since profits are competed away"],"Hired factors get less than MPP times price; the entrepreneur keeps the excess."),
     tf("True or false: at a Chamberlin-style tangency, Robinson says returns are constant in value though increasing physically.",true,"Falling AC means increasing physical returns, but in value terms returns are constant at zero profit.")],
  sa:[sa("What is the adding-up problem?","Whether marginal-product payments exactly exhaust the total product.",[['marginal'],['exhaust','add','total','use up','used up']]),
      sa("Who builds on Robinson's Euler result in 1935?","Kahn, in Some Notes on Ideal Output.",[['kahn']],1)],
  line:"profits are zero positive or negative as returns are constant diminishing or increasing"}
]},

/* ------------------------------------------------ #53 */
{id:'53',year:1934,who:'Kaldor',title:"KALDOR 1934 · REVIEW OF ROBINSON'S IMPERFECT COMPETITION",secs:[
 {h:'A treatise on monopoly, and the imagined demand curve',beats:[
  ["August 1934, Economica. Kaldor reviews Robinson's 1933 book. Verdict in one phrase: it promises a theory of imperfect competition but \"inevitably becomes a treatise on monopoly\".","Why? It leaves out *duopoly*, the interaction of rivals' policies, and *marketing costs*. Those are the hallmarks of imperfect markets."],
  ["He praises what is there. The book is \"ultra-Marshallian\". Its best part is Books VII–IX on distribution. Kaldor adds that *monopsonistic exploitation* is worse than monopolistic: it distorts factor proportions and wastes resources technically. Collective bargaining can counter it by making labour supply horizontal to the firm."],
  ["Her \"industry\" assumes each producer's demand is equally sensitive to every price in the group. Not so. The village cigarette shop may be closer to the pub's beer than to the town's cigarettes."],
  {fig:'compare',a:[{left:{h:'REAL DEMAND CURVE',lines:['objective relation','depends on rivals','  reacting','indeterminate'],},right:{h:'IMAGINED DEMAND CURVE',lines:["in the producer's mind",'expected reactions','  built in','determinate']},note:'they need coincide only at the actual point'}]},
  ["So Kaldor introduces the *imagined demand curve*. Because it need match reality only at the price actually charged, ignorance can persist in equilibrium. Remember where this idea first appears: this review. He develops it in #58, and Kahn (#59) cites the review. Compare the American reviews in #54."]],
  q:[mc("Which two omissions led Kaldor to call Robinson's book a treatise on monopoly?",["Duopoly and marketing costs","Selling costs and price discrimination","Exploitation and the theory of rent","Time and money"],"Rival interaction and marketing costs are the hallmarks of imperfect markets."),
     tf("True or false: Kaldor's 'imagined demand curve' is indeterminate, while the real one is determinate.",false,"The reverse: the real curve is indeterminate when rivals react; the imagined one is determinate."),
     mc("Why is monopsonistic exploitation worse than monopolistic, per Kaldor 1934?",["It distorts factor proportions, causing technical waste","It lowers the price of the product","It cannot be countered by any policy","It only affects the entrepreneur"],"Collective bargaining can counter it by making labour supply horizontal.")],
  sa:[sa("What did Kaldor say Robinson's book becomes?","A treatise on monopoly.",[['monopol']],1),
      sa("What is an imagined demand curve?","The producer's own expected demand, given rivals' reactions.",[['producer','seller','firm','mind','expect','subjective','own'],['demand','sales']])],
  line:"robinson omits duopoly and marketing costs so it is about monopoly"}
]},

/* ------------------------------------------------ #54 */
{id:'54',year:1934,who:'Schumpeter (and Nichol)',title:'SCHUMPETER & NICHOL 1934 · REVIEWS OF ROBINSON',secs:[
 {h:'Master key, Marshallian core, and a world of monopolies',beats:[
  ["April 1934, Journal of Political Economy. One item, *two* reviews of Robinson's book: Schumpeter's, then a short one by A. J. Nichol. Exams like to ask which reviewer said what."],
  ["Schumpeter first. Perfect competition stays fundamental in theory because of its properties, not because facts conform to it or because it is desirable. Marginal revenue is \"the master key\" to a store of tools. It gives one *single price formula* for every case from perfect competition to monopoly."],
  {fig:'steps',a:[{title:"SCHUMPETER'S SINGLE PRICE FORMULA",lines:['price = MR x e / (e - 1)','e = elasticity of demand for the seller','e infinite: price = MR (perfect competition)','e = 2: price = 2 x MR (illustrative)','one formula, perfect competition to monopoly']}]},
  ["Then the sting: \"the book is Marshallian to the core\". Partial equilibrium, no Walras, little on time, money and the cycle. He calls the \"sensible manner\" assumption a definition of the unknown by the more unknown.","Nichol is harsher. The elasticity idea assumes other prices constant, which fails in \"A World of Monopolies\". That needs calculus and simultaneous equations, not plane geometry."],
  {fig:'compare',a:[{left:{h:'SCHUMPETER',lines:['MR = master key','one price formula','Marshallian to core','admirable textbook']},right:{h:'NICHOL',lines:['mostly pure monopoly','  and perfect comp.','geometry fails','use calculus']},note:'compare Kaldor #53: also "ultra-Marshallian"'}]},
  ["Place it. No reply in the set. Read it beside Kaldor's review (#53): all three reviewers find the book Marshallian. Nichol also wrote #55 on Chamberlin the same year."]],
  q:[mc("Which reviewer called Robinson's book 'Marshallian to the core'?",["Schumpeter","Nichol","Kaldor","Harrod"],"Schumpeter, JPE April 1934. Kaldor said 'ultra-Marshallian'."),
     mc("What did Nichol say Robinson's 'World of Monopolies' needed?",["Calculus and simultaneous equations, not plane geometry","More attention to selling costs","A theory of the representative firm","Empirical cost data from industry"],"Elasticity assumes other prices constant, which interdependent monopolies violate."),
     fill("Schumpeter's single formula: price = MR x e / (e - __).",['1','one'],"Price = marginal revenue times e/(e - 1).")],
  sa:[sa("Why, for Schumpeter, does perfect competition remain fundamental?","Because of its properties, not realism or desirability.",[['propert','background','comparison','benchmark']],1),
      sa("What unifies price theory, per Schumpeter?","Marginal revenue, the master key.",[['marginal revenue','mr']],1)],
  line:"schumpeter marginal revenue is the master key but the book is marshallian"}
]},

/* ------------------------------------------------ #55 */
{id:'55',year:1934,who:'Nichol',title:"NICHOL 1934 · CHAMBERLIN'S THEORY OF LIMITED COMPETITION",secs:[
 {h:'Does a far-sighted few reach the monopoly price?',beats:[
  ["February 1934, Quarterly Journal of Economics. A. J. Nichol tests Chamberlin's oligopoly theorem: if competition is limited to a far-sighted few, price tends to the pure monopoly level by independent action, not combination.","Be careful. This is *limited competition*: a few sellers of the same product. It is not the large-group tangency."],
  ["First, a side point on group B. Nichol says Cournot's theory makes sense only if buyers name prices, and Edgeworth's only if sellers name prices. Chamberlin's review of the two does not reach bedrock.","His main charge: the theorem comes from costless production. It also holds with constant total costs, constant unit costs, or identical increasing costs. Change the costs and it breaks."],
  {fig:'table',a:[{title:"NICHOL'S COUNTER-EXAMPLES",head:['cost case','monopoly','duopoly'],rows:[['costless (Chamberlin)','P','same P'],['decreasing variable cost','20','24'],['unequal rising costs','28','26']],left:[0],note:'duopoly can sit above OR below monopoly price'}]},
  ["Decreasing variable cost: a monopoly concentrates output in one plant and charges 20. Duopolists split the market and each maximises on half of it, so price is 24, above monopoly.","Unequal increasing costs: monopoly charges 28. Inefficient M wants 30, efficient N wants 26. N cuts, M must follow, so price is 26, below monopoly. Total profits fall from 13,500 to 12,000."],
  {fig:'steps',a:[{title:'FIGURE 1: ORDER OF PRICES (unequal costs)',lines:['P1  inefficient firm M would like (30)','Pm  joint monopoly price (28)','P2  efficient firm N enforces (26)','    = duopoly equilibrium','lowest: free competition, P = MC for both']}]},
  ["Verdict: Chamberlin's costless case is \"woefully unrepresentative\" of limited competition. The group's interest rarely equals each member's. Yet the book's terminology and technique are of \"permanent importance\".","Place it. Answers Chamberlin's 1929 duopoly paper and 1933 book (context). No reply in the set. Nichol also reviewed Robinson in #54."]],
  q:[mc("Nichol (1934): with decreasing variable costs, duopoly price compared with monopoly price is…",["Higher (24 vs 20)","Lower (26 vs 28)","Exactly equal","Equal to marginal cost"],"Monopoly uses one plant; each duopolist maximises on half the market."),
     tf("True or false: Nichol argued Chamberlin's theorem was derived from the case of costless production.",true,"He calls that case 'woefully unrepresentative'."),
     mc("With unequal increasing costs, why does duopoly price fall below monopoly price?",["The efficient firm prefers a lower price and can force its rival to follow","The inefficient firm floods the market","Buyers name the price, as in Cournot","Entry of new firms drives price down"],"N prefers 26, cuts, and M must match.")],
  sa:[sa("What does Chamberlin's oligopoly theorem claim?","A far-sighted few reach the monopoly price independently.",[['monopol'],['few','oligopol','duopol','far sighted','foresight']]),
      sa("Under which cost case did Chamberlin derive it, per Nichol?","Costless production.",[['costless','zero cost','no cost']],1)],
  line:"far-sighted duopolists reach monopoly price only when production is costless"}
]},

/* ------------------------------------------------ #56 */
{id:'56',year:1934,who:'Harrod',title:'HARROD 1934 · DOCTRINES OF IMPERFECT COMPETITION',secs:[
 {h:'Two long-period equilibria',beats:[
  ["May 1934, Quarterly Journal of Economics. Roy Harrod sums up what the new theory implies. Most sources of supply outside organised exchanges face a downward-sloping demand curve. Every producer of non-homogeneous goods is \"something of a monopolist\", and in equilibrium his elasticity of demand must exceed one."],
  ["Under perfect competition a source can never sit in a range of decreasing costs. If one more unit costs less and sells at no lower price, producing it pays even better. So output expands into rising costs. The long-period cost curve is the *envelope* of short-period curves, not the locus of their minima."],
  {fig:'compare',a:[{left:{h:'1. OPTIMUM LAY-OUT',lines:['plant at optimum size','price above AC','excess profits persist','entrant must cut price']},right:{h:'2. TANGENCY',lines:['entry easy','standard profits only','d tangent to falling AC','plant too small, idle']},note:'either way price is above the competitive level'}]},
  ["Equilibrium 1: if demand allows the optimum lay-out, price exceeds cost and excess profits persist. A newcomer would have to make substantial price concessions to win customers, so he stays out.","Equilibrium 2: if entry is easy and only the *standard rate of profit* is earned, demand is tangent to the falling long-period AC curve. The lay-out is below optimum size and worked below capacity."],
  {fig:'plot',a:[{title:'HARROD FIG. 7: THE TANGENCY (illustrative)',xl:'output',yl:'P',xr:[1,10],yr:[1,9],curves:[{f:x=>1+9/x+0.25*x,ch:'A',name:'LAC'},{f:x=>7-0.75*x,ch:'d',name:'demand'},{f:x=>7-1.5*x,ch:'r',name:'MR'},{f:x=>1+0.5*x,ch:'m',name:'LMC'}],eq:[0,1],eqf:(x,y)=>'P = AC at q = '+x.toFixed(1)+'; min AC at q = 6',cap:'MR = MC where d touches AC on its falling side',yf:v=>String(v)}]},
  ["Exam point: the *standard rate of profit* is the lowest rate that is an adequate inducement to invest in fixed equipment. That is what sits inside Harrod's cost curve at the tangency."]],
  q:[mc("Harrod (1934): with easy entry and only standard profits, the firm's plant is…",["Below optimum size and worked below capacity","At optimum size, earning excess profits","Beyond optimum size, on rising costs","At minimum average cost"],"Demand is tangent to the falling part of long-period AC."),
     tf("True or false: Harrod says excess profits can persist because entrants must make substantial price concessions.",true,"That is his first long-period equilibrium, at the optimum lay-out."),
     fill("For Harrod the long-period cost curve is the ________ of the short-period curves.",['envelope'],"Not the locus of their minima.")],
  sa:[sa("Name Harrod's two imperfect-competition equilibria.","Optimum lay-out with excess profits; tangency with under-used plant.",[['excess profit','optimum'],['tangen','under','sub optimal','too small','idle']]),
      sa("Define Harrod's standard rate of profit.","Lowest rate inducing investment in fixed equipment.",[['lowest','minimum','least'],['invest','induc','equipment']])],
  line:"easy entry gives tangency with too small and under-used plant"},

 {h:'A breach in laissez-faire, and the trade cycle',beats:[
  ["Welfare. Price measures marginal utility, but marginal revenue lies below price. Resources that earn equal marginal revenue in every use give equal marginal utility only if elasticities are equal. So imperfect competition distorts allocation away from the optimum."],
  {fig:'table',a:[{title:"HARROD'S TARIFF EQUIVALENTS",head:['elasticity of demand','distorts like a tariff of'],rows:[['3','50 per cent'],['6','20 per cent']],left:[0],note:'injury at least as great as the world\'s tariffs'}]},
  ["\"The doctrines of imperfect competition thus make a large breach\" in the defence of laissez-faire. The moral is not to restore perfect competition. Harrod sees a case for public wage-fixing and cautious compulsory rationalisation. Marketing expenses distort in the same way."],
  ["Factor markets. With a rising supply curve of a factor, *marginal outlay* exceeds the factor's price. Trade unions make the labour market more perfect by giving each firm a constant supply price, which improves allocation."],
  {fig:'steps',a:[{title:'THE TRADE-CYCLE APPLICATION',lines:['imperfect competition allows decreasing costs','decreasing-cost trades: total output unstable','Pigou\'s reciprocal-demand case assumes rising costs','so the psychological theory of the cycle','  needs no persistent error']}]},
  ["Place it. Harrod extends his own notes of 1930–33 (#41, #43, #45). Robinson (#57) shares his definition of perfect competition but says he slips in free entry. Harrod continues in #61. Compare Kaldor's excess-capacity critique (#58) and Kahn on welfare (#59)."]],
  q:[mc("Harrod likens a demand elasticity of 3 to a tariff of…",["50 per cent ad valorem","20 per cent ad valorem","3 per cent ad valorem","100 per cent ad valorem"],"Elasticity 6 corresponds to 20 per cent."),
     mc("Why does equalising marginal revenue across uses fail to reach the optimum (Harrod)?",["MR is below price, so equal MR means equal utility only if elasticities match","Marginal cost is always above marginal revenue","Firms cannot measure marginal revenue","Consumers prefer variety to cheapness"],"Price measures marginal utility; MR does not."),
     tf("True or false: Harrod argued trade unions make the labour market less perfect.",false,"Collective bargaining gives each firm a constant supply price: more perfect.")],
  sa:[sa("What does Harrod say imperfect competition breaches?","The defence of laissez-faire.",[['laissez','free market','non interven']],1),
      sa("Why do decreasing costs matter for the trade cycle?","They make equilibrium of total output unstable.",[['unstab','instab'],['output','equilibri','total']])],
  line:"imperfect competition makes a large breach in the defence of laissez-faire"}
]},

/* ------------------------------------------------ #57 */
{id:'57',year:1934,who:'Robinson',title:'ROBINSON 1934 · WHAT IS PERFECT COMPETITION?',secs:[
 {h:'A narrow definition, kept apart from normal profits',beats:[
  ["November 1934, Quarterly Journal of Economics. Robinson defines *perfect competition* in one line: \"the demand for the output of an individual seller is perfectly elastic.\" Nothing about entry. Nothing about profits.","Two notions had been lumped together: a seller cannot influence price, and a seller cannot earn more than normal profits. She keeps only the first."],
  ["She rejects Knight's catch-all definition. She also rejects Chamberlin's split between pure and perfect competition: it \"pays a verbal tribute\" to the old confusion. What he calls *pure competition* she calls perfect. Further assumptions, such as mobility or certainty, should be stated separately. Harrod (#56) shares her definition but slips in free entry."],
  {fig:'compare',a:[{left:{h:'ROBINSON',lines:['perfect = elastic','  demand per seller','entry: separate issue','profits: separate issue']},right:{h:'CHAMBERLIN 1933',lines:['pure = elastic demand','perfect = pure plus','  mobility, certainty,','  other "perfections"']},note:"Robinson's perfect = Chamberlin's pure"}]},
  ["*Normal profits* are \"simply the supply price of entrepreneurship\" to a particular industry: the level at which the number of firms has no tendency to change. They differ between industries and can be high wherever entry is costly. Their link to imperfect markets, through goodwill, is purely empirical."],
  {fig:'steps',a:[{title:'TWO LEVELS OF NORMAL PROFIT (after Shove)',lines:['upper level: needed to attract new entrants','lower level: needed to keep existing firms','so two long-period supply curves: upper, lower','joined by quasi-long-period curves','  (fixed number of firms)','reached gradually: the pair is determinate']}]},
  ["Write it this way: perfect competition and free entry or normal profits are analytically quite distinct. Chamberlin (#63) later accepts that restriction of entry is compatible with perfect competition. Robinson's Euler paper (#50) uses the same narrow definition in a footnote."]],
  q:[mc("How does Robinson (1934) define perfect competition?",["Each seller faces a perfectly elastic demand curve","Free entry drives profits to normal","Many firms selling a homogeneous product","Perfect knowledge and perfect mobility of factors"],"Nothing about free entry or normal profits."),
     mc("What does Robinson say about Chamberlin's pure/perfect distinction?",["It pays a verbal tribute to the old confusion","It is the correct way to separate entry from elasticity","It applies only to duopoly","It is identical to Knight's definition"],"She calls 'perfect' what he calls 'pure'."),
     tf("True or false: for Robinson, high normal profits imply imperfect competition.",false,"Normal profits can be high under perfect competition; the link is purely empirical.")],
  sa:[sa("What are normal profits for Robinson (1934)?","The supply price of entrepreneurship to an industry.",[['supply price'],['entrepreneur']]),
      sa("Which term of Chamberlin's equals Robinson's perfect competition?","Pure competition.",[['pure']],1)],
  line:"perfect competition means a perfectly elastic demand for each seller"},

 {h:'Perfect markets and how many firms',beats:[
  ["Perfect competition needs a perfect market and enough firms. Product differentiation is neither necessary nor sufficient for imperfection. Suppose every buyer pays exactly 6d. more for A than for B and buys only one of them. With B at 1/-, any rise in A above 1/6 ends A's sales. Demand for each is perfectly elastic."],
  ["So a *perfect market* needs two things: all buyers have the same preferences, and each buyer deals with only one firm at a time. Odd corollary: with only one buyer, the market for each firm must be perfect. Many buyers make imperfection more likely, not less."],
  ["Number of firms. Cournot's test, that removing a firm leaves price unchanged, is \"much too severe\". When one firm adds a unit, price dips, and rivals setting MC equal to price cut their output. Industry output rises by less than one unit, so the price cut is small."],
  {fig:'table',a:[{title:'MC SLOPE AND FIRMS NEEDED FOR PERFECTION',head:['rivals\' marginal cost','firms needed'],rows:[['falling','impossible: one survives'],['constant','two (not lasting)'],['rising gently','few'],['rising steeply','many'],['vertical','indefinitely great']],left:[0,1],note:'"in some cases, may be quite small"'}]},
  ["The vertical case does not matter in practice. At the Saturday-night fish market supply is fixed, so competition is not strictly perfect. Yet the competitive output still sells at the competitive price, unless demand for fish is highly inelastic."],
  ["Place it. Answers Knight, Chamberlin and Harrod (#56), and Cournot's large-numbers condition. Chamberlin replies in #63: he accepts the entry point, rebuts her on differentiation, and quips that her logic makes bilateral monopoly the requirement for full perfection."]],
  q:[mc("For Robinson, what determines how many firms perfect competition needs?",["The slopes of the firms' marginal cost curves","Cournot's rule that removing a firm leaves price unchanged","The degree of product differentiation","The level of normal profits"],"Flatter MC, fewer firms needed; vertical MC, indefinitely many."),
     tf("True or false: Robinson argues product differentiation is a sufficient condition for market imperfection.",false,"The 6d. example: distinct goods A and B can still trade in a perfect market."),
     mc("Robinson: with falling marginal costs in a perfect market, how many firms survive?",["One","Two","Indefinitely many","Exactly as many as there are buyers"],"Price-cutting drives the others out, so competition cannot be perfect.")],
  sa:[sa("Two conditions for a perfect market (Robinson)?","Identical buyer preferences; each buyer deals with one firm.",[['same','identical','alike'],['one firm','single firm','one seller','one at a time']]),
      sa("What does the fish market example show?","Inelastic supply still sells the competitive output at competitive price.",[['competitive'],['output','price','sold','sell']])],
  line:"the number of firms needed depends on the slopes of marginal cost"}
]},

/* ------------------------------------------------ #58 */
{id:'58',year:1935,who:'Kaldor',title:'KALDOR 1935 · MARKET IMPERFECTION AND EXCESS CAPACITY',secs:[
 {h:'The excess-capacity doctrine and its four assumptions',beats:[
  ["February 1935, Economica. Kaldor calls *excess capacity* the most intellectually striking doctrine of the new theory. Free entry, the old guardian of efficiency, takes on a more dubious role as the creator of excess capacity.","Definition: long-run equilibrium on the falling part of the long-run cost curve."],
  {fig:'plot',a:[{title:"CHAMBERLIN'S TANGENCY (illustrative)",xl:'output of the firm',yl:'P',xr:[1,10],yr:[3,7],curves:[{f:x=>1+9/x+0.25*x,ch:'A',name:'average cost'},{f:x=>8.6-0.75*x,ch:'d',name:'firm demand'}],eq:[0,1],eqf:(x,y)=>Math.abs(7-0.75*x-y)<0.2?'tangency at q = '+x.toFixed(1)+', min AC at q = 6':'d cuts AC: profits, entry follows',shift:{curve:1,to:{f:x=>7-0.75*x},cap:'entry pushes d left until it just touches AC'},cap:'before entry: d above AC, profits',yf:v=>String(v)}]},
  ["Read the figure. Entrants take customers, each firm's demand curve slides left until it is tangent to average cost. Profit is gone, but price has not fallen to minimum cost. Profits are absorbed in lower productive efficiency rather than passed on in lower prices. The factory is half empty and in equilibrium."],
  {fig:'steps',a:[{title:'THE FOUR ASSUMPTIONS KALDOR DIGS OUT',lines:['1 many producers of slightly different products','2 preferences evenly spread: rivals equally close','3 no institutional monopoly: free entry','4 economies of scale over some range','=> entry ends at tangency: excess capacity']}]},
  ["Do not misreport Kaldor. Given its assumptions \"the theory is unassailable\". He attacks the assumptions, not the logic.","He also separates the two 1933 versions. Robinson counts as cost any profits not competed away, so her tangency \"is merely a statement of a tautology\". Chamberlin's cost curve holds only necessary payments, so his tangency is a real result. Kaldor follows Chamberlin."],
  {fig:'compare',a:[{left:{h:"ROBINSON'S TANGENCY",lines:['uncompeted profits','  counted as cost','tangency by definition','a tautology']},right:{h:"CHAMBERLIN'S TANGENCY",lines:['only necessary costs','entry erodes profit','tangency is a result','=> excess capacity']},note:'only a "formal similarity" between them'}]}],
  q:[mc("Why does Kaldor call Robinson's tangency result a tautology?",["She counts profits not competed away as part of cost","She assumes perfectly elastic demand","She ignores economies of scale","She defines the industry too narrowly"],"Tangency then holds by definition and implies no excess capacity."),
     mc("Which is NOT one of the assumptions Kaldor finds behind the excess-capacity theorem?",["Rival producers react far-sightedly to entrants","Preferences evenly spread among producers","No institutional monopoly","Economies of scale over some range"],"Kaldor's objection is that the theory assumes short-sighted producers."),
     tf("True or false: Kaldor (1935) argued Chamberlin's tangency does not follow from Chamberlin's assumptions.",false,"Given the assumptions 'the theory is unassailable'; he disputes the assumptions.")],
  sa:[sa("Define excess capacity (Kaldor 1935).","Long-run equilibrium on the falling part of average cost.",[['fall','declin','downward','below min','less than min'],['cost','ac']]),
      sa("Whose tangency version does Kaldor follow?","Chamberlin's, because it is not tautological.",[['chamberlin']],1)],
  line:"free entry with differentiated products ends in tangency and excess capacity"},

 {h:'Taking the assumptions away',beats:[
  ["Objection 1: the scale of products. Real products sit on a scale with near and far rivals. Savile Row tailors watch Savile Row prices, not the East End's. Kaldor's model: consumers spread evenly along a road, a ribbon development, sellers at equal distances. Each is a *pseudo-monopolist*, most affected by his neighbours."],
  ["So one firm's move is not spread evenly. Duopoly is \"the leading species of a large genus\", and the firm's curve is an *imagined demand curve* (from #53). Far-sighted firms that allow for potential entrants act as if demand were more elastic, price low, and may avoid excess capacity."],
  {fig:'plot',a:[{title:'NO ECONOMIES OF SCALE (sketch)',xl:'output of the firm',yl:'P',xr:[0,10],yr:[2,8],curves:[{f:x=>4,ch:'A',name:'flat average cost'},{f:x=>7.5-0.6*x,ch:'d',name:'firm demand'}],shift:{curve:1,to:{f:x=>4.15-0.015*x},cap:'entry until d is flat: perfect competition'},cap:'differentiated product, sloping d',yf:v=>String(v)}]},
  ["Objection 2: divisibility. With no economies of scale, entry goes on until each firm's demand is infinitely elastic. Perfect competition establishes itself. The mathematical economists \"weren't such fools after all.\"","With economies of scale, an entrant needs a minimum output that can push everyone into losses. Indivisibility shields profits and favours whoever is first in the field. Tangency is not necessary."],
  ["*Institutional monopoly*: patents, trade-marks, names, unique resources, buyers' inertia. Anything that stops a rival making the identical product at the same relative cost. It can block excess capacity or, by raising imperfection, encourage it. Kaldor's verdict: some rise in costs instead of fall in price from entry still remains likely."],
  {fig:'steps',a:[{title:'POLICY FOOTNOTE: PRICE FIXED, ENTRY FREE',lines:['uniform taxi fare -> too many empty taxis','professional etiquette -> under-employed doctors','uniform retail margin -> too many tobacco shops','lesson: distrust cartels and rationalisation']}]},
  ["Welfare: you cannot call excess capacity the consumers' choice of variety over cheapness. They are never offered that choice.","Place it. Builds on #49 and #53. Chamberlin (#63) rejects the divisibility point but accepts that free entry means anyone could make the identical product. Kaldor rejoins in #66. Report: major revisions, to the assumptions."]],
  q:[mc("According to Kaldor (1935), with free entry and no economies of scale the result is…",["Perfect competition, with infinitely elastic firm demand","Tangency with excess capacity","Monopoly by whoever is first in the field","Losses for all firms"],"'The mathematical economists ... weren't such fools after all.'"),
     mc("What does Kaldor mean by 'institutional monopoly'?",["Anything stopping a rival making the identical product at the same cost","A monopoly owned by the state","A cartel that fixes quantities","A firm whose demand curve is horizontal"],"Patents, trade-marks, names, unique resources, buyers' inertia."),
     tf("True or false: Kaldor said a uniform taxi fare leads to too many empty taxis.",true,"Price fixed, entry free: competition shows up as excess capacity.")],
  sa:[sa("Why may far-sighted firms avoid excess capacity?","They price low to deter potential entrants.",[['entr','entrant','newcomer'],['low','deter','elastic','anticipat','forestall']]),
      sa("With economies of scale, why need tangency not occur?","An entrant's minimum output would cause losses.",[['minimum','indivisib','large','scale'],['loss','unprofit','shield']])],
  line:"without scale economies free entry gives perfect competition not excess capacity"}
]}

gloss:[
['co-ordinating ability',"Kaldor (1934): the managerial function of deciding which contracts to make; every decision must pass through a single brain, so it is fixed for the firm.","A firm is 'a productive combination possessing a given unit of co-ordinating ability'.",['entrepreneurial function','free good']],
['entrepreneurial function',"Kaldor (1934) splits it into uncertainty-bearing and management; management into supervision (divisible) and co-ordination (fixed).","Joint-stock companies spread risk; foremen can be doubled; co-ordination cannot.",['co-ordinating ability']],
['free good',"In Kaldor (1934), what co-ordination becomes in a stationary state, since it is needed only to adjust to change.","With no change to adjust to, nothing limits the competitive firm's size.",['co-ordinating ability']],
['adding-up problem',"Whether paying each factor its marginal product exactly exhausts the total product. Robinson (1934): profits zero, positive, negative as returns constant, diminishing, increasing.","Wicksteed (1894) solved it with Euler's theorem, assuming constant returns.",['constant returns in value']],
['constant returns in value',"Robinson (1934): a proportional rise in outlay on every factor raises the value of output in the same proportion; holds at a zero-profit tangency even when physical returns increase.","At Chamberlin's tangency AC is falling, yet returns in value are constant.",['adding-up problem','tangency']],
['imagined demand curve',"Kaldor (1934 review, 1935): the producer's own view of how sales respond to his price, allowing for rivals' and entrants' reactions; determinate, unlike the real curve.","It need match the real curve only at the price actually charged.",['pseudo-monopolist','excess capacity']],
['monopsonistic exploitation',"Paying a factor less than its marginal value because the buyer faces a rising supply curve; Kaldor (1934) says it distorts factor proportions, unlike monopolistic exploitation.","Collective bargaining can counter it by making labour supply horizontal to the firm.",['marginal outlay']],
['single price formula',"Schumpeter's (1934) reading of Robinson: price = MR x e/(e - 1), one formula for every case from perfect competition to monopoly.","With infinite elasticity, price equals marginal revenue.",['perfect competition']],
['limited competition',"Nichol (1934), after Chamberlin: competition among a few sellers of the same product (duopoly, oligopoly), not product differentiation.","With decreasing variable costs, duopoly price 24 exceeds monopoly price 20.",['foresight']],
['foresight',"Chamberlin's assumption that each of a few rivals anticipates the others' reactions and the indirect effects of his own acts; Nichol (1934) says it gives the monopoly price only with costless production.","Unequal rising costs: the efficient firm enforces 26, below monopoly 28.",['limited competition']],
['standard rate of profit',"Harrod (1934): the lowest rate of profit that is an adequate inducement to invest in fixed equipment; included in cost at the tangency.","With easy entry only the standard rate is earned and plant is under-used.",['tangency','excess capacity']],
['marginal outlay',"Harrod (1934): the extra expenditure needed to obtain one more unit of a factor when its supply curve rises; it exceeds the factor's price.","Trade unions make the labour market more perfect by giving firms a constant supply price.",['monopsonistic exploitation']],
['perfect competition',"Robinson (1934): the demand for an individual seller's output is perfectly elastic, with nothing implied about free entry or normal profits.","Robinson's 'perfect' is Chamberlin's 'pure' competition.",['pure competition','normal profits','perfect market']],
['pure competition',"Chamberlin's (1933) term for perfectly elastic demand per seller; his 'perfect' competition adds mobility, certainty and other perfections. Robinson rejects the split.","She says it pays a verbal tribute to the old confusion.",['perfect competition']],
['normal profits',"Robinson (1934): the supply price of entrepreneurship to a particular industry, where the number of firms has no tendency to change; analytically separate from perfect competition.","Can be high wherever entry is costly, perfect market or not.",['perfect competition']],
['perfect market',"Robinson (1934): a market where a rise in one firm's price ends its sales; needs identical buyer preferences and each buyer dealing with one firm at a time.","A and B differ by exactly 6d. for every buyer: still a perfect market.",['perfect competition']],
['excess capacity',"Long-run equilibrium on the falling part of the long-run average cost curve (Kaldor 1935), produced by free entry with differentiated products.","Too many empty taxis under a uniform fare.",['tangency','institutional monopoly']],
['tangency',"Chamberlin's large-group equilibrium: entry shifts each firm's demand left until it just touches falling average cost, so profit is zero but price exceeds minimum cost.","Robinson's version is a tautology (Kaldor); Chamberlin's is a result.",['excess capacity','standard rate of profit']],
['institutional monopoly',"Kaldor (1935): anything that stops a rival producing the identical product at the same relative cost: patents, trade-marks, names, unique resources, buyers' inertia.","Can block excess capacity or, by raising imperfection, encourage it.",['excess capacity']],
['pseudo-monopolist',"Kaldor (1935): a seller of a differentiated product whose cross-elasticities with rivals are large but finite.","Sellers spaced along a road, each most affected by his neighbours.",['imagined demand curve']]
],
